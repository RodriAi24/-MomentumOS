    }

    .log-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    .log-row:first-child {
      border-top: 0;
    }

    .log-date {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
    }

    .big-number {
      font-family: var(--font-display);
      color: var(--sys2);
      text-shadow: none;
      letter-spacing: .04em;
      line-height: 1;
    }

    .big-number-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .big-number-sub {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink4);
      margin-top: 3px;
    }

    /* System frame (used in OAA, status window, exam, etc) */
    .sys-frame {
      border: 1px solid var(--sys);
      padding: 16px;
      border-radius: var(--radius-lg);
      background: var(--bg);
      position: relative;
    }

    .sys-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sys), transparent);
    }

    /* Exam frame (golden variant) */
    .exam-frame {
      border-color: var(--rank-a);
      box-shadow: 0 0 24px rgba(245, 158, 11, .2);
    }

    .exam-frame::before {
      background: linear-gradient(90deg, transparent, var(--rank-a), transparent);
    }

    .sysnotif.exam-variant {
      border-color: var(--rank-a);
      box-shadow: 0 0 30px rgba(245, 158, 11, .3);
    }

    .sysnotif.exam-variant .sysnotif-corner {
      border-color: var(--rank-a);
    }

    .sysnotif.exam-variant .sysnotif-icon {
      color: var(--rank-a);
    }

    .sysnotif.exam-variant .sysnotif-tag {
      color: var(--rank-a);
    }

    .sysnotif.exam-variant .quest-progress {
      color: var(--rank-a);
    }

    .sysnotif.exam-variant .quest-fill {
      background: var(--rank-a);
    }

    .btn-exam {
      background: var(--rank-a);
      border-color: var(--rank-a);
    }

    .talent-row {
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }

    .talent-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .talent-name {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .talent-badge {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 9px;
    }

    .talent-desc {
      font-size: 11px;
      color: var(--ink2);
      margin-top: 4px;
      padding-left: 22px;
    }

    .talent-date {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      margin-top: 3px;
      padding-left: 22px;
    }

    .talent-locked {
      padding: 8px 0;
      border-top: 1px solid var(--border);
      opacity: 0.5;
    }

    .talent-hint {
      font-size: 10px;
      color: var(--ink4);
      margin-top: 3px;
      padding-left: 22px;
      font-style: italic;
    }

    .report-dim-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: baseline;
      gap: 12px;
      padding: 6px 0;
      border-top: 1px solid var(--border);
    }

    .report-obs {
      padding: 8px 0;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .report-obs-num {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--sys2);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .report-obs-text {
      font-size: 12px;
      color: var(--ink2);
      line-height: 1.55;
      flex: 1;
    }

    .report-rec {
      padding: 8px 10px;
      background: var(--bg);
      border-left: 2px solid var(--sys);
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--ink);
      line-height: 1.5;
    }

    .mini-oaa {
      background: var(--card);
      border: 1px solid var(--sys);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      cursor: pointer;
      box-shadow: 0 0 12px var(--sys-dim);
      transition: all .2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    .mini-oaa:active {
      transform: scale(.98);
    }

    .mini-oaa-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .25em;
      color: var(--sys);
      margin-bottom: 8px;
    }

    .mini-oaa-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mini-oaa-letter {
      font-family: var(--font-display);
      font-size: 36px;
      color: var(--sys);
      text-shadow: 0 0 10px var(--sys-glow);
      line-height: 1;
      flex-shrink: 0;
      min-width: 50px;
      text-align: center;
    }

    .mini-oaa-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mini-oaa-row {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .mini-oaa-dim {
      color: var(--ink3);
      letter-spacing: .1em;
    }

    .mini-oaa-val {
      color: var(--ink2);
      font-weight: 600;
    }

    .mini-oaa-chev {
      color: var(--ink3);
      flex-shrink: 0;
    }

    .mini-oaa-chev svg {
      width: 18px;
      height: 18px;
    }

    /* Condition check row (used in exams) */
    .condition-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .06em;
    }

    .condition-met {
      color: var(--positive);
    }

    .condition-pending {
      color: var(--ink2);
    }

    /* Cursor pointer for interactive elements */
    .clickable {
      cursor: pointer;
    }

    .clickable:active {
      transform: scale(.98);
    }

    /* Reduce motion for users who prefer it */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Auto dark/light based on system preference is handled by default vars */

    /* Selection styling */
    ::selection {
      background: rgba(139, 92, 246, .3);
      color: var(--ink);
    }

    ::-moz-selection {
      background: rgba(139, 92, 246, .3);
      color: var(--ink);
    }

    /* Focus visible for keyboard users */
    :focus-visible {
      outline: 2px solid var(--sys);
      outline-offset: 2px;
    }

    button:focus:not(:focus-visible) {
      outline: none;
    }

    /* Better input styling */
    .input:focus-visible {
      outline: none;
      border-color: var(--sys);
      box-shadow: 0 0 0 3px var(--sys-dim);
    }

    .modal-ov {
      position: fixed;
      inset: 0;
      background: rgba(5, 4, 10, .85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s var(--ease);
    }

    .modal-ov.show {
      display: flex;
      opacity: 1;
    }

    .modal {
      background: var(--bg2);
      border-top: 1px solid var(--sys);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 20px 18px calc(36px + env(safe-area-inset-bottom));
      transform: translateY(0);
      transition: transform .3s var(--ease);
      position: relative;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Modal enter animation */
    .modal-ov.show .modal {
      animation: modalSlideUp .35s var(--ease);
    }

    @keyframes modalSlideUp {
      from {
        transform: translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: var(--card-pad-md);
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    }

    .card:active {
      border-color: var(--border);
    }

    /* Clickable cards get subtle hover */
    .card.clickable:active {
      border-color: var(--sys);
      box-shadow: 0 0 12px var(--sys-dim);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(5, 4, 10, .92);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }

    body[data-theme="light"] .header {
      background: rgba(245, 243, 248, .92);
    }

    .onb-frame {
      flex: 1;
      border: 1px solid rgba(139, 92, 246, .3);
      border-radius: var(--radius-lg);
      position: relative;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: rgba(10, 8, 20, .6);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      box-shadow:
        0 0 40px var(--sys-glow),
        inset 0 0 24px rgba(139, 92, 246, .04),
        inset 0 1px 0 rgba(255, 255, 255, .05);
      overflow: hidden;
    }

    .habit-chip {
      transform: translateY(0);
      transition: all .2s var(--ease), transform .15s var(--ease);
    }

    .habit-chip:active {
      transform: scale(.95) translateY(1px);
    }

    .habit-chip.done {
      background: var(--sys-dim);
      border-color: var(--sys);
      animation: chipDone .4s var(--ease);
    }

    @keyframes chipDone {
      0% {
        transform: scale(1);
      }

      30% {
        transform: scale(.92);
      }

      60% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }
    }

    .stat-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
          transparent 0%,
          rgba(255, 255, 255, .15) 50%,
          transparent 100%);
      animation: shimmer 3s ease-in-out infinite;
      width: 200%;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(50%);
      }
    }

    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg2);
      border: 1px solid var(--sys);
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .08em;
      z-index: 250;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      opacity: 0;
      transition: all .3s var(--ease);
      pointer-events: none;
      max-width: 90vw;
      text-transform: uppercase;
      color: var(--ink);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    body[data-theme="light"] {
      --bg: #F8F7FC;
      --bg2: #FFFFFF;
      --bg3: #FAF9FE;
      --card: #FFFFFF;
      --card2: #F5F4FA;
      --surface: #EEEDF5;
      --ink: #1A1730;
      --ink2: #4A4665;
      --ink3: #76728F;
      --ink4: #B5B1CC;
      --border: #E8E5F3;
      --border2: #DBD8EB;
      --sys-dim: rgba(139, 92, 246, .06);
      --sys-glow: rgba(139, 92, 246, .15);
    }

    body[data-theme="light"] .card {
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
    }

    body[data-theme="light"] .sysnotif {
      box-shadow: 0 2px 8px rgba(139, 92, 246, .12);
    }

    body[data-theme="light"] .bottom-nav {
      background: rgba(255, 255, 255, .9);
      border-top-color: var(--border);
    }

    body[data-theme="light"] .header {
      border-bottom-color: var(--border);
    }

    body[data-theme="light"] .status-window {
      box-shadow: 0 2px 12px rgba(139, 92, 246, .08);
    }

    body[data-theme="light"] .nav-tab-fab {
      box-shadow: 0 4px 16px rgba(139, 92, 246, .25);
    }

    body[data-theme="light"] .modal-ov {
      background: rgba(248, 247, 252, .8);
    }

    body[data-theme="light"]::before {
      opacity: .015;
    }

    body[data-theme="light"]::after {
      background-image:
        linear-gradient(rgba(139, 92, 246, .03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, .03) 1px, transparent 1px);
    }

    body[data-theme="light"] .big-number {
      text-shadow: none;
    }

    .btn {
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--ripple-x, 50%) var(--ripple-y, 50%), rgba(255, 255, 255, .3) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .4s;
    }

    .btn:active::after {
      opacity: 1;
      transition: opacity 0s;
    }

    .skeleton {
      background: var(--surface);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }

    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(139, 92, 246, .05), transparent);
      animation: skeletonPulse 1.5s infinite;
    }

    @keyframes skeletonPulse {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    /* === V3.8: Collapsible sections === */
    .card-collapse {
      overflow: hidden;
      max-height: 2000px;
      transition: max-height .4s var(--ease), opacity .3s var(--ease);
      opacity: 1;
    }

    .card-collapse.collapsed {
      max-height: 0;
      opacity: 0;
    }

    .card-title.collapsible {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .card-title.collapsible::after {
      content: '';
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--ink3);
      border-bottom: 1.5px solid var(--ink3);
      transform: rotate(45deg);
      transition: transform .25s var(--ease);
      flex-shrink: 0;
      margin-left: auto;
    }

    .card-title.collapsible.is-collapsed::after {
      transform: rotate(-45deg);
    }

    /* === V3.8: Daily progress bar === */
    .daily-progress {
      height: 2px;
      background: var(--border);
      position: relative;
      margin: 0 16px;
    }

    .daily-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sys), var(--cyan));
      transition: width .8s var(--ease);
      border-radius: 1px;
      position: relative;
    }

    .daily-progress-fill.has-progress::after {
      content: '';
      position: absolute;
      right: -3px;
      top: -2px;
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
    }

    /* === V3.8: Breathing === */
    .section-gap {
      height: 6px;
    }

    .page>.card+.card {
      margin-top: 14px;
    }

    .page>.sysnotif+.card,
    .page>.card+.sysnotif {
      margin-top: 16px;
    }

    /* === Profile tab toggle === */
    .profile-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border: 1px solid rgba(100, 180, 255, .25);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(12, 18, 40, .5);
    }

    body[data-theme="light"] .profile-tabs {
      background: rgba(220, 232, 250, .5);
    }

    .profile-tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(150, 200, 255, .5);
      cursor: pointer;
      transition: all .2s var(--ease);
      border: none;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }

    .profile-tab.active {
      background: rgba(100, 180, 255, .15);
      color: rgba(200, 220, 255, 1);
      text-shadow: 0 0 8px rgba(100, 180, 255, .3);
    }

    body[data-theme="light"] .profile-tab.active {
      background: rgba(80, 150, 255, .15);
      color: rgba(30, 80, 160, 1);
    }

    /* === V3.7: COTE-style OAA card === */
    .cote-card {
      position: relative;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(20, 24, 48, .6) 0%, rgba(15, 18, 36, .8) 100%);
      border: 1px solid rgba(100, 180, 255, .35);
      box-shadow:
        0 0 30px rgba(80, 150, 255, .15),
        inset 0 1px 0 rgba(150, 200, 255, .1);
    }

    body[data-theme="light"] .cote-card {
      background: linear-gradient(180deg, rgba(240, 245, 255, .95) 0%, rgba(225, 235, 250, .95) 100%);
      border-color: rgba(80, 150, 255, .45);
      box-shadow: 0 0 24px rgba(80, 150, 255, .12), inset 0 1px 0 rgba(255, 255, 255, .8);
    }

    .cote-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(180deg, transparent 0%, transparent 50%, rgba(100, 180, 255, .03) 50%, transparent 51%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1;
    }

    .cote-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px 18px 8px;
      border-bottom: 1px solid rgba(100, 180, 255, .2);
    }

    .cote-tag {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: .08em;
      color: rgba(150, 200, 255, .9);
      text-shadow: 0 0 8px rgba(100, 180, 255, .4);
    }

    .cote-class {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .2em;
      color: rgba(150, 200, 255, .7);
    }

    .cote-portrait {
      display: flex;
      justify-content: center;
      padding: 22px 0 10px;
    }

    .cote-portrait-frame {
      width: 200px;
      height: 240px;
      border: 2px solid rgba(100, 180, 255, .55);
      padding: 4px;
      background: rgba(40, 60, 100, .3);
      position: relative;
    }

    .cote-portrait-frame::before,
    .cote-portrait-frame::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(150, 200, 255, .9);
    }

    .cote-portrait-frame::before {
      top: -5px;
      left: -5px;
      border-right: 0;
      border-bottom: 0;
    }

    .cote-portrait-frame::after {
      bottom: -5px;
      right: -5px;
      border-left: 0;
      border-top: 0;
    }

    .cote-portrait-inner {
      width: 100%;
      height: 100%;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 56px;
      font-weight: 700;
      color: rgba(150, 200, 255, .9);
      overflow: hidden;
    }

    .cote-name {
      text-align: center;
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: .14em;
      color: rgba(200, 220, 255, 1);
      text-shadow: 0 0 8px rgba(100, 180, 255, .3);
      padding: 14px 16px 2px;
    }

    .cote-name-sub {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .35em;
      color: rgba(150, 200, 255, .6);
      padding-bottom: 14px;
    }

    /* --- Dims grid: COTE-style compact layout --- */
    .cote-dims-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 0;
      padding: 0 12px;
      position: relative;
      border-top: 2px solid rgba(100, 180, 255, .3);
      border-bottom: 2px solid rgba(100, 180, 255, .3);
      margin: 0 4px;
    }

    .cote-dim-cell {
      border: 1px solid rgba(100, 180, 255, .25);
      background: rgba(12, 18, 40, .7);
    }

    body[data-theme="light"] .cote-dim-cell {
      background: rgba(210, 225, 248, .7);
    }

    .cote-dim {
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      position: relative;
      min-height: 56px;
    }

    .cote-dim-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .cote-dim-score {
      font-family: var(--font-mono);
      font-size: 18px;
      color: rgba(180, 210, 255, .85);
      letter-spacing: .02em;
      font-weight: 600;
      line-height: 1.1;
    }

    .cote-dim-label {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: .18em;
      color: rgba(150, 200, 255, .5);
      text-transform: uppercase;
    }

    .cote-dim-letter {
      font-family: var(--font-display);
      font-size: 30px;
      color: rgba(220, 230, 255, 1);
      text-shadow: 0 0 8px rgba(100, 180, 255, .35);
      line-height: 1;
      flex-shrink: 0;
      min-width: 28px;
      text-align: center;
    }

    .cote-dim-arrow {
      position: absolute;
      top: 4px;
      right: 5px;
      font-size: 8px;
    }

    /* --- Center cell: Overall score --- */
    .cote-center-cell {
      grid-column: 2;
      grid-row: 1 / 3;
      border: 1px solid rgba(100, 180, 255, .25);
      background: rgba(12, 18, 40, .85);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body[data-theme="light"] .cote-center-cell {
      background: rgba(200, 218, 245, .8);
    }

    .cote-center {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 10px 0;
    }

    .cote-center-tag {
      font-family: var(--font-mono);
      font-size: 7px;
      letter-spacing: .25em;
      color: rgba(150, 200, 255, .55);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .cote-ring {
      width: 88px;
      height: 88px;
    }

    .cote-ring-bg {
      fill: none;
      stroke: rgba(100, 180, 255, .15);
      stroke-width: 3.5;
    }

    .cote-ring-fg {
      fill: none;
      stroke: rgba(150, 200, 255, .95);
      stroke-width: 3.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 5px rgba(100, 180, 255, .6));
      transition: stroke-dashoffset 1s var(--ease);
    }

    .cote-ring-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cote-ring-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cote-center-letter {
      font-family: var(--font-display);
      font-size: 38px;
      color: rgba(220, 235, 255, 1);
      text-shadow: 0 0 12px rgba(100, 180, 255, .6);
      line-height: 1;
    }

    .cote-center-score {
      font-family: var(--font-mono);
      font-size: 10px;
      color: rgba(150, 200, 255, .8);
      letter-spacing: .1em;
      margin-top: 2px;
    }

    /* --- Fifth dim row --- */
    .cote-dim-fifth {
      padding: 0 12px;
      margin: 0 4px;
    }

    .cote-dim-fifth .cote-dim-cell {
      border-top: 0;
    }

    .cote-trend {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .2em;
      color: rgba(150, 200, 255, .5);
      padding: 10px 16px 14px;
      text-transform: uppercase;
    }

       NOCTURNE — signature layer (applied on top of tokens)
       ============================================================ */
    /* Rules fade to transparent at both ends — Nocturne signature */
    .section-divider, .modal-label { position: relative; }
    .border-t { border-top: none !important; background-image: linear-gradient(to right, transparent, var(--border2) 48px, var(--border2) calc(100% - 48px), transparent); background-size: 100% 1px; background-repeat: no-repeat; background-position: top; }
    .border-b { border-bottom: none !important; background-image: linear-gradient(to right, transparent, var(--border2) 48px, var(--border2) calc(100% - 48px), transparent); background-size: 100% 1px; background-repeat: no-repeat; background-position: bottom; }
    /* Subtle radial bloom behind the page (design: radial 120%/60% at 50% -10%) */
    body[data-theme="dark"]::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(120% 60% at 50% -10%, var(--sys-dim), transparent 70%); }
    #app { position: relative; z-index: 1; }
    /* Softer, larger radii on interactive surfaces */
    .btn { border-radius: var(--radius); }
    .card { border-radius: 10px; }
    /* Tabular numerals everywhere numbers live */
    .mono, .big-number, .data-cell-label, .stat-xp, .quest-xp { font-variant-numeric: tabular-nums; }
    /* Focus ring per Nocturne */
    :focus-visible { outline: 2px solid var(--sys); outline-offset: 2px; }
    ::selection { background: var(--sys-dim); }

</head>

    const ACADEMICO_HIGH_EFFORT = ['cca', 'tutorial', 'lang'];

    // Decay exponencial — vida media 14 días
    function timeWeight(daysAgo) {
      // Vida media 7 días — el decay golpea fuerte
      return Math.exp(-daysAgo / 7);
    }

    // Calendar-day difference between two YYYY-MM-DD keys (TZ-safe: both parse as UTC midnight).
    function daysBetweenKeys(k1, k2) {
      return Math.round((new Date(String(k2).slice(0, 10)) - new Date(String(k1).slice(0, 10))) / 86400000);
    }

    function daysSince(dateStr) {
      // Calendar days in app timezone between a stored date (key or ISO) and today.
      return daysBetweenKeys(dateStr, todayKey());
    }

    // Iterar sobre los últimos N días de logs
    function getRecentLogs(days = 30) {
      const logs = [];
      for (let i = 0; i < days; i++) {
        const d = nowApp();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        if (l) logs.push({ ...l, daysAgo: i });
      }
      return logs;
    }

    // ============================================================
    // CÁLCULO DE DIMENSIONES (0 a 14, mapeable a letras)
    // ============================================================

    function calcAcademico() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      const sabidIds = HABITS_BASE.sabiduria.map(h => h.id)
        .concat(state.custom.filter(c => c.stat === 'sabiduria').map(c => c.id));

      let freqRaw = 0;
      let totalSabidLogs = 0;
      let highEffortLogs = 0;
      const uniqueHabits = new Set();
      const daysWithSabid = new Set();

      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (sabidIds.includes(h)) {
            freqRaw += w;
            totalSabidLogs++;
            uniqueHabits.add(h);
            daysWithSabid.add(log.date);
            if (ACADEMICO_HIGH_EFFORT.includes(h)) highEffortLogs++;
          }
        });
      });

      // V14: target subido — 40 hábitos ponderados = A (era 15)
      // Llegar a A requiere ~3-4 sabiduría por día sostenidos
      const freqScore = Math.min(14, (freqRaw / 40) * 14);

      // Consistencia: % días con sabiduría — necesita 90%+ para A
      const consistencyScore = Math.pow(daysWithSabid.size / 30, 1.5) * 14;

      // Profundidad: high-effort tiene que ser dominante para A
      const depthScore = totalSabidLogs > 0
        ? Math.min(14, Math.pow(highEffortLogs / totalSabidLogs, 1.3) * 14)
        : 0;

      // Diversidad: necesitás 6+ hábitos distintos para A
      const diversityScore = Math.min(14, (uniqueHabits.size / 6) * 14);

      let raw = freqScore * 0.40 + consistencyScore * 0.30 + depthScore * 0.20 + diversityScore * 0.10;

      // Penalizaciones más agresivas
      let dryStreak = 0, maxDryStreak = 0;
      for (let i = 0; i < 14; i++) {
        const d = nowApp();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        const hasSabid = l && l.habits.some(h => sabidIds.includes(h));
        if (!hasSabid) { dryStreak++; maxDryStreak = Math.max(maxDryStreak, dryStreak); }
        else dryStreak = 0;
      }
      // V14: penalizaciones escaladas
      if (maxDryStreak >= 3) raw -= 1.0;
      if (maxDryStreak >= 5) raw -= 1.5;
      if (maxDryStreak >= 7) raw -= 2.0;

      // Carga profunda (CCA, deep_work)
      let deepLoad = 0;
      let pomoLoad = 0;
      for (let i = 0; i < 14; i++) {
        const d = nowApp();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        if (l) {
          deepLoad += l.habits.filter(h => h === 'deep_work').length;
          pomoLoad += l.habits.filter(h => h === 'pomo').length;
        }
      }
      const heavyCognitiveLoad = deepLoad >= 5 || pomoLoad >= 10;

      if (totalSabidLogs > 0 && uniqueHabits.size === 1 && uniqueHabits.has('notes') && !heavyCognitiveLoad) {
        raw = Math.min(raw, 8);
      }

      if (heavyCognitiveLoad) raw += 0.5;

      // V14: cap absoluto si menos de 21 días de uso (B máximo)
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    function calcFisico() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      const fuerzaIds = HABITS_BASE.fuerza.map(h => h.id)
        .concat(state.custom.filter(c => c.stat === 'fuerza').map(c => c.id));

      let freqRaw = 0;
      let sleepDays = 0;
      let hydrationDays = 0;
      const daysWithFisico = new Set();
      const habitTypes = new Set();
      let gymDays = 0;

      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (fuerzaIds.includes(h)) {
            freqRaw += w;
            daysWithFisico.add(log.date);
            habitTypes.add(h);
            if (h === 'gym') gymDays++;
            if (h === 'sleep7') sleepDays++;
            if (h === 'hydration') hydrationDays++;
          }
        });
      });

      // V14: targets subidos
      // Frecuencia: target 45 hábitos ponderados (era 18) — necesita actividad casi diaria
      const freqScore = Math.min(14, (freqRaw / 45) * 14);
      const consistencyScore = Math.pow(daysWithFisico.size / 30, 1.5) * 14;
      const sleepScore = Math.pow(sleepDays / 30, 1.3) * 14;
      const hydraVarScore = Math.min(14, (hydrationDays / 25) * 7 + (habitTypes.size / 6) * 7);

      let raw = freqScore * 0.30 + consistencyScore * 0.30 + sleepScore * 0.20 + hydraVarScore * 0.20;

      // Penalizaciones
      if (gymDays > 0 && habitTypes.size === 1 && habitTypes.has('gym')) {
        raw = Math.min(raw, 9); // cap B− (era B)
      }
      // Sin gym 7/14/21+ días — escalado
      let gymDryStreak = 0;
      for (let i = 0; i < 21; i++) {
        const d = nowApp();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        if (!l || !l.habits.includes('gym')) gymDryStreak++;
        else break;
      }
      if (gymDryStreak >= 7) raw -= 1;
      if (gymDryStreak >= 14) raw -= 2;
      if (gymDryStreak >= 21) raw -= 3;

      // Cap absoluto si menos de 21 días
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    function calcMental() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      // Sysquests en últimos 30 días
      const sysQ30 = state.sysquest_history.filter(q => daysSince(q.date) <= 30);
      const accepted = sysQ30.filter(q => q.status === 'accepted' || q.status === 'completed' || q.status === 'failed').length;
      const completed = sysQ30.filter(q => q.status === 'completed').length;
      const rejected = sysQ30.filter(q => q.status === 'rejected').length;
      const totalIssued = sysQ30.length;

      // Aceptación rate
      const acceptRate = totalIssued > 0 ? accepted / totalIssued : 0.5;
      const acceptScore = acceptRate * 14;

      // Completion rate de las aceptadas
      const completeRate = accepted > 0 ? completed / accepted : 0.5;
      const completeScore = completeRate * 14;

      // Daily intent completion
      let intentDone = 0, intentTotal = 0;
      logs.forEach(log => {
        if (log.daily_intent?.items?.length > 0) {
          intentTotal += log.daily_intent.items.length;
          intentDone += (log.daily_intent.completed || []).filter(Boolean).length;
        }
      });
      const intentScore = intentTotal > 0 ? (intentDone / intentTotal) * 14 : 7;

      // V14: targets subidos en pomos y scroll streak
      const scrollScore = Math.min(14, Math.pow(state.streaks.no_scroll_am.current / 21, 1.2) * 14);

      let pomoCount = 0;
      logs.forEach(log => {
        if (log.habits.includes('pomo')) pomoCount++;
        if (log.habits.includes('deep_work')) pomoCount += 1.5;
      });
      // V14: target 40 pomos en 30d (era 15) — requiere ~1.3 pomos/día sostenidos
      const pomoScore = Math.min(14, (pomoCount / 40) * 14);

      const reflClosed = logs.filter(l => l.reflection?.closed).length;
      const reflScore = Math.pow(reflClosed / 30, 1.3) * 14;

      let raw =
        acceptScore * 0.25 +
        completeScore * 0.25 +
        intentScore * 0.15 +
        scrollScore * 0.15 +
        pomoScore * 0.10 +
        reflScore * 0.10;

      // Penalizaciones
      const lastThree = state.sysquest_history.slice(-3);
      if (lastThree.length === 3 && lastThree.every(q => q.status === 'rejected' || q.status === 'failed')) {
        raw = Math.min(raw, 7);
      }
      const last14 = state.sysquest_history.filter(q => daysSince(q.date) <= 14);
      if (last14.length > 0 && last14.every(q => q.status === 'rejected')) {
        raw = Math.min(raw, 5);
      }

      raw += getScreenTimeOAAFactor();

      // Cap absoluto si menos de 21 días
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    function calcSocial() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      let weighted = 0;
      const types = new Set();
      let mostRecentVinculo = Infinity;
      let qualityTimeCount = 0;
      let qualityTimeRecent = Infinity;

      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (SOCIAL_WEIGHTS[h] !== undefined) {
            weighted += SOCIAL_WEIGHTS[h] * w;
            types.add(h);
            mostRecentVinculo = Math.min(mostRecentVinculo, log.daysAgo);
          }
          if (h === 'quality_time') {
            qualityTimeCount++;
            qualityTimeRecent = Math.min(qualityTimeRecent, log.daysAgo);
          }
        });
      });

      // V14: target subido — 70 weighted points = A (era 30)
      let raw = Math.min(14, (weighted / 70) * 14);

      const qualityTimeMaster = qualityTimeCount >= 4 && qualityTimeRecent <= 7;

      if (!qualityTimeMaster) {
        // V14: decay más agresivo
        if (mostRecentVinculo >= 14) raw = Math.min(raw, 4);
        else if (mostRecentVinculo >= 10) raw -= 3;
        else if (mostRecentVinculo >= 7) raw -= 2;
        else if (mostRecentVinculo >= 4) raw -= 1;
      }

      if (types.size >= 5) raw += 1;
      if (qualityTimeMaster) raw += 0.5;

      // Cap absoluto si menos de 21 días
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    function calcIdentidad() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      const almaIds = HABITS_BASE.alma.map(h => h.id);

      // Consistencia Alma
      let almaCount = 0;
      const almaDays = new Set();
      const almaTypes = new Set();
      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (almaIds.includes(h)) {
            almaCount += w;
            almaDays.add(log.date);
            almaTypes.add(h);
          }
        });
      });
      const almaScore = Math.min(14, Math.pow(almaDays.size / 25, 1.4) * 14);

      // V19.9: Entertainment penalty system
      // If entertainment level is disproportionately high vs other stats, penalize Identidad
      const entLvl = levelFromXP(state.xp.entretenimiento || 0);
      const otherStats = ['fuerza', 'sabiduria', 'disciplina', 'alma', 'vinculo'];
      const otherAvg = otherStats.reduce((s, k) => s + levelFromXP(state.xp[k] || 0), 0) / 5;
      const entRatio = otherAvg > 0 ? entLvl / otherAvg : 0;
      let entScore;
      if (entRatio < 0.7) {
        entScore = 2; // Healthy balance: small positive
      } else if (entRatio <= 1.0) {
        entScore = 0; // Neutral
      } else if (entRatio <= 1.5) {
        entScore = -2; // Too much entertainment
      } else {
        entScore = -4; // Identity = entertainment (problem)
      }

      // Mazmorras: requieren más para alto score
      const recentBosses = state.bosses.filter(b => b.completed && daysSince(b.completedAt) <= 30);
      const recentForged = state.bosses.filter(b => daysSince(b.createdAt) <= 30);
      const bossScore = Math.min(14, recentBosses.length * 3 + recentForged.length * 0.5);

      const activeCustoms = state.custom.filter(c => {
        return logs.some(l => l.habits.includes(c.id));
      });
      const customScore = Math.min(14, activeCustoms.length * 2.5);

      const journaled = logs.filter(l => l.reflection?.journal && l.reflection.journal.length > 10).length;
      const journalScore = Math.min(14, (journaled / 20) * 14);

      let raw = almaScore * 0.35 + bossScore * 0.25 + customScore * 0.15 + journalScore * 0.10 + entScore * 0.15;

      if (state.custom.length > 0) {
        let maxLogs = 0;
        state.custom.forEach(c => {
          const count = logs.reduce((s, l) => s + (l.habits.includes(c.id) ? 1 : 0), 0);
          maxLogs = Math.max(maxLogs, count);
        });
        if (maxLogs >= 25) raw += 0.5;
      }

      // Cap absoluto si menos de 21 días
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    // ============================================================
    // OAA TOTAL Y CACHE
    // ============================================================

    // Data confidence: 0 on assessment day -> 1 after VERIFY_DAYS of use.
    const VERIFY_DAYS = 30;
    function dataConfidence() {
      if (!state.assessment) return 1;
      const days = daysSince(state.assessment.date);
      return Math.max(0, Math.min(1, days / VERIFY_DAYS));
    }

    function calcAllDimensions() {
      const dataDims = {
        academico: calcAcademico(),
        fisico: calcFisico(),
        mental: calcMental(),
        social: calcSocial(),
        identidad: calcIdentidad(),
      };
      // While a provisional assessment is active, blend its baseline toward real data.
      // Day 1: pure self-assessment (firm provisional rank). Over VERIFY_DAYS: converges to logged data.
      if (!state.assessment || !state.assessment.dims) return dataDims;
      const c = dataConfidence();
      const a = state.assessment.dims;
      const blended = {};
      for (const k in dataDims) {
        const av = (a[k] == null ? 0 : a[k]);
        // No real data yet for this dim -> hold the assessment value instead of decaying to 0.
        const dv = (dataDims[k] == null ? av : dataDims[k]);
        blended[k] = av * (1 - c) + dv * c;
      }
      return blended;
    }

    function calcOAATotal(dims) {
      // Si alguna dimensión es null, calcular con las que están y normalizar pesos
      let total = 0;
      let weightSum = 0;
      for (const key in OAA_WEIGHTS) {
        if (dims[key] !== null && dims[key] !== undefined) {
          total += dims[key] * OAA_WEIGHTS[key];
          weightSum += OAA_WEIGHTS[key];
        }
      }
      if (weightSum === 0) return null;
      return total / weightSum;
    }

    function getCurrentOAA() {
      // Cache: si el cálculo es de hoy, devolverlo. Si no, recalcular.
      const today = todayKey();
      if (state.oaa && state.oaa.date === today) return state.oaa;
      const dims = calcAllDimensions();
      const total = calcOAATotal(dims);
      state.oaa = { date: today, dims, total, computedAt: new Date().toISOString() };
      // Guardar histórico
      if (!state.oaa_history) state.oaa_history = [];
      // Solo guardar si es distinto al último
      const last = state.oaa_history[state.oaa_history.length - 1];
      if (!last || last.date !== today) {
        state.oaa_history.push({ date: today, dims, total });
        // Mantener últimos 120 días
        if (state.oaa_history.length > 120) state.oaa_history.shift();
      }
      persist();
      return state.oaa;
    }

    // ============================================================
    // CLASES
    // ============================================================

    function computeCurrentClass() {
      // Calcular OAA promedio últimos N días según umbral más alto disponible
      if (!state.oaa_history || state.oaa_history.length === 0) return 'D';

      const history = state.oaa_history.filter(h => h.total !== null);
      if (history.length === 0) return 'D';

      // Ir desde la clase más alta hacia abajo, verificar si cumple
      const tryClasses = [...CLASS_ORDER].reverse();
      for (const cls of tryClasses) {
        const t = CLASS_THRESHOLDS[cls];
        if (cls === 'D') return 'D';

        const days = t.sustainDays;
        const recentN = history.slice(-days);
        if (recentN.length < days) continue;

        const avg = recentN.reduce((s, h) => s + h.total, 0) / recentN.length;
        if (avg < t.oaaMin) continue;

        // Extra: mazmorras para clase A
        if (t.extra.dungeons) {
          const completedDungeons = state.bosses.filter(b => b.completed).length;
          if (completedDungeons < t.extra.dungeons) continue;
        }

        return cls;
      }
      return 'D';
    }

    function updateClassIfChanged() {
      const newClass = computeCurrentClass();
      const oldClass = state.currentClass || 'D';
      if (newClass !== oldClass) {
        state.currentClass = newClass;
        state.classHistory = state.classHistory || [];
        state.classHistory.push({ date: todayKey(), from: oldClass, to: newClass });
        persist();
        // Notificar promoción o descenso
        const oldIdx = CLASS_ORDER.indexOf(oldClass);
        const newIdx = CLASS_ORDER.indexOf(newClass);
        setTimeout(() => {
          if (newIdx > oldIdx) {
            sysToast(`PROMOTION · CLASS ${CLASS_THRESHOLDS[newClass].code}`, 'positive');
            ppOnClassPromotion();
          } else {
            sysToast(`REASSESSMENT · CLASS ${CLASS_THRESHOLDS[newClass].code}`, 'danger');
          }
        }, 800);
      }
    }

    function classCode(cls) {
      return CLASS_THRESHOLDS[cls]?.code || 'D';
    }

    // ============================================================
    // PRIVATE POINTS — Core
    // ============================================================

    function ppEnabled() {
      // V19.9: PP unlocked at Rank C (lv 12)
      return totalLevel() >= 12;
    }

    function earnPP(amount, reason) {
      if (!ppEnabled()) return;
      const wasZero = state.pp === 0;
      state.pp += amount;
      // V19.6: First PP earned tutorial
      if (wasZero && amount > 0) {
        maybeShowTutorial('first_pp', 'First Private Points', 'ECONOMY ACTIVE', [
          `You earned your first ${amount} PP. The System's economy is now active.`,
          'PP accumulates automatically every Monday based on your weekly evaluation. You also earn it by completing dungeons, exams, and achievements.',
          'Go to the Points tab to see your balance and the shop where you can spend them.'
        ]);
      }
      state.ppLog.push({
        date: todayKey(),
        type: 'earn',
        amount,
        reason,
        balance: state.pp,
        ts: Date.now(),
      });
      if (state.ppLog.length > 200) state.ppLog = state.ppLog.slice(-200);
      persist();
    }

    function spendPP(itemKey) {
      if (!ppEnabled()) { toast('PP unlocked at Rank C'); return false; }
      const item = PP_SPEND[itemKey];
      if (!item) return false;
      if (state.pp < item.cost) { toast('Insufficient PP · ' + item.cost + ' required'); return false; }
      if (!checkPPLimit(itemKey)) {
        toast('Limit reached · ' + item.limit);
        return false;
      }
      state.pp -= item.cost;
      state.ppLog.push({
        date: todayKey(),
        type: 'spend',
        amount: -item.cost,
        reason: item.label,
        itemKey,
        balance: state.pp,
        ts: Date.now(),
      });
      if (state.ppLog.length > 200) state.ppLog = state.ppLog.slice(-200);
      recordPPLimit(itemKey);
      persist();
      sysToast(`−${item.cost} PP · ${item.label}`);
      return true;
    }

    function checkPPLimit(itemKey) {
      const item = PP_SPEND[itemKey];
      if (!item) return false;
      const limits = state.ppLimits;
      const now = nowApp();
      const key = itemKey;

      if (item.limit === 'unlimited') return true;
      if (item.limit === 'permanent') {
        return !limits[key];
      }

      const uses = (limits[key] || []).filter(ts => {
        const d = new Date(ts);
        if (item.limit === '1/day') return dateToKey(d) === todayKey();
        if (item.limit === '1/week') {
          const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate() - 7);
          return d > weekAgo;
        }
        if (item.limit === '1/month' || item.limit === '2/month') {
          const monthAgo = new Date(now); monthAgo.setMonth(monthAgo.getMonth() - 1);
          return d > monthAgo;
        }
        if (item.limit === '3/year') {
          const yearAgo = new Date(now); yearAgo.setFullYear(yearAgo.getFullYear() - 1);
          return d > yearAgo;
        }
        return true;
      });

      const maxUses = parseInt(item.limit) || 1;
      return uses.length < maxUses;
    }

    function recordPPLimit(itemKey) {
      if (!state.ppLimits[itemKey]) state.ppLimits[itemKey] = [];
      state.ppLimits[itemKey].push(Date.now());
    }

    function checkPPEarnings() {
      if (!ppEnabled()) return;
      const today = todayKey();
      const earned = state.ppLog.filter(l => l.date === today && l.type === 'earn');
      const reasons = earned.map(e => e.reason);

      if (log.reflection?.closed && !reasons.includes('reflection')) {
        earnPP(PP_EARN.reflection_closed, 'reflection');
      }

      const di = log.daily_intent;
      if (di.items.length >= 3 && di.completed.filter(Boolean).length >= di.items.length && !reasons.includes('intent_3_of_3')) {
        earnPP(PP_EARN.daily_intent_3_of_3, 'intent_3_of_3');
      }

      if (state.streaks.daily_log.last === today && !reasons.includes('daily_streak')) {
        earnPP(PP_EARN.daily_streak, 'daily_streak');
      }
    }

    function ppOnSysquestComplete(quest) {
      if (!ppEnabled()) return;
      const isHard = HARD_QUEST_CATEGORIES.includes(quest.category);
      const amount = isHard ? PP_EARN.sysquest_hard_completed : PP_EARN.sysquest_completed;
      earnPP(amount, 'sysquest_' + quest.category);
    }

    function ppOnQuestComplete(type) {
      if (!ppEnabled()) return;
      if (type === 'weekly') earnPP(PP_EARN.weekly_quest_completed, 'weekly_quest');
      if (type === 'monthly') earnPP(PP_EARN.monthly_quest_completed, 'monthly_quest');
    }

    function ppOnDungeonComplete() {
      if (!ppEnabled()) return;
      earnPP(PP_EARN.dungeon_completed, 'dungeon');
    }

    function ppWeeklyOAABonus() {
      if (!ppEnabled()) return;
      const today = nowApp();
      if (today.getDay() !== 0) return;
      const tk = todayKey();
      const earned = state.ppLog.filter(l => l.date === tk && l.type === 'earn');
      if (earned.some(e => e.reason === 'oaa_weekly')) return;

      const oaa = getCurrentOAA();
      if (oaa.total === null) return;
      if (oaa.total >= 12) {
        earnPP(PP_EARN.oaa_weekly_above_A, 'oaa_weekly');
      } else if (oaa.total >= 9) {
        earnPP(PP_EARN.oaa_weekly_above_B, 'oaa_weekly');
      }
    }

    function ppOnClassPromotion() {
      if (!ppEnabled()) return;
      earnPP(PP_EARN.class_promotion, 'class_promotion');
    }

    // ============================================================
    // PP ACTIONS \u2014 Skip, Pause, Insurance, Reroll
    // ============================================================

    function ppSkipSysquest() {
      if (!state.sysquest) { toast('No active quest'); return; }
      if (!spendPP('skip_sysquest')) return;
      state.sysquest.status = 'skipped';
      state.sysquest_history.push(state.sysquest);
      state.sysquest = null;
      persist();
      render();
    }

    function ppPostponeIntent() {
      if (!spendPP('postpone_intent')) return;
      log.daily_intent.postponed = true;
      saveLog(log);
      toast('Intent postponed · now due tomorrow', 'positive');
    }

    function ppStreakInsurance() {
      if (!spendPP('streak_insurance')) return;
      const s = state.streaks.daily_log;
      if (s.current === 0 && (s.lastBroken > 0 || s.longest > 0)) {
        // Restore the streak that broke and anchor it to yesterday,
        // so logging today continues it instead of resetting to 1.
        const restored = s.lastBroken || 1;
        const yesterday = nowApp();
        yesterday.setDate(yesterday.getDate() - 1);
        s.current = restored;
        s.last = dateToKey(yesterday);
        s.lastBroken = 0;
        toast(`Streak rescued · ${restored}d restored`, 'positive');
      } else {
        toast('Your streak is active', 'positive');
      }
      persist();
      render();
    }

    function ppQuestReroll() {
      if (!state.sysquest || state.sysquest.status !== 'pending') {
        toast('Only pending quests can be rerolled');
        return;
      }
      if (!spendPP('quest_reroll')) return;
      state.sysquest.status = 'rerolled';
      state.sysquest_history.push(state.sysquest);
      const rank = currentRank().rank;
      const recentCats = state.sysquest_history.slice(-2).map(q => q.category);
      state.sysquest = generateDailyQuest(rank, recentCats);
      persist();
      render();
      sysToast('QUEST REROLLED');
    }

    function ppActivatePause() {
      if (!spendPP('pause_mode')) return;
      const until = new Date();
      until.setDate(until.getDate() + 3);
      state.pause = {
        active: true,
        until: until.toISOString(),
        activatedAt: todayKey(),
      };
      persist();
      render();
      sysToast('PAUSE MODE · 3 DAYS', 'positive');
    }

    function isPaused() {
      if (!state.pause?.active) return false;
      if (new Date(state.pause.until) < new Date()) {
        state.pause = null;
        persist();
        return false;
      }
      return true;
    }

    function ppDoubleDungeon(bossId) {
      const b = state.bosses.find(x => x.id === bossId);
      if (!b || b.completed || b.doubleReward) { toast('Not applicable'); return; }
      if (!spendPP('double_dungeon')) return;
      b.doubleReward = true;
      persist();
      render();
      sysToast('DUNGEON · DOUBLE REWARD ACTIVE');

    // ============================================================
    // TALENTS — Evaluation Engine
    // ============================================================

    function evaluateTalents() {
      if (!state.oaa_history || state.oaa_history.length < 30) return;
      const hist = state.oaa_history;

      TALENTS.forEach(t => {
        const hasTalent = state.talents.find(x => x.id === t.id);

        if (!hasTalent) {
          try {
            if (t.check(hist, state)) {
              state.talents.push({
                id: t.id,
                unlockedAt: todayKey(),
                active: true,
              });
              earnPP(PP_EARN.talent_unlocked, 'talent_' + t.id);
              setTimeout(() => sysToast(`TALENT DETECTED · ${t.name.toUpperCase()}`, 'positive'), 800);
            }
          } catch (e) {
            console.warn('Talent check error:', t.id, e.message);
          }
        } else if (hasTalent.active && !t.permanent && t.decay) {
          try {
            if (t.decay(hist, state)) {
              hasTalent.active = false;
              hasTalent.lostAt = todayKey();
              setTimeout(() => sysToast(`TALENT LOST · ${t.name.toUpperCase()}`, 'danger'), 800);
            }
          } catch (e) {
            console.warn('Talent decay error:', t.id, e.message);
          }
        }
      });

      persist();
    }

    function getActiveTalents() {
      return state.talents.filter(t => t.active);
    }

    function getAllTalentsWithStatus() {
      return TALENTS.map(t => {
        const unlocked = state.talents.find(x => x.id === t.id);
        return {
          ...t,
          unlocked: !!unlocked,
          active: unlocked?.active || false,
          unlockedAt: unlocked?.unlockedAt,
          lostAt: unlocked?.lostAt,
        };
      });
    }

    function examEnabled() {
      // V19.9: Exams unlocked at Rank B (lv 24)
      return totalLevel() >= 24;
    }

    function maybeOfferExam() {
      if (!examEnabled()) return;
      if (state.specialExam) return;

      const lastExam = state.examHistory[state.examHistory.length - 1];
      if (lastExam) {
        const daysSinceLast = daysSince(lastExam.endDate || lastExam.offeredDate);
        if (lastExam.status === 'failed' && daysSinceLast < EXAM_COOLDOWN_FAIL) return;
        if (lastExam.status === 'rejected' && daysSinceLast < EXAM_COOLDOWN_REJECT) return;
        if (lastExam.status === 'expired' && daysSinceLast < EXAM_COOLDOWN_REJECT) return;
        if (lastExam.status === 'passed') {
          const lastMonth = lastExam.endDate?.slice(0, 7);
          const thisMonth = todayKey().slice(0, 7);
          if (lastMonth === thisMonth) return;
        }
      }

      const today = nowApp();
      if (today.getDate() > 3 && state.examHistory.length > 0) return;

      const lastId = lastExam?.examId;
      const pool = SPECIAL_EXAMS.filter(e => e.id !== lastId);
      const exam = pool[Math.floor(Math.random() * pool.length)];

      state.specialExam = {
        examId: exam.id,
        status: 'offered',
        offeredDate: todayKey(),
        acceptDeadline: new Date(Date.now() + 48 * 60 * 60 * 1000).toISOString(),
        dayLogs: [],
      };
      persist();
      setTimeout(() => sysToast('SPECIAL EXAM AVAILABLE'), 1500);
    }

    function acceptExam() {
      if (!state.specialExam || state.specialExam.status !== 'offered') return;
      state.specialExam.status = 'active';
      state.specialExam.startDate = todayKey();
      state.specialExam.endDate = (() => {
        const d = nowApp();
        d.setDate(d.getDate() + 7);
        return dateToKey(d);
      })();
      persist();
      render();
      sysToast('SPECIAL EXAM ACCEPTED · 7 DAYS');
    }

    function rejectExam() {
      if (!state.specialExam) return;
      customConfirm('Reject the Special Exam? 14-day cooldown until the next one.', () => {
        state.specialExam.status = 'rejected';
        state.examHistory.push({ ...state.specialExam });
        state.specialExam = null;
        persist();
        render();
        haptic('error');
        sysToast('SPECIAL EXAM REJECTED', 'danger');
      });
    }

    function checkExamExpiry() {
      if (!state.specialExam) return;
      const exam = state.specialExam;

      if (exam.status === 'offered' && new Date(exam.acceptDeadline) < new Date()) {
        exam.status = 'expired';
        state.examHistory.push({ ...exam });
        state.specialExam = null;
        persist();
        return;
      }

      if (exam.status === 'active') {
        // Backfill any past exam days from their stored logs before judging.
        syncExamDayLogs();
        // endDate is the evaluation day: all `duration` exam days are already in the past.
        if (exam.endDate && todayKey() >= exam.endDate) evaluateExam();
      }
    }

    // Records each PAST exam day (startDate .. min(yesterday, last exam day)) by
    // evaluating its stored daily log. Today is never frozen here — it is always
    // computed live by getExamProgress, and becomes a "past day" tomorrow.
    function syncExamDayLogs() {
      if (!state.specialExam || state.specialExam.status !== 'active') return;
      const exam = state.specialExam;
      const template = SPECIAL_EXAMS.find(e => e.id === exam.examId);
      if (!template || !exam.startDate) return;

      const today = todayKey();
      let changed = false;
      for (let i = 0; i < template.duration; i++) {
        const d = new Date(exam.startDate);
        d.setUTCDate(d.getUTCDate() + i);
        const key = d.toISOString().slice(0, 10);
        if (key >= today) break; // never freeze today or the future
        if (exam.dayLogs.some(x => x.date === key)) continue;
        const dayLog = load(K.log(key), null);
        const dayResult = evaluateExamDayFor(template, dayLog);
        exam.dayLogs.push({ date: key, passed: dayResult.allMet, details: dayResult.details });
        changed = true;
      }
      if (changed) persist();
    }

    // Kept for compatibility with init: now just delegates to the backfill.
    function checkExamDaily() {
      syncExamDayLogs();
    }

    // Evaluates the daily conditions of a template against a specific day log.
    function evaluateExamDayFor(template, dayLog) {
      const details = [];
      let allMet = true;
      const habits = dayLog?.habits || [];
      const reflection = dayLog?.reflection || null;

      template.conditions.forEach(cond => {
        let met = false;
        switch (cond.type) {
          case 'daily_habit':
            met = habits.includes(cond.habitId);
            break;
          case 'daily_reflection':
            met = !!reflection?.closed;
            break;
          case 'daily_journal':
            met = !!(reflection?.journal && reflection.journal.length > 10);
            break;
          case 'daily_stat_count': {
            const statHabits = HABITS_BASE[cond.stat]?.map(h => h.id) || [];
            const count = habits.filter(h => statHabits.includes(h)).length;
            met = count >= cond.min;
            break;
          }
          case 'daily_all_stats': {
            const statKeys = Object.keys(STATS);
            met = statKeys.every(sk => {
              const ids = (HABITS_BASE[sk] || []).map(h => h.id)
                .concat(state.custom.filter(c => c.stat === sk).map(c => c.id));
              return habits.some(h => ids.includes(h));
            });
            break;
          }
          case 'total_habits':
            met = true;
            break;
        }
        details.push({ label: cond.label, met });
        if (!met && cond.type !== 'total_habits') allMet = false;
      });

      return { allMet, details };
    }

    // Today's live evaluation (used by getExamProgress for display).
    function evaluateExamDay(template) {
      return evaluateExamDayFor(template, log);
    }


    function evaluateExam() {
      const exam = state.specialExam;
      if (!exam || exam.status !== 'active') return;
      const template = SPECIAL_EXAMS.find(e => e.id === exam.examId);
      if (!template) return;

      let passed = true;

      const dailyConditions = template.conditions.filter(c => c.type !== 'total_habits');
      if (dailyConditions.length > 0) {
        const requiredDays = template.duration;
        const passedDays = exam.dayLogs.filter(d => d.passed).length;
        if (passedDays < requiredDays) passed = false;
      }

      const totalConditions = template.conditions.filter(c => c.type === 'total_habits');
      totalConditions.forEach(cond => {
        let totalCount = 0;
        for (let i = 0; i < template.duration; i++) {
          const d = new Date(exam.startDate);
          d.setUTCDate(d.getUTCDate() + i);
          const key = d.toISOString().slice(0, 10);
          const dayLog = load(K.log(key), null);
          if (dayLog) {
            totalCount += dayLog.habits.filter(h => cond.habitIds.includes(h)).length;
          }
        }
        if (totalCount < cond.min) passed = false;
      });

      exam.status = passed ? 'passed' : 'failed';
      exam.completedAt = todayKey();

      if (passed) {
        earnPP(template.reward.pp, 'special_exam_' + exam.examId);
        if (template.reward.title) {
          if (!state.examTitles) state.examTitles = [];
          if (!state.examTitles.includes(template.reward.title)) {
            state.examTitles.push(template.reward.title);
          }
        }
        setTimeout(() => sysToast(`SPECIAL EXAM PASSED · +${template.reward.pp} PP`, 'positive'), 600);
      } else {
        setTimeout(() => sysToast('SPECIAL EXAM FAILED · 21-day cooldown', 'danger'), 600);
      }

      state.examHistory.push({ ...exam });
      state.specialExam = null;
      persist();
      render();
    }

    function getExamProgress() {
      if (!state.specialExam || state.specialExam.status !== 'active') return null;
      const exam = state.specialExam;
      const template = SPECIAL_EXAMS.find(e => e.id === exam.examId);
      if (!template) return null;

      const dayNumber = Math.min(template.duration, Math.max(1, daysBetweenKeys(exam.startDate, todayKey()) + 1));
      const passedDays = exam.dayLogs.filter(d => d.passed).length;
      const totalDays = template.duration;

      let totalProgress = {};
      template.conditions.filter(c => c.type === 'total_habits').forEach(cond => {
        let count = 0;
        for (let i = 0; i < dayNumber; i++) {
          const d = new Date(exam.startDate);
          d.setUTCDate(d.getUTCDate() + i);
          const key = d.toISOString().slice(0, 10);
          const dayLog = load(K.log(key), null);
          if (dayLog) count += dayLog.habits.filter(h => cond.habitIds.includes(h)).length;
        }
        totalProgress[cond.label] = { current: count, target: cond.min };
      });

      const todayResult = evaluateExamDay(template);

      return {
        template,
        dayNumber,
        totalDays,
        passedDays,
        pct: (passedDays / totalDays) * 100,
        todayConditions: todayResult.details,
        totalProgress,
      };
    }

    function getOAATrend(weeks = 4) {
      // Regresión lineal simple sobre últimas N semanas de OAA Total
      if (!state.oaa_history || state.oaa_history.length < weeks * 7) return 'flat';
      const recent = state.oaa_history.slice(-(weeks * 7)).filter(h => h.total !== null);
      if (recent.length < 7) return 'flat';
      const n = recent.length;
      const xs = recent.map((_, i) => i);
      const ys = recent.map(h => h.total);
      const xMean = xs.reduce((a, b) => a + b, 0) / n;
      const yMean = ys.reduce((a, b) => a + b, 0) / n;
      const num = xs.reduce((s, x, i) => s + (x - xMean) * (ys[i] - yMean), 0);
      const den = xs.reduce((s, x) => s + (x - xMean) ** 2, 0);
      const slope = den === 0 ? 0 : num / den;
      if (slope > 0.05) return 'up';
      if (slope < -0.05) return 'down';
      return 'flat';
    }

    function getDimChange(stat) {
      // Cambio vs semana anterior
      if (!state.oaa_history || state.oaa_history.length < 8) return 0;
      const today = state.oaa_history[state.oaa_history.length - 1];
      const weekAgo = state.oaa_history[state.oaa_history.length - 8];
      if (!today.dims[stat] || !weekAgo.dims[stat]) return 0;
      return today.dims[stat] - weekAgo.dims[stat];
    }

    function generateDailyQuest(currentRank, recentCategories) {
      // Pesos: ajustan según rango
      let weights = {
        ruptura: 2,
        confrontacion: 2,
        disciplina_pura: 2,
        curiosidad: 2,
        vulnerabilidad: 1,
        fisico_extremo: 2,
      };
      // Si tu rango es alto, aumentamos lo difícil
      if (currentRank === 'C' || currentRank === 'B') {
        weights.vulnerabilidad = 2;
        weights.disciplina_pura = 3;
      }
      if (currentRank === 'A' || currentRank === 'S' || currentRank === 'NL') {
        weights.vulnerabilidad = 3;
        weights.confrontacion = 3;
        weights.disciplina_pura = 3;
        weights.ruptura = 1;
        weights.curiosidad = 1;
      }
      // No repetir las últimas 2 categorías
      recentCategories.forEach(cat => { if (weights[cat]) weights[cat] = 0; });

      // Build weighted pool
      const pool = [];
      for (const cat in weights) {
        for (let i = 0; i < weights[cat]; i++) pool.push(cat);
      }
      const category = pool[Math.floor(Math.random() * pool.length)] || 'ruptura';

      // V3.7: Memoria de últimas 8 quests específicas (no solo categorías)
      const recentTitles = state.sysquest_history.slice(-8).map(q => q.title);
      const templates = QUEST_TEMPLATES[category];
      const fresh = templates.filter(t => !recentTitles.includes(t.title));
      const pickFrom = fresh.length > 0 ? fresh : templates;
      const tpl = pickFrom[Math.floor(Math.random() * pickFrom.length)];

      return {
        id: 'sysq_' + Date.now(),
        category,
        ...tpl,
        status: 'pending', // pending | accepted | rejected | completed | failed
        issuedAt: new Date().toISOString(),
        date: todayKey(),
      };
    }

    function load(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        if (v === null) return fallback;
        return JSON.parse(v);
      } catch (e) { return fallback; }
    }

    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); }
      catch (e) {
        if (e.name === 'QuotaExceededError' || e.code === 22) {
          // Storage full — try to clean up old logs
          console.warn('Storage quota exceeded, cleaning old logs');
          try {
            // Delete logs older than 180 days
            const cutoff = nowApp();
            cutoff.setDate(cutoff.getDate() - 180);
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
            keys.forEach(k => {
              if (k.startsWith('mo_log_')) {
                const dateStr = k.replace('mo_log_', '');
                const d = new Date(dateStr);
                if (d < cutoff) localStorage.removeItem(k);
              }
            });
            // Try save again
            localStorage.setItem(key, JSON.stringify(value));
            toast('Storage cleaned · old logs removed', 'positive');
          } catch (e2) {
            console.error('save retry failed', key, e2);
            toast('Storage full · export backup', 'danger');
          }
        } else {
          console.error('save failed', key, e);
        }
      }
    }

    // V19: Streak XP multiplier — rewards consistency

    function getStreakMultiplier() {
      const streak = state.streaks?.daily_log?.current || 0;
      if (streak >= 60) return 1.60;
      if (streak >= 30) return 1.40;
      if (streak >= 14) return 1.25;

      return 1.00;

    function xpForLevel(level) {
      // V19: sub-quadratic curve ((lvl+1)^1.5 * 100) — more achievable than quadratic
      // lvl 0: 0 XP
      // lvl 1: 100 XP
      // lvl 3: 901 XP
      // lvl 5: 2,819 XP
      // lvl 7: 6,140 XP
      // lvl 10: 14,264 XP
      let total = 0;
      for (let i = 0; i < level; i++) total += Math.floor(Math.pow(i + 1, 1.5) * 100);
      return total;
    }



    function levelFromXP(xp) {
      // Starts at 0
      xp = Number(xp) || 0;
      let lvl = 0;
      while (xpForLevel(lvl + 1) <= xp) lvl++;
      return lvl;
    }

    function progressInLevel(xp) {
      xp = Number(xp) || 0;
      const lvl = levelFromXP(xp);
      const base = xpForLevel(lvl);
      const next = xpForLevel(lvl + 1);
      return {
        level: lvl,
        current: xp - base,
        needed: next - base,
        pct: ((xp - base) / (next - base)) * 100,
      };
    }

    function totalLevel() {
      return Object.keys(STATS).reduce((sum, key) => sum + levelFromXP(state.xp[key]), 0);
    }

    function currentRank() {
      const lvl = totalLevel();
      // V19: Strict mode — check level AND OAA requirements
      const oaa = state.oaa || { total: 0 };
      const dims = ['academico', 'fisico', 'mental', 'social', 'identidad']
        .map(k => oaa.dims?.[k] ?? oaa[k] ?? 0);
      const minDim = Math.min(...dims);

      let rank = RANKS[0];
      for (const r of RANKS) {
        if (lvl < r.min) continue;
        if (r.oaaMin && (oaa.total || 0) < r.oaaMin) continue;
        if (r.noDimBelow !== null && r.noDimBelow !== undefined && minDim < r.noDimBelow) continue;
        rank = r;
      }
      return rank;
    }

    function allHabits() {
      const all = {};
      for (const stat in HABITS_BASE) all[stat] = [...HABITS_BASE[stat]];
      state.custom.forEach(h => {
        if (all[h.stat]) all[h.stat].push(h);
      });
      return all;
    }

    function findHabit(habitId) {
      const all = allHabits();
      for (const stat in all) {
        const h = all[stat].find(x => x.id === habitId);
        if (h) return { ...h, stat };
      }
      return null;
    }

      // First log of the day bonus
      if (realHabits.length === 1) {
        xpToAdd += 5;
        setTimeout(() => sysToast('FIRST LOG OF THE DAY · +5 BONUS'), 400);
      }

      // V19: First touch of this stat today bonus
      const statTouchedToday = realHabits.slice(0, -1).some(hid => {
        const hh = findHabit(hid);
        return hh && hh.stat === h.stat;
      });
      if (!statTouchedToday) {
        xpToAdd += 3;
        setTimeout(() => sysToast(`FIRST ${STATS[h.stat].name.toUpperCase()} · +3 BONUS`), 700);
      }

      // V19: Apply streak multiplier
      const streakMult = getStreakMultiplier();
      if (streakMult > 1.0) {
        const before = xpToAdd;
        xpToAdd = Math.floor(xpToAdd * streakMult);
        const bonus = xpToAdd - before;
        if (bonus > 0) {
          setTimeout(() => sysToast(`STREAK x${streakMult.toFixed(2)} · +${bonus} XP`), 1000);
        }
      }
      // Prompt nota (no-blocking, aparece después)
      setTimeout(() => promptHabitNote(habitId), 800);
      // Record the REAL XP awarded (base + bonuses + multiplier) so undo is exact.
      if (!log.habit_xp) log.habit_xp = {};
      log.habit_xp[habitId] = xpToAdd;
      if (xpToAdd > 0) {
        log.xp_gained[h.stat] += xpToAdd;
        const prevLevel = levelFromXP(state.xp[h.stat]);
        const prevRank = currentRank().rank;
        state.xp[h.stat] += xpToAdd;
        const newLevel = levelFromXP(state.xp[h.stat]);
        const newRank = currentRank().rank;

        floatXP(`+${xpToAdd}`, STATS[h.stat].color, originEvent);

        if (newLevel > prevLevel) {
          setTimeout(() => showLevelUp(h.stat, newLevel), 600);
        }
        if (newRank !== prevRank) {
          setTimeout(() => showRankUp(newRank), newLevel > prevLevel ? 2500 : 600);
        }
      }

      updateDailyStreak();
      updateQuestsFromHabit(habitId, h.stat);
      checkDailyIntentBonus();
      checkAchievements();
      checkDailyCombo();

      saveLog(log);
      persist();
      render();

    }




    function undoHabit(habitId) {
      if (!log || log.date !== todayKey()) log = getLog(todayKey());
      const h = findHabit(habitId);
      if (!h) return;
      if (!log.habits.includes(habitId)) return;
      // Reverse exactly what was awarded (incl. first-log/first-stat bonuses and streak multiplier).
      const awarded = log.habit_xp?.[habitId] ?? h.xp;
      log.habits = log.habits.filter(id => id !== habitId);
      if (log.habit_xp) delete log.habit_xp[habitId];
      log.xp_gained[h.stat] = Math.max(0, log.xp_gained[h.stat] - awarded);
      state.xp[h.stat] = Math.max(0, state.xp[h.stat] - awarded);
      saveLog(log);
      persist();
      render();
      toast('Undone');
    }

      if (!s || !s.last || s.current === 0) return;
      const today = todayKey();
      const yesterday = nowApp();
      yesterday.setDate(yesterday.getDate() - 1);

    // ============================================================
    // SCREEN TIME ACCOUNTABILITY SYSTEM
    // ============================================================
    // Umbral dinámico por rango + clase. Penalización NO LINEAL.
    // Afecta TODOS los stats (disciplina doble).
    // Primeros 7 días cumplidos: no suman, solo evitan penalización.
    // Después de streak sostenido: empezás a ganar de a poco.

    function getScreenTimeThreshold() {
      const rank = currentRank().rank;
      const cls = state.currentClass || 'D';
      let threshold = 3;
      const rankAdj = { E: 0, D: 0, C: -0.5, B: -0.5, A: -1, S: -1, NL: -1.5 };
      const clsAdj = { D: 0, C: -0.25, B: -0.5, A: -0.75, Aplus: -1 };
      threshold += (rankAdj[rank] || 0);
      threshold += (clsAdj[cls] || 0);
      return Math.max(1, Math.round(threshold * 4) / 4);
    }

    function calcScreenTimePenalty(hours, threshold) {
      const excess = Math.max(0, hours - threshold);
      if (excess === 0) return 0;
      // NO LINEAL — exponencial. Pasarte 1h duele, 4h destruye.
      // 0.5h over: ~4, 1h: ~10, 2h: ~25, 3h: ~45, 4h: ~70, 5h: ~100
      return Math.min(120, Math.round(Math.pow(excess, 1.8) * 6));
    }

    function calcScreenTimeReward(streak) {
      // Primeros 7 días: 0 reward. Solo evitás penalización.
      if (streak <= 7) return 0;
      if (streak <= 14) return 2;
      if (streak <= 21) return 5;
      if (streak <= 30) return 8;
      return 12; // cap ~15 XP/stat/día después de un mes
    }

    function reportScreenTime(hours) {
      if (log.screen_time !== null) return;
      hours = Math.round(hours * 2) / 2;

      const threshold = getScreenTimeThreshold();
      const passed = hours <= threshold;
      const st = state.screenTime;

      if (passed) {
        log.screen_time = 'pass';
        const yesterday = nowApp();
        yesterday.setDate(yesterday.getDate() - 1);
        const ykey = dateToKey(yesterday);
        if (st.last === ykey || st.streak === 0) st.streak++;
        else st.streak = 1;
        if (st.streak > st.longest) st.longest = st.streak;
        st.last = todayKey();

        const reward = calcScreenTimeReward(st.streak);
        if (reward > 0) {
          Object.keys(STATS).forEach(k => state.xp[k] += reward);
          sysToast('SCREEN TIME · streak ' + st.streak + 'd · +' + (reward * 6) + ' XP', 'positive');
          floatXP('+' + (reward * 6), 'var(--positive)', null);
        } else {
          sysToast('SCREEN TIME · APPROVED · streak ' + st.streak + 'd');
        }
      } else {
        log.screen_time = 'fail';
        st.streak = 0;
        st.last = todayKey();

        const penalty = calcScreenTimePenalty(hours, threshold);
        // TODOS los stats pierden. DISCIPLINA pierde el DOBLE.
        Object.keys(STATS).forEach(k => {
          const mult = k === 'disciplina' ? 2 : 1;
          state.xp[k] = Math.max(0, state.xp[k] - (penalty * mult));
        });
        const totalLoss = (penalty * 5) + (penalty * 2);
        floatXP('-' + totalLoss, 'var(--negative)', null);
        sysToast('SCREEN TIME · ' + hours + 'h > ' + threshold + 'h · -' + totalLoss + ' XP', 'danger');
      }

      st.history.push({
        date: todayKey(), hours, threshold,
        result: passed ? 'pass' : 'fail',
        streak: st.streak,
        penalty: passed ? 0 : calcScreenTimePenalty(hours, threshold),
      });
      if (st.history.length > 90) st.history.shift();

      saveLog(log);
      persist();
      render();
    }

    function getScreenTimeOAAFactor() {
      const hist = state.screenTime.history;
      if (hist.length < 7) return 0;
      const last30 = hist.filter(h => daysSince(h.date) <= 30);
      if (last30.length === 0) return 0;
      const passRate = last30.filter(h => h.result === 'pass').length / last30.length;
      if (passRate >= 0.8) return 2;
      if (passRate >= 0.6) return 1;
      if (passRate >= 0.4) return 0;
      if (passRate >= 0.2) return -1;
      return -3;
    }

    function checkDailyCombo() {
      const statsHit = new Set();
      log.habits.forEach(h => {
        const habit = findHabit(h);
        if (habit) statsHit.add(habit.stat);
      });
      const comboLevel = statsHit.size;
      if (comboLevel >= 3 && !log.comboBonusGiven) {
        const bonus = comboLevel === 3 ? 10 : comboLevel === 4 ? 20 : comboLevel === 5 ? 35 : comboLevel >= 6 ? 50 : 0;
        if (bonus > 0) {
          Object.keys(STATS).forEach(k => {
            if (statsHit.has(k)) state.xp[k] += Math.floor(bonus / statsHit.size);
          });
          log.comboBonusGiven = true;
          saveLog(log);
          persist();
          setTimeout(() => sysToast(`COMBO ×${comboLevel} · +${bonus} XP`, 'positive'), 600);
        }
      }
    }
