      // PATRONES - SCREEN TIME
      if (state.screenTime?.streak === 0 && (state.screenTime?.longest || 0) >= 14) {
        questions.push({
          area: 'PATRÓN: SCREEN TIME',
          question: '¿Cuándo dejaste de controlar tu tiempo de pantalla esta vez?',
          context: 'Tu mejor racha fue ' + state.screenTime.longest + ' días. Las recaídas tienen detonantes específicos.',
        });
      }

      // PATRONES - REFLECTION
      const recentLogs = getRecentLogs(14);
      const reflections = recentLogs.filter(l => l.reflection).length;
      if (reflections < 3) {
        questions.push({
          area: 'PATRÓN: REFLEXIÓN',
          question: '¿Evitás cerrar el día porque no querés ver lo que hiciste o no hiciste?',
          context: 'Hiciste reflection ' + reflections + ' veces en 14 días. El registro nocturno es donde se procesa el día.',
        });
      }

      // PATRONES - CUSTOM HABITS
      const customCount = (state.custom || []).length;
      if (customCount === 0 && daysSinceCreated() >= 30) {
        questions.push({
          area: 'PATRÓN: CUSTOM',
          question: '¿Por qué no has creado ni un solo hábito personalizado en un mes?',
          context: 'Los hábitos predefinidos son el punto de partida. Los tuyos son los que te definen.',
        });
      }

      // PATRONES - BALANCE
      const dimsValues = Object.values(oaa?.dims || {}).filter(d => d !== null);
      if (dimsValues.length === 5) {
        const max = Math.max(...dimsValues);
        const min = Math.min(...dimsValues);
        if (max - min >= 6) {
          questions.push({
            area: 'PATRÓN: DESBALANCE',
            question: '¿Estás optimizando lo que ya sos bueno y evitando lo que te cuesta?',
            context: `La brecha entre tu mejor y peor dimensión es de ${(max - min).toFixed(1)} puntos. Eso no es perfil, es preferencia.`,
          });
        }
      }

      // PATRONES - TIEMPO EN EL SISTEMA
      if (daysSinceCreated() >= 90) {
        questions.push({
          area: 'PATRÓN: VETERANIA',
          question: '¿La persona que sos hoy reconocería al que abrió esta app por primera vez?',
          context: 'Llevás ' + daysSinceCreated() + ' días en el Sistema. El cambio se ve mejor desde adentro hacia afuera.',
        });
      }

      // Default (siempre presente)
      questions.push({
        area: 'PATRÓN: GENERAL',
        question: '¿Si pudieras cambiar una sola cosa de cómo estás usando este sistema, cuál sería?',
        context: 'A veces la pregunta más simple es la más útil. No la respondas rápido.',
      });
      questions.push({
        area: 'PATRÓN: GENERAL',
        question: '¿Qué hábito te dice más sobre vos: el que más marcás o el que más postergás?',
        context: 'Lo que sostenés define lo que sos. Lo que evitás define lo que evitás ser.',
      });
      questions.push({
        area: 'PATRÓN: GENERAL',
        question: '¿Por qué arrancaste a usar el Sistema? ¿Esa razón sigue siendo válida?',
        context: 'Las razones cambian. Lo importante es saber cuándo cambian y por qué.',
      });

      // Elegir una aleatoria del pool
      return questions[Math.floor(Math.random() * questions.length)];
    }

    function renderHeatmap() {
      const $hm = document.getElementById('heatmap');
      if (!$hm) return;
      let html = '';
      for (let i = 34; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        const count = l ? l.habits.filter(h => h !== '__touched').length : 0;
        let lvl = 0;
        if (count >= 1) lvl = 1;
        if (count >= 3) lvl = 2;
        if (count >= 5) lvl = 3;
        if (count >= 8) lvl = 4;
        html += `<div class="heatmap-cell" data-lvl="${lvl}" title="${key}: ${count}"></div>`;
      }
      $hm.innerHTML = html;
    }

    let oaaLineChart = null;
    function renderOAALine() {
      const canvas = document.getElementById('oaaLineChart');
      if (!canvas) return;
      const hist = (state.oaa_history || []).filter(h => h.total !== null);
      if (hist.length < 7) return;

      // Agrupar por semana (tomar el último de cada semana)
      const weeks = [];
      for (let i = 0; i < hist.length; i += 7) {
        const chunk = hist.slice(i, i + 7);
        const last = chunk[chunk.length - 1];
        weeks.push(last);
      }
      const recent = weeks.slice(-12);
      const labels = recent.map(h => h.date.slice(5));
      const data = recent.map(h => h.total);

      const isLight = document.body.dataset.theme === 'light';
      const gridColor = isLight ? 'rgba(0,0,0,.06)' : 'rgba(139,92,246,.12)';

      if (oaaLineChart) oaaLineChart.destroy();
      oaaLineChart = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data,
            borderColor: '#8B5CF6',
            backgroundColor: 'rgba(139,92,246,.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#A78BFA',
            borderWidth: 2,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: gridColor }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 9, family: 'JetBrains Mono' } } },
            y: { min: 0, max: 14, grid: { color: gridColor }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 9, family: 'JetBrains Mono' }, callback: (v) => ['E−', 'E', 'E+', 'D−', 'D', 'D+', 'C−', 'C', 'C+', 'B−', 'B', 'B+', 'A−', 'A', 'A+'][v] || '' } },
          },
        },
      });
    }

      const labels = [];
      const datasets = {};
      Object.keys(STATS).forEach(k => { datasets[k] = []; });

      for (let i = days - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        labels.push(key.slice(5));
        const dayLog = load(K.log(key), null);
        Object.keys(STATS).forEach(k => {
          datasets[k].push(dayLog ? (dayLog.xp_gained?.[k] || 0) : 0);
        });
      }

      const isLight = document.body.dataset.theme === 'light';
      const gridColor = isLight ? 'rgba(0,0,0,.06)' : 'rgba(139,92,246,.12)';

      const colors = {
        fuerza: '#FF4444', sabiduria: '#FFB020', disciplina: '#4ADE80',
        alma: '#60A5FA', vinculo: '#F472B6', juego: '#C084FC',
      };

      if (xpStackChart) xpStackChart.destroy();
      xpStackChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: Object.keys(STATS).map(k => ({
            label: STATS[k].name,
            data: datasets[k],
            backgroundColor: colors[k] + '88',
            borderColor: colors[k],
            borderWidth: 1,
          })),
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { stacked: true, grid: { display: false }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 8, family: 'JetBrains Mono' } } },
            y: { stacked: true, grid: { color: gridColor }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 9 } } },
          },
        },
      });
    }

    function pickTheme(themeId) {
      if (!state.unlockedThemes.includes(themeId)) {
        unlockTheme(themeId);
        return;
      }
      state.user.theme = themeId;
      applyTheme();
      persist();
      render();
      sysToast('TEMA: ' + THEMES[themeId].name.toUpperCase());
    }

    function applyTheme() {
      const themeId = state.user.theme || 'dark';
      const theme = THEMES[themeId] || THEMES.dark;
      document.body.dataset.theme = (themeId === 'light') ? 'light' : 'dark';

      // Apply custom theme vars if defined (premium themes override defaults)
      const root = document.documentElement;
      if (theme.vars) {
        Object.entries(theme.vars).forEach(([k, v]) => root.style.setProperty(k, v));
      } else {
        // Reset inline overrides (for dark/light defaults)
        ['--bg', '--bg2', '--bg3', '--card', '--card2', '--sys', '--sys-glow', '--sys-dim'].forEach(k => root.style.removeProperty(k));
      }

      const metaContent = (themeId === 'light') ? '#F5F3F8' : (theme.vars?.['--bg'] || '#05040A');
      const meta = document.getElementById('themeColorMeta');
      if (meta) meta.content = metaContent;
    }

    function unlockTheme(themeId) {
      const theme = THEMES[themeId];
      if (!theme) return;
      if (state.unlockedThemes.includes(themeId)) {
        toast('Tema ya desbloqueado');
        return;
      }
      if (state.pp < theme.cost) {
        toast('Sin PP suficientes');
        return;
      }
      customConfirm(`Desbloquear "${theme.name}" por ${theme.cost} PP?`, () => {
        state.pp -= theme.cost;
        state.ppLog.push({ type: 'spend', amount: -theme.cost, reason: 'theme_' + themeId, date: todayKey() });
        state.unlockedThemes.push(themeId);
        persist();
        sysToast('TEMA DESBLOQUEADO · ' + theme.name.toUpperCase());
        haptic('success');
        applyThemeAndPick(themeId);
      });
    }

    function applyThemeAndPick(themeId) {
      state.user.theme = themeId;
      applyTheme();
      persist();
      render();
    }

    function detectApp(data) {
      // Heurísticas para detectar de qué app viene
      if (data.exercises || data.workouts || data.gb_) return 'gymbrain';
      if (data.books || data.bp_ || data.reading) return 'bookpick';
      if (data.transactions || data.ft_ || data.budget) return 'fintrack';
      return null;
    }

    function processAppData(appName, data) {
      if (!state.ecosystem) state.ecosystem = {};
      if (!state.ecosystem[appName]) state.ecosystem[appName] = {};
      if (!data || typeof data !== 'object') {
        toast('Datos inválidos', 'danger');
        return;
      }

      const today = todayKey();

      try {
        switch (appName) {
          case 'gymbrain': {
            // Detectar si hubo workout hoy
            const workouts = data.workouts || data.gb_workouts || [];
            const todayWorkout = Array.isArray(workouts) && workouts.find(w => {
              const d = w?.date || w?.timestamp;
              return d && typeof d === 'string' && d.includes(today);
            });
            if (todayWorkout && !log.habits.includes('gym')) {
              logHabit('gym');
              sysToast('GYMBRAIN · WORKOUT DETECTADO');
            }
            state.ecosystem.gymbrain.lastImport = today;
            state.ecosystem.gymbrain.enabled = true;
            persist();
            toast('GymBrain importado', 'positive');
            break;
          }
          case 'bookpick': {
            // Detectar lectura reciente
            const sessions = data.sessions || data.bp_sessions || data.reading || [];
            const todaySession = Array.isArray(sessions) && sessions.find(s => {
              const d = s?.date || s?.timestamp;
              return d && typeof d === 'string' && d.includes(today);
            });
            if (todaySession && !log.habits.includes('read25')) {
              logHabit('read25');
              sysToast('BOOKPICK · LECTURA DETECTADA');
            }
            state.ecosystem.bookpick.lastImport = today;
            state.ecosystem.bookpick.enabled = true;
            persist();
            toast('BookPick importado', 'positive');
            break;
          }
          case 'fintrack': {
            // FinTrack no genera hábitos directamente, pero si hay transacciones
            // de hoy, lo registramos como dato de contexto
            state.ecosystem.fintrack.lastImport = today;
            state.ecosystem.fintrack.enabled = true;
            persist();
            toast('FinTrack importado', 'positive');
            break;
          }
        }
      } catch (e) {
        console.warn('processAppData error:', e.message);
        toast('Error procesando datos', 'danger');
        return;
      }
      closeModal();
      openModal('ecosystem');
    }

        const k = localStorage.key(i);

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

    // ============================================================
    window.focusTimer = {
      duration: 25 * 60,
      remaining: 25 * 60,
      running: false,
      startedAt: null,      // Date.now() cuando arrancó esta corrida
      pausedRemaining: 25 * 60, // segundos que quedaban cuando se pausó
      mode: 25,
      interval: null,
    };

    function setTimerMode(mins) {
      if (focusTimer.running) return;
      focusTimer.mode = mins;
      focusTimer.duration = mins * 60;
      focusTimer.remaining = mins * 60;
      focusTimer.pausedRemaining = mins * 60;
      updateTimerUI();
    }

    function toggleTimer() {
      if (focusTimer.running) pauseTimer();
      else startTimer();
    }

    function startTimer() {
      focusTimer.running = true;
      // V14: anchor en Date.now(). Si pausamos antes, retomamos desde pausedRemaining.
      focusTimer.startedAt = Date.now();
      // El interval ahora solo refresca el UI cada 250ms basado en el delta real
      focusTimer.interval = setInterval(tickTimer, 250);
      updateTimerUI();
    }

    function pauseTimer() {
      // Guardar el tiempo restante real antes de parar
      if (focusTimer.startedAt) {
        const elapsed = Math.floor((Date.now() - focusTimer.startedAt) / 1000);
        focusTimer.pausedRemaining = Math.max(0, focusTimer.pausedRemaining - elapsed);
        focusTimer.remaining = focusTimer.pausedRemaining;
      }
      focusTimer.running = false;
      focusTimer.startedAt = null;
      if (focusTimer.interval) clearInterval(focusTimer.interval);
      updateTimerUI();
    }

    function resetTimer() {
      if (focusTimer.interval) clearInterval(focusTimer.interval);
      focusTimer.running = false;
      focusTimer.startedAt = null;
      focusTimer.remaining = focusTimer.duration;
      focusTimer.pausedRemaining = focusTimer.duration;
      updateTimerUI();
    }

    function tickTimer() {
      // V14: calcular remaining basado en timestamp, no en decrement
      if (!focusTimer.running || !focusTimer.startedAt) return;
      const elapsed = Math.floor((Date.now() - focusTimer.startedAt) / 1000);
      focusTimer.remaining = Math.max(0, focusTimer.pausedRemaining - elapsed);
      if (focusTimer.remaining <= 0) completeTimer();
      else updateTimerUI();
    }

    function completeTimer() {
      clearInterval(focusTimer.interval);
      focusTimer.running = false;
      focusTimer.startedAt = null;
      focusTimer.remaining = 0;
      updateTimerUI();
      const habitId = focusTimer.mode >= 90 ? 'deep_work' : 'pomo';
      if (!log.habits.includes(habitId)) logHabit(habitId);
      else toast(`Sesión completada`, 'positive');
      focusTimer.remaining = focusTimer.duration;
      focusTimer.pausedRemaining = focusTimer.duration;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    // V14: cuando la app vuelve del background, recalcular remaining
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && focusTimer.running) {
        tickTimer();
      }
    });

    function updateTimerUI() {
      const $t = document.getElementById('timerTime');
      const $m = document.getElementById('timerMode');
      const $c = document.getElementById('timerCircle');
      const $b = document.getElementById('timerStartBtn');
      if (!$t) return;

      $t.textContent = `${mm}:${ss}`;

    function countAllHabits() {
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('mo_log_')) {
          try {
            const l = JSON.parse(localStorage.getItem(k));
            count += l.habits.filter(h => h !== '__touched').length;
          } catch (e) { }
        }
      }
      return count;
    }

    function getSystemPhrase(context, vars = {}) {
      const pool = SYSTEM_PHRASES[context];
      if (!pool || pool.length === 0) return null;
      let phrase = pool[Math.floor(Math.random() * pool.length)];
      for (const key in vars) {
        phrase = phrase.replace('${' + key + '}', vars[key]);
      }
      return phrase;
    }

    function morningGreeting() {
      const today = todayKey();
      if (state.uiState.morning_greeted === today) return;
      state.uiState.morning_greeted = today;
      persist();
      const hour = new Date().getHours();
      if (hour >= 5 && hour <= 11) {
        const streak = state.streaks.daily_log.current;
        const context = streak > 1 ? 'morning_streak' : 'morning_no_streak';
        setTimeout(() => sysToast(getSystemPhrase(context, { streak }) || 'Buenos días'), 1500);
      }
    }

    // V19.7: Optional system sounds using WebAudio (no external files)
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { return null; }
      }
      return audioCtx;
    }

    function playSystemSound(type) {
      if (!state.user?.settings?.sounds_enabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(.08, now + .02);

        if (type === 'level_up') {
          o.type = 'sine';
          o.frequency.setValueAtTime(440, now);
          o.frequency.linearRampToValueAtTime(880, now + .25);
          g.gain.exponentialRampToValueAtTime(.0001, now + .35);
          o.start(now);
          o.stop(now + .4);
        } else if (type === 'rank_up') {
          o.type = 'triangle';
          o.frequency.setValueAtTime(523, now);
          o.frequency.setValueAtTime(659, now + .15);
          o.frequency.setValueAtTime(784, now + .30);
          g.gain.exponentialRampToValueAtTime(.0001, now + .55);
          o.start(now);
          o.stop(now + .6);
        } else if (type === 'achievement') {
          o.type = 'square';
          o.frequency.setValueAtTime(659, now);
          o.frequency.setValueAtTime(880, now + .12);
          g.gain.exponentialRampToValueAtTime(.0001, now + .25);
          o.start(now);
          o.stop(now + .3);
        } else if (type === 'click') {
          o.type = 'sine';
          o.frequency.setValueAtTime(800, now);
          g.gain.setValueAtTime(.04, now);
          g.gain.exponentialRampToValueAtTime(.0001, now + .06);
          o.start(now);
          o.stop(now + .07);
        }
      } catch (e) { }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update();
            });
            setInterval(() => reg.update(), 30 * 60 * 1000);
            reg.addEventListener('updatefound', () => {
              const newSW = reg.installing;
              if (!newSW) return;
              newSW.addEventListener('statechange', () => {
                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                  sysToast('VERSIÓN NUEVA · ACTUALIZANDO');
                  newSW.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          })
          .catch((err) => console.warn('SW reg failed:', err));
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }

    function maybePeriodEval() {
      const today = todayKey();
      const lastEval = state.uiState.last_period_eval;
      if (lastEval) {
        const daysSinceLast = daysSince(lastEval);
        if (daysSinceLast < 28) return; // mínimo 28 días entre evaluaciones
      }
      // Solo trigger el primer día del mes o cada 30 días
      const dayOfMonth = new Date().getDate();
      if (dayOfMonth > 3 && lastEval) return;

      if (!lastEval || daysSince(lastEval) >= 28) {
        state.uiState.last_period_eval = today;
        persist();
        setTimeout(() => {
          sysToast('EVALUACIÓN DE PERÍODO');
          setTimeout(() => openModal('period_eval'), 1500);
        }, 2000);
      }
    }

    function maybeShowFinalExam() {
      if (!state.creationDate) return;
      const today = new Date();
      const creation = new Date(state.creationDate);
      const diffDays = Math.floor((today - creation) / (1000 * 60 * 60 * 24));

      // Solo mostrar en aniversarios exactos de 365 días (con margen de 3 días)
      if (diffDays > 0 && diffDays % 365 <= 3) {
        const year = Math.floor(diffDays / 365);
        const examKey = `final_exam_y${year}`;
        if (!state.achievements.find(a => a.id === examKey)) {
          // Grant achievement to not show again
          state.achievements.push({ id: examKey, date: todayKey() });
          persist();
          setTimeout(() => openModal('final_exam'), 2000);
        }
      }
    }

    function renderCalendar() {
      const now = new Date();
      const viewMonth = state.calendarMonth || now.getMonth();
      const viewYear = state.calendarYear || now.getFullYear();
      const firstDay = new Date(viewYear, viewMonth, 1);
      const lastDay = new Date(viewYear, viewMonth + 1, 0);
      const startPad = (firstDay.getDay() + 6) % 7; // lunes = 0
      const totalDays = lastDay.getDate();
      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const today = todayKey();

      let html = `
        <div class="card">
          <div class="card-title">
            <span class="card-action" onclick="calendarNav(-1)">◂</span>
            <span class="card-title-text">${monthNames[viewMonth]} ${viewYear}</span>
            <span class="card-action" onclick="calendarNav(1)">▸</span>
          </div>
          <div class="mb-1" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">
            ${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<div class="text-xs tracking-wide text-center text-ink4 mono" style="padding:4px 0">${d}</div>`).join('')}
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">
      `;

      // Padding
      for (let i = 0; i < startPad; i++) {
        html += `<div style="aspect-ratio:1;"></div>`;
      }

      // Days
      for (let d = 1; d <= totalDays; d++) {
        const key = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayLog = load(K.log(key), null);
        const habitCount = dayLog ? dayLog.habits.filter(h => h !== '__touched').length : 0;
        const isToday = key === today;
        const mood = dayLog?.reflection?.mood;

        // Intensidad de color por actividad
        let bg = 'var(--surface)';
        let border = 'transparent';
        if (habitCount >= 1) bg = 'rgba(139, 92, 246, .15)';
        if (habitCount >= 3) bg = 'rgba(139, 92, 246, .3)';
        if (habitCount >= 5) bg = 'rgba(139, 92, 246, .5)';
        if (habitCount >= 8) bg = 'rgba(139, 92, 246, .7)';
        if (isToday) border = 'var(--sys)';

        // Sysquest indicator
        let indicator = '';
        if (dayLog) {
          const sq = state.sysquest_history.find(q => q.date === key);
          if (sq) {
            indicator = sq.status === 'completed' ? '<span class="text-positive" style="font-size:7px">✓</span>' :
              sq.status === 'rejected' || sq.status === 'failed' ? '<span class="text-negative" style="font-size:7px">✗</span>' : '';
          }
        }

        // Mood dot
        let moodDot = '';
        if (mood) {
          const moodColors = ['', 'var(--negative)', 'var(--warning)', 'var(--ink3)', 'var(--positive)', 'var(--sys)'];
          moodDot = `<span style="display:block;width:4px;height:4px;border-radius:50%;background:${moodColors[mood]};margin:1px auto 0;"></span>`;
        }

        html += `
          <div onclick="showDayDetail('${key}')" class="flex flex-col items-center justify-center" style="aspect-ratio:1;background:${bg};border:1px solid ${border};border-radius:var(--rsm);cursor:pointer;position:relative;transition:all .15s var(--ease)">
            <span class="mono" style="font-size:${isToday ? '11' : '10'}px;font-weight:${isToday ? '700' : '500'};color:${habitCount > 0 ? 'var(--ink)' : 'var(--ink3)'}">${d}</span>
            ${indicator}
            ${moodDot}
          </div>
        `;
      }

      // Padding final para completar la última fila
      const totalCells = startPad + totalDays;
      const remaining = (7 - (totalCells % 7)) % 7;
      for (let i = 0; i < remaining; i++) {
        html += '<div style="aspect-ratio:1;"></div>';
      }

      html += `</div></div>`;

      // Resumen del mes
      let monthHabits = 0, monthDays = 0;
      for (let d = 1; d <= totalDays; d++) {
        const key = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayLog = load(K.log(key), null);
        if (dayLog && dayLog.habits.filter(h => h !== '__touched').length > 0) {

      html += `

          <div class="flex gap-3">
            <div class="text-center flex-1">

              <div class="mono data-cell-label">PROMEDIO/DÍA</div>
            </div>
          </div>
        </div>
      `;

      return html;
    }

    function miniRadarSVG(size = 36) {
      const stats = Object.keys(STATS);
      const levels = stats.map(k => levelFromXP(state.xp[k]));
      const maxLvl = Math.max(...levels, 1);
      const cx = size / 2, cy = size / 2, r = size / 2 - 2;
      const n = stats.length;
      const angles = stats.map((_, i) => (Math.PI * 2 * i / n) - Math.PI / 2);

      // Build polygon points for the user's shape
      const pts = levels.map((lvl, i) => {
        const pct = Math.max(lvl / Math.max(maxLvl, 10), 0.08);
        const x = cx + r * pct * Math.cos(angles[i]);
        const y = cy + r * pct * Math.sin(angles[i]);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;pointer-events:none">
        <polygon points="${pts}" fill="rgba(139,92,246,.35)" stroke="rgba(139,92,246,.9)" stroke-width="1.5"/>
        ${levels.map((lvl, i) => {
        const pct = Math.max(lvl / Math.max(maxLvl, 10), 0.08);
        const x = cx + r * pct * Math.cos(angles[i]);
        const y = cy + r * pct * Math.sin(angles[i]);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.5" fill="rgba(139,92,246,1)"/>`;
      }).join('')}
      </svg>`;
    }

          </div>
        </div>

        <div class="card">
          <div class="card-title"><span class="card-title-text">Acciones</span></div>
      `;

      const actions = [
        { key: 'skip_sysquest', fn: 'ppSkipSysquest()', condition: !!state.sysquest },
        { key: 'quest_reroll', fn: 'ppQuestReroll()', condition: state.sysquest?.status === 'pending' },
        { key: 'postpone_intent', fn: 'ppPostponeIntent()', condition: log.daily_intent.items.length > 0 },
        { key: 'streak_insurance', fn: 'ppStreakInsurance()', condition: state.streaks.daily_log.current === 0 },
        { key: 'pause_mode', fn: 'ppActivatePause()', condition: !isPaused() },
        { key: 'double_dungeon', fn: 'promptDoubleDungeon()', condition: state.bosses.some(b => !b.completed && !b.doubleReward) },
      ];

      actions.forEach(a => {
        const item = PP_SPEND[a.key];
        if (!item) return;
        const canAfford = state.pp >= item.cost;
        const withinLimit = checkPPLimit(a.key);
        const available = a.condition && canAfford && withinLimit;
        html += `
          <div class="setting-row" style="opacity:${available ? 1 : 0.4};">
            <div>
              <div class="setting-name">${item.label}</div>
              <div class="setting-sub">${item.cost} PP · ${item.limit}</div>
            </div>
            <button class="btn btn-sm ${available ? '' : 'btn-ghost'}" ${available ? `onclick="${a.fn}"` : 'disabled'} style="min-width:70px;">
              ${available ? 'Usar' : canAfford ? 'Limit' : 'Sin PP'}
            </button>
          </div>
        `;
      });

      html += `</div>`;

      // V19.5: Mentor Question featured card
      html += `
        <div class="card mentor-card" onclick="openModal('mentor')" style="cursor:pointer;border-left:2px solid var(--sys);position:relative;overflow:hidden">
          <div class="sysnotif-corner tl"></div>
          <div class="sysnotif-corner tr"></div>
          <div class="sysnotif-corner bl"></div>
          <div class="sysnotif-corner br"></div>
          <div style="display:flex;align-items:flex-start;gap:14px;padding:6px 4px">
            <div style="flex-shrink:0;width:42px;height:42px;border:1px solid var(--sys);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sys);box-shadow:0 0 12px var(--sys-glow)">
              ${svgIcon('eye', 'icon')}
            </div>
            <div style="flex:1;min-width:0">
              <div class="mono text-xs text-sys" style="letter-spacing:.25em;margin-bottom:4px">MENTOR QUESTION</div>
              <div class="display text-xl" style="margin-bottom:4px">Diagnóstico del Sistema</div>
              <div class="text-sm text-ink2" style="line-height:1.4">El Sistema analiza tu evaluación actual y te devuelve una pregunta específica. 50 PP por consulta.</div>
            </div>
            <span class="text-ink3" style="align-self:center">${svgIcon('chevron', 'icon')}</span>
          </div>
        </div>
      `;

      // V18: Class Points breakdown
      const lastEval = state.classPoints?.history?.[state.classPoints.history.length - 1];
      if (lastEval) {
        const totalBonus = Object.values(lastEval.bonuses || {}).reduce((a, b) => a + b, 0);
        const totalPen = Object.values(lastEval.penalties || {}).reduce((a, b) => a + b, 0);
        html += `
          <div class="card">
            <div class="card-title"><span class="card-title-text">Última evaluación semanal</span></div>
            <div class="flex items-baseline gap-2 mb-2">
              <div class="display text-3xl" style="color:var(--sys)">+${lastEval.total}</div>
              <div class="mono text-sm text-ink3">PP · Clase ${lastEval.class} · ${lastEval.week}</div>
            </div>
            <div class="mono text-sm text-ink2" style="line-height:1.8">
              <div>Base Clase ${lastEval.class}: <span style="color:var(--ink)">+${lastEval.base}</span></div>
              <div style="color:var(--positive)">Bonuses: +${totalBonus}</div>
              <div style="padding-left:12px;font-size:11px;opacity:.7">
                ${lastEval.bonuses.habits ? `+${lastEval.bonuses.habits} hábitos · ` : ''}
                ${lastEval.bonuses.sysquests ? `+${lastEval.bonuses.sysquests} sysquests · ` : ''}
                ${lastEval.bonuses.combos ? `+${lastEval.bonuses.combos} combos · ` : ''}
                ${lastEval.bonuses.intent ? `+${lastEval.bonuses.intent} intent 3/3 · ` : ''}
                ${lastEval.bonuses.screenTime ? `+${lastEval.bonuses.screenTime} screen time · ` : ''}
                ${lastEval.bonuses.streak ? `+${lastEval.bonuses.streak} streak` : ''}
              </div>
              ${totalPen < 0 ? `
                <div style="color:var(--negative)">Penalizaciones: ${totalPen}</div>
                <div style="padding-left:12px;font-size:11px;opacity:.7">
                  ${lastEval.penalties.inactive ? `${lastEval.penalties.inactive} inactividad · ` : ''}
                  ${lastEval.penalties.sysquestFailed ? `${lastEval.penalties.sysquestFailed} sysquests fallidas · ` : ''}
                  ${lastEval.penalties.screenTimeFail ? `${lastEval.penalties.screenTimeFail} screen time excedido` : ''}
                </div>
              ` : ''}
            </div>
            <div class="text-xs text-ink3 mono mt-2" style="text-align:center;padding-top:8px;border-top:1px solid var(--border)">
              Próxima evaluación: lunes
            </div>
          </div>
        `;
      }

      const recent = state.ppLog.slice(-12).reverse();
      if (recent.length) {
        html += `<div class="card"><div class="card-title"><span class="card-title-text">Historial reciente</span></div>`;
        recent.forEach(l => {
          const color = l.type === 'earn' ? 'var(--positive)' : 'var(--negative)';
          const sign = l.type === 'earn' ? '+' : '';
          html += `
            <div class="text-md flex items-center border-t" style="padding:8px 0">
              <span class="mono font-bold" style="color:${color};width:60px">${sign}${l.amount}</span>
              <span class="text-ink2 flex-1">${l.reason}</span>
              <span class="mono log-date">${l.date.slice(5)}</span>
            </div>
          `;
        });
        html += `</div>`;
      }

      return html;
    }

    function renderNav() {
      const p = state.page;
      return `
        <div class="bottom-nav">
          <button class="nav-tab ${p === 'home' ? 'active' : ''}" onclick="goPage('home')">
            ${svgIcon('home')}
            <span>Home</span>
          </button>
          <button class="nav-tab ${p === 'stats' || p === 'calendar' ? 'active' : ''}" onclick="goPage('stats')">
            ${svgIcon('chart')}
            <span>Status</span>
          </button>
          <button class="nav-tab nav-tab-center ${p === 'character' ? 'active' : ''}" onclick="goPage('character')">
            <div class="nav-radar">${miniRadarSVG(26)}</div>
            <span>Profile</span>
          </button>
          <button class="nav-tab ${p === 'pp' ? 'active' : ''}" onclick="goPage('pp')">
            ${svgIcon('coin')}
            <span>Points</span>
          </button>
          <button class="nav-tab" onclick="openModal('menu')">
            ${svgIcon('menu')}
            <span>Menú</span>
          </button>
        </div>
      `;
    }


  </script>
</body>

</html>
