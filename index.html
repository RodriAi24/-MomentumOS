<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Momentum">
  <title>MomentumOS · Awakening</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="theme-color" content="#05040A" id="themeColorMeta">
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #05040A;
      --bg2: #0A0814;
      --bg3: #110E1F;
      --card: #14111F;
      --card2: #1A1628;
      --surface: #221E33;
      --ink: #E8E4F5;
      --ink2: #A8A1C2;
      --ink3: #6A6483;
      --ink4: #3A3550;
      --border: #1F1B30;
      --border2: #2A2540;
      --sys: #8B5CF6;
      --sys2: #A78BFA;
      --sys3: #C4B5FD;
      --sys-glow: rgba(139, 92, 246, .5);
      --sys-dim: rgba(139, 92, 246, .12);
      --cyan: #22D3EE;
      --cyan-dim: rgba(34, 211, 238, .12);
      --rank-e: #6B7280;
      --rank-d: #84CC16;
      --rank-c: #06B6D4;
      --rank-b: #8B5CF6;
      --rank-a: #F59E0B;
      --rank-s: #EF4444;
      --rank-national: #EC4899;
      --stat-fuerza: #FF4444;
      --stat-sabiduria: #FFB020;
      --stat-disciplina: #4ADE80;
      --stat-alma: #60A5FA;
      --stat-vinculo: #F472B6;
      --stat-juego: #C084FC;
      --stat-fuerza-dim: rgba(255, 68, 68, .14);
      --stat-sabiduria-dim: rgba(255, 176, 32, .14);
      --stat-disciplina-dim: rgba(74, 222, 128, .14);
      --stat-alma-dim: rgba(96, 165, 250, .14);
      --stat-vinculo-dim: rgba(244, 114, 182, .14);
      --stat-juego-dim: rgba(192, 132, 252, .14);
      --positive: #4ADE80;
      --negative: #EF4444;
      --warning: #F59E0B;
      --info: #22D3EE;
      --radius: 4px;
      --rsm: 2px;
      --ease: cubic-bezier(.32, .72, 0, 1);
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body[data-theme="light"] {
      --bg: #F5F3F8;
      --bg2: #FFFFFF;
      --bg3: #FAF8FC;
      --card: #FFFFFF;
      --card2: #FAF8FC;
      --surface: #EFEBF5;
      --ink: #14111F;
      --ink2: #4A4665;
      --ink3: #76728F;
      --ink4: #BCB8D0;
      --border: #E5E1F0;
      --border2: #D5D1E5;
      --sys-dim: rgba(139, 92, 246, .08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      overscroll-behavior: none;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(139, 92, 246, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, .025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
    }

    ::-webkit-scrollbar {
      width: 0;
      display: none;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom)) 0;
      min-height: 100dvh;
      position: relative;
      z-index: 1;
    }

    .mono {
      font-family: var(--font-mono);
    }

    .display {
      font-family: var(--font-display);
      letter-spacing: .04em;
    }

    .page {
      display: none;
      padding: 8px 16px;
      animation: fadeIn .35s var(--ease);
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glitchIn {
      0% {
        opacity: 0;
        transform: translateY(-6px);
        clip-path: inset(0 0 100% 0);
      }

      20% {
        clip-path: inset(0 0 60% 0);
        transform: translateY(-2px) translateX(2px);
      }

      40% {
        clip-path: inset(40% 0 20% 0);
        transform: translateX(-2px);
      }

      60% {
        clip-path: inset(0 0 30% 0);
        transform: translateX(1px);
      }

      80% {
        clip-path: inset(0 0 0 0);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        clip-path: inset(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .5;
      }
    }

    @keyframes scan {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(100%);
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 12px var(--sys-glow), inset 0 0 12px rgba(139, 92, 246, .08);
      }

      50% {
        box-shadow: 0 0 24px var(--sys-glow), inset 0 0 18px rgba(139, 92, 246, .14);
      }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, var(--bg) 75%, transparent 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--sys);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: var(--sys2);
      flex-shrink: 0;
      cursor: pointer;
      transition: all .2s var(--ease);
      position: relative;
      overflow: hidden;
      font-family: var(--font-mono);
    }

    .avatar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, var(--sys-dim) 100%);
      opacity: .5;
    }

    .avatar:active {
      transform: scale(.94);
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-tag {
      font-size: 10px;
      color: var(--sys2);
      font-weight: 600;
      letter-spacing: .2em;
      font-family: var(--font-mono);
      text-transform: uppercase;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-tag::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--sys);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .header-rank {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--sys2);
      letter-spacing: .08em;
      text-shadow: 0 0 8px var(--sys-glow);
    }

    .header-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink2);
      cursor: pointer;
      transition: all .2s var(--ease);
    }

    .header-btn:active {
      transform: scale(.92);
      border-color: var(--sys);
      color: var(--sys2);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .card-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--sys2);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-bottom: 14px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title-text {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title-text::before {
      content: '▸ ';
      color: var(--sys);
    }

    .card-action {
      font-size: 10px;
      color: var(--sys2);
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .12em;
      border: 1px solid var(--border2);
      padding: 4px 10px;
      border-radius: var(--radius);
      transition: all .2s var(--ease);
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .card-action:hover,
    .card-action:active {
      border-color: var(--sys);
      background: var(--sys-dim);
    }

    .btn {
      background: var(--sys);
      color: #fff;
      border: 1px solid var(--sys);
      padding: 12px 20px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .2s var(--ease);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, .15) 50%, transparent 100%);
      transform: translateY(-100%);
      transition: transform .3s var(--ease);
    }

    .btn:active::before {
      transform: translateY(0);
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border2);
    }

    .btn-ghost:active {
      border-color: var(--sys);
      background: var(--sys-dim);
      color: var(--sys2);
    }

    .btn-danger {
      background: transparent;
      border-color: var(--negative);
      color: var(--negative);
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 11px;
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .icon-lg {
      width: 22px;
      height: 22px;
    }

    .icon-sm {
      width: 14px;
      height: 14px;
    }

    /* === SYSTEM NOTIFICATION (Daily Quest, Rank Up) === */
    .sysnotif {
      background: var(--bg2);
      border: 1px solid var(--sys);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      animation: glitchIn .5s var(--ease);
      box-shadow: 0 0 24px var(--sys-glow), inset 0 0 16px rgba(139, 92, 246, .06);
    }

    .sysnotif::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--sys), transparent);
      animation: scan 3s linear infinite;
    }

    .sysnotif-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--sys);
    }

    .sysnotif-corner.tl {
      top: 6px;
      left: 6px;
      border-right: 0;
      border-bottom: 0;
    }

    .sysnotif-corner.tr {
      top: 6px;
      right: 6px;
      border-left: 0;
      border-bottom: 0;
    }

    .sysnotif-corner.bl {
      bottom: 6px;
      left: 6px;
      border-right: 0;
      border-top: 0;
    }

    .sysnotif-corner.br {
      bottom: 6px;
      right: 6px;
      border-left: 0;
      border-top: 0;
    }

    .sysnotif-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 6px;
    }

    .sysnotif-icon {
      color: var(--sys2);
    }

    .sysnotif-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--sys2);
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    .sysnotif-rank {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      color: var(--ink2);
      letter-spacing: .15em;
      padding: 2px 6px;
      border: 1px solid var(--border2);
      border-radius: 2px;
    }

    .sysnotif-body {
      padding: 0 6px;
    }

    .sysnotif-title {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: .04em;
      line-height: 1;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .sysnotif-desc {
      font-size: 13px;
      color: var(--ink2);
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .sysnotif-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .1em;
    }

    .sysnotif-stat {
      padding: 8px 10px;
      background: var(--bg);
      border-left: 2px solid var(--sys);
      border-radius: 0;
    }

    .sysnotif-stat-label {
      font-size: 9px;
      color: var(--ink3);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .sysnotif-stat-val {
      font-size: 12px;
      color: var(--ink);
      font-weight: 600;
    }

    .sysnotif-stat.reward {
      border-left-color: var(--positive);
    }

    .sysnotif-stat.reward .sysnotif-stat-val {
      color: var(--positive);
    }

    .sysnotif-stat.penalty {
      border-left-color: var(--negative);
    }

    .sysnotif-stat.penalty .sysnotif-stat-val {
      color: var(--negative);
    }

    .sysnotif-stat.deadline {
      border-left-color: var(--warning);
    }

    .sysnotif-stat.deadline .sysnotif-stat-val {
      color: var(--warning);
    }

    .sysnotif-actions {
      display: flex;
      gap: 8px;
      padding: 0 6px;
    }

    .sysnotif.accepted {
      border-color: var(--positive);
      box-shadow: 0 0 16px rgba(74, 222, 128, .3);
    }

    .sysnotif.accepted::before {
      background: linear-gradient(90deg, transparent, var(--positive), transparent);
    }

    .sysnotif.failed {
      border-color: var(--negative);
      box-shadow: 0 0 16px rgba(239, 68, 68, .25);
      opacity: .8;
    }

    .sysnotif.completed {
      border-color: var(--positive);
    }

    /* === STAT BARS === */
    .stat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      cursor: pointer;
      transition: all .15s var(--ease);
    }

    .stat-row+.stat-row {
      border-top: 1px solid var(--border);
    }

    .stat-row:active {
      transform: scale(.995);
    }

    .stat-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      position: relative;
    }

    .stat-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.5;
      fill: none;
    }

    .stat-body {
      flex: 1;
      min-width: 0;
    }

    .stat-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .stat-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .stat-lvl {
      font-family: var(--font-display);
      font-size: 18px;
      letter-spacing: .05em;
    }

    .stat-bar {
      height: 6px;
      background: var(--surface);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
    }

    .stat-fill {
      height: 100%;
      border-radius: 1px;
      transition: width .8s var(--ease);
      position: relative;
    }

    .stat-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .3), transparent);
      animation: shimmer 4s infinite;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    .stat-xp {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      margin-top: 4px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* === HABIT CHIPS === */
    .habit-group {
      margin-bottom: 16px;
    }

    .habit-group:last-child {
      margin-bottom: 0;
    }

    .habit-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .habit-group-dot {
      width: 6px;
      height: 6px;
    }

    .habit-group-name {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .habit-group-cap {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      font-weight: 600;
      letter-spacing: .05em;
    }

    .habit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .habit-chip {
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all .2s var(--ease);
      text-align: left;
      font-family: inherit;
      color: var(--ink);
      position: relative;
      overflow: hidden;
    }

    .habit-chip:active {
      transform: scale(.97);
    }

    .habit-chip.done {
      background: var(--sys-dim);
      border-color: var(--sys);
    }

    .habit-chip.capped {
      opacity: .45;
    }

    .habit-chip-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .habit-chip-icon svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.5;
      fill: none;
    }

    .habit-chip-body {
      flex: 1;
      min-width: 0;
    }

    .habit-chip-name {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--ink);
    }

    .habit-chip-xp {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      color: var(--ink3);
      margin-top: 2px;
      letter-spacing: .05em;
    }

    .habit-chip.done .habit-chip-xp {
      color: var(--sys2);
    }

    /* === SCROLL AM CARD === */
    .scroll-am {
      background: var(--card);
      border: 1px solid var(--border2);
      border-left: 3px solid var(--warning);
      border-radius: var(--radius);
      padding: 14px 14px 14px 16px;
      margin-bottom: 12px;
    }

    .scroll-am-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--warning);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .scroll-am-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .scroll-am-btns {
      display: flex;
      gap: 6px;
    }

    .scroll-am-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border2);
      background: var(--card2);
      color: var(--ink);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 10px;
      cursor: pointer;
      transition: all .2s var(--ease);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .scroll-am-btn.win:active {
      background: rgba(74, 222, 128, .12);
      border-color: var(--positive);
      color: var(--positive);
    }

    .scroll-am-btn.lose:active {
      background: rgba(239, 68, 68, .1);
      border-color: var(--negative);
      color: var(--negative);
    }

    .scroll-am-btn-xp {
      font-size: 10px;
      font-weight: 700;
      opacity: .7;
      font-family: var(--font-display);
      letter-spacing: .04em;
    }

    .scroll-am-btn.win .scroll-am-btn-xp {
      color: var(--positive);
    }

    .scroll-am-btn.lose .scroll-am-btn-xp {
      color: var(--negative);
    }

    .scroll-am-result {
      padding: 10px;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .scroll-am-result.won {
      border-left: 3px solid var(--positive);
      color: var(--positive);
    }

    .scroll-am-result.lost {
      border-left: 3px solid var(--negative);
      color: var(--negative);
    }

    /* === DAILY INTENT === */
    .intent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      cursor: pointer;
    }

    .intent-item+.intent-item {
      border-top: 1px solid var(--border);
    }

    .intent-check {
      width: 18px;
      height: 18px;
      border-radius: 2px;
      border: 1.5px solid var(--ink4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all .2s var(--ease);
      color: transparent;
    }

    .intent-item.done .intent-check {
      background: var(--sys);
      border-color: var(--sys);
      color: #fff;
    }

    .intent-text {
      flex: 1;
      font-size: 13px;
      transition: all .25s var(--ease);
    }

    .intent-item.done .intent-text {
      color: var(--ink3);
      text-decoration: line-through;
    }

    .intent-empty {
      text-align: center;
      padding: 16px;
      color: var(--ink3);
      font-size: 12px;
      font-family: var(--font-mono);
      letter-spacing: .08em;
    }

    /* === QUESTS / DUNGEONS === */
    .quest {
      background: var(--card2);
      border: 1px solid var(--border2);
      border-left: 3px solid var(--sys);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all .2s var(--ease);
    }

    .quest:active {
      transform: scale(.99);
    }

    .quest.dungeon {
      border-left-color: var(--rank-a);
      background: linear-gradient(90deg, rgba(245, 158, 11, .04), var(--card2));
    }

    .quest.completed {
      opacity: .55;
    }

    .quest-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      gap: 10px;
    }

    .quest-name {
      font-size: 13px;
      font-weight: 600;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quest-xp {
      font-family: var(--font-display);
      font-size: 15px;
      letter-spacing: .05em;
      color: var(--sys2);
      white-space: nowrap;
    }

    .quest-bar {
      height: 4px;
      background: var(--surface);
      border-radius: 1px;
      overflow: hidden;
    }

    .quest-fill {
      height: 100%;
      background: var(--sys);
      border-radius: 1px;
      transition: width .8s var(--ease);
    }

    .quest.dungeon .quest-fill {
      background: var(--rank-a);
    }

    .quest-progress {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink2);
      margin-top: 6px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .quest-reward {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink3);
      margin-top: 4px;
      letter-spacing: .04em;
    }

    /* === MODAL === */
    .modal-ov {
      position: fixed;
      inset: 0;
      background: rgba(5, 4, 10, .85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn .25s var(--ease);
    }

    .modal-ov.show {
      display: flex;
    }

    .modal {
      background: var(--bg2);
      border-top: 1px solid var(--sys);
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      width: 100%;
      max-width: 500px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 20px 18px calc(36px + env(safe-area-inset-bottom));
      animation: slideUp .35s var(--ease);
      position: relative;
    }

    .modal::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sys), transparent);
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-handle {
      width: 32px;
      height: 3px;
      background: var(--ink4);
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .modal-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--sys2);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 26px;
      letter-spacing: .04em;
      margin-bottom: 4px;
      color: var(--ink);
    }

    .modal-sub {
      font-size: 12px;
      color: var(--ink2);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .modal-section {
      margin-bottom: 16px;
    }

    .modal-label {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      color: var(--ink3);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 11px 13px;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 13px;
      transition: border-color .2s var(--ease);
    }

    .input:focus {
      outline: 0;
      border-color: var(--sys);
    }

    textarea.input {
      resize: vertical;
      min-height: 70px;
      font-family: var(--font-body);
    }

    /* === XP FLOAT === */
    .xp-float {
      position: fixed;
      pointer-events: none;
      z-index: 300;
      font-family: var(--font-display);
      font-size: 24px;
      letter-spacing: .04em;
      animation: xpFloat 1.4s var(--ease) forwards;
      text-shadow: 0 0 10px currentColor;
    }

    @keyframes xpFloat {
      0% {
        opacity: 0;
        transform: translateY(0) scale(.6);
      }

      20% {
        opacity: 1;
        transform: translateY(-15px) scale(1.1);
      }

      80% {
        opacity: 1;
        transform: translateY(-65px) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-90px) scale(.9);
      }
    }

    /* === LEVEL UP === */
    .levelup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 400;
      background: rgba(5, 4, 10, .92);
      backdrop-filter: blur(14px);
      animation: fadeIn .3s var(--ease);
    }

    .levelup.show {
      display: flex;
    }

    .levelup-content {
      text-align: center;
      animation: levelupPulse .9s var(--ease);
      padding: 30px;
      border: 1px solid var(--sys);
      background: var(--bg2);
      position: relative;
      min-width: 280px;
      border-radius: var(--radius);
      box-shadow: 0 0 60px var(--sys-glow);
    }

    .levelup-content .sysnotif-corner {
      animation: pulse 1.5s infinite;
    }

    @keyframes levelupPulse {
      0% {
        transform: scale(.5);
        opacity: 0;
      }

      60% {
        transform: scale(1.1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .levelup-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .3em;
      color: var(--sys2);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .levelup-num {
      font-family: var(--font-display);
      font-size: 100px;
      letter-spacing: .06em;
      line-height: 1;
      color: var(--sys2);
      text-shadow: 0 0 20px var(--sys-glow);
      margin-bottom: 8px;
    }

    .levelup-stat {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      font-family: var(--font-mono);
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    /* === RANK UP === */
    .rankup-content {
      text-align: center;
      animation: levelupPulse .9s var(--ease);
      padding: 40px 36px;
      border: 1px solid var(--sys);
      background: var(--bg2);
      position: relative;
      min-width: 280px;
      border-radius: var(--radius);
      box-shadow: 0 0 80px var(--sys-glow);
    }

    .rankup-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .35em;
      color: var(--sys2);
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .rankup-num {
      font-family: var(--font-display);
      font-size: 140px;
      letter-spacing: .06em;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 24px currentColor;
    }

    .rankup-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .25em;
      color: var(--ink);
      text-transform: uppercase;
    }

    /* === RADAR === */
    .radar-wrap {
      position: relative;
      height: 280px;
      padding: 4px;
    }

    /* === HEATMAP === */
    .heatmap {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      padding: 6px 0;
    }

    .heatmap-cell {
      aspect-ratio: 1;
      background: var(--surface);
      border-radius: 1px;
      transition: all .2s var(--ease);
      cursor: pointer;
      position: relative;
    }

    .heatmap-cell[data-lvl="1"] {
      background: rgba(139, 92, 246, .25);
    }

    .heatmap-cell[data-lvl="2"] {
      background: rgba(139, 92, 246, .5);
    }

    .heatmap-cell[data-lvl="3"] {
      background: rgba(139, 92, 246, .75);
    }

    .heatmap-cell[data-lvl="4"] {
      background: var(--sys);
    }

    .heatmap-cell:hover {
      transform: scale(1.15);
    }

    /* === ACHIEVEMENTS === */
    .ach-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .ach {
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 14px 8px 12px;
      text-align: center;
      transition: all .2s var(--ease);
    }

    .ach.unlocked {
      background: var(--sys-dim);
      border-color: var(--sys);
    }

    .ach.locked {
      opacity: .3;
    }

    .ach-icon {
      width: 32px;
      height: 32px;
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ach-icon svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.5;
      fill: none;
      color: var(--sys2);
    }

    .ach.locked .ach-icon svg {
      color: var(--ink3);
    }

    .ach-name {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .ach-desc {
      font-size: 9px;
      color: var(--ink3);
      margin-top: 3px;
      line-height: 1.3;
    }

    /* === MOOD === */
    .mood-row {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }

    .mood-btn {
      flex: 1;
      aspect-ratio: 1;
      max-width: 52px;
      border: 1px solid var(--border2);
      background: var(--card2);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink2);
    }

    .mood-btn svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.5;
      fill: none;
    }

    .mood-btn.selected {
      background: var(--sys-dim);
      border-color: var(--sys);
      color: var(--sys2);
      transform: scale(1.05);
    }

    /* === TOAST === */
    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg2);
      border: 1px solid var(--sys);
      padding: 10px 16px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      z-index: 250;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5), 0 0 16px var(--sys-glow);
      opacity: 0;
      transition: opacity .25s var(--ease), transform .25s var(--ease);
      pointer-events: none;
      max-width: 90vw;
      text-transform: uppercase;
      color: var(--ink);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-8px);
    }

    .toast.danger {
      border-color: var(--negative);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5), 0 0 16px rgba(239, 68, 68, .5);
    }

    .toast.positive {
      border-color: var(--positive);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5), 0 0 16px rgba(74, 222, 128, .5);
    }

    /* === CHECK-IN === */
    .checkin {
      background: var(--card);
      border: 1px solid var(--warning);
      border-left: 3px solid var(--warning);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .checkin.serious {
      border-color: var(--info);
      border-left-color: var(--info);
    }

    .checkin-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--warning);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .checkin.serious .checkin-tag {
      color: var(--info);
    }

    .checkin-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .checkin-text {
      font-size: 12px;
      color: var(--ink2);
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .checkin-actions {
      display: flex;
      gap: 6px;
    }

    /* === SETTINGS === */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-name {
      font-size: 13px;
      font-weight: 600;
    }

    .setting-sub {
      font-size: 11px;
      color: var(--ink3);
      margin-top: 2px;
      font-family: var(--font-mono);
      letter-spacing: .05em;
    }

    .switch {
      width: 42px;
      height: 24px;
      background: var(--ink4);
      border-radius: 100px;
      position: relative;
      cursor: pointer;
      transition: background .2s var(--ease);
      flex-shrink: 0;
    }

    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s var(--ease);
    }

    .switch.on {
      background: var(--sys);
    }

    .switch.on::after {
      transform: translateX(18px);
    }

    /* === EMPTY === */
    .empty {
      text-align: center;
      padding: 24px 16px;
      color: var(--ink3);
    }

    .empty-icon {
      width: 32px;
      height: 32px;
      margin: 0 auto 8px;
      opacity: .4;
    }

    .empty-icon svg {
      width: 100%;
      height: 100%;
      stroke-width: 1.5;
      fill: none;
    }

    .empty-text {
      font-size: 12px;
      line-height: 1.5;
      font-family: var(--font-mono);
      letter-spacing: .04em;
    }

    /* === ONBOARDING === */
    .onb {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 500;
      display: flex;
      flex-direction: column;
      padding: 50px 24px 30px;
      animation: fadeIn .5s var(--ease);
      overflow-y: auto;
    }

    .onb-frame {
      flex: 1;
      border: 1px solid var(--sys);
      border-radius: var(--radius);
      position: relative;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--bg2);
      box-shadow: 0 0 40px var(--sys-glow), inset 0 0 24px rgba(139, 92, 246, .04);
      overflow: hidden;
    }

    .onb-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sys), transparent);
      animation: scan 4s linear infinite;
    }

    .onb-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--sys2);
      letter-spacing: .35em;
      margin-bottom: 24px;
      text-transform: uppercase;
      text-align: center;
    }

    .onb-step {
      text-align: center;
      animation: glitchIn .5s var(--ease);
    }

    .onb-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      color: var(--sys2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .onb-icon svg {
      width: 100%;
      height: 100%;
      stroke-width: 1.2;
      fill: none;
      filter: drop-shadow(0 0 6px var(--sys-glow));
    }

    .onb-title {
      font-family: var(--font-display);
      font-size: 32px;
      letter-spacing: .04em;
      margin-bottom: 12px;
      line-height: 1.05;
    }

    .onb-text {
      font-size: 14px;
      color: var(--ink2);
      line-height: 1.6;
      max-width: 380px;
      margin: 0 auto;
    }

    .onb-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 18px 0 12px;
    }

    .onb-dot {
      width: 6px;
      height: 6px;
      background: var(--ink4);
      transition: all .25s var(--ease);
    }

    .onb-dot.active {
      background: var(--sys2);
      width: 24px;
      box-shadow: 0 0 8px var(--sys-glow);
    }

    /* === SLIDER === */
    .slider {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      height: 4px;
      background: var(--surface);
      border-radius: 2px;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--sys);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg2);
      box-shadow: 0 0 8px var(--sys-glow);
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: var(--sys);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg2);
    }

    .slider-val {
      text-align: center;
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: .04em;
      margin-top: 6px;
      color: var(--sys2);
    }

    /* === DUNGEON STEP === */
    .dungeon-step {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .dungeon-step .input {
      flex: 1;
    }

    .boss-step-del {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      background: var(--card2);
      border: 1px solid var(--border2);
      color: var(--ink3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .boss-step-check {
      width: 20px;
      height: 20px;
      border-radius: 2px;
      border: 1.5px solid var(--ink4);
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      transition: all .2s var(--ease);
    }

    .boss-step-check.done {
      background: var(--sys);
      border-color: var(--sys);
      color: #fff;
    }

    .boss-step-name {
      flex: 1;
      font-size: 12px;
    }

    .boss-step-row.done .boss-step-name {
      color: var(--ink3);
      text-decoration: line-through;
    }

    .boss-step-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }

    .boss-step-row:first-child {
      border-top: 0;
    }

    /* === SELECT === */
    .select {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .select-opt {
      padding: 9px 6px;
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--ink2);
      cursor: pointer;
      transition: all .2s var(--ease);
      text-align: center;
      letter-spacing: .08em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .select-opt svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.5;
      fill: none;
    }

    .select-opt.selected {
      background: var(--sys-dim);
      border-color: var(--sys);
      color: var(--sys2);
    }

    /* === FOCUS TIMER === */
    .timer-wrap {
      text-align: center;
      padding: 16px 0;
    }

    .timer-frame {
      width: 240px;
      height: 240px;
      margin: 0 auto 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-frame::before,
    .timer-frame::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border: 1.5px solid var(--sys);
    }

    .timer-frame::before {
      top: 0;
      left: 0;
      border-right: 0;
      border-bottom: 0;
    }

    .timer-frame::after {
      bottom: 0;
      right: 0;
      border-left: 0;
      border-top: 0;
    }

    .timer-corner-tr,
    .timer-corner-bl {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 1.5px solid var(--sys);
    }

    .timer-corner-tr {
      top: 0;
      right: 0;
      border-left: 0;
      border-bottom: 0;
    }

    .timer-corner-bl {
      bottom: 0;
      left: 0;
      border-right: 0;
      border-top: 0;
    }

    .timer-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all .3s var(--ease);
    }

    .timer-circle.running {
      border-color: var(--sys);
      box-shadow: 0 0 40px var(--sys-glow), inset 0 0 30px rgba(139, 92, 246, .08);
      animation: glow 2.5s infinite;
    }

    .timer-time {
      font-family: var(--font-display);
      font-size: 56px;
      letter-spacing: .04em;
      line-height: 1;
      color: var(--ink);
    }

    .timer-mode {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      letter-spacing: .3em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .timer-actions {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* === STATUS WINDOW (Character sheet) === */
    .status-window {
      background: var(--bg2);
      border: 1px solid var(--sys);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 0 24px var(--sys-glow);
    }

    .status-window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sys), transparent);
    }

    .status-title {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--sys2);
      letter-spacing: .3em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border2);
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .status-row-h {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      letter-spacing: .15em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .status-row-v {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: .05em;
      color: var(--ink);
    }

    .status-row-v.sys {
      color: var(--sys2);
      text-shadow: 0 0 6px var(--sys-glow);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 500px;
      margin: 0 auto;
      padding: 8px 20px calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent 0%, var(--bg) 35%);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-tab {
      background: none;
      border: 0;
      color: var(--ink3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 14px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      transition: color .2s var(--ease);
    }

    .nav-tab svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.5;
      fill: none;
    }

    .nav-tab.active {
      color: var(--sys2);
    }

    .nav-tab.active svg {
      filter: drop-shadow(0 0 6px var(--sys-glow));
    }

    .nav-tab-fab {
      background: var(--sys);
      border: 1px solid var(--sys);
      width: 56px;
      height: 56px;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(139, 92, 246, .4), 0 0 16px var(--sys-glow);
      transition: all .25s var(--ease);
      margin-top: -16px;
      position: relative;
    }

    .nav-tab-fab::before {
      content: '';
      position: absolute;
      inset: -3px;
      border: 1px solid var(--sys);
      border-radius: var(--radius);
      opacity: .4;
    }

    .nav-tab-fab:active {
      transform: scale(.92) rotate(45deg);
    }

    .nav-tab-fab svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
      fill: none;
    }

    .oaa-card {
      border-color: var(--sys);
      background: linear-gradient(180deg, var(--card) 0%, var(--bg2) 100%);
    }

    .oaa-grade {
      text-align: center;
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--border2);
      margin-bottom: 14px;
    }

    .oaa-grade-letter {
      font-family: var(--font-display);
      font-size: 72px;
      line-height: 1;
      color: var(--sys2);
      letter-spacing: .04em;
      text-shadow: 0 0 14px var(--sys-glow);
      margin-bottom: 4px;
    }

    .oaa-grade-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink3);
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    .oaa-dims {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 12px;
    }

    .oaa-dim {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: baseline;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }

    .oaa-dim:first-child {
      border-top: 0;
    }

    .oaa-dim-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: .15em;
    }

    .oaa-dim-letter {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--sys2);
      letter-spacing: .04em;
      text-shadow: 0 0 6px var(--sys-glow);
    }

    .oaa-dim-arrow {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      width: 16px;
      text-align: center;
    }

    .oaa-trend {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink3);
      letter-spacing: .15em;
      text-transform: uppercase;
      padding-top: 10px;
      border-top: 1px solid var(--border2);
    }
  </style>
</head>

    async function apiFetch(url, options = {}, timeoutMs = 5000) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch (e) {
        console.warn('API fetch failed:', url, e.message);
        return null;
      }
    }

    const ACADEMICO_HIGH_EFFORT = ['cca', 'tutorial', 'lang'];

    // Decay exponencial — vida media 14 días
    function timeWeight(daysAgo) {
      return Math.exp(-daysAgo / 14);
    }

    function daysSince(dateStr) {
      const d = new Date(dateStr);
      const now = new Date();
      return Math.floor((now - d) / (1000 * 60 * 60 * 24));
    }

    // Iterar sobre los últimos N días de logs
    function getRecentLogs(days = 30) {
      const logs = [];
      for (let i = 0; i < days; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const l = load(K.log(key), null);
        if (l) logs.push({ ...l, daysAgo: i });
      }
      return logs;
    }

    // Días con datos en últimos N días (proxy de antigüedad de uso)
    function daysWithData(days = 30) {
      return getRecentLogs(days).filter(l => l.habits.length > 0 || l.scroll_am !== null).length;
    }

    // ============================================================
    // CÁLCULO DE DIMENSIONES (0 a 14, mapeable a letras)
    // ============================================================

    function calcAcademico() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null; // no enough data

      const sabidIds = HABITS_BASE.sabiduria.map(h => h.id)
        .concat(state.custom.filter(c => c.stat === 'sabiduria').map(c => c.id));

      // Frecuencia ponderada
      let freqRaw = 0;
      let totalSabidLogs = 0;
      let highEffortLogs = 0;
      const uniqueHabits = new Set();
      const daysWithSabid = new Set();

      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (sabidIds.includes(h)) {
            freqRaw += w;
            totalSabidLogs++;
            uniqueHabits.add(h);
            daysWithSabid.add(log.date);
            if (ACADEMICO_HIGH_EFFORT.includes(h)) highEffortLogs++;
          }
        });
      });

      // Normalizar frecuencia (target: ~15 hábitos ponderados en 30d = A)
      const freqScore = Math.min(14, (freqRaw / 15) * 14);

      // Consistencia: % días con al menos 1 sabiduría
      const consistencyScore = (daysWithSabid.size / 30) * 14;

      // Profundidad: % de high-effort
      const depthScore = totalSabidLogs > 0
        ? Math.min(14, (highEffortLogs / totalSabidLogs) * 20)
        : 0;

      // Diversidad: cantidad de hábitos distintos
      const diversityScore = Math.min(14, (uniqueHabits.size / 5) * 14);

      let raw = freqScore * 0.40 + consistencyScore * 0.30 + depthScore * 0.20 + diversityScore * 0.10;

      // Penalizaciones
      // Racha de 5+ días sin sabiduría
      let dryStreak = 0, maxDryStreak = 0;
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const l = load(K.log(key), null);
        const hasSabid = l && l.habits.some(h => sabidIds.includes(h));
        if (!hasSabid) { dryStreak++; maxDryStreak = Math.max(maxDryStreak, dryStreak); }
        else dryStreak = 0;
      }
      if (maxDryStreak >= 5) raw -= 1.5;

      // Solo notes (el más fácil): cap C+
      if (totalSabidLogs > 0 && uniqueHabits.size === 1 && uniqueHabits.has('notes')) {
        raw = Math.min(raw, 8);
      }

      return Math.max(0, Math.min(14, raw));
    }

    function calcFisico() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      const fuerzaIds = HABITS_BASE.fuerza.map(h => h.id);

      let freqRaw = 0;
      let sleepDays = 0;
      let hydrationDays = 0;
      const daysWithFisico = new Set();
      const habitTypes = new Set();
      let gymDays = 0;

      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (fuerzaIds.includes(h)) {
            freqRaw += w;
            daysWithFisico.add(log.date);
            habitTypes.add(h);
            if (h === 'gym') gymDays++;
            if (h === 'sleep7') sleepDays++;
            if (h === 'hydration') hydrationDays++;
          }
        });
      });

      const freqScore = Math.min(14, (freqRaw / 18) * 14);
      const consistencyScore = (daysWithFisico.size / 30) * 14;
      const sleepScore = (sleepDays / 30) * 14;
      const hydraVarScore = Math.min(14, (hydrationDays / 20) * 7 + (habitTypes.size / 5) * 7);

      let raw = freqScore * 0.30 + consistencyScore * 0.30 + sleepScore * 0.20 + hydraVarScore * 0.20;

      // Penalizaciones
      // Solo gym sin variedad
      if (gymDays > 0 && habitTypes.size === 1 && habitTypes.has('gym')) {
        raw = Math.min(raw, 10); // cap B
      }
      // Sin gym 14+ días
      let gymDryStreak = 0;
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const l = load(K.log(key), null);
        if (!l || !l.habits.includes('gym')) gymDryStreak++;
        else break;
      }
      if (gymDryStreak >= 14) raw -= 2;

      return Math.max(0, Math.min(14, raw));
    }

    function calcMental() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      // Sysquests en últimos 30 días
      const sysQ30 = state.sysquest_history.filter(q => daysSince(q.date) <= 30);
      const accepted = sysQ30.filter(q => q.status === 'accepted' || q.status === 'completed' || q.status === 'failed').length;
      const completed = sysQ30.filter(q => q.status === 'completed').length;
      const rejected = sysQ30.filter(q => q.status === 'rejected').length;
      const totalIssued = sysQ30.length;

      // Aceptación rate
      const acceptRate = totalIssued > 0 ? accepted / totalIssued : 0.5;
      const acceptScore = acceptRate * 14;

      // Completion rate de las aceptadas
      const completeRate = accepted > 0 ? completed / accepted : 0.5;
      const completeScore = completeRate * 14;

      // Daily intent completion
      let intentDone = 0, intentTotal = 0;
      logs.forEach(log => {
        if (log.daily_intent.items.length > 0) {
          intentTotal += log.daily_intent.items.length;
          intentDone += log.daily_intent.completed.filter(Boolean).length;
        }
      });
      const intentScore = intentTotal > 0 ? (intentDone / intentTotal) * 14 : 7;

      // Scroll AM streak
      const scrollScore = Math.min(14, (state.streaks.no_scroll_am.current / 14) * 14);

      // Pomodoros + deep work
      let pomoCount = 0;
      logs.forEach(log => {
        if (log.habits.includes('pomo')) pomoCount++;
        if (log.habits.includes('deep_work')) pomoCount += 1.5;
      });
      const pomoScore = Math.min(14, (pomoCount / 15) * 14);

      // Reflections cerradas
      const reflClosed = logs.filter(l => l.reflection?.closed).length;
      const reflScore = (reflClosed / 30) * 14;

      let raw =
        acceptScore * 0.25 +
        completeScore * 0.25 +
        intentScore * 0.15 +
        scrollScore * 0.15 +
        pomoScore * 0.10 +
        reflScore * 0.10;

      // Penalizaciones
      // 3 rechazos seguidos: cap C
      const lastThree = state.sysquest_history.slice(-3);
      if (lastThree.length === 3 && lastThree.every(q => q.status === 'rejected' || q.status === 'failed')) {
        raw = Math.min(raw, 7);
      }
      // 0 quests aceptadas en 14 días: cap D+
      const last14 = state.sysquest_history.filter(q => daysSince(q.date) <= 14);
      if (last14.length > 0 && last14.every(q => q.status === 'rejected')) {
        raw = Math.min(raw, 5);
      }

      return Math.max(0, Math.min(14, raw));
    }

    function calcSocial() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      let weighted = 0;
      const types = new Set();
      let mostRecentVinculo = Infinity;

      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (SOCIAL_WEIGHTS[h] !== undefined) {
            weighted += SOCIAL_WEIGHTS[h] * w;
            types.add(h);
            mostRecentVinculo = Math.min(mostRecentVinculo, log.daysAgo);
          }
        });
      });

      // Normalizar — target 30 weighted points = A
      let raw = Math.min(14, (weighted / 30) * 14);

      // Decay por inactividad
      if (mostRecentVinculo >= 21) raw = Math.min(raw, 4); // cap D
      else if (mostRecentVinculo >= 14) raw -= 2;
      else if (mostRecentVinculo >= 7) raw -= 1;

      // Bonus diversidad
      if (types.size >= 4) raw += 1;

      return Math.max(0, Math.min(14, raw));
    }

    function calcIdentidad() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      const almaIds = HABITS_BASE.alma.map(h => h.id);
      const juegoIds = HABITS_BASE.juego.map(h => h.id);

      // Consistencia Alma
      let almaCount = 0;
      const almaDays = new Set();
      const almaTypes = new Set();
      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (almaIds.includes(h)) {
            almaCount += w;
            almaDays.add(log.date);
            almaTypes.add(h);
          }
        });
      });
      const almaScore = Math.min(14, (almaDays.size / 20) * 14);

      // Diversidad Juego
      const juegoTypes = new Set();
      logs.forEach(log => {
        log.habits.forEach(h => { if (juegoIds.includes(h)) juegoTypes.add(h); });
      });
      const juegoScore = (juegoTypes.size / 5) * 14;

      // Mazmorras
      const recentBosses = state.bosses.filter(b => b.completed && daysSince(b.completedAt) <= 30);
      const recentForged = state.bosses.filter(b => daysSince(b.createdAt) <= 30);
      const bossScore = Math.min(14, recentBosses.length * 4 + recentForged.length * 1);

      // Customs activos
      const activeCustoms = state.custom.filter(c => {
        return logs.some(l => l.habits.includes(c.id));
      });
      const customScore = Math.min(14, activeCustoms.length * 3);

      // Reflections con journal lleno
      const journaled = logs.filter(l => l.reflection?.journal && l.reflection.journal.length > 10).length;
      const journalScore = Math.min(14, (journaled / 15) * 14);

      let raw = almaScore * 0.30 + juegoScore * 0.20 + bossScore * 0.25 + customScore * 0.15 + journalScore * 0.10;

      // Bonus si tu custom más usado tiene 20+ logs
      if (state.custom.length > 0) {
        let maxLogs = 0;
        state.custom.forEach(c => {
          const count = logs.reduce((s, l) => s + (l.habits.includes(c.id) ? 1 : 0), 0);
          maxLogs = Math.max(maxLogs, count);
        });
        if (maxLogs >= 20) raw += 0.5;
      }

      return Math.max(0, Math.min(14, raw));
    }

    // ============================================================
    // OAA TOTAL Y CACHE
    // ============================================================

    function calcAllDimensions() {
      return {
        academico: calcAcademico(),
        fisico: calcFisico(),
        mental: calcMental(),
        social: calcSocial(),
        identidad: calcIdentidad(),
      };
    }

    function calcOAATotal(dims) {
      // Si alguna dimensión es null, calcular con las que están y normalizar pesos
      let total = 0;
      let weightSum = 0;
      for (const key in OAA_WEIGHTS) {
        if (dims[key] !== null && dims[key] !== undefined) {
          total += dims[key] * OAA_WEIGHTS[key];
          weightSum += OAA_WEIGHTS[key];
        }
      }
      if (weightSum === 0) return null;
      return total / weightSum;
    }

    function getCurrentOAA() {
      // Cache: si el cálculo es de hoy, devolverlo. Si no, recalcular.
      const today = todayKey();
      if (state.oaa && state.oaa.date === today) return state.oaa;
      const dims = calcAllDimensions();
      const total = calcOAATotal(dims);
      state.oaa = { date: today, dims, total, computedAt: new Date().toISOString() };
      // Guardar histórico
      if (!state.oaa_history) state.oaa_history = [];
      // Solo guardar si es distinto al último
      const last = state.oaa_history[state.oaa_history.length - 1];
      if (!last || last.date !== today) {
        state.oaa_history.push({ date: today, dims, total });
        // Mantener últimos 120 días
        if (state.oaa_history.length > 120) state.oaa_history.shift();
      }
      persist();
      return state.oaa;
    }

    // ============================================================
    // CLASES
    // ============================================================

    function computeCurrentClass() {
      // Calcular OAA promedio últimos N días según umbral más alto disponible
      if (!state.oaa_history || state.oaa_history.length === 0) return 'D';

      const history = state.oaa_history.filter(h => h.total !== null);
      if (history.length === 0) return 'D';

      // Ir desde la clase más alta hacia abajo, verificar si cumple
      const tryClasses = [...CLASS_ORDER].reverse();
      for (const cls of tryClasses) {
        const t = CLASS_THRESHOLDS[cls];
        if (cls === 'D') return 'D';

        const days = t.sustainDays;
        const recentN = history.slice(-days);
        if (recentN.length < days) continue;

        const avg = recentN.reduce((s, h) => s + h.total, 0) / recentN.length;
        if (avg < t.oaaMin) continue;

        // Extra: mazmorras para clase A
        if (t.extra.dungeons) {
          const completedDungeons = state.bosses.filter(b => b.completed).length;
          if (completedDungeons < t.extra.dungeons) continue;
        }

        return cls;
      }
      return 'D';
    }

    function updateClassIfChanged() {
      const newClass = computeCurrentClass();
      const oldClass = state.currentClass || 'D';
      if (newClass !== oldClass) {
        state.currentClass = newClass;
        state.classHistory = state.classHistory || [];
        state.classHistory.push({ date: todayKey(), from: oldClass, to: newClass });
        persist();
        // Notificar promoción o descenso
        const oldIdx = CLASS_ORDER.indexOf(oldClass);
        const newIdx = CLASS_ORDER.indexOf(newClass);
        setTimeout(() => {
          if (newIdx > oldIdx) {
            sysToast(`PROMOCIÓN · CLASE ${CLASS_THRESHOLDS[newClass].code}`, 'positive');
            ppOnClassPromotion();
          } else {
            sysToast(`REEVALUACIÓN · CLASE ${CLASS_THRESHOLDS[newClass].code}`, 'danger');
          }
        }, 800);
      }
    }

    function classCode(cls) {
      return CLASS_THRESHOLDS[cls]?.code || 'D';
    }

    // ============================================================
    // PRIVATE POINTS — Core
    // ============================================================

    function ppEnabled() {
      const classIdx = CLASS_ORDER.indexOf(state.currentClass || 'D');
      return classIdx >= CLASS_ORDER.indexOf('B');
    }

    function earnPP(amount, reason) {
      if (!ppEnabled()) return;
      state.pp += amount;
      state.ppLog.push({
        date: todayKey(),
        type: 'earn',
        amount,
        reason,
        balance: state.pp,
        ts: Date.now(),
      });
      if (state.ppLog.length > 200) state.ppLog = state.ppLog.slice(-200);
      persist();
    }

    function spendPP(itemKey) {
      if (!ppEnabled()) { toast('PP desbloqueados en Clase B'); return false; }
      const item = PP_SPEND[itemKey];
      if (!item) return false;
      if (state.pp < item.cost) { toast('PP insuficientes · ' + item.cost + ' necesarios'); return false; }
      if (!checkPPLimit(itemKey)) {
        toast('Límite alcanzado · ' + item.limit);
        return false;
      }
      state.pp -= item.cost;
      state.ppLog.push({
        date: todayKey(),
        type: 'spend',
        amount: -item.cost,
        reason: item.label,
        itemKey,
        balance: state.pp,
        ts: Date.now(),
      });
      if (state.ppLog.length > 200) state.ppLog = state.ppLog.slice(-200);
      recordPPLimit(itemKey);
      persist();
      sysToast(`−${item.cost} PP · ${item.label}`);
      return true;
    }

    function checkPPLimit(itemKey) {
      const item = PP_SPEND[itemKey];
      if (!item) return false;
      const limits = state.ppLimits;
      const now = new Date();
      const key = itemKey;

      if (item.limit === 'unlimited') return true;
      if (item.limit === 'permanent') {
        return !limits[key];
      }

      const uses = (limits[key] || []).filter(ts => {
        const d = new Date(ts);
        if (item.limit === '1/day') return d.toISOString().slice(0, 10) === todayKey();
        if (item.limit === '1/week') {
          const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate() - 7);
          return d > weekAgo;
        }
        if (item.limit === '1/month' || item.limit === '2/month') {
          const monthAgo = new Date(now); monthAgo.setMonth(monthAgo.getMonth() - 1);
          return d > monthAgo;
        }
        if (item.limit === '3/year') {
          const yearAgo = new Date(now); yearAgo.setFullYear(yearAgo.getFullYear() - 1);
          return d > yearAgo;
        }
        return true;
      });

      const maxUses = parseInt(item.limit) || 1;
      return uses.length < maxUses;
    }

    function recordPPLimit(itemKey) {
      if (!state.ppLimits[itemKey]) state.ppLimits[itemKey] = [];
      state.ppLimits[itemKey].push(Date.now());
    }

    function checkPPEarnings() {
      if (!ppEnabled()) return;
      const today = todayKey();
      const earned = state.ppLog.filter(l => l.date === today && l.type === 'earn');
      const reasons = earned.map(e => e.reason);

      if (log.reflection?.closed && !reasons.includes('reflection')) {
        earnPP(PP_EARN.reflection_closed, 'reflection');
      }

      const di = log.daily_intent;
      if (di.items.length >= 3 && di.completed.filter(Boolean).length >= di.items.length && !reasons.includes('intent_3_of_3')) {
        earnPP(PP_EARN.daily_intent_3_of_3, 'intent_3_of_3');
      }

      if (state.streaks.daily_log.last === today && !reasons.includes('daily_streak')) {
        earnPP(PP_EARN.daily_streak, 'daily_streak');
      }
    }

    function ppOnSysquestComplete(quest) {
      if (!ppEnabled()) return;
      const isHard = HARD_QUEST_CATEGORIES.includes(quest.category);
      const amount = isHard ? PP_EARN.sysquest_hard_completed : PP_EARN.sysquest_completed;
      earnPP(amount, 'sysquest_' + quest.category);
    }

    function ppOnQuestComplete(type) {
      if (!ppEnabled()) return;
      if (type === 'weekly') earnPP(PP_EARN.weekly_quest_completed, 'weekly_quest');
      if (type === 'monthly') earnPP(PP_EARN.monthly_quest_completed, 'monthly_quest');
    }

    function ppOnDungeonComplete() {
      if (!ppEnabled()) return;
      earnPP(PP_EARN.dungeon_completed, 'dungeon');
    }

    function ppWeeklyOAABonus() {
      if (!ppEnabled()) return;
      const today = new Date();
      if (today.getDay() !== 0) return;
      const tk = todayKey();
      const earned = state.ppLog.filter(l => l.date === tk && l.type === 'earn');
      if (earned.some(e => e.reason === 'oaa_weekly')) return;

      const oaa = getCurrentOAA();
      if (oaa.total === null) return;
      if (oaa.total >= 12) {
        earnPP(PP_EARN.oaa_weekly_above_A, 'oaa_weekly');
      } else if (oaa.total >= 9) {
        earnPP(PP_EARN.oaa_weekly_above_B, 'oaa_weekly');
      }
    }

    function ppOnClassPromotion() {
      if (!ppEnabled()) return;
      earnPP(PP_EARN.class_promotion, 'class_promotion');
    }

    // ============================================================
    // PP ACTIONS \u2014 Skip, Pause, Insurance, Reroll
    // ============================================================

    function ppSkipSysquest() {
      if (!state.sysquest) { toast('No hay quest activa'); return; }
      if (!spendPP('skip_sysquest')) return;
      state.sysquest.status = 'skipped';
      state.sysquest_history.push(state.sysquest);
      state.sysquest = null;
      persist();
      render();
    }

    function ppPostponeIntent() {
      if (!spendPP('postpone_intent')) return;
      log.daily_intent.postponed = true;
      saveLog(log);
      toast('Intent pospuesto · mañana es', 'positive');
    }

    function ppStreakInsurance() {
      if (!spendPP('streak_insurance')) return;
      const s = state.streaks.daily_log;
      if (s.current === 0 && s.longest > 0) {
        s.current = 1;
        toast('Streak rescatado', 'positive');
      } else {
        toast('Tu streak está activo', 'positive');
      }
      persist();
      render();
    }

    function ppQuestReroll() {
      if (!state.sysquest || state.sysquest.status !== 'pending') {
        toast('Solo pod\u00e9s rerollear quests pendientes');
        return;
      }
      if (!spendPP('quest_reroll')) return;
      state.sysquest.status = 'rerolled';
      state.sysquest_history.push(state.sysquest);
      const rank = currentRank().rank;
      const recentCats = state.sysquest_history.slice(-2).map(q => q.category);
      state.sysquest = generateDailyQuest(rank, recentCats);
      persist();
      render();
      sysToast('QUEST REROLLED');
    }

    function ppActivatePause() {
      if (!spendPP('pause_mode')) return;
      const until = new Date();
      until.setDate(until.getDate() + 3);
      state.pause = {
        active: true,
        until: until.toISOString(),
        activatedAt: todayKey(),
      };
      persist();
      render();
      sysToast('PAUSE MODE · 3 DÍAS', 'positive');
    }

    function isPaused() {
      if (!state.pause?.active) return false;
      if (new Date(state.pause.until) < new Date()) {
        state.pause = null;
        persist();
        return false;
      }
      return true;
    }

    function ppDoubleDungeon(bossId) {
      const b = state.bosses.find(x => x.id === bossId);
      if (!b || b.completed || b.doubleReward) { toast('No aplicable'); return; }
      if (!spendPP('double_dungeon')) return;
      b.doubleReward = true;
      persist();
      render();
      sysToast('MAZMORRA · DOBLE RECOMPENSA ACTIVA');
    }

    // ============================================================
    // TALENTS — Evaluation Engine
    // ============================================================

    function evaluateTalents() {
      if (!state.oaa_history || state.oaa_history.length < 30) return;
      const hist = state.oaa_history;

      TALENTS.forEach(t => {
        const hasTalent = state.talents.find(x => x.id === t.id);

        if (!hasTalent) {
          try {
            if (t.check(hist, state)) {
              state.talents.push({
                id: t.id,
                unlockedAt: todayKey(),
                active: true,
              });
              earnPP(PP_EARN.talent_unlocked, 'talent_' + t.id);
              setTimeout(() => sysToast(`TALENT DETECTADO · ${t.name.toUpperCase()}`, 'positive'), 800);
            }
          } catch (e) {
            console.warn('Talent check error:', t.id, e.message);
          }
        } else if (hasTalent.active && !t.permanent && t.decay) {
          try {
            if (t.decay(hist, state)) {
              hasTalent.active = false;
              hasTalent.lostAt = todayKey();
              setTimeout(() => sysToast(`TALENT PERDIDO · ${t.name.toUpperCase()}`, 'danger'), 800);
            }
          } catch (e) {
            console.warn('Talent decay error:', t.id, e.message);
          }
        }
      });

      persist();
    }

    function getActiveTalents() {
      return state.talents.filter(t => t.active);
    }

    function getAllTalentsWithStatus() {
      return TALENTS.map(t => {
        const unlocked = state.talents.find(x => x.id === t.id);
        return {
          ...t,
          unlocked: !!unlocked,
          active: unlocked?.active || false,
          unlockedAt: unlocked?.unlockedAt,
          lostAt: unlocked?.lostAt,
        };
      });
    }

    // ============================================================
    // SPECIAL EXAMS — Lifecycle
    // ============================================================

    function examEnabled() {
      const classIdx = CLASS_ORDER.indexOf(state.currentClass || 'D');
      return classIdx >= CLASS_ORDER.indexOf('A');
    }

    function maybeOfferExam() {
      if (!examEnabled()) return;
      if (state.specialExam) return;

      const lastExam = state.examHistory[state.examHistory.length - 1];
      if (lastExam) {
        const daysSinceLast = daysSince(lastExam.endDate || lastExam.offeredDate);
        if (lastExam.status === 'failed' && daysSinceLast < EXAM_COOLDOWN_FAIL) return;
        if (lastExam.status === 'rejected' && daysSinceLast < EXAM_COOLDOWN_REJECT) return;
        if (lastExam.status === 'expired' && daysSinceLast < EXAM_COOLDOWN_REJECT) return;
        if (lastExam.status === 'passed') {
          const lastMonth = lastExam.endDate?.slice(0, 7);
          const thisMonth = todayKey().slice(0, 7);
          if (lastMonth === thisMonth) return;
        }
      }

      const today = new Date();
      if (today.getDate() > 3 && state.examHistory.length > 0) return;

      const lastId = lastExam?.examId;
      const pool = SPECIAL_EXAMS.filter(e => e.id !== lastId);
      const exam = pool[Math.floor(Math.random() * pool.length)];

      state.specialExam = {
        examId: exam.id,
        status: 'offered',
        offeredDate: todayKey(),
        acceptDeadline: new Date(Date.now() + 48 * 60 * 60 * 1000).toISOString(),
        dayLogs: [],
      };
      persist();
      setTimeout(() => sysToast('SPECIAL EXAM DISPONIBLE'), 1500);
    }

    function acceptExam() {
      if (!state.specialExam || state.specialExam.status !== 'offered') return;
      state.specialExam.status = 'active';
      state.specialExam.startDate = todayKey();
      state.specialExam.endDate = (() => {
        const d = new Date();
        d.setDate(d.getDate() + 7);
        return d.toISOString().slice(0, 10);
      })();
      persist();

    function checkExamExpiry() {
      if (!state.specialExam) return;
      const exam = state.specialExam;

      if (exam.status === 'offered' && new Date(exam.acceptDeadline) < new Date()) {
        exam.status = 'expired';
        state.examHistory.push({ ...exam });
        state.specialExam = null;
