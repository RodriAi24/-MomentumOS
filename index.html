  <style>
    :root {
      /* V19.8: Card padding tokens */
      --card-pad-sm: 12px;
      --card-pad-md: 16px;

      --bg: #161826;

      --cyan: #22D3EE;

      --rank-e: #6B7280;
      --rank-d: #84CC16;
      --rank-c: #06B6D4;
      --rank-b: #9184D9;
      --rank-a: #F59E0B;

      --stat-sabiduria-dim: rgba(255, 176, 32, .14);
      --stat-disciplina-dim: rgba(74, 222, 128, .14);
      --stat-alma-dim: rgba(96, 165, 250, .14);
      --stat-vinculo-dim: rgba(244, 114, 182, .14);
      --stat-juego-dim: rgba(192, 132, 252, .14);
      --positive: #4ADE80;
      --negative: #EF4444;
      --warning: #F59E0B;
      --info: #22D3EE;
      --radius: 8px;
      --radius-sm: 4px;
      --radius-lg: 14px;
      --radius-xl: 16px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, .4);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, .5);
      --shadow-glow: 0 0 16px var(--sys-glow);
      --shadow-glow-lg: 0 0 32px var(--sys-glow);
      --rsm: 2px;
      --ease: cubic-bezier(.32, .72, 0, 1);
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    body[data-theme="light"] {
      --bg: #F5F3F8;
      --bg2: #FFFFFF;
      --bg3: #FAF8FC;
      --card: #FFFFFF;
      --card2: #FAF8FC;
      --surface: #EFEBF5;
      --ink: #14111F;
      --ink2: #4A4665;
      --ink3: #76728F;
      --ink4: #BCB8D0;
      --border: #E5E1F0;
      --border2: #D5D1E5;
      --sys-dim: rgba(139, 92, 246, .08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      overscroll-behavior: none;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      opacity: .035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(139, 92, 246, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, .025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
    }

    ::-webkit-scrollbar {
      width: 0;
      display: none;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 0 calc(100px + env(safe-area-inset-bottom)) 0;
      min-height: 100dvh;
      position: relative;
      z-index: 1;
    }

    .mono {
      font-family: var(--font-mono);
    }

    .display {
      font-family: var(--font-display);
      letter-spacing: .04em;
    }

    .page {
      display: none;
      padding: 8px 16px;
      animation: fadeIn .35s var(--ease);
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glitchIn {
      0% {
        opacity: 0;
        transform: translateY(-6px);
        clip-path: inset(0 0 100% 0);
      }

      20% {
        clip-path: inset(0 0 60% 0);
        transform: translateY(-2px) translateX(2px);
      }

      40% {
        clip-path: inset(40% 0 20% 0);
        transform: translateX(-2px);
      }

      60% {
        clip-path: inset(0 0 30% 0);
        transform: translateX(1px);
      }

      80% {
        clip-path: inset(0 0 0 0);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        clip-path: inset(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .5;
      }
    }

    @keyframes scan {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(100%);
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 12px var(--sys-glow), inset 0 0 12px rgba(139, 92, 246, .08);
      }

      50% {
        box-shadow: 0 0 24px var(--sys-glow), inset 0 0 18px rgba(139, 92, 246, .14);
      }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }

    body[data-theme="light"] .header {
      background: var(--bg);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--sys);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: var(--sys2);
      flex-shrink: 0;
      cursor: pointer;
      transition: all .2s var(--ease);
      position: relative;
      overflow: hidden;
      font-family: var(--font-mono);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, var(--sys-dim) 100%);
      opacity: .5;
    }

    .avatar:active {
      transform: scale(.94);
    }

    .header-left {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .header-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-bottom-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-pp {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--sys);
      letter-spacing: .08em;
      font-weight: 600;
    }

    .header-pp-locked {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink3);
      letter-spacing: .08em;
    }

    .header-streak {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--negative);
      font-weight: 700;
      letter-spacing: .05em;
    }

    .header-streak-icon {
      display: inline-flex;
      width: 12px;
      height: 12px;
    }

    .header-streak-icon svg {
      width: 12px;
      height: 12px;
      stroke: var(--negative);
      fill: var(--negative);
    }

    .header-streak-glow .header-streak-icon svg {
      filter: drop-shadow(0 0 4px rgba(239, 68, 68, .6));
    }

    .header-streak-glow {
      animation: streakPulse 2s ease-in-out infinite;
    }

    @keyframes streakPulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .65;
      }
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .header-rank-line {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: .08em;
      text-shadow: 0 0 8px var(--sys-glow);
      white-space: nowrap;
    }

    .header-level-line {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink3);
      letter-spacing: .15em;
    }

    .header-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink2);
      cursor: pointer;
      transition: all .2s var(--ease);
    }

    .header-btn:active {
      transform: scale(.92);
      border-color: var(--sys);
      color: var(--sys2);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: var(--card-pad-md);
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      transition: border-color .25s var(--ease);
    }

    .card-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--sys2);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-bottom: 14px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title-text {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title-text::before {
      content: '▸ ';
      color: var(--sys);
    }

    .card-action {
      font-size: 10px;
      color: var(--sys2);
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .12em;
      border: 1px solid var(--border2);
      padding: 4px 10px;
      border-radius: var(--radius);
      transition: all .2s var(--ease);
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    .card-action:hover,
    .card-action:active {
      border-color: var(--sys);
      background: var(--sys-dim);
    }

    .btn {
      background: var(--sys);
      color: #fff;
      border: 1px solid var(--sys);
      padding: 12px 20px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .2s var(--ease);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, .15) 50%, transparent 100%);
      transform: translateY(-100%);
      transition: transform .3s var(--ease);
    }

    .btn:active::before {
      transform: translateY(0);
    }

    .btn:active {
      transform: scale(.97);
      filter: brightness(.92);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, .25);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border2);
    }

    .btn-ghost:active {
      border-color: var(--sys);
      background: var(--sys-dim);
      color: var(--sys2);
    }

    .btn-danger {
      background: transparent;
      border-color: var(--negative);
      color: var(--negative);
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 11px;
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .icon-lg {
      width: 22px;
      height: 22px;
    }

    .icon-sm {
      width: 14px;
      height: 14px;
    }

    /* === SYSTEM NOTIFICATION (Daily Quest, Rank Up) === */
    .sysnotif {
      background: var(--bg2);
      border: 1px solid var(--sys);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      animation: glitchIn .5s var(--ease);
      box-shadow: 0 0 24px var(--sys-glow), inset 0 0 16px rgba(139, 92, 246, .06);
    }

    .sysnotif::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--sys), transparent);
      animation: scan 3s linear infinite;
    }

    .sysnotif-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--sys);
    }

    .sysnotif-corner.tl {
      top: 6px;
      left: 6px;
      border-right: 0;
      border-bottom: 0;
    }

    .sysnotif-corner.tr {
      top: 6px;
      right: 6px;
      border-left: 0;
      border-bottom: 0;
    }

    .sysnotif-corner.bl {
      bottom: 6px;
      left: 6px;
      border-right: 0;
      border-top: 0;
    }

    .sysnotif-corner.br {
      bottom: 6px;
      right: 6px;
      border-left: 0;
      border-top: 0;
    }

    .sysnotif-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 6px;
    }

    .sysnotif-icon {
      color: var(--sys2);
    }

    .sysnotif-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--sys2);
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    .sysnotif-rank {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      color: var(--ink2);
      letter-spacing: .15em;
      padding: 2px 6px;
      border: 1px solid var(--border2);
      border-radius: 2px;
    }

    .sysnotif-body {
      padding: 0 6px;
    }

    .sysnotif-title {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: .04em;
      line-height: 1;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .sysnotif-desc {
      font-size: 13px;
      color: var(--ink2);
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .sysnotif-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .1em;
    }

    .sysnotif-stat {
      padding: 8px 10px;
      background: var(--bg);
      border-left: 2px solid var(--sys);
      border-radius: 0;
    }

    .sysnotif-stat-label {
      font-size: 9px;
      color: var(--ink3);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .sysnotif-stat-val {
      font-size: 12px;
      color: var(--ink);
      font-weight: 600;
    }

    .sysnotif-stat.reward {
      border-left-color: var(--positive);
    }

    .sysnotif-stat.reward .sysnotif-stat-val {
      color: var(--positive);
    }

    .sysnotif-stat.penalty {
      border-left-color: var(--negative);
    }

    .sysnotif-stat.penalty .sysnotif-stat-val {
      color: var(--negative);
    }

    .sysnotif-stat.deadline {
      border-left-color: var(--warning);
    }

    .sysnotif-stat.deadline .sysnotif-stat-val {
      color: var(--warning);
    }

    .sysnotif-actions {
      display: flex;
      gap: 8px;
      padding: 0 6px;
    }

    .sysnotif.accepted {
      border-color: var(--positive);
      box-shadow: 0 0 16px rgba(74, 222, 128, .3);
    }

    .sysnotif.accepted::before {
      background: linear-gradient(90deg, transparent, var(--positive), transparent);
    }

    .sysnotif.failed {
      border-color: var(--negative);
      box-shadow: 0 0 16px rgba(239, 68, 68, .25);
      opacity: .8;
    }

    .sysnotif.completed {
      border-color: var(--positive);
    }

    /* === STAT BARS === */
    .stat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      cursor: pointer;
      transition: all .15s var(--ease);
    }

    .stat-row+.stat-row {
      border-top: 1px solid var(--border);
    }

    .stat-row:active {
      transform: scale(.995);
    }

    .stat-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      position: relative;
    }

    .stat-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.5;
      fill: none;
    }

    .stat-body {
      flex: 1;
      min-width: 0;
    }

    .stat-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .stat-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .stat-lvl {
      font-family: var(--font-display);
      font-size: 18px;
      letter-spacing: .05em;
    }

    .stat-bar {
      height: 6px;
      background: var(--surface);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
    }

    .stat-fill {
      height: 100%;
      border-radius: 1px;
      transition: width .8s var(--ease);
      position: relative;
    }

    .stat-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .3), transparent);
      animation: shimmer 4s infinite;
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    .stat-xp {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      margin-top: 4px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* === HABIT CHIPS === */
    .habit-group {
      margin-bottom: 16px;
    }

    .habit-group:last-child {
      margin-bottom: 0;
    }

    .habit-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .habit-group-dot {
      width: 6px;
      height: 6px;
    }

    .habit-group-name {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .habit-group-cap {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      font-weight: 600;
      letter-spacing: .05em;
    }

    .habit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .habit-chip {
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all .2s var(--ease);
      text-align: left;
      font-family: inherit;
      color: var(--ink);
      position: relative;
      overflow: hidden;
    }

    .habit-chip:active {
      transform: scale(.97);
    }

    .habit-chip.done {
      background: var(--sys-dim);
      border-color: var(--sys);
    }

    .habit-chip.capped {
      opacity: .45;
    }

    .habit-chip-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .habit-chip-icon svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.5;
      fill: none;
    }

    .habit-chip-body {
      flex: 1;
      min-width: 0;
    }

    .habit-chip-name {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--ink);
    }

    .habit-chip-xp {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      color: var(--ink3);
      margin-top: 2px;
      letter-spacing: .05em;
    }

    .habit-chip.done .habit-chip-xp {
      color: var(--sys2);
    }

    /* === SCROLL AM CARD === */
    .scroll-am {
      background: var(--card);
      border: 1px solid var(--border2);
      border-left: 3px solid var(--warning);
      border-radius: var(--radius);
      padding: 14px 14px 14px 16px;
      margin-bottom: 12px;
    }

    .scroll-am-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--warning);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .scroll-am-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .scroll-am-btns {
      display: flex;
      gap: 6px;
    }

    .scroll-am-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border2);
      background: var(--card2);
      color: var(--ink);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 10px;
      cursor: pointer;
      transition: all .2s var(--ease);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .scroll-am-btn.win:active {
      background: rgba(74, 222, 128, .12);
      border-color: var(--positive);
      color: var(--positive);
    }

    .scroll-am-btn.lose:active {
      background: rgba(239, 68, 68, .1);
      border-color: var(--negative);
      color: var(--negative);
    }

    .scroll-am-btn-xp {
      font-size: 10px;
      font-weight: 700;
      opacity: .7;
      font-family: var(--font-display);
      letter-spacing: .04em;
    }

    .scroll-am-btn.win .scroll-am-btn-xp {
      color: var(--positive);
    }

    .scroll-am-btn.lose .scroll-am-btn-xp {
      color: var(--negative);
    }

    .scroll-am-result {
      padding: 10px;
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .scroll-am-result.won {
      border-left: 3px solid var(--positive);
      color: var(--positive);
    }

    .scroll-am-result.lost {
      border-left: 3px solid var(--negative);
      color: var(--negative);
    }

    /* === DAILY INTENT === */
    .intent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      cursor: pointer;
    }

    .intent-item+.intent-item {
      border-top: 1px solid var(--border);
    }

    .intent-check {
      width: 18px;
      height: 18px;
      border-radius: 2px;
      border: 1.5px solid var(--ink4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all .2s var(--ease);
      color: transparent;
    }

    .intent-item.done .intent-check {
      background: var(--sys);
      border-color: var(--sys);
      color: #fff;
    }

    .intent-text {
      flex: 1;
      font-size: 13px;
      transition: all .25s var(--ease);
    }

    .intent-item.done .intent-text {
      color: var(--ink3);
      text-decoration: line-through;
    }

    .intent-empty {
      text-align: center;
      padding: 16px;
      color: var(--ink3);
      font-size: 12px;
      font-family: var(--font-mono);
      letter-spacing: .08em;
    }

    /* === QUESTS / DUNGEONS === */
    .quest {
      background: var(--card2);
      border: 1px solid var(--border2);
      border-left: 3px solid var(--sys);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all .2s var(--ease);
    }

    .quest:active {
      transform: scale(.99);
    }

    .quest.dungeon {
      border-left-color: var(--rank-a);
      background: linear-gradient(90deg, rgba(245, 158, 11, .04), var(--card2));
    }

    .quest.completed {
      opacity: .55;
    }

    .quest-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      gap: 10px;
    }

    .quest-name {
      font-size: 13px;
      font-weight: 600;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quest-xp {
      font-family: var(--font-display);
      font-size: 15px;
      letter-spacing: .05em;
      color: var(--sys2);
      white-space: nowrap;
    }

    .quest-bar {
      height: 4px;
      background: var(--surface);
      border-radius: 1px;
      overflow: hidden;
    }

    .quest-fill {
      height: 100%;
      background: var(--sys);
      border-radius: 1px;
      transition: width .8s var(--ease);
    }

    .quest.dungeon .quest-fill {
      background: var(--rank-a);
    }

    .quest-progress {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink2);
      margin-top: 6px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .quest-reward {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink3);
      margin-top: 4px;
      letter-spacing: .04em;
    }

    /* === MODAL === */
    /* Modals redefined above */

    .modal::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sys), transparent);
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-handle {
      width: 32px;
      height: 3px;
      background: var(--ink4);
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .modal-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--sys2);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 26px;
      letter-spacing: .04em;
      margin-bottom: 4px;
      color: var(--ink);
    }

    .modal-sub {
      font-size: 12px;
      color: var(--ink2);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .modal-section {
      margin-bottom: 16px;
    }

    .modal-label {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      color: var(--ink3);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 11px 13px;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 13px;
      transition: border-color .2s var(--ease);
    }

    .input:focus {
      outline: 0;
      border-color: var(--sys);
    }

    textarea.input {
      resize: vertical;
      min-height: 70px;
      font-family: var(--font-body);
    }

    /* === XP FLOAT === */
    .xp-float {
      position: fixed;
      pointer-events: none;
      z-index: 300;
      font-family: var(--font-display);
      font-size: 24px;
      letter-spacing: .04em;
      animation: xpFloat 1.4s var(--ease) forwards;
      text-shadow: 0 0 10px currentColor;
    }

    @keyframes xpFloat {
      0% {
        opacity: 0;
        transform: translateY(0) scale(.6);
      }

      20% {
        opacity: 1;
        transform: translateY(-15px) scale(1.1);
      }

      80% {
        opacity: 1;
        transform: translateY(-65px) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-90px) scale(.9);
      }
    }

    /* === LEVEL UP === */
    .levelup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 400;
      background: rgba(5, 4, 10, .92);
      backdrop-filter: blur(14px);
      animation: fadeIn .3s var(--ease);
    }

    .levelup.show {
      display: flex;
    }

    .levelup-content {
      text-align: center;
      animation: levelupPulse .9s var(--ease);
      padding: 30px;
      border: 1px solid var(--sys);
      background: var(--bg2);
      position: relative;
      min-width: 280px;
      border-radius: var(--radius);
      box-shadow: 0 0 60px var(--sys-glow);
    }

    .levelup-content .sysnotif-corner {
      animation: pulse 1.5s infinite;
    }

    @keyframes levelupPulse {
      0% {
        transform: scale(.5);
        opacity: 0;
      }

      60% {
        transform: scale(1.1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .levelup-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .3em;
      color: var(--sys2);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .levelup-num {
      font-family: var(--font-display);
      font-size: 100px;
      letter-spacing: .06em;
      line-height: 1;
      color: var(--sys2);
      text-shadow: 0 0 20px var(--sys-glow);
      margin-bottom: 8px;
    }

    .levelup-stat {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      font-family: var(--font-mono);
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    /* === RANK UP === */
    .achievement-unlock .ach-unlock-icon svg {
      width: 32px;
      height: 32px;
    }

    .rankup-content {
      text-align: center;
      animation: levelupPulse .9s var(--ease);
      padding: 40px 36px;
      border: 1px solid var(--sys);
      background: var(--bg2);
      position: relative;
      min-width: 280px;
      border-radius: var(--radius);
      box-shadow: 0 0 80px var(--sys-glow);
    }

    .rankup-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .35em;
      color: var(--sys2);
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .rankup-num {
      font-family: var(--font-display);
      font-size: 140px;
      letter-spacing: .06em;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 24px currentColor;
    }

    .rankup-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .25em;
      color: var(--ink);
      text-transform: uppercase;
    }

    /* === RADAR === */
    .radar-wrap {
      position: relative;
      height: 280px;
      padding: 4px;
    }

    /* === HEATMAP === */
    .heatmap {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      padding: 6px 0;
    }

    .heatmap-cell {
      aspect-ratio: 1;
      background: var(--surface);
      border-radius: 1px;
      transition: all .2s var(--ease);
      cursor: pointer;
      position: relative;
    }

    .heatmap-cell[data-lvl="1"] {
      background: rgba(139, 92, 246, .25);
    }

    .heatmap-cell[data-lvl="2"] {
      background: rgba(139, 92, 246, .5);
    }

    .heatmap-cell[data-lvl="3"] {
      background: rgba(139, 92, 246, .75);
    }

    .heatmap-cell[data-lvl="4"] {
      background: var(--sys);
    }

    .heatmap-cell:hover {
      transform: scale(1.15);
    }

    /* === ACHIEVEMENTS === */
    .trophy-room {
      padding: 16px;
    }

    .trophy-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .trophy {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 6px;
      border-radius: 8px;
      background: var(--bg2);
      border: 1px solid var(--border);
      transition: all .2s var(--ease);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .trophy.unlocked {
      border-color: var(--sys);
      box-shadow: inset 0 0 12px var(--sys-dim);
    }

    .trophy.locked {
      opacity: .35;
      filter: grayscale(1);
    }

    .trophy:active {
      transform: scale(.95);
    }

    .trophy-icon {
      color: var(--sys);
      margin-bottom: 6px;
    }

    .trophy.locked .trophy-icon {
      color: var(--ink3);
    }

    .trophy-icon svg {
      width: 28px;
      height: 28px;
    }

    .trophy-name {
      font-family: var(--font-mono);
      font-size: 9px;
      text-align: center;
      letter-spacing: .05em;
      color: var(--ink2);
      line-height: 1.2;
    }

    .trophy.locked .trophy-name {
      color: var(--ink3);
    }

    .ach-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .ach {
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 14px 8px 12px;
      text-align: center;
      transition: all .2s var(--ease);
    }

    .ach.unlocked {
      background: var(--sys-dim);
      border-color: var(--sys);
    }

    .ach.locked {
      opacity: .3;
    }

    .ach-icon {
      width: 32px;
      height: 32px;
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ach-icon svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.5;
      fill: none;
      color: var(--sys2);
    }

    .ach.locked .ach-icon svg {
      color: var(--ink3);
    }

    .ach-name {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .ach-desc {
      font-size: 9px;
      color: var(--ink3);
      margin-top: 3px;
      line-height: 1.3;
    }

    /* === MOOD === */
    .mood-row {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }

    .mood-btn {
      flex: 1;
      aspect-ratio: 1;
      max-width: 52px;
      border: 1px solid var(--border2);
      background: var(--card2);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink2);
    }

    .mood-btn svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.5;
      fill: none;
    }

    .mood-btn.selected {
      background: var(--sys-dim);
      border-color: var(--sys);
      color: var(--sys2);
      transform: scale(1.05);
    }

    /* === TOAST === */
    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg2);
      border: 1px solid var(--sys);
      padding: 10px 16px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      z-index: 250;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5), 0 0 16px var(--sys-glow);
      opacity: 0;
      transition: opacity .25s var(--ease), transform .25s var(--ease);
      pointer-events: none;
      max-width: 90vw;
      text-transform: uppercase;
      color: var(--ink);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-8px);
    }

    .toast.danger {
      border-color: var(--negative);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5), 0 0 16px rgba(239, 68, 68, .5);
    }

    .toast.positive {
      border-color: var(--positive);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5), 0 0 16px rgba(74, 222, 128, .5);
    }

    /* === CHECK-IN === */
    .checkin {
      background: var(--card);
      border: 1px solid var(--warning);
      border-left: 3px solid var(--warning);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .checkin.serious {
      border-color: var(--info);
      border-left-color: var(--info);
    }

    .checkin-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--warning);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .checkin.serious .checkin-tag {
      color: var(--info);
    }

    .checkin-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .checkin-text {
      font-size: 12px;
      color: var(--ink2);
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .checkin-actions {
      display: flex;
      gap: 6px;
    }

    /* === SETTINGS === */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-name {
      font-size: 13px;
      font-weight: 600;
    }

    .setting-sub {
      font-size: 11px;
      color: var(--ink3);
      margin-top: 2px;
      font-family: var(--font-mono);
      letter-spacing: .05em;
    }

    .switch {
      width: 42px;
      height: 24px;
      background: var(--ink4);
      border-radius: 100px;
      position: relative;
      cursor: pointer;
      transition: background .2s var(--ease);
      flex-shrink: 0;
    }

    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s var(--ease);
    }

    .switch.on {
      background: var(--sys);
    }

    .switch.on::after {
      transform: translateX(18px);
    }

    /* === EMPTY === */
    .empty {
      text-align: center;
      padding: 24px 16px;
      color: var(--ink3);
    }

    .empty-icon {
      width: 32px;
      height: 32px;
      margin: 0 auto 8px;
      opacity: .4;
    }

    .empty-icon svg {
      width: 100%;
      height: 100%;
      stroke-width: 1.5;
      fill: none;
    }

    .empty-text {
      font-size: 12px;
      line-height: 1.5;
      font-family: var(--font-mono);
      letter-spacing: .04em;
    }

    /* === ONBOARDING === */
    .onb {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 500;
      display: flex;
      flex-direction: column;
      padding: 50px 24px 30px;
      animation: fadeIn .5s var(--ease);
      overflow-y: auto;
    }

    .onb-frame {
      flex: 1;
      border: 1px solid var(--sys);
      border-radius: var(--radius);
      position: relative;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--bg2);
      box-shadow: 0 0 40px var(--sys-glow), inset 0 0 24px rgba(139, 92, 246, .04);
      overflow: hidden;
    }

    .onb-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sys), transparent);
      animation: scan 4s linear infinite;
    }

    .onb-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--sys2);
      letter-spacing: .35em;
      margin-bottom: 24px;
      text-transform: uppercase;
      text-align: center;
    }

    .onb-step {
      text-align: center;
      animation: glitchIn .5s var(--ease);
    }

    .onb-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      color: var(--sys2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .onb-icon svg {
      width: 100%;
      height: 100%;
      stroke-width: 1.2;
      fill: none;
      filter: drop-shadow(0 0 6px var(--sys-glow));
    }

    .onb-title {
      font-family: var(--font-display);
      font-size: 32px;
      letter-spacing: .04em;
      margin-bottom: 12px;
      line-height: 1.05;
    }

    .onb-text {
      font-size: 14px;
      color: var(--ink2);
      line-height: 1.6;
      max-width: 380px;
      margin: 0 auto;
    }

    .onb-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 18px 0 12px;
    }

    .onb-dot {
      width: 6px;
      height: 6px;
      background: var(--ink4);
      transition: all .25s var(--ease);
    }

    .onb-dot.active {
      background: var(--sys2);
      width: 24px;
      box-shadow: 0 0 8px var(--sys-glow);
    }

    .onb-dot.done {
      background: var(--sys);
      opacity: .55;
    }

    /* === AWAKENING ASSESSMENT === */
    .assess-opt {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink);
      font-size: .95rem;
      text-align: left;
      cursor: pointer;
      transition: all .18s var(--ease);
      border-radius: 2px;
    }
    .assess-opt:hover { border-color: var(--sys2); }
    .assess-opt:active { transform: scale(.99); }
    .assess-opt.selected {
      border-color: var(--sys);
      background: var(--sys-dim);
      box-shadow: 0 0 0 1px var(--sys), 0 0 12px var(--sys-glow);
      color: var(--ink);
    }

    .reveal-frame { position: relative; }
    .reveal-rank {
      font-size: 5rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-top: 8px;
      text-shadow: 0 0 24px currentColor;
    }
    .reveal-badge {
      display: inline-block;
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 2px;
      font-family: var(--font-mono);
      font-size: .68rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .reveal-prov { color: var(--ink3); border-color: var(--ink4); }
    .reveal-oaa {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
      margin: 24px auto 0;
      text-align: left;
    }
    .reveal-dim-head {
      display: flex;
      justify-content: space-between;
      font-size: .8rem;
      margin-bottom: 4px;
      color: var(--ink2);
    }
    .reveal-bar {
      height: 5px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
    }
    .reveal-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sys2), var(--sys));
      border-radius: 3px;
      transition: width .6s var(--ease);
    }
    .reveal-verdict {
      margin: 22px auto 0;
      max-width: 380px;
      font-size: .9rem;
      line-height: 1.5;
      color: var(--ink);
      font-style: italic;
    }
    .reveal-disclaimer {
      margin: 16px auto 0;
      max-width: 380px;
      font-size: .72rem;
      line-height: 1.5;
      color: var(--ink3);
      font-family: var(--font-mono);
    }

    /* === SLIDER === */
    .slider {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      height: 4px;
      background: var(--surface);
      border-radius: 2px;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--sys);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg2);
      box-shadow: 0 0 8px var(--sys-glow);
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: var(--sys);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg2);
    }

    .slider-val {
      text-align: center;
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: .04em;
      margin-top: 6px;
      color: var(--sys2);
    }

    /* === DUNGEON STEP === */
    .dungeon-step {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .dungeon-step .input {
      flex: 1;
    }

    .boss-step-del {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      background: var(--card2);
      border: 1px solid var(--border2);
      color: var(--ink3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .boss-step-check {
      width: 20px;
      height: 20px;
      border-radius: 2px;
      border: 1.5px solid var(--ink4);
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      transition: all .2s var(--ease);
    }

    .boss-step-check.done {
      background: var(--sys);
      border-color: var(--sys);
      color: #fff;
    }

    .boss-step-name {
      flex: 1;
      font-size: 12px;
    }

    .boss-step-row.done .boss-step-name {
      color: var(--ink3);
      text-decoration: line-through;
    }

    .boss-step-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }

    .boss-step-row:first-child {
      border-top: 0;
    }

    /* === SELECT === */
    .select {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .select-opt {
      padding: 9px 6px;
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--ink2);
      cursor: pointer;
      transition: all .2s var(--ease);
      text-align: center;
      letter-spacing: .08em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .select-opt svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.5;
      fill: none;
    }

    .select-opt.selected {
      background: var(--sys-dim);
      border-color: var(--sys);
      color: var(--sys2);
    }

    /* === FOCUS TIMER === */
    .timer-wrap {
      text-align: center;
      padding: 16px 0;
    }

    .timer-frame {
      width: 240px;
      height: 240px;
      margin: 0 auto 24px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-frame::before,
    .timer-frame::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border: 1.5px solid var(--sys);
    }

    .timer-frame::before {
      top: 0;
      left: 0;
      border-right: 0;
      border-bottom: 0;
    }

    .timer-frame::after {
      bottom: 0;
      right: 0;
      border-left: 0;
      border-top: 0;
    }

    .timer-corner-tr,
    .timer-corner-bl {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 1.5px solid var(--sys);
    }

    .timer-corner-tr {
      top: 0;
      right: 0;
      border-left: 0;
      border-bottom: 0;
    }

    .timer-corner-bl {
      bottom: 0;
      left: 0;
      border-right: 0;
      border-top: 0;
    }

    .timer-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all .3s var(--ease);
    }

    .timer-circle.running {
      border-color: var(--sys);
      box-shadow: 0 0 40px var(--sys-glow), inset 0 0 30px rgba(139, 92, 246, .08);
      animation: glow 2.5s infinite;
    }

    .timer-time {
      font-family: var(--font-display);
      font-size: 56px;
      letter-spacing: .04em;
      line-height: 1;
      color: var(--ink);
    }

    .timer-mode {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      letter-spacing: .3em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .timer-actions {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* === STATUS WINDOW (Character sheet) === */
    .status-window {
      background: var(--bg2);
      border: 1px solid var(--sys);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 0 24px var(--sys-glow);
    }

    .status-window::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sys), transparent);
    }

    .status-title {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--sys2);
      letter-spacing: .3em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border2);
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .status-row-h {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink3);
      letter-spacing: .15em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .status-row-v {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: .05em;
      color: var(--ink);
    }

    .status-row-v.sys {
      color: var(--sys2);
      text-shadow: 0 0 6px var(--sys-glow);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 500px;
      margin: 0 auto;
      padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .nav-tab {
      background: none;
      border: 0;
      color: var(--ink4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 0;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: color .2s var(--ease);
      min-width: 52px;
      min-height: 44px;
      justify-content: center;
      position: relative;
    }

    .nav-tab svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.5;
      fill: none;
      transition: all .2s var(--ease);
    }

    .nav-tab span {
      transition: all .2s var(--ease);
    }

    .nav-tab.active {
      color: var(--sys2);
    }

    .nav-tab.active svg {
      filter: drop-shadow(0 0 6px var(--sys-glow));
    }

    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--sys);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--sys-glow);
    }

    .nav-tab-fab {
      background: var(--sys);
      border: 0;
      width: 48px;
      height: 48px;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(139, 92, 246, .4), 0 0 12px var(--sys-glow);
      transition: all .25s var(--ease);
      margin-top: -12px;
      position: relative;
      flex-shrink: 0;
    }

    .nav-tab-fab::before {
      content: '';
      position: absolute;
      inset: -2px;
      border: 1px solid var(--sys);
      border-radius: var(--radius);
      opacity: .3;
    }

    .nav-tab-fab:active {
      transform: scale(.9) rotate(45deg);
    }

    .nav-tab-fab svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
      fill: none;
    }

    /* === V3.7: Profile tab destacado al centro === */
    .nav-tab-center {
      background: var(--sys);
      border: 0;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(139, 92, 246, .45), 0 0 14px var(--sys-glow);
      transition: all .25s var(--ease);
      margin-top: -18px;
      position: relative;
      flex-shrink: 0;
      gap: 2px;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-tab-center::before {
      content: '';
      position: absolute;
      inset: -3px;
      border: 1px solid var(--sys);
      border-radius: 16px;
      opacity: .3;
    }

    .nav-tab-center:active {
      transform: scale(.92);
    }

    .nav-tab-center .nav-radar {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .nav-tab-center .nav-radar svg polygon {
      fill: rgba(255, 255, 255, .3);
      stroke: rgba(255, 255, 255, .9);
    }

    .nav-tab-center .nav-radar svg circle {
      fill: rgba(255, 255, 255, .9);
    }

    .nav-tab-center span {
      font-size: 8px;
      letter-spacing: .12em;
      color: rgba(255, 255, 255, .85);
    }

    .nav-tab-center.active {
      box-shadow: 0 4px 24px rgba(139, 92, 246, .6), 0 0 20px var(--sys-glow);
    }

      box-shadow: 0 4px 16px rgba(139, 92, 246, .3);
    }

    /* === V3: OAA Card === */
    .oaa-card {
      border-color: var(--sys);
      background: linear-gradient(180deg, var(--card) 0%, var(--bg2) 100%);
    }

    .oaa-grade {
      text-align: center;
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--border2);
      margin-bottom: 14px;
    }

    .oaa-grade-letter {
      font-family: var(--font-display);
      font-size: 72px;
      line-height: 1;
      color: var(--sys2);
      letter-spacing: .04em;
      text-shadow: 0 0 14px var(--sys-glow);
      margin-bottom: 4px;
    }

    .oaa-grade-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink3);
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    .oaa-dims {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 12px;
    }

    .oaa-dim {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: baseline;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }

    .oaa-dim:first-child {
      border-top: 0;
    }

    .oaa-dim-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: .15em;
    }

    .oaa-dim-letter {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--sys2);
      letter-spacing: .04em;
      text-shadow: 0 0 6px var(--sys-glow);
    }

    .oaa-dim-arrow {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      width: 16px;
      text-align: center;
    }

    .oaa-trend {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink3);
      letter-spacing: .15em;
      text-transform: uppercase;
      padding-top: 10px;
      border-top: 1px solid var(--border2);
    }

    /* UX: Overhaul Fixes */
    .header-btn-back svg {
      transform: rotate(180deg);
    }

    .habit-chip,
    .intent-item,
    .mood-btn,
    .select-opt,
    .nav-tab,
    .header-btn,
    .boss-step-del {
      min-height: 44px;
      min-width: 44px;
    }

    .card-action {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
    }

    .setting-row {
      min-height: 52px;
    }

    .modal {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .app {
      overscroll-behavior: none;
    }

    .async-loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1.5px solid var(--ink4);
      border-top-color: var(--sys);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* V19.7: Microinteractions */
    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes habitBounce {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(.94);
      }

      60% {
        transform: scale(1.04);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes xpFloat {
      0% {
        transform: translateY(0);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-40px);
        opacity: 0;
      }
    }

    .page>.card,
    .page>.sysnotif,
    .page>.checkin {
      animation: cardFadeIn .35s var(--ease) backwards;
    }

    .page>.card:nth-child(1) {
      animation-delay: 0s;
    }

    .page>.card:nth-child(2) {
      animation-delay: .04s;
    }

    .page>.card:nth-child(3) {
      animation-delay: .08s;
    }

    .page>.card:nth-child(4) {
      animation-delay: .12s;
    }

    .page>.card:nth-child(5) {
      animation-delay: .16s;
    }

    .page>.card:nth-child(6) {
      animation-delay: .20s;
    }

    .habit-row.bouncing {
      animation: habitBounce .4s var(--ease);
    }

    /* Smooth scroll behavior */
    html {
      scroll-behavior: smooth;
    }

    /* Collapsible smooth */
    .collapsible-content {
      transition: max-height .35s var(--ease), opacity .25s var(--ease);
    }

    .xp-float-mult {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      opacity: .85;
      letter-spacing: .05em;
    }

    /* V19.8: Cinematic Rank Up */
    .rankup-cinematic {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s var(--ease);
    }

    .rankup-cinematic.show {
      opacity: 1;
      pointer-events: auto;
    }

    .rankup-cinematic-bg {
      position: absolute;
      inset: 0;
      background: rgba(5, 4, 10, .92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .rankup-cinematic-rays {
      position: absolute;
      inset: 0;
      animation: rankupRaysSpin 20s linear infinite;
      opacity: .6;
    }

    @keyframes rankupRaysSpin {
      0% {
        transform: rotate(0deg) scale(1);
      }

      50% {
        transform: rotate(180deg) scale(1.1);
      }

      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    .rankup-cinematic-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 50px 36px;
      max-width: 380px;
      animation: rankupContentIn 1s var(--ease) both;
    }

    @keyframes rankupContentIn {
      0% {
        opacity: 0;
        transform: scale(.85);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .rankup-cinematic-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .5em;
      color: var(--sys);
      text-transform: uppercase;
      margin-bottom: 4px;
      animation: rankupTagIn 1.2s var(--ease) both;
      animation-delay: .3s;
    }

    .rankup-cinematic-tag-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--ink3);
      text-transform: uppercase;
      margin-bottom: 36px;
      animation: rankupTagIn 1.2s var(--ease) both;
      animation-delay: .5s;
    }

    @keyframes rankupTagIn {
      0% {
        opacity: 0;
        letter-spacing: 1em;
      }

      100% {
        opacity: 1;
      }
    }

    .rankup-cinematic-num-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .rankup-cinematic-num {
      font-family: var(--font-display);
      font-size: 120px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.04em;
      animation: rankupNumIn 1.6s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: .8s;
    }

    @keyframes rankupNumIn {
      0% {
        opacity: 0;
        transform: scale(.4);
        filter: blur(20px);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
        filter: blur(0);
      }

      75% {
        transform: scale(.95);
      }

      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
    }

    .rankup-cinematic-label {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: .25em;
      color: var(--ink);
      margin-bottom: 40px;
      text-transform: uppercase;
      animation: rankupLabelIn 1s var(--ease) both;
      animation-delay: 1.6s;
    }

    @keyframes rankupLabelIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .rankup-cinematic-btn {
      background: var(--sys);
      color: #fff;
      border: 0;
      padding: 14px 36px;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--sys-glow);
      animation: rankupBtnIn 1s var(--ease) both;
      animation-delay: 2.2s;
      transition: all .2s var(--ease);
    }

    .rankup-cinematic-btn:active {
      transform: scale(.95);
      filter: brightness(.92);
    }

    @keyframes rankupBtnIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tip-of-day {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      margin-bottom: 12px;
      background: var(--bg2);
      border: 1px dashed var(--border2);
      border-radius: 6px;
      cursor: pointer;
      transition: all .2s var(--ease);

    }

    .nav-tab.active {
      color: var(--sys2);
      position: relative;
