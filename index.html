    // ============================================================
    // SISTEMA: Daily Quest lifecycle
    // ============================================================
    function maybeGenerateSysQuest() {
      // Check si necesitamos generar una
      if (!state.uiState.onb_done) return;
      if (state.uiState.sysquest_suspended_until && new Date(state.uiState.sysquest_suspended_until) > new Date()) return;

      const today = todayKey();
      if (state.sysquest && state.sysquest.date === today) return; // ya hay una de hoy

      // BUGFIX: si ya hubo una quest hoy en el historial, NO generar otra.
      // Esto evita que completar/rechazar una quest genere otra el mismo día.
      const hadOneToday = state.sysquest_history.some(q => q.date === today);
      if (hadOneToday && !state.sysquest) return;

      // Si tenemos una vieja sin resolver (de OTRO día), marcarla fallida y archivar
      if (state.sysquest && state.sysquest.date !== today) {
        const old = state.sysquest;
        if (old.status === 'accepted' || old.status === 'pending') {
          old.status = 'failed';
          // aplicar penalización
          const p = old.penalty;
          state.xp[p.stat] = Math.max(0, state.xp[p.stat] - p.xp);
          state.sysquest_history.push(old);
          // Si rechazó/falló 3 días seguidos → suspender 7 días
          const recent = state.sysquest_history.slice(-3);
          if (recent.length === 3 && recent.every(q => q.status === 'failed' || q.status === 'rejected')) {
            const until = nowApp();
            until.setDate(until.getDate() + 7);
            state.uiState.sysquest_suspended_until = dateToKey(until);
            setTimeout(() => {
              haptic('error');
              sysToast('EVALUATION SUSPENDED · 7 days', 'danger');
            }, 1000);
          }
        } else if (old.status === 'completed' || old.status === 'rejected') {
          state.sysquest_history.push(old);
        }
        state.sysquest = null;

        // Re-check: ahora que archivamos la vieja, ¿ya hay una de hoy en el historial?
        if (state.sysquest_history.some(q => q.date === today)) {
          persist();
          return;
        }
      }

      // Generar nueva solo si no hay y no hubo ninguna hoy
      if (!state.sysquest) {
        const rank = currentRank().rank;
        const recentCats = state.sysquest_history.slice(-2).map(q => q.category);
        state.sysquest = generateDailyQuest(rank, recentCats);
        persist();
        setTimeout(() => sysToast('NEW SYSTEM QUEST'), 1200);
      }
    }

    function rejectSysQuest() {
      customConfirm('Reject the System\'s quest?<br><br>The penalty will be applied. Three rejections in a row suspend the evaluation.', () => {
        if (!state.sysquest) return;
        state.sysquest.status = 'rejected';
        const p = state.sysquest.penalty;
        state.xp[p.stat] = Math.max(0, state.xp[p.stat] - p.xp);
        state.sysquest_history.push(state.sysquest);
        state.sysquest = null;
        // Check 3 rechazos seguidos
        const recent = state.sysquest_history.slice(-3);
        if (recent.length === 3 && recent.every(q => q.status === 'failed' || q.status === 'rejected')) {
          const until = nowApp();
          until.setDate(until.getDate() + 7);
          state.uiState.sysquest_suspended_until = dateToKey(until);
          haptic('error');
          sysToast('EVALUATION SUSPENDED · 7 days', 'danger');
        }
        persist();
        render();
        sysToast('QUEST REJECTED', 'danger');
        floatXP(`-${p.xp}`, 'var(--negative)', null);
      });
    }

    function completeSysQuest() {
      customConfirm('Did you complete the quest? Only you know the truth.<br><br>The System trusts your honesty.', () => {
        if (!state.sysquest || state.sysquest.status !== 'accepted') return;
        state.sysquest.status = 'completed';
        state.sysquest.completedAt = todayKey();

        const r = state.sysquest.reward;
        const prevLevel = levelFromXP(state.xp[r.stat]);
        const prevRank = currentRank().rank;
        state.xp[r.stat] += r.xp;
        const newLevel = levelFromXP(state.xp[r.stat]);
        const newRank = currentRank().rank;

        floatXP(`+${r.xp}`, STATS[r.stat].color, null);
        state.sysquest_history.push(state.sysquest);

        if (newLevel > prevLevel) setTimeout(() => showLevelUp(r.stat, newLevel), 400);
        if (newRank !== prevRank) setTimeout(() => showRankUp(newRank), newLevel > prevLevel ? 2500 : 400);

        ppOnSysquestComplete(state.sysquest);
        checkAchievements();
        state.sysquest = null;
        persist();
        render();
        sysToast('QUEST COMPLETED', 'positive');
        haptic('success');
      });
    }

    function weekKey() {
      const d = nowApp();
      d.setHours(0, 0, 0, 0);
      const day = d.getDay();
      const diff = (day === 0 ? -6 : 1 - day); // lunes = 0 offset
      d.setDate(d.getDate() + diff);
      return dateToKey(d);
    }

    function monthKey() {
      const d = nowApp();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function generateWeeklyQuests() {
      const wk = weekKey();
      if (state.weekly && state.weekly.week === wk) return;
      const prevIds = state.weekly?.quests?.map(q => q.id) || [];
      const pool = WEEKLY_TEMPLATES.filter(t => !prevIds.includes(t.id));
      const easy = pool.filter(t => t.diff === 'easy');
      const med = pool.filter(t => t.diff === 'med');
      const hard = pool.filter(t => t.diff === 'hard');
      const pick = (arr) => arr.length ? arr[Math.floor(Math.random() * arr.length)] : null;
      const quests = [pick(easy), pick(med), pick(hard)]
        .filter(Boolean)
        .map(t => ({ ...t, progress: 0, completed: false, type: 'weekly' }));
      state.weekly = { week: wk, quests };
      persist();
    }

    function generateMonthlyQuest() {
      const mk = monthKey();
      if (state.monthly && state.monthly.month === mk) return;
      const t = MONTHLY_TEMPLATES[Math.floor(Math.random() * MONTHLY_TEMPLATES.length)];
      // `type` becomes the container kind ('monthly'); keep the template mechanic separately.
      state.monthly = { month: mk, ...t, mechanic: t.type || null, progress: 0, completed: false, type: 'monthly' };
      persist();
    }

    function syncQuestNames() {
      // Re-sync stored quest fields from the current templates by id.
      // Self-heals quests frozen from older builds (names from a previous language,
      // or mechanics fixed in a newer template) without losing progress or resetting.
      try {
        const syncFields = (q, t) => {
          ['name', 'target', 'habit', 'stat', 'xp'].forEach(f => {
            if (t[f] !== undefined && q[f] !== t[f]) q[f] = t[f];
          });
          // Heal the stored mechanic from the template (streak/manual monthlies).
          if (t.type === 'streak' || t.type === 'manual') {
            if (q.mechanic !== t.type) q.mechanic = t.type;
          }
          // If the template dropped a matching field (e.g. minutes-type removed), drop it too.
          ['habit', 'stat'].forEach(f => { if (t[f] === undefined && q[f] !== undefined && f in t === false) delete q[f]; });
          if (t.type === undefined && q.type !== undefined && q.type !== 'weekly' && q.type !== 'monthly') delete q.type;
        };
        if (state.weekly && Array.isArray(state.weekly.quests)) {
          state.weekly.quests.forEach(q => {
            const t = WEEKLY_TEMPLATES.find(x => x.id === q.id);
            if (t) syncFields(q, t);
          });
        }
        if (state.monthly && state.monthly.id) {
          const t = MONTHLY_TEMPLATES.find(x => x.id === state.monthly.id);
          if (t) syncFields(state.monthly, t);
        }
        persist();
      } catch (e) { console.warn('syncQuestNames:', e.message); }
    }

    function updateQuestsFromHabit(habitId, stat) {
      const checkQuest = (q) => {
        if (q.completed) return;
        let matched = false;
        if (q.mechanic === 'streak') {
          // Progress mirrors the daily streak (updateDailyStreak runs before this).
          const cur = state.streaks?.daily_log?.current || 0;
          if (cur > (q.progress || 0)) { q.progress = cur; matched = true; }
        }
        else if (q.habit && q.habit === habitId) { q.progress++; matched = true; }
        else if (q.stat && q.stat === stat) { q.progress++; matched = true; }
        if (matched && q.progress >= q.target) {
          q.completed = true;
          const perStat = Math.floor(q.xp / 6);
          Object.keys(STATS).forEach(k => state.xp[k] += perStat);
          setTimeout(() => sysToast(`+${q.xp} XP · QUEST COMPLETED`, 'positive'), 400);
          ppOnQuestComplete(q.type || 'weekly');
        }
      };
      if (state.weekly?.quests) state.weekly.quests.forEach(checkQuest);
      if (state.monthly) checkQuest(state.monthly);
    }

    // Manual monthly quests (e.g. "Finish a book") are confirmed by the Hunter.
    function completeManualQuest() {
      const m = state.monthly;
      if (!m || m.completed || m.mechanic !== 'manual') return;
      customConfirm('Mark this monthly objective as complete?<br><br>The System trusts your honesty.', () => {
        m.progress = m.target;
        m.completed = true;
        const perStat = Math.floor(m.xp / 6);
        Object.keys(STATS).forEach(k => state.xp[k] += perStat);
        ppOnQuestComplete('monthly');
        persist();
        render();
        sysToast(`+${m.xp} XP · QUEST COMPLETED`, 'positive');
      });
    }

    function checkAchievements() {
      const has = (id) => state.achievements.find(a => a.id === id);
      if (!has('first_step') && log.habits.filter(h => h !== '__touched').length >= 1) unlockAchievement('first_step');
      if (!has('week_alive') && state.streaks.daily_log.longest >= 7) unlockAchievement('week_alive');
      if (!has('month_alive') && state.streaks.daily_log.longest >= 30) unlockAchievement('month_alive');
      if (!has('streak_30') && state.streaks.daily_log.longest >= 30) unlockAchievement('streak_30');
      if (!has('no_scroll_30') && state.streaks.no_scroll_am.longest >= 30) unlockAchievement('no_scroll_30');
      if (!has('balanced') && Object.keys(STATS).every(k => levelFromXP(state.xp[k]) >= 5)) unlockAchievement('balanced');
      if (!has('level_50') && totalLevel() >= 51) unlockAchievement('level_50');
      if (!has('social_butterfly') && levelFromXP(state.xp.vinculo) >= 10) unlockAchievement('social_butterfly');
      if (!has('first_quest') && state.weekly?.quests?.some(q => q.completed)) unlockAchievement('first_quest');
      if (!has('first_dungeon') && state.bosses.some(b => b.completed)) unlockAchievement('first_dungeon');
      const completedSysQ = state.sysquest_history.filter(q => q.status === 'completed').length;
      if (!has('first_sysquest') && completedSysQ >= 1) unlockAchievement('first_sysquest');
      if (!has('sysquest_7') && completedSysQ >= 7) unlockAchievement('sysquest_7');
      if (!has('combo_master') && log.comboBonusGiven) {
        const statsHit = new Set();
        log.habits.forEach(h => { const hab = findHabit(h); if (hab) statsHit.add(hab.stat); });
        if (statsHit.size >= 6) unlockAchievement('combo_master');
      }
      if (!has('streak_50') && state.streaks.daily_log.longest >= 50) unlockAchievement('streak_50');
      if (!has('streak_100') && state.streaks.daily_log.longest >= 100) unlockAchievement('streak_100');
      if (!has('quest_master') && state.sysquest_history.filter(q => q.status === 'completed').length >= 30) unlockAchievement('quest_master');
      if (!has('pp_millionaire') && state.ppLog.filter(l => l.type === 'earn').reduce((s, l) => s + l.amount, 0) >= 5000) unlockAchievement('pp_millionaire');
      // V19.6: New achievement checks + contextual tutorials
      const lvl = totalLevel();
      if (!has('rank_c_reached') && lvl >= 20) {
        unlockAchievement('rank_c_reached');
        maybeShowTutorial('rank_c', 'Rank C reached', 'SYSTEM PROMOTION', [
          'The System has classified you as a Qualified Hunter. Your trajectory justifies access to the internal economy.',
          'Private Points are now active. Every Monday you will receive points based on your weekly evaluation.',
          'You can spend them in the shop (Points tab) on themes, emergency items, or Mentor consultations.'
        ]);
      }
      if (!has('rank_b_reached') && lvl >= 40) {
        unlockAchievement('rank_b_reached');
        maybeShowTutorial('rank_b', 'Rank B reached', 'SYSTEM PROMOTION', [
          'The System has classified you as an Elite Hunter. You have demonstrated sustained capability.',
          'Special Exams are now available. They are 7-day evaluations that unlock permanent Talents.',
          'The System will offer you an exam automatically from time to time. Accepting is optional, but each exam passed permanently expands your capabilities.'
        ]);
      }
      if (!has('rank_a_reached') && lvl >= 65) unlockAchievement('rank_a_reached');
      if (!has('first_talent') && (state.talents || []).length >= 1) unlockAchievement('first_talent');
      if (!has('first_exam') && (state.examHistory || []).some(e => e.result === 'passed')) unlockAchievement('first_exam');
      if (!has('half_year') && daysSinceCreated() >= 180) unlockAchievement('half_year');
      if (!has('one_year') && daysSinceCreated() >= 365) unlockAchievement('one_year');
      if (!has('theme_collector') && (state.unlockedThemes || []).length >= 5) unlockAchievement('theme_collector');
      // resilient: tiene streak actual 30+ y al menos una vez antes lo rompió
      if (!has('resilient')) {
        const currStreak = state.streaks.daily_log.current;
        const longestStreak = state.streaks.daily_log.longest;
        if (currStreak >= 30 && longestStreak > currStreak) unlockAchievement('resilient');
      }
    }

    function getEmptyDaysCount() {
      let count = 0;
      for (let i = 1; i <= 14; i++) {
        const d = nowApp();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        if (!l || l.habits.length === 0) count++;
        else break;
      }
      return count;
    }

    const PAGE_ORDER = ["home", "stats", "focus", "character", "calendar"];
    const pageHistory = [];

    function goPage(p) {
      if (state.page && state.page !== p) {
        pageHistory.push(state.page);
        if (pageHistory.length > 10) pageHistory.shift();
      }
      const oldIdx = PAGE_ORDER.indexOf(state.page);
      const newIdx = PAGE_ORDER.indexOf(p);
      state.pageDirection = newIdx > oldIdx ? "right" : "left";
      state.page = p;
      render();
      if (p === 'stats') {
        setTimeout(() => { renderRadar(); renderHeatmap(); renderOAALine(); renderXPStack(); }, 60);
      }
      if (p === 'focus') {
        setTimeout(updateTimerUI, 60);
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goBack() {
      const prev = pageHistory.pop() || 'home';
      state.page = prev;
      render();
      if (prev === 'stats') setTimeout(() => { renderRadar(); renderHeatmap(); renderOAALine(); renderXPStack(); }, 60);
      if (prev === 'focus') setTimeout(updateTimerUI, 60);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    let radarChart = null;
    function renderRadar() {
      const canvas = document.getElementById('radarChart');
      if (!canvas) return;
      const data = Object.keys(STATS).map(k => levelFromXP(state.xp[k]));
      const labels = Object.keys(STATS).map(k => STATS[k].name);
      const maxLvl = Math.max(...data, 5) + 2;
      if (radarChart) radarChart.destroy();
      const isLight = document.body.dataset.theme === 'light';
      const gridColor = isLight ? 'rgba(0,0,0,.08)' : 'rgba(139, 92, 246, .15)';
      const inkColor = isLight ? '#4A4665' : '#A8A1C2';
      radarChart = new Chart(canvas, {
        type: 'radar',
        data: {
          labels,
          datasets: [{
            data,
            fill: true,
            backgroundColor: 'rgba(139, 92, 246, .2)',
            borderColor: '#8B5CF6',
            borderWidth: 1.5,
            pointBackgroundColor: '#A78BFA',
            pointBorderColor: '#0A0814',
            pointRadius: 4,
            pointHoverRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              beginAtZero: true,

              grid: { color: gridColor },

    }

      const dims = oaa.dims;
      const arrowFor = (delta) => delta > 0.3 ? '▲' : delta < -0.3 ? '▼' : '·';
      const colorFor = (delta) => delta > 0.3 ? 'var(--positive)' : delta < -0.3 ? 'var(--negative)' : 'var(--ink3)';

      const dimBlock = (key, label) => {
        if (dims[key] === null || dims[key] === undefined) {
          return `
            <div class="cote-dim">
              <div class="cote-dim-info">
                <div class="cote-dim-score">—</div>
                <div class="cote-dim-label">${label}</div>
              </div>
              <div class="cote-dim-letter">—</div>
            </div>

        const letter = numToLetter(dims[key]);
        const delta = getDimChange(key);
        const score = Math.round((dims[key] / 14) * 100);
        return `
          <div class="cote-dim">
            <div class="cote-dim-info">
              <div class="cote-dim-score">${score}</div>
              <div class="cote-dim-label">${label}</div>
            </div>
            <div class="cote-dim-letter">${letter}</div>
            <div class="cote-dim-arrow" style="color:${colorFor(delta)}">${arrowFor(delta)}</div>
          </div>
        `;
      };

      const totalScore = Math.round((oaa.total / 14) * 100);
      const totalPct = (oaa.total / 14) * 100;
      const ringR = 37;
      const ringC = 2 * Math.PI * ringR;
      const ringOffset = ringC - (totalPct / 100) * ringC;

      const trendText = trend === 'up' ? 'Ascending' : trend === 'down' ? 'Descending' : 'Stable';

      return `
        <div class="card cote-card">
          <div class="cote-header">
            <div class="cote-tag">Over All Ability</div>
            <div class="cote-class">${rank.rank} - ${clsCode}</div>

            </div>
          </div>

          <div class="cote-name">${escapeHtml(state.user.name)}</div>
          <div class="cote-name-sub">${escapeHtml(rank.name).toUpperCase()}</div>

          <div class="cote-dims-grid">
            <div class="cote-dim-cell">${dimBlock('academico', 'Academic')}</div>
            <div class="cote-center-cell">
              <div class="cote-center">
                <div class="cote-center-tag">総合力</div>
                <div class="cote-ring-wrap">
                  <svg class="cote-ring" viewBox="0 0 90 90">
                    <circle cx="45" cy="45" r="${ringR}" class="cote-ring-bg"></circle>
                    <circle cx="45" cy="45" r="${ringR}" class="cote-ring-fg"
                      stroke-dasharray="${ringC}" stroke-dashoffset="${ringOffset}"
                      transform="rotate(-90 45 45)"></circle>
                  </svg>
                  <div class="cote-ring-content">
                    <div class="cote-center-letter">${totalLetter}</div>
                    <div class="cote-center-score">${totalScore}</div>

                </div>

            </div>

    // ============================================================
    // V3.3 — INFORME DE EVALUACIÓN SEMANAL
    // ============================================================

    const CLASS_POINT_BASE = {
      D: 50,
      C: 100,
      B: 250,
      A: 500,
      Aplus: 750,
    };

    function maybeCalculateClassPoints() {
      const now = nowApp();
      const dayOfWeek = now.getDay(); // 0 = Sunday, 1 = Monday
      if (dayOfWeek !== 1) return; // Only run on Monday

      const todayK = todayKey();
      if (state.classPoints.lastWeeklyCalc === todayK) return;

      const cls = state.currentClass || 'D';
      const base = CLASS_POINT_BASE[cls] || 50;

      // Iterate the last 7 days of logs
      let habitsTotal = 0;
      let combos = 0;
      let intent3of3 = 0;
      let screenTimeOk = 0;
      let screenTimeFail = 0;
      let inactiveDays = 0;
      let sysquestCompleted = 0;
      let sysquestFailed = 0;

      for (let i = 1; i <= 7; i++) {
        const d = nowApp();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        if (!l || (!l.habits?.length && l.scroll_am === null)) {
          inactiveDays++;
          continue;
        }
        const realHabits = (l.habits || []).filter(h => h !== '__touched');
        habitsTotal += realHabits.length;

        // Count combo: 3+ distinct stats touched
        const statsTouched = new Set();
        realHabits.forEach(hid => {
          for (const [stat, list] of Object.entries(HABITS_BASE)) {
            if (list.some(h => h.id === hid)) { statsTouched.add(stat); break; }
          }
        });
        (state.custom || []).forEach(c => {
          if (realHabits.includes(c.id)) statsTouched.add(c.stat);
        });
        if (statsTouched.size >= 3) combos++;

        // Daily intent 3/3
        const c = l.daily_intent?.completed || [];
        if (c.length >= 3 && c.every(Boolean)) intent3of3++;

        // Screen time
        if (l.screen_time === 'pass') screenTimeOk++;
        else if (l.screen_time === 'fail') screenTimeFail++;
      }

      // Sysquests this week
      (state.sysquest_history || []).forEach(sq => {
        if (sq.date && daysSince(sq.date) <= 7) {
          if (sq.status === 'completed') sysquestCompleted++;
          else if (sq.status === 'failed') sysquestFailed++;
        }
      });

      const streakBonus = Math.min(35, Math.max(0, state.streaks.daily_log.current) * 5);

      const bonuses = {
        habits: habitsTotal * 2,
        sysquests: sysquestCompleted * 10,
        combos: combos * 5,
        intent: intent3of3 * 20,
        screenTime: screenTimeOk * 15,
        streak: streakBonus,
      };

      const penalties = {
        inactive: inactiveDays * -10,
        sysquestFailed: sysquestFailed * -25,
        screenTimeFail: screenTimeFail * -15,
      };

      const total = base
        + Object.values(bonuses).reduce((a, b) => a + b, 0)
        + Object.values(penalties).reduce((a, b) => a + b, 0);

      const finalPoints = Math.max(0, total);

      const entry = {
        week: todayK,
        class: cls,
        base,
        bonuses,
        penalties,
        total: finalPoints,
      };

      state.classPoints.current = finalPoints;
      state.classPoints.history.push(entry);
      // Keep only last 26 weeks (~6 months)
      if (state.classPoints.history.length > 26) {
        state.classPoints.history = state.classPoints.history.slice(-26);
      }
      state.classPoints.lastWeeklyCalc = todayK;

      // Award PP: 1 class point = 1 PP
      if (finalPoints > 0 && ppEnabled()) {
        earnPP(finalPoints, 'weekly_class_points');
      }

      persist();

      setTimeout(() => {
        sysToast(`WEEKLY EVALUATION · +${finalPoints} PP`, 'positive');
      }, 2000);
    }

    function generateWeeklyReport() {
      const today = nowApp();
      if (today.getDay() !== 0) return null; // solo domingos

      const wk = weekKey();
      // No generar si ya existe para esta semana
      if (state.weeklyReports.find(r => r.week === wk)) return null;

      const oaa = getCurrentOAA();
      if (!oaa || oaa.total === null) return null;

      const logs7 = getRecentLogs(7);
      const logs30 = getRecentLogs(30);
      const rank = currentRank();
      const cls = state.currentClass || 'D';

      // Calcular cambios vs semana anterior
      const hist = state.oaa_history || [];
      const prevWeek = hist.length >= 8 ? hist[hist.length - 8] : null;
      const dimChange = {};
      const dims = ['academico', 'fisico', 'mental', 'social', 'identidad'];
      dims.forEach(d => {
        dimChange[d] = prevWeek?.dims?.[d] != null && oaa.dims[d] != null
          ? oaa.dims[d] - prevWeek.dims[d]
          : 0;
      });
      const totalChange = prevWeek?.total != null ? oaa.total - prevWeek.total : 0;

      // === OBSERVACIONES ===
      const observations = [];

      // 1. Caída significativa en alguna dimensión
      dims.forEach(d => {
        if (dimChange[d] < -1.5) {
          const dimName = { academico: 'Academic', fisico: 'Physical', mental: 'Mental', social: 'Social', identidad: 'Identity' }[d];
          // Intentar detectar causa
          let causa = '';
          if (d === 'fisico') {
            const gymDays = logs7.filter(l => l.habits.includes('gym')).length;
            if (gymDays <= 1) causa = ` Probable cause: ${gymDays === 0 ? 'no gym at all' : 'only 1 day of gym'} this week.`;
          }
          if (d === 'social') {
            const vincDays = logs7.filter(l => l.habits.some(h => ['call', 'meal', 'msg', 'new_person', 'compliment'].includes(h))).length;
            if (vincDays <= 1) causa = ` Probable cause: ${vincDays === 0 ? 'zero' : '1'} social interaction logged.`;
          }
          observations.push(`Drop detected in ${dimName} (${numToLetter(oaa.dims[d] + Math.abs(dimChange[d]))} → ${numToLetter(oaa.dims[d])}).${causa}`);
        }
      });

      // 2. Patrón de rechazo de sysquests
      const recentQ = state.sysquest_history.filter(q => daysSince(q.date) <= 7);
      if (recentQ.length >= 2) {
        const rejected = recentQ.filter(q => q.status === 'rejected');
        if (rejected.length >= 2) {
          const categories = rejected.map(q => q.category);
          const uniqueCats = [...new Set(categories)];
          if (uniqueCats.length === 1) {
            const catName = { ruptura: 'Rupture', confrontacion: 'Confrontation', disciplina_pura: 'Discipline', curiosidad: 'Curiosity', vulnerabilidad: 'Vulnerability', fisico_extremo: 'Extreme Physical' }[uniqueCats[0]] || uniqueCats[0];
            observations.push(`Persistent pattern: ${rejected.length} of ${recentQ.length} rejected quests belong to category ${catName}. This suggests deliberate avoidance of that area.`);
          }
        }
      }

      // 3. Récord de scroll AM
      if (state.streaks.no_scroll_am.current >= 7 && state.streaks.no_scroll_am.current === state.streaks.no_scroll_am.longest) {
        observations.push(`Personal record: ${state.streaks.no_scroll_am.current} consecutive days without scroll AM.`);
      }

      // 4. Daily intent completion
      let intentDone = 0, intentTotal = 0;
      logs7.forEach(l => {
        if (l.daily_intent?.items?.length > 0) {
          intentTotal += l.daily_intent.items.length;
          intentDone += (l.daily_intent.completed || []).filter(Boolean).length;
        }
      });
      const intentRate = intentTotal > 0 ? Math.round((intentDone / intentTotal) * 100) : null;
      if (intentRate !== null) {
        let intentObs = `Daily intent completion: ${intentRate}%.`;
        // Comparar con mes anterior
        let monthIntentDone = 0, monthIntentTotal = 0;
        logs30.forEach(l => {
          if (l.daily_intent?.items?.length > 0) {
            monthIntentTotal += l.daily_intent.items.length;
            monthIntentDone += (l.daily_intent.completed || []).filter(Boolean).length;
          }
        });
        const monthRate = monthIntentTotal > 0 ? Math.round((monthIntentDone / monthIntentTotal) * 100) : null;
        if (monthRate !== null && Math.abs(intentRate - monthRate) > 10) {
          intentObs += ` Month comparison: ${monthRate}%.`;
          if (intentRate < monthRate - 15) {
            intentObs += ` Hypothesis: you are defining intentions that exceed your operational energy.`;
          }
        }
        observations.push(intentObs);
      }

      // 5. Subida notable
      dims.forEach(d => {
        if (dimChange[d] > 1.5) {
          const dimName = { academico: 'Academic', fisico: 'Physical', mental: 'Mental', social: 'Social', identidad: 'Identity' }[d];
          observations.push(`Significant progress in ${dimName}: +${dimChange[d].toFixed(1)} levels this week.`);
        }
      });

      // 6. Streak diario
      if (state.streaks.daily_log.current >= 14) {
        observations.push(`Active streak of ${state.streaks.daily_log.current} days. Sustained operational consistency.`);
      }

      // 7. Dimensión descuidada
      const lowest = dims.reduce((a, b) => (oaa.dims[a] || 0) < (oaa.dims[b] || 0) ? a : b);
      const highest = dims.reduce((a, b) => (oaa.dims[a] || 0) > (oaa.dims[b] || 0) ? a : b);
      if (oaa.dims[highest] - oaa.dims[lowest] > 4) {
        const loName = { academico: 'Academic', fisico: 'Physical', mental: 'Mental', social: 'Social', identidad: 'Identity' }[lowest];
        observations.push(`Imbalance detected: ${loName} is ${Math.round(oaa.dims[highest] - oaa.dims[lowest])} levels below your strongest dimension.`);
      }

      // 8. Screen Time
      const stHist = state.screenTime.history.filter(h => daysSince(h.date) <= 7);
      if (stHist.length >= 3) {
        const stPassRate = stHist.filter(h => h.result === 'pass').length / stHist.length;
        if (stPassRate < 0.5) {
          const avgHours = (stHist.reduce((s, h) => s + h.hours, 0) / stHist.length).toFixed(1);
          observations.push(`Average screen time: ${avgHours}h/day. ${Math.round(stPassRate * 100)}% within threshold. Negative impact on OAA Mental.`);
        } else if (stPassRate >= 0.85 && state.screenTime.streak >= 7) {
          observations.push(`Screen time controlled: streak of ${state.screenTime.streak} days. Positive impact on OAA Mental (+${getScreenTimeOAAFactor()}).`);
        }
      }

      // Limitar a 4 observaciones
      const finalObs = observations.slice(0, 4);

      // === RECOMENDACIONES ===
      const recommendations = [];

      // Recomendación basada en observaciones
      if (intentRate !== null && intentRate < 60) {
        recommendations.push('Reduce daily intents to 2 items for 7 days. Re-evaluate next Sunday.');
      }
      const rejectedCats = recentQ.filter(q => q.status === 'rejected').map(q => q.category);
      if (rejectedCats.length >= 2) {
        recommendations.push(`Accept the next quest of ${rejectedCats[0] || 'the rejected category'}${ppEnabled() ? ' or spend 80 PP to skip.' : '.'}`);
      }
      if (dimChange.fisico < -1) {
        recommendations.push('Prioritize at least 3 physical activity sessions this week.');
      }
      if (dimChange.social < -1) {
        recommendations.push('Schedule at least 1 in-person interaction (meal or call) this week.');
      }
      if (recommendations.length === 0) {
        recommendations.push('Maintain the current pace. No urgent adjustments detected.');
      }

      // === PP summary ===
      const ppWeek = state.ppLog.filter(l => daysSince(l.date) <= 7);
      const ppEarned = ppWeek.filter(l => l.type === 'earn').reduce((s, l) => s + l.amount, 0);
      const ppSpent = ppWeek.filter(l => l.type === 'spend').reduce((s, l) => s + Math.abs(l.amount), 0);


      const report = {
        week: wk,
        weekNumber: getWeekNumber(),
        year: today.getFullYear(),
        generatedAt: new Date().toISOString(),
        rank: rank.rank,
        class: classCode(cls),
        level: totalLevel(),
        oaa: {
          total: oaa.total,
          totalLetter: numToLetter(oaa.total),
          dims: {},
          totalChange: totalChange,
        },
        observations: finalObs,
        recommendations: recommendations.slice(0, 2),
        pp: { balance: state.pp, earned: ppEarned, spent: ppSpent },
        streak: state.streaks.daily_log.current,
        habitsThisWeek: logs7.reduce((s, l) => s + l.habits.filter(h => h !== '__touched').length, 0),
        feedbackGiven: false,
        resonatedObs: [],
      };

      dims.forEach(d => {
        report.oaa.dims[d] = {
          value: oaa.dims[d],
          letter: oaa.dims[d] !== null ? numToLetter(oaa.dims[d]) : '—',
          change: dimChange[d],
        };
      });

      state.weeklyReports.push(report);
      // Mantener últimos 52 informes (1 año)
      if (state.weeklyReports.length > 52) state.weeklyReports.shift();
      persist();

      return report;
    }

    function getWeekNumber() {
      const d = nowApp();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
      const week1 = new Date(d.getFullYear(), 0, 4);
      return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    }

    function getLatestReport() {
      if (!state.weeklyReports.length) return null;
      return state.weeklyReports[state.weeklyReports.length - 1];
    }

    function markReportFeedback(obsIndex) {
      const report = getLatestReport();
      if (!report) return;
      if (report.resonatedObs.includes(obsIndex)) {
        report.resonatedObs = report.resonatedObs.filter(i => i !== obsIndex);
      } else {
        report.resonatedObs.push(obsIndex);
      }
      report.feedbackGiven = true;
      persist();
      // Re-render modal
      closeModal();
      openModal('report');
    }

    function getSmartSuggestion() {
      // V19.6: Disponible desde Rank C (no más Clase B-only)
      if (totalLevel() < 20) return null;

      // Solo una sugerencia por día
      if (state.uiState.smart_suggestion_today === todayKey()) return null;

      const today = nowApp();
      const dayOfWeek = today.getDay();
      const hour = today.getHours();
      const logs = getRecentLogs(30);

      // ========== Patrón 1: hábito por día de la semana ==========
      const dayPatterns = {};
      logs.forEach(l => {
        const d = new Date(l.date);
        const dow = d.getDay();
        if (!dayPatterns[dow]) dayPatterns[dow] = {};
        l.habits.forEach(h => {
          if (h === '__touched') return;
          dayPatterns[dow][h] = (dayPatterns[dow][h] || 0) + 1;
        });
      });
      const todayPattern = dayPatterns[dayOfWeek];
      if (todayPattern) {
        const entries = Object.entries(todayPattern).sort((a, b) => b[1] - a[1]);
        if (entries.length > 0) {
          const [topHabit, count] = entries[0];
          if (count >= 3 && !log.habits.includes(topHabit)) {
            const habit = findHabit(topHabit);
            if (habit) {
              const dayNames = ['Sundays', 'Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays'];
              return {
                habit: topHabit,
                label: habit.label,
                stat: habit.stat,
                message: `${habit.label} logged on ${count} of the last ${dayNames[dayOfWeek]}. Today still no activity.`,
              };
            }
          }
        }
      }

      // ========== Patrón 2: stat oxidándose ==========
      const statActivity = {};
      Object.keys(STATS).forEach(s => statActivity[s] = 0);
      logs.forEach(l => {
        l.habits.forEach(h => {
          const habit = findHabit(h);
          if (habit && statActivity[habit.stat] !== undefined) statActivity[habit.stat]++;
        });
      });
      const rusty = Object.entries(statActivity).sort((a, b) => a[1] - b[1])[0];
      if (rusty && rusty[1] < 3) {
        const statHabits = (HABITS_BASE[rusty[0]] || []);
        if (statHabits.length > 0) {
          const habit = statHabits[0];
          return {
            habit: habit.id,
            label: habit.label,
            stat: rusty[0],
            message: `${STATS[rusty[0]].name} with only ${rusty[1]} activities in 30 days. Stat rusting.`,
          };
        }
      }

      // ========== Patrón 3: cerca de level up ==========
      for (const stat of Object.keys(STATS)) {
        const p = progressInLevel(state.xp[stat]);
        if (p.pct >= 80) {
          const statHabits = (HABITS_BASE[stat] || []);
          const todoHoy = statHabits.filter(h => !log.habits.includes(h.id));
          if (todoHoy.length > 0) {
            const habit = todoHoy[0];
            const remaining = p.needed - p.current;
            return {
              habit: habit.id,
              label: habit.label,
              stat: stat,
              message: `${remaining} XP remaining for ${STATS[stat].name} to reach LV ${p.level + 1}.`,
            };
          }
        }
      }

      // ========== Patrón 4: streak en riesgo (no marcaste nada hoy y es tarde) ==========
      if (hour >= 19 && log.habits.filter(h => h !== '__touched').length === 0) {
        const streak = state.streaks?.daily_log?.current || 0;
        if (streak >= 7) {
          // Sugerir el hábito más fácil/rápido
          const easyHabit = HABITS_BASE.alma?.find(h => h.id === 'selfcare') || HABITS_BASE.disciplina?.find(h => h.id === 'reflection');
          if (easyHabit && !log.habits.includes(easyHabit.id)) {
            return {
              habit: easyHabit.id,
              label: easyHabit.label,
              stat: easyHabit.stat,
              message: `Your ${streak}-day streak at risk. ${easyHabit.label} keeps the cycle active.`,
            };
          }
        }
      }

      return null;
    }

    function maybeAyanokojiMessage() {
      const daysAlive = daysSinceCreated();
      // V19.5: First message at 14 days (was 90)
      if (daysAlive < 14) return;

      // V19.5: Then every 21 days (was 90)
      const lastMsg = state.ayanokoji.lastMessage;
      if (lastMsg) {
        const daysSinceLast = Math.floor((new Date() - new Date(lastMsg)) / (1000 * 60 * 60 * 24));
        if (daysSinceLast < 21) return;
      }

      // No mostrar si ya se mostró hoy
      if (state.uiState.ayanokoji_shown_today === todayKey()) return;

      const oaa = getCurrentOAA();
      if (!oaa || oaa.total === null) return;

      // Filtrar mensajes ya mostrados
      const shownIds = state.ayanokoji.messages.map(m => m.id);
      const candidates = AYANOKOJI_MESSAGES.filter(m => !shownIds.includes(m.id));
      if (candidates.length === 0) return;

      // Evaluar condiciones
      const matching = candidates.filter(m => {
        try { return m.condition(oaa, state); }
        catch (e) { return false; }
      });

      if (matching.length === 0) return;

      // Elegir uno (priorizar los más específicos — últimos en la lista)
      const chosen = matching[matching.length - 1];

      state.ayanokoji.lastMessage = todayKey();
      state.ayanokoji.messages.push({ id: chosen.id, date: todayKey() });
      state.uiState.ayanokoji_shown_today = todayKey();
      persist();

      // Mostrar después de un delay
      setTimeout(() => showAyanokojiMessage(chosen), 3000);
    }

          context: `Your record is ${state.streaks.daily_log.longest} days. Breaks have patterns that repeat if they are not named.`,
        });
      }

      // PATRONES - MAZMORRAS
      const activeBosses = state.bosses?.filter(b => !b.completed).length || 0;
      if (activeBosses >= 2) {
        questions.push({
          area: 'PATTERN: DUNGEONS',
          question: 'Are you forging dungeons you truly want to complete, or the ones you think you should?',
          context: `You have ${activeBosses} open dungeons. The System notes the difference between ambition and desire.`,
        });
      }
      if (daysSinceCreated() >= 45 && (!state.bosses || state.bosses.length === 0)) {
        questions.push({
          area: 'PATTERN: NO DUNGEONS',
          question: 'Why have you not forged a single dungeon in 45 days?',
          context: 'The System gives the daily quests. You choose the epic ones. Silence here is not neutrality.',
        });
      }

      // PATRONES - SYSQUESTS
      const sysqHist = state.sysquest_history || [];
      const recentRejected = sysqHist.filter(q => daysSince(q.date) <= 30 && q.status === 'rejected').length;
      if (recentRejected >= 3) {
        questions.push({
          area: 'PATTERN: REJECTION',
          question: 'Do you reject the quests because they are miscalibrated or because they demand what you don\'t want to see?',
          context: `You rejected ${recentRejected} quests this month. The System asks only once.`,
        });
      }
      const recentFailed = sysqHist.filter(q => daysSince(q.date) <= 30 && q.status === 'failed').length;
      if (recentFailed >= 3) {
        questions.push({
          area: 'PATTERN: FAILURES',
          question: 'Do you accept quests without checking if you can really fulfill them?',
          context: `You failed ${recentFailed} recent quests. Accepting without calculating is worse than rejecting.`,
        });
      }

      // PATRONES - PP
      if (ppEnabled() && state.pp >= 2000 && state.ppLog?.filter(l => l.type === 'spend').length < 3) {
        questions.push({
          area: 'PATTERN: ACCUMULATED PP',
          question: 'Why do you accumulate Private Points without using them?',
          context: `You have ${state.pp} PP. The economy only makes sense if it circulates. PP are tools, not trophies.`,
        });
      }

      // PATRONES - SCREEN TIME
      if (state.screenTime?.streak === 0 && (state.screenTime?.longest || 0) >= 14) {
        questions.push({
          area: 'PATTERN: SCREEN TIME',
          question: 'When did you stop controlling your screen time this time?',
          context: 'Your best streak was ' + state.screenTime.longest + ' days. Relapses have specific triggers.',
        });
      }

      // PATRONES - REFLECTION
      const recentLogs = getRecentLogs(14);
      const reflections = recentLogs.filter(l => l.reflection).length;
      if (reflections < 3) {
        questions.push({
          area: 'PATTERN: REFLECTION',
          question: 'Do you avoid closing the day because you don\'t want to see what you did or didn\'t do?',
          context: 'You logged reflection ' + reflections + ' times in 14 days. The nightly record is where the day is processed.',
        });
      }

      // PATRONES - CUSTOM HABITS
      const customCount = (state.custom || []).length;
      if (customCount === 0 && daysSinceCreated() >= 30) {
        questions.push({
          area: 'PATTERN: CUSTOM',
          question: 'Why have you not created a single custom habit in a month?',
          context: 'Predefined habits are the starting point. Yours are the ones that define you.',
        });
      }

      // PATRONES - BALANCE
      const dimsValues = Object.values(oaa?.dims || {}).filter(d => d !== null);
      if (dimsValues.length === 5) {
        const max = Math.max(...dimsValues);
        const min = Math.min(...dimsValues);
        if (max - min >= 6) {
          questions.push({
            area: 'PATTERN: IMBALANCE',
            question: 'Are you optimizing what you are already good at and avoiding what is hard?',
            context: `The gap between your best and worst dimension is ${(max - min).toFixed(1)} points. That is not a profile, it is a preference.`,
          });
        }
      }

      // PATRONES - TIEMPO EN EL SISTEMA
      if (daysSinceCreated() >= 90) {
        questions.push({
          area: 'PATTERN: VETERAN',
          question: 'Would the person you are today recognize the one who opened this app for the first time?',
          context: 'You have ' + daysSinceCreated() + ' days in the System. Change is seen better from the inside out.',
        });
      }

      // Default (siempre presente)
      questions.push({
        area: 'PATTERN: GENERAL',
        question: 'If you could change one single thing about how you are using this system, what would it be?',
        context: 'Sometimes the simplest question is the most useful. Do not answer it quickly.',
      });
      questions.push({
        area: 'PATTERN: GENERAL',
        question: 'Which habit tells you more about yourself: the one you log most or the one you postpone most?',
        context: 'What you sustain defines what you are. What you avoid defines what you avoid being.',
      });
      questions.push({
        area: 'PATTERN: GENERAL',
        question: 'Why did you start using the System? Is that reason still valid?',
        context: 'Reasons change. What matters is knowing when they change and why.',
      });

      // Elegir una aleatoria del pool
      return questions[Math.floor(Math.random() * questions.length)];
    }

    function renderHeatmap() {
      const $hm = document.getElementById('heatmap');
      if (!$hm) return;
      let html = '';
      for (let i = 34; i >= 0; i--) {
        const d = nowApp();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        const count = l ? l.habits.filter(h => h !== '__touched').length : 0;
        let lvl = 0;
        if (count >= 1) lvl = 1;
        if (count >= 3) lvl = 2;
        if (count >= 5) lvl = 3;
        if (count >= 8) lvl = 4;
        html += `<div class="heatmap-cell" data-lvl="${lvl}" title="${key}: ${count}"></div>`;
      }
      $hm.innerHTML = html;
    }

    let oaaLineChart = null;
    function renderOAALine() {
      const canvas = document.getElementById('oaaLineChart');
      if (!canvas) return;
      const hist = (state.oaa_history || []).filter(h => h.total !== null);
      if (hist.length < 7) return;

      // Agrupar por semana (tomar el último de cada semana)
      const weeks = [];
      for (let i = 0; i < hist.length; i += 7) {
        const chunk = hist.slice(i, i + 7);
        const last = chunk[chunk.length - 1];
        weeks.push(last);
      }
      const recent = weeks.slice(-12);
      const labels = recent.map(h => h.date.slice(5));
      const data = recent.map(h => h.total);

      const isLight = document.body.dataset.theme === 'light';
      const gridColor = isLight ? 'rgba(0,0,0,.06)' : 'rgba(139,92,246,.12)';

      if (oaaLineChart) oaaLineChart.destroy();
      oaaLineChart = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data,
            borderColor: '#8B5CF6',
            backgroundColor: 'rgba(139,92,246,.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#A78BFA',
            borderWidth: 2,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: gridColor }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 9, family: 'JetBrains Mono' } } },
            y: { min: 0, max: 14, grid: { color: gridColor }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 9, family: 'JetBrains Mono' }, callback: (v) => ['E−', 'E', 'E+', 'D−', 'D', 'D+', 'C−', 'C', 'C+', 'B−', 'B', 'B+', 'A−', 'A', 'A+'][v] || '' } },
          },
        },
      });
    }

    let xpStackChart = null;
    function renderXPStack() {
      const canvas = document.getElementById('xpStackChart');
      if (!canvas) return;

      const days = 14;
      const labels = [];
      const datasets = {};
      Object.keys(STATS).forEach(k => { datasets[k] = []; });

    // Settings rendered with `!== false` default to ON when unset.
    const DEFAULT_ON_SETTINGS = ['screen_time_enabled', 'sysquest_enabled'];

    function toggleSetting(key, el) {
      const cur = state.user.settings[key];
      const effective = DEFAULT_ON_SETTINGS.includes(key) ? cur !== false : !!cur;
      state.user.settings[key] = !effective;
      el.classList.toggle('on', !effective);
      persist();
      render();

    function pickTheme(themeId) {
      if (!state.unlockedThemes.includes(themeId)) {
        unlockTheme(themeId);
        return;
      }
      state.user.theme = themeId;
      applyTheme();
      persist();
      render();
      sysToast('THEME: ' + THEMES[themeId].name.toUpperCase());
    }

    function applyTheme() {
      const themeId = state.user.theme || 'dark';
      const theme = THEMES[themeId] || THEMES.dark;
      document.body.dataset.theme = (themeId === 'light') ? 'light' : 'dark';

      // Apply custom theme vars if defined (premium themes override defaults)
      const root = document.documentElement;
      if (theme.vars) {
        Object.entries(theme.vars).forEach(([k, v]) => root.style.setProperty(k, v));
      } else {
        // Reset inline overrides (for dark/light defaults)
        ['--bg', '--bg2', '--bg3', '--card', '--card2', '--sys', '--sys-glow', '--sys-dim'].forEach(k => root.style.removeProperty(k));
      }

      const metaContent = (themeId === 'light') ? '#F5F3F8' : (theme.vars?.['--bg'] || '#161826');
      const meta = document.getElementById('themeColorMeta');
      if (meta) meta.content = metaContent;

    function unlockTheme(themeId) {
      const theme = THEMES[themeId];
      if (!theme) return;
      if (state.unlockedThemes.includes(themeId)) {
        toast('Theme already unlocked');
        return;
      }
      if (state.pp < theme.cost) {
        toast('Not enough PP');
        return;
      }
      customConfirm(`Unlock "${theme.name}" for ${theme.cost} PP?`, () => {
        state.pp -= theme.cost;
        state.ppLog.push({ type: 'spend', amount: -theme.cost, reason: 'theme_' + themeId, date: todayKey() });
        state.unlockedThemes.push(themeId);
        persist();
        sysToast('THEME UNLOCKED · ' + theme.name.toUpperCase());
        haptic('success');
        applyThemeAndPick(themeId);
      });
    }

    // FOCUS TIMER (V14: timestamp-based, sobrevive a bloqueo de pantalla)
    // ============================================================
    window.focusTimer = {
      duration: 25 * 60,
      remaining: 25 * 60,
      running: false,
      startedAt: null,      // Date.now() cuando arrancó esta corrida
      pausedRemaining: 25 * 60, // segundos que quedaban cuando se pausó
      mode: 25,
      interval: null,
    };

    function setTimerMode(mins) {
      if (focusTimer.running) return;
      focusTimer.mode = mins;
      focusTimer.duration = mins * 60;
      focusTimer.remaining = mins * 60;
      focusTimer.pausedRemaining = mins * 60;
      updateTimerUI();
    }

    function toggleTimer() {
      if (focusTimer.running) pauseTimer();
      else startTimer();
    }

    function startTimer() {
      focusTimer.running = true;
      // V14: anchor en Date.now(). Si pausamos antes, retomamos desde pausedRemaining.
      focusTimer.startedAt = Date.now();
      // El interval ahora solo refresca el UI cada 250ms basado en el delta real
      focusTimer.interval = setInterval(tickTimer, 250);
      updateTimerUI();
    }

    function pauseTimer() {
      // Guardar el tiempo restante real antes de parar
      if (focusTimer.startedAt) {
        const elapsed = Math.floor((Date.now() - focusTimer.startedAt) / 1000);
        focusTimer.pausedRemaining = Math.max(0, focusTimer.pausedRemaining - elapsed);
        focusTimer.remaining = focusTimer.pausedRemaining;
      }
      focusTimer.running = false;
      focusTimer.startedAt = null;
      if (focusTimer.interval) clearInterval(focusTimer.interval);
      updateTimerUI();
    }

    function resetTimer() {
      if (focusTimer.interval) clearInterval(focusTimer.interval);
      focusTimer.running = false;
      focusTimer.startedAt = null;
      focusTimer.remaining = focusTimer.duration;
      focusTimer.pausedRemaining = focusTimer.duration;
      updateTimerUI();
    }

    function tickTimer() {
      // V14: calcular remaining basado en timestamp, no en decrement
      if (!focusTimer.running || !focusTimer.startedAt) return;
      const elapsed = Math.floor((Date.now() - focusTimer.startedAt) / 1000);
      focusTimer.remaining = Math.max(0, focusTimer.pausedRemaining - elapsed);
      if (focusTimer.remaining <= 0) completeTimer();
      else updateTimerUI();
    }

    function completeTimer() {
      clearInterval(focusTimer.interval);
      focusTimer.running = false;
      focusTimer.startedAt = null;
      focusTimer.remaining = 0;
      updateTimerUI();
      const habitId = focusTimer.mode >= 90 ? 'deep_work' : 'pomo';
      if (!log.habits.includes(habitId)) logHabit(habitId);
      else toast(`Session completed`, 'positive');
      focusTimer.remaining = focusTimer.duration;
      focusTimer.pausedRemaining = focusTimer.duration;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    // V14: cuando la app vuelve del background, recalcular remaining
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && focusTimer.running) {
        tickTimer();
      }
    });

      const $t = document.getElementById('timerTime');
      const $m = document.getElementById('timerMode');
      const $c = document.getElementById('timerCircle');
      const $b = document.getElementById('timerStartBtn');

      $t.textContent = `${mm}:${ss}`;

    // ============================================================
    // LICENSE / ACTIVATION
    // ============================================================
    // Offline-tolerant license gate. Validates a key online on activation, then
    // re-checks periodically when online. If offline, keeps working (grace) so the
    // PWA stays usable without a connection. Client-side gates are inherently
    // bypassable by a determined user; this raises the effort substantially and,
    // combined with obfuscation of the final build, deters casual sharing/cracking.
    const LICENSE = {
      // TODO(deploy): point this at your deployed validation endpoint (see backend file).
      endpoint: 'https://ascendency-license.YOUR-SUBDOMAIN.workers.dev/validate', // TODO(deploy): your Worker URL (must match CSP connect-src)
      // Days between background re-validations when online.
      recheckDays: 7,
      // Days the app keeps working offline since the last successful check before
      // it asks to reconnect. Generous, so genuine offline users are never punished.
      graceDays: 30,
      productHint: 'ascendency',
    };

    // Is the Hunter system unlocked? (reveal/assessment are always free)
    function isLicensed() {
      const L = state.license || {};
      if (L.status === 'licensed' || L.status === 'grace') {
        // Both states keep working offline for graceDays since the last successful
        // check. Past that, the app asks to reconnect once (stored key revalidates
        // in one tap from the activation screen).
        if (!L.lastCheck) return L.status === 'licensed';
        return daysSince(L.lastCheck) <= LICENSE.graceDays;
      }
      return false;
    }

    function licenseNeedsRecheck() {
      const L = state.license || {};
      if (L.status === 'unlicensed') return false;
      if (!L.lastCheck) return true;
      return daysSince(L.lastCheck) >= LICENSE.recheckDays;
    }

    // Validate a key against the backend. Returns {ok:boolean, reason?:string}.
    async function validateLicenseKey(key, { silent = false } = {}) {
      const trimmed = (key || '').trim();
      if (!trimmed) return { ok: false, reason: 'empty' };
      // Server explicitly rejected the key (revoked / refunded / typo): drop access.
      const invalidate = () => {
        if (state.license && state.license.status !== 'unlicensed') {
          state.license = { ...state.license, status: 'unlicensed' };
          persist();
        }
        return { ok: false, reason: 'invalid' };
      };
      try {
        const res = await fetch(LICENSE.endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: trimmed, product: LICENSE.productHint, instance: state.license?.instanceId || null }),
        });
        if (!res.ok) {
          // Network reached server but got an error status.
          if (res.status === 404 || res.status === 403) return invalidate();
          throw new Error('status ' + res.status);
        }
        const data = await res.json();
        if (data && data.valid === true) {
          state.license = {
            status: 'licensed',
            key: trimmed,
            lastCheck: todayKey(),
            activatedAt: state.license?.activatedAt || todayKey(),
            // Instance binding (LemonSqueezy activation) — enforces the per-license device limit.
            instanceId: data.instance_id || state.license?.instanceId || null,
          };
          persist();
          return { ok: true };
        }
        return invalidate();
      } catch (e) {
        // Could not reach the server (offline or server down).
        // If the user was already licensed, keep them in grace rather than locking out.
        if (state.license && (state.license.status === 'licensed' || state.license.status === 'grace') && state.license.key) {
          state.license.status = 'grace';
          persist();
          return { ok: silent, reason: 'offline-grace' };
        }
        return { ok: false, reason: 'offline' };
      }
    }

    // Background re-validation: only runs when online and due. Never blocks the UI.
    async function maybeRecheckLicense() {
      if (!licenseNeedsRecheck()) return;
      if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
      const before = state.license?.status;
      await validateLicenseKey(state.license.key, { silent: true });
      // If the status changed (e.g. key revoked), reroute through the gate.
      if (state.license?.status !== before) render();
    }

    // Manual activation from the activation screen.
    async function submitLicenseKey() {
      const input = document.getElementById('licenseKeyInput');
      const btn = document.getElementById('licenseSubmitBtn');
      const errEl = document.getElementById('licenseError');
      if (!input) return;
      const key = input.value.trim();
      if (!key) { if (errEl) errEl.textContent = 'Enter your license key.'; return; }
      if (btn) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = 'Validating…'; }
      if (errEl) errEl.textContent = '';
      const result = await validateLicenseKey(key);
      if (result.ok) {
        sysToast('LICENSE ACCEPTED. SYSTEM UNLOCKED.');
        // Complete entry into the system (no-op flag set if already onboarded).
        finalizeEntry();
      } else {
        if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label || 'Activate'; }
        if (errEl) {
          errEl.textContent =
            result.reason === 'offline' || result.reason === 'offline-grace' ? 'No connection. Validation needs internet — try again when online.' :
            result.reason === 'invalid' ? 'That key was not recognized.' :
            'Could not validate. Try again.';
        }
      }
    }

    // answers: { q1: optionIndex, ... } -> seeds state, returns reveal payload
    function scoreAssessment(answers) {
      const mean = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
      // group sub-scores by stat and by dim
      const byStat = {}, byDim = {};
      for (const q of ASSESSMENT_QUESTIONS) {
        if (q.focus) continue;
        const idx = answers[q.id];
        if (idx == null) continue;
        const sc = q.options[idx].s;
        if (q.stat) (byStat[q.stat] = byStat[q.stat] || []).push(sc);
        if (q.dim) (byDim[q.dim] = byDim[q.dim] || []).push(sc);
      }
      // OAA dims (0..14 scale, conservative -> capped near 10 = 'B')
      const dims = {};
      for (const d of ['academico', 'fisico', 'mental', 'social', 'identidad']) {
        const s01 = mean(byDim[d] || [0]);
        dims[d] = Math.round(Math.pow(s01, 1.2) * 10);
      }
      const total = calcOAATotal(dims);
      // XP per stat (conservative -> capped at level 4 = 1701 XP)
      const initialXP = { fuerza: 0, sabiduria: 0, disciplina: 0, alma: 0, vinculo: 0, entretenimiento: 0 };
      for (const st of ['fuerza', 'sabiduria', 'disciplina', 'alma', 'vinculo']) {
        const s01 = mean(byStat[st] || [0]);
        initialXP[st] = Math.round(Math.pow(s01, 1.3) * 1701);

      // focus area from q11
      const fq = ASSESSMENT_QUESTIONS.find(q => q.focus);
      const fIdx = answers[fq.id];
      const focusArea = (fIdx != null) ? fq.options[fIdx].area : null;
      return { dims, total, initialXP, focusArea };
    }

    function revealVerdict(lowDim, focusArea) {
      const dimName = { academico: 'Academic', fisico: 'Physical', mental: 'Mental', social: 'Social', identidad: 'Identity' };
      const base = `Your ${dimName[lowDim]} signal is the faintest. The System will watch whether your output matches your input.`;
      if (focusArea && focusArea === lowDim) {
        return `You named it yourself: ${dimName[lowDim]} is where you are weakest, and where you intend to change. The System has recorded the claim. Prove it.`;
      }
      if (focusArea) {
        return `${base} You have chosen to focus on ${FOCUS_LABELS[focusArea].toLowerCase()}. Intention is noted. Only action is measured.`;

      return base;

    function beginAssessment() {
      const name = document.getElementById('onbName').value.trim();
      if (!name) { toast('Name required', 'danger'); return; }
      pendingName = name.slice(0, 30);
      onbPhase = 'assessment';
      assessmentStep = 0;
      assessmentAnswers = {};
      renderAssessment();
    }

    function answerAssessment(optIdx) {
      const q = ASSESSMENT_QUESTIONS[assessmentStep];
      assessmentAnswers[q.id] = optIdx;
      renderAssessment();
    }

    function assessmentNext() {
      const q = ASSESSMENT_QUESTIONS[assessmentStep];
      if (assessmentAnswers[q.id] == null) return;
      if (assessmentStep < ASSESSMENT_QUESTIONS.length - 1) {
        assessmentStep++;
        renderAssessment();
      } else {
        // compute result + provisional rank
        const scored = scoreAssessment(assessmentAnswers);
        // temporarily seed OAA so currentRank() can read it for the reveal snapshot
        const prevOaa = state.oaa, prevXp = state.xp, prevAssess = state.assessment;
        state.assessment = { dims: scored.dims, total: scored.total, date: todayKey() };
        state.oaa = { date: todayKey(), dims: scored.dims, total: scored.total, computedAt: new Date().toISOString() };
        state.xp = { ...scored.initialXP };
        const rank = currentRank();
        const cls = classFromOAA(scored.total);
        // restore (real seeding happens in finishAwakening on confirm)
        state.oaa = prevOaa; state.xp = prevXp; state.assessment = prevAssess;
        assessmentResult = { dims: scored.dims, total: scored.total, initialXP: scored.initialXP, focusArea: scored.focusArea, rank, cls };
        onbPhase = 'reveal';
        renderReveal();
      }
    }

    function assessmentBack() {
      if (assessmentStep > 0) { assessmentStep--; renderAssessment(); }
    }

    function onbNext() {
      onbStep++;
      renderOnboarding();
    }

    function finishAwakening() {
      const r = assessmentResult;
      state.user = {
        createdAt: todayKey(),
        name: pendingName,
        avatar: pendingName.charAt(0).toUpperCase(),
        theme: 'dark',
        settings: {
          penalize_scroll_am: true,
          sysquest_enabled: true,
          reflection_reminder_hour: 21,
          week_starts: 'monday',
        },
      };
      // Seed provisional state from the assessment
      state.xp = { ...r.initialXP };
      state.assessment = { dims: r.dims, total: r.total, date: todayKey() };
      state.provisional = true;
      state.focusArea = r.focusArea;
      state.oaa = { date: todayKey(), dims: r.dims, total: r.total, computedAt: new Date().toISOString() };
      state.oaa_history = [{ date: todayKey(), dims: r.dims, total: r.total }];
      state.currentClass = r.cls;
      persist();
      applyTheme();
      // If already licensed (e.g. reinstalled and re-validated), skip the gate.
      if (isLicensed()) { finalizeEntry(); return; }
      // Otherwise present the activation gate. The assessment + reveal were free.
      onbPhase = 'activate';
      render();
    }

    function escapeHtml(s) {
      if (typeof s !== 'string') return '';
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function countAllHabits() {
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('mo_log_')) {
          try {
            const l = JSON.parse(localStorage.getItem(k));
            count += l.habits.filter(h => h !== '__touched').length;
          } catch (e) { }
        }
      }
      return count;
    }

      if (!state.user.createdAt) return 1;

    let touchStartY = 0;
    let touchStartTime = 0;
    document.addEventListener("touchstart", (e) => {
      const modal = document.querySelector(".modal-ov.show .modal");
      if (!modal) return;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      const modal = document.querySelector(".modal-ov.show .modal");
      if (!modal) return;
      const deltaY = e.changedTouches[0].clientY - touchStartY;
      const deltaTime = Date.now() - touchStartTime;
      if (deltaY > 80 && deltaTime < 300 && modal.scrollTop <= 0) {
        closeModal();
      }
    }, { passive: true });

    // Pull to refresh
    let pullStartY = 0;
    let pulling = false;
    document.addEventListener("touchstart", (e) => {
      if (window.scrollY === 0 && !document.querySelector(".modal-ov.show")) {
        pullStartY = e.touches[0].clientY;
        pulling = true;
      }
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (!pulling) return;
      const delta = e.touches[0].clientY - pullStartY;
      if (delta > 80 && window.scrollY === 0) {
        pulling = false;
        render();
        sysToast("REFRESHED");
        haptic("light");
      }
    }, { passive: true });

    document.addEventListener("touchend", () => { pulling = false; }, { passive: true });

        case "heavy": navigator.vibrate([30, 10, 30]); break;
        case "success": navigator.vibrate([15, 30, 15]); break;
        case "error": navigator.vibrate([50, 30, 50]); break;

    }

      if (state.uiState.morning_greeted === today) return;
      state.uiState.morning_greeted = today;
      persist();
      const hour = nowApp().getHours();
      if (hour >= 5 && hour <= 11) {
        const streak = state.streaks.daily_log.current;
        const context = streak > 1 ? 'morning_streak' : 'morning_no_streak';
        setTimeout(() => sysToast(getSystemPhrase(context, { streak }) || 'Good morning'), 1500);
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    const $app = document.getElementById('app');

    // V19.7: Optional system sounds using WebAudio (no external files)
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { return null; }
      }
      return audioCtx;
    }

    function playSystemSound(type) {
      if (!state.user?.settings?.sounds_enabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(.08, now + .02);

        if (type === 'level_up') {
          o.type = 'sine';
          o.frequency.setValueAtTime(440, now);
          o.frequency.linearRampToValueAtTime(880, now + .25);
          g.gain.exponentialRampToValueAtTime(.0001, now + .35);
          o.start(now);
          o.stop(now + .4);
        } else if (type === 'rank_up') {
          o.type = 'triangle';
          o.frequency.setValueAtTime(523, now);
          o.frequency.setValueAtTime(659, now + .15);
          o.frequency.setValueAtTime(784, now + .30);
          g.gain.exponentialRampToValueAtTime(.0001, now + .55);
          o.start(now);
          o.stop(now + .6);
        } else if (type === 'achievement') {
          o.type = 'square';
          o.frequency.setValueAtTime(659, now);
          o.frequency.setValueAtTime(880, now + .12);
          g.gain.exponentialRampToValueAtTime(.0001, now + .25);
          o.start(now);
          o.stop(now + .3);
        } else if (type === 'click') {
          o.type = 'sine';
          o.frequency.setValueAtTime(800, now);
          g.gain.setValueAtTime(.04, now);
          g.gain.exponentialRampToValueAtTime(.0001, now + .06);
          o.start(now);
          o.stop(now + .07);
        }
      } catch (e) { }
    }

    // Carry over a postponed Daily Intent (paid PP action) from yesterday.
    function carryPostponedIntent() {
      try {
        const y = nowApp();
        y.setDate(y.getDate() - 1);
        const ylog = load(K.log(dateToKey(y)), null);
        if (!ylog?.daily_intent?.postponed) return;
        const pending = (ylog.daily_intent.items || []).filter((it, i) => !ylog.daily_intent.completed?.[i]);
        if (pending.length && log.daily_intent.items.length === 0) {
          log.daily_intent.items = pending.slice(0, 5);
          log.daily_intent.completed = log.daily_intent.items.map(() => false);
          log.daily_intent.bonusGiven = false;
          saveLog(log);
          setTimeout(() => sysToast('POSTPONED INTENT · DUE TODAY'), 1800);
        }
        ylog.daily_intent.postponed = false;
        save(K.log(ylog.date), ylog);
      } catch (e) { }
    }

    let lastMaintenanceDay = null;

    // Everything that must run once per day (also re-runs if the PWA stays
    // open/in memory across midnight — see the visibilitychange hook below).
    function dailyMaintenance() {
      lastMaintenanceDay = todayKey();
      generateWeeklyQuests();
      generateMonthlyQuest();
      syncQuestNames();
      syncDailyStreak();
      if (state.user?.settings?.sysquest_enabled !== false) {
        maybeGenerateSysQuest();
      }
      // Background license re-validation (online + due only; never blocks UI).
      maybeRecheckLicense();
      // V3: recalcular OAA y clase
      getCurrentOAA();
      // Provisional assessment expires once logged data fully takes over (VERIFY_DAYS reached).
      if (state.assessment && dataConfidence() >= 1) {
        state.assessment = null;
        state.provisional = false;
        persist();
      }
      updateClassIfChanged();
      ppWeeklyOAABonus();
      // V18: Calcular puntos de clase semanales (solo lunes)
      maybeCalculateClassPoints();
      // Check pause mode expiry
      if (state.pause?.active && new Date(state.pause.until) < new Date()) {
        state.pause = null;
        persist();
        sysToast('PAUSE MODE ENDED');
      }
      applyTheme();
      maybeRemindReflection();
      morningGreeting();
      carryPostponedIntent();
      // V3.3: Informe semanal
      maybeGenerateReport();
      // V3.3: Layer Ayanokoji
      maybeAyanokojiMessage();
      // V3.4: Final Exam anual
      maybeShowFinalExam();
      maybePeriodEval();
      // FIX: Activar sistema dormido de Talents + Special Exams
      evaluateTalents();
      checkExamExpiry();
      maybeOfferExam();
      checkExamDaily();
    }

    function init() {
      if (state.uiState.onb_done) {
        dailyMaintenance();
      }
      render();
    }

    // ============================================================
    // ⚠ DEV BUILD — SOLO PARA TESTEO LOCAL. NO PUBLICAR ESTE ARCHIVO.
    // Siembra una licencia local en cada boot: el gate de activación
    // nunca aparece y el recheck remoto nunca corre. El build real
    // para vender es build/dist/ascendency.html (este bloque no existe ahí).
    // ============================================================
    state.license = { status: 'licensed', key: 'DEV-LOCAL', lastCheck: todayKey(), activatedAt: state.license?.activatedAt || todayKey() };
    persist();

    init();

    // Day rollover: when the app becomes visible on a new day (PWA kept in
    // memory overnight), refresh the day log and re-run daily maintenance.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (!state.uiState.onb_done) return;
      if (lastMaintenanceDay && todayKey() !== lastMaintenanceDay) {
        log = getLog(todayKey());
        dailyMaintenance();
        render();
      }
    });

    // ============================================================
    // SERVICE WORKER REGISTRATION + AUTO-UPDATE
    // ============================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update();
            });
            setInterval(() => reg.update(), 30 * 60 * 1000);
            reg.addEventListener('updatefound', () => {
              const newSW = reg.installing;
              if (!newSW) return;
              newSW.addEventListener('statechange', () => {
                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                  sysToast('NEW VERSION · UPDATING');
                  newSW.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          })
          .catch((err) => console.warn('SW reg failed:', err));
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }

    function render() {
      if (!state.user || !state.uiState.onb_done) {
        if (onbPhase === 'activate') { renderActivation(); return; }
        if (onbPhase === 'assessment') { renderAssessment(); return; }
        if (onbPhase === 'reveal') { renderReveal(); return; }
        renderOnboarding();
        return;
      }
      // Post-onboarding gate: key revoked or offline grace expired.
      // Onboarding state stays untouched; data is intact behind the gate.
      if (!isLicensed()) { renderActivation(); return; }
      log = getLog(todayKey());
      const html = `${renderHeader()}${renderPage()}${renderNav()}`;
      $app.innerHTML = html;
    }

    // Avatar: usa avatar.png si existe en el repo, sino fallback a la inicial
    function avatarHTML(extraClasses = '') {
      const raw = (state.user.name || '').charAt(0).toUpperCase();
      const init = /^[A-Z0-9]$/i.test(raw) ? raw : 'H';
      // El onerror reemplaza la img por la inicial si el archivo no existe
      return `<img src="avatar.png" class="avatar-img" alt="${init}" onerror="this.outerHTML='${init}'">`;

    function renderHeader() {

      const streakHtml = streak >= 7
        ? `<span class="header-streak ${streak >= 30 ? 'header-streak-glow' : ''}" title="${streak} consecutive days"><span class="header-streak-icon">${svgIcon('ach_fire', 'icon')}</span><span class="header-streak-num">${streak}</span></span>`

    <div class="header">

        <div class="header-bottom-line">

      // PAUSE MODE banner
      if (isPaused()) {

        html += `
          <div class="sysnotif text-info" style="border-color:var(--info);box-shadow:0 0 24px var(--cyan-dim)">

              </div>
            ` : ''}

        `;
      }

      return html;

    function maybePeriodEval() {
      const today = todayKey();
      const lastEval = state.uiState.last_period_eval;
      if (lastEval) {
        const daysSinceLast = daysSince(lastEval);
        if (daysSinceLast < 28) return; // mínimo 28 días entre evaluaciones
      }
      // Solo trigger el primer día del mes o cada 30 días
      const dayOfMonth = nowApp().getDate();
      if (dayOfMonth > 3 && lastEval) return;

      if (!lastEval || daysSince(lastEval) >= 28) {
        state.uiState.last_period_eval = today;
        persist();
        setTimeout(() => {
          sysToast('PERIOD EVALUATION');
          setTimeout(() => openModal('period_eval'), 1500);
        }, 2000);
      }
    }

    function maybeShowFinalExam() {
      const createdAt = state.user?.createdAt;
      if (!createdAt) return;
      const diffDays = daysSince(createdAt);

      // Solo mostrar en aniversarios exactos de 365 días (con margen de 3 días)
      if (diffDays > 0 && diffDays % 365 <= 3) {
        const year = Math.floor(diffDays / 365);
        const examKey = `final_exam_y${year}`;
        if (!state.achievements.find(a => a.id === examKey)) {
          // Grant achievement to not show again
          state.achievements.push({ id: examKey, date: todayKey() });
          persist();
          setTimeout(() => openModal('final_exam'), 2000);
        }
      }
    }

    async function exportStatusWidget() {
      // Usar html2canvas para capturar la ventana de Character (app container)
      // Como no tenemos la librería cargada por defecto, usamos un fallback básico
      // (En una PWA real, cargaríamos html2canvas dinámicamente)
      toast('Generating widget…', 'neutral');
      try {
        if (!window.html2canvas) {
          const script = document.createElement('script');
          script.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
          document.body.appendChild(script);
          await new Promise(r => script.onload = r);
        }

    function renderCalendar() {
      const now = nowApp();
      const viewMonth = state.calendarMonth ?? now.getMonth();
      const viewYear = state.calendarYear ?? now.getFullYear();
      const firstDay = new Date(viewYear, viewMonth, 1);
      const lastDay = new Date(viewYear, viewMonth + 1, 0);
      const startPad = (firstDay.getDay() + 6) % 7; // Monday = 0
      const totalDays = lastDay.getDate();
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const today = todayKey();

      let html = `
        <div class="card">
          <div class="card-title">
            <span class="card-action" onclick="calendarNav(-1)">◂</span>
