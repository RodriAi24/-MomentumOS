    function checkExamDaily() {
      if (!state.specialExam || state.specialExam.status !== 'active') return;
      const exam = state.specialExam;
      const template = SPECIAL_EXAMS.find(e => e.id === exam.examId);
      if (!template) return;

      const today = todayKey();
      if (exam.dayLogs.some(d => d.date === today)) return;

      const dayResult = evaluateExamDay(template);
      exam.dayLogs.push({ date: today, passed: dayResult.allMet, details: dayResult.details });
      persist();
    }

    function evaluateExamDay(template) {
      const details = [];
      let allMet = true;

      template.conditions.forEach(cond => {
        let met = false;
        switch (cond.type) {
          case 'daily_habit':
            met = log.habits.includes(cond.habitId);
            break;
          case 'daily_reflection':
            met = !!log.reflection?.closed;
            break;
          case 'daily_journal':
            met = !!(log.reflection?.journal && log.reflection.journal.length > 10);
            break;
          case 'daily_stat_count': {
            const statHabits = HABITS_BASE[cond.stat]?.map(h => h.id) || [];
            const count = log.habits.filter(h => statHabits.includes(h)).length;
            met = count >= cond.min;
            break;
          }
          case 'daily_all_stats': {
            const statKeys = Object.keys(STATS);
            met = statKeys.every(sk => {
              const ids = (HABITS_BASE[sk] || []).map(h => h.id)
                .concat(state.custom.filter(c => c.stat === sk).map(c => c.id));
              return log.habits.some(h => ids.includes(h));
            });
            break;
          }
          case 'total_habits':
            met = true;
            break;
        }
        details.push({ label: cond.label, met });
        if (!met && cond.type !== 'total_habits') allMet = false;
      });

      return { allMet, details };
    }

    function evaluateExam() {
      const exam = state.specialExam;
      if (!exam || exam.status !== 'active') return;
      const template = SPECIAL_EXAMS.find(e => e.id === exam.examId);
      if (!template) return;

      let passed = true;

      const dailyConditions = template.conditions.filter(c => c.type !== 'total_habits');
      if (dailyConditions.length > 0) {
        const requiredDays = template.duration;
        const passedDays = exam.dayLogs.filter(d => d.passed).length;
        if (passedDays < requiredDays) passed = false;
      }

      const totalConditions = template.conditions.filter(c => c.type === 'total_habits');
      totalConditions.forEach(cond => {
        let totalCount = 0;
        for (let i = 0; i < template.duration; i++) {
          const d = new Date(exam.startDate);
          d.setDate(d.getDate() + i);
          const key = d.toISOString().slice(0, 10);
          const dayLog = load(K.log(key), null);
          if (dayLog) {
            totalCount += dayLog.habits.filter(h => cond.habitIds.includes(h)).length;
          }
        }
        if (totalCount < cond.min) passed = false;
      });

      exam.status = passed ? 'passed' : 'failed';
      exam.completedAt = todayKey();

      if (passed) {
        earnPP(template.reward.pp, 'special_exam_' + exam.examId);
        if (template.reward.title) {
          if (!state.examTitles) state.examTitles = [];
          if (!state.examTitles.includes(template.reward.title)) {
            state.examTitles.push(template.reward.title);
          }
        }
        setTimeout(() => sysToast(`SPECIAL EXAM APROBADO · +${template.reward.pp} PP`, 'positive'), 600);
      } else {
        setTimeout(() => sysToast('SPECIAL EXAM FALLIDO · Cooldown 21 días', 'danger'), 600);
      }

      state.examHistory.push({ ...exam });
      state.specialExam = null;
      persist();
      render();
    }

    function getExamProgress() {
      if (!state.specialExam || state.specialExam.status !== 'active') return null;
      const exam = state.specialExam;
      const template = SPECIAL_EXAMS.find(e => e.id === exam.examId);
      if (!template) return null;

      const startDate = new Date(exam.startDate);
      const now = new Date();
      const dayNumber = Math.min(template.duration, Math.floor((now - startDate) / (1000 * 60 * 60 * 24)) + 1);
      const passedDays = exam.dayLogs.filter(d => d.passed).length;
      const totalDays = template.duration;

      let totalProgress = {};
      template.conditions.filter(c => c.type === 'total_habits').forEach(cond => {
        let count = 0;
        for (let i = 0; i < dayNumber; i++) {
          const d = new Date(exam.startDate);
          d.setDate(d.getDate() + i);
          const key = d.toISOString().slice(0, 10);
          const dayLog = load(K.log(key), null);
          if (dayLog) count += dayLog.habits.filter(h => cond.habitIds.includes(h)).length;
        }
        totalProgress[cond.label] = { current: count, target: cond.min };
      });

      const todayResult = evaluateExamDay(template);

      return {
        template,
        dayNumber,
        totalDays,
        passedDays,
        pct: (passedDays / totalDays) * 100,
        todayConditions: todayResult.details,
        totalProgress,
      };
    }

    async function fetchChessGames() {
      const username = state.user?.settings?.chess?.username;
      if (!username) return null;

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const url = `${API.chess.base}/${username}/games/${year}/${month}`;
      const data = await apiFetch(url, {}, 8000);
      if (!data?.games) return null;

      const today = todayKey();
      const todayGames = data.games.filter(g => {
        const d = new Date(g.end_time * 1000);
        return d.toISOString().slice(0, 10) === today;
      });

      return todayGames.map(g => {
        const isWhite = g.white.username.toLowerCase() === username.toLowerCase();
        const myResult = isWhite ? g.white.result : g.black.result;
        const myRating = isWhite ? g.white.rating : g.black.rating;
        return {
          result: myResult,
          rating: myRating,
          timeClass: g.time_class,
          url: g.url,
        };
      });
    }

    async function autoLogChess() {
      const username = state.user?.settings?.chess?.username;
      if (!username) return;

      const today = todayKey();
      const lastCheck = load('mo_chess_last_check', null);
      if (lastCheck === today) return;

      const games = await fetchChessGames();
      if (!games || games.length === 0) {
        save('mo_chess_last_check', today);
        return;
      }

      if (!log.habits.includes('chess')) {
        log.habits.push('chess');
        const gained = log.xp_gained.juego;
        const cap = STATS.juego.cap;
        const xpToAdd = Math.min(8, cap - gained);
        if (xpToAdd > 0) {
          log.xp_gained.juego += xpToAdd;
          state.xp.juego += xpToAdd;
        }
        saveLog(log);
        persist();

        const wins = games.filter(g => g.result === 'win').length;
        const total = games.length;
        const rating = games[games.length - 1]?.rating || '?';
        sysToast(`${total} partida${total > 1 ? 's' : ''} detectada${total > 1 ? 's' : ''} \u00b7 ${wins}W \u00b7 Rating ${rating}`);
      }

      save('mo_chess_last_check', today);
    }

    async function gistBackup() {
      const cfg = state.user?.settings?.gist;
      if (!cfg?.enabled || !cfg?.token) return;

      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('mo_')) data[k] = localStorage.getItem(k);
      }

      const content = JSON.stringify(data, null, 2);
      const filename = `momentum_backup_${todayKey()}.json`;

      const headers = {
        'Authorization': `token ${cfg.token}`,
        'Content-Type': 'application/json',
      };

      try {
        if (cfg.gistId) {
          await fetch(`${API.gist.base}/${cfg.gistId}`, {
            method: 'PATCH',
            headers,
            body: JSON.stringify({
              description: `MomentumOS backup \u00b7 ${todayKey()}`,
              files: { [filename]: { content } },
            }),
          });

    function getOAATrend(weeks = 4) {
      // Regresión lineal simple sobre últimas N semanas de OAA Total
      if (!state.oaa_history || state.oaa_history.length < weeks * 7) return 'flat';
      const recent = state.oaa_history.slice(-(weeks * 7)).filter(h => h.total !== null);
      if (recent.length < 7) return 'flat';
      const n = recent.length;
      const xs = recent.map((_, i) => i);
      const ys = recent.map(h => h.total);
      const xMean = xs.reduce((a, b) => a + b, 0) / n;
      const yMean = ys.reduce((a, b) => a + b, 0) / n;
      const num = xs.reduce((s, x, i) => s + (x - xMean) * (ys[i] - yMean), 0);
      const den = xs.reduce((s, x) => s + (x - xMean) ** 2, 0);
      const slope = den === 0 ? 0 : num / den;
      if (slope > 0.05) return 'up';
      if (slope < -0.05) return 'down';
      return 'flat';
    }

    function getDimChange(stat) {
      // Cambio vs semana anterior
      if (!state.oaa_history || state.oaa_history.length < 8) return 0;
      const today = state.oaa_history[state.oaa_history.length - 1];
      const weekAgo = state.oaa_history[state.oaa_history.length - 8];
      if (!today.dims[stat] || !weekAgo.dims[stat]) return 0;
      return today.dims[stat] - weekAgo.dims[stat];
    }

    const QUEST_CATEGORIES = Object.keys(QUEST_TEMPLATES);

    function generateDailyQuest(currentRank, recentCategories) {
      // Pesos: ajustan según rango
      let weights = {
        ruptura: 2,
        confrontacion: 2,
        disciplina_pura: 2,
        curiosidad: 2,
        vulnerabilidad: 1,
        fisico_extremo: 2,
      };
      // Si tu rango es alto, aumentamos lo difícil (vulnerabilidad, disciplina, confrontación)
      if (currentRank === 'C' || currentRank === 'B') {
        weights.vulnerabilidad = 2;
        weights.disciplina_pura = 3;
      }
      if (currentRank === 'A' || currentRank === 'S' || currentRank === 'NL') {
        weights.vulnerabilidad = 3;
        weights.confrontacion = 3;
        weights.disciplina_pura = 3;
        weights.ruptura = 1;
        weights.curiosidad = 1;
      }
      // No repetir las últimas 2 categorías
      recentCategories.forEach(cat => { if (weights[cat]) weights[cat] = 0; });

      // Build weighted pool
      const pool = [];
      for (const cat in weights) {
        for (let i = 0; i < weights[cat]; i++) pool.push(cat);
      }
      const category = pool[Math.floor(Math.random() * pool.length)] || 'ruptura';

      // Pick template from category, avoiding most recent template
      const templates = QUEST_TEMPLATES[category];
      const tpl = templates[Math.floor(Math.random() * templates.length)];

      return {
        id: 'sysq_' + Date.now(),
        category,
        ...tpl,
        status: 'pending', // pending | accepted | rejected | completed | failed
        issuedAt: new Date().toISOString(),
        date: todayKey(),
      };
    }

    // ============================================================
    // XP & LEVELS — CON FIX DE LVL 0
    // ============================================================
    function xpForLevel(level) {
      // total XP needed to reach this level (cumulative).
      // Starting at level 0, so:
      // lvl 0: 0 XP
      // lvl 1: 100 XP
      // lvl 2: 100 + 400 = 500
      // lvl 3: 500 + 900 = 1400
      let total = 0;
      for (let i = 0; i < level; i++) total += (i + 1) * (i + 1) * 100;
      return total;
    }

    function xpForNextLevel(currentLevel) {
      return (currentLevel + 1) * (currentLevel + 1) * 100;
    }

    function levelFromXP(xp) {
      // Starts at 0
      let lvl = 0;
      while (xpForLevel(lvl + 1) <= xp) lvl++;
      return lvl;
    }

    function progressInLevel(xp) {
      const lvl = levelFromXP(xp);
      const base = xpForLevel(lvl);
      const next = xpForLevel(lvl + 1);
      return {
        level: lvl,
        current: xp - base,
        needed: next - base,
        pct: ((xp - base) / (next - base)) * 100,
      };
    }

    function totalLevel() {
      return Object.keys(STATS).reduce((sum, key) => sum + levelFromXP(state.xp[key]), 0);
    }

    function currentRank() {
      const lvl = totalLevel();
      let rank = RANKS[0];
      for (const r of RANKS) {
        if (lvl >= r.min) rank = r;
      }
      return rank;
    }

    // ============================================================
    // HABIT LOGGING
    // ============================================================
    function allHabits() {
      const all = {};
      for (const stat in HABITS_BASE) all[stat] = [...HABITS_BASE[stat]];
      state.custom.forEach(h => {
        if (all[h.stat]) all[h.stat].push(h);
      });
      return all;
    }

    function findHabit(habitId) {
      const all = allHabits();
      for (const stat in all) {
        const h = all[stat].find(x => x.id === habitId);
        if (h) return { ...h, stat };
      }
      return null;
    }

    function logHabit(habitId, originEvent) {
      if (!log || log.date !== todayKey()) log = getLog(todayKey());
      if (log.habits.includes(habitId)) {
        toast('Ya marcado hoy');
        return;
      }
      const h = findHabit(habitId);
      if (!h) return;

      const currentXP = log.xp_gained[h.stat];
      const cap = STATS[h.stat].cap;
      let xpToAdd = h.xp;
      let capped = false;

      if (currentXP + xpToAdd > cap) {
        xpToAdd = Math.max(0, cap - currentXP);
        capped = true;
      }

      log.habits.push(habitId);
      // Prompt nota (no-blocking, aparece después)
      setTimeout(() => promptHabitNote(habitId), 800);
      if (xpToAdd > 0) {
        log.xp_gained[h.stat] += xpToAdd;
        const prevLevel = levelFromXP(state.xp[h.stat]);
        const prevRank = currentRank().rank;
        state.xp[h.stat] += xpToAdd;
        const newLevel = levelFromXP(state.xp[h.stat]);
        const newRank = currentRank().rank;

        floatXP(`+${xpToAdd}`, STATS[h.stat].color, originEvent);

        if (newLevel > prevLevel) {
          setTimeout(() => showLevelUp(h.stat, newLevel), 600);
        }
        if (newRank !== prevRank) {
          setTimeout(() => showRankUp(newRank), newLevel > prevLevel ? 2500 : 600);
        }
      } else if (capped) {
        toast(`Cap diario de ${STATS[h.stat].name}`);
      }

      updateDailyStreak();
      updateQuestsFromHabit(habitId, h.stat);
      checkDailyIntentBonus();
      checkAchievements();

      saveLog(log);
      persist();
      render();

      // APOD trigger cuando marca astronomía
      if (habitId === 'stars') showAPOD();
    }

    function promptHabitNote(habitId) {
      // Solo preguntar si no es la primera vez (no molestar en el primer uso)
      if (countAllHabits() < 10) return;
      // No preguntar si ya hay nota para este hábito hoy
      if (log.habit_notes?.[habitId]) return;

      const h = findHabit(habitId);
      if (!h) return;

      // Crear mini-prompt no intrusivo (toast con input)
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--sys);padding:12px 16px;border-radius:var(--radius);z-index:260;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;width:320px;animation:fadeIn .25s var(--ease);';
      el.id = 'habitNotePrompt';
      el.innerHTML = `
        <div class="mono" style="font-size:9px;color:var(--sys2);letter-spacing:.2em;margin-bottom:6px;">NOTA · ${escapeHtml(h.label)}</div>
        <input class="input" id="habitNoteInput" placeholder="Opcional: peso, sensación, detalle..." maxlength="140" style="font-size:12px;padding:8px 10px;">
        <div style="display:flex;gap:6px;margin-top:8px;">
          <button class="btn btn-sm" onclick="saveHabitNote('${habitId}')">Guardar</button>
          <button class="btn btn-sm btn-ghost" onclick="document.getElementById('habitNotePrompt')?.remove()">Skip</button>
        </div>
      `;
      document.body.appendChild(el);
      document.getElementById('habitNoteInput')?.focus();
      // Auto-dismiss after 8 seconds
      setTimeout(() => el.remove(), 8000);
    }

    function saveHabitNote(habitId) {
      const input = document.getElementById('habitNoteInput');
      const note = input?.value?.trim();
      if (note) {
        if (!log.habit_notes) log.habit_notes = {};
        log.habit_notes[habitId] = note;
        saveLog(log);
        toast('Nota guardada', 'positive');
      }
      document.getElementById('habitNotePrompt')?.remove();
    }

    function setScrollAM(won) {
      if (!log || log.date !== todayKey()) log = getLog(todayKey());
      if (log.scroll_am !== null) return;
      if (won) {
        log.scroll_am = 'won';
        logHabit('no_scroll_am');
      } else {
        log.scroll_am = 'lost';
        const dis = log.xp_gained.disciplina;
        const penalty = Math.min(10, state.xp.disciplina, dis);
        if (dis >= 10) {
          log.xp_gained.disciplina -= 10;
          state.xp.disciplina = Math.max(0, state.xp.disciplina - 10);
        } else {
          state.xp.disciplina = Math.max(0, state.xp.disciplina - penalty);
          log.xp_gained.disciplina = Math.max(0, log.xp_gained.disciplina - penalty);
        }
        floatXP(`-${penalty}`, 'var(--negative)', null);
        toast('Mañana es otro día', 'danger');
      }
      if (!won && state.streaks.no_scroll_am) {
        state.streaks.no_scroll_am.current = 0;
      } else if (won) {
        const s = state.streaks.no_scroll_am;
        if (s.last !== todayKey()) {
          s.current++;
          if (s.current > s.longest) s.longest = s.current;
          s.last = todayKey();
        }
      }
      saveLog(log);
      persist();
      render();
    }

    function updateDailyStreak() {
      const today = todayKey();
      const s = state.streaks.daily_log;
      if (s.last === today) return;
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const ykey = yesterday.toISOString().slice(0, 10);
      if (s.last === ykey) s.current++;
      else s.current = 1;
      if (s.current > s.longest) s.longest = s.current;
      s.last = today;
    }

    function checkDailyIntentBonus() {
      const di = log.daily_intent;
      if (!di.items.length) return;
      if (di.bonusGiven) return;
      if (di.completed.filter(Boolean).length < di.items.length) return;
      const bonus = Math.floor(25 / 6);
      Object.keys(STATS).forEach(k => state.xp[k] += bonus);
      di.bonusGiven = true;
      setTimeout(() => toast(`+${bonus * 6} XP · bonus daily intent`, 'positive'), 800);
      checkPPEarnings();
    }

    function updateIntent(idx) {
      if (!log || log.date !== todayKey()) log = getLog(todayKey());
      log.daily_intent.completed[idx] = !log.daily_intent.completed[idx];
      checkDailyIntentBonus();
      saveLog(log);
      persist();
      render();
    }

    function saveIntent(items) {
      if (!log || log.date !== todayKey()) log = getLog(todayKey());
      log.daily_intent.items = items.filter(s => s.trim()).slice(0, 5);
      log.daily_intent.completed = log.daily_intent.items.map(() => false);
      log.daily_intent.bonusGiven = false;
      saveLog(log);
      render();
    }

    // ============================================================
    // SISTEMA: Daily Quest lifecycle
    // ============================================================
    function maybeGenerateSysQuest() {
      // Check si necesitamos generar una
      if (!state.uiState.onb_done) return;
      if (state.uiState.sysquest_suspended_until && new Date(state.uiState.sysquest_suspended_until) > new Date()) return;

      const today = todayKey();
      if (state.sysquest && state.sysquest.date === today) return; // ya hay una de hoy

      // Si tenemos una vieja sin resolver, marcarla fallida y archivar
      if (state.sysquest && state.sysquest.date !== today) {
        const old = state.sysquest;
        if (old.status === 'accepted' || old.status === 'pending') {
          old.status = 'failed';
          // aplicar penalización
          const p = old.penalty;
          state.xp[p.stat] = Math.max(0, state.xp[p.stat] - p.xp);
          state.sysquest_history.push(old);
          // Si rechazó/falló 3 días seguidos → suspender 7 días
          const recent = state.sysquest_history.slice(-3);
          if (recent.length === 3 && recent.every(q => q.status === 'failed' || q.status === 'rejected')) {
            const until = new Date();
            until.setDate(until.getDate() + 7);
            state.uiState.sysquest_suspended_until = until.toISOString();
            setTimeout(() => sysToast('EVALUACIÓN SUSPENDIDA · 7 días', 'danger'), 1000);
          }
        } else if (old.status === 'completed' || old.status === 'rejected') {
          state.sysquest_history.push(old);
        }
        state.sysquest = null;
      }

      // Generar nueva si corresponde
      if (!state.sysquest) {
        const rank = currentRank().rank;
        const recentCats = state.sysquest_history.slice(-2).map(q => q.category);
        state.sysquest = generateDailyQuest(rank, recentCats);
        persist();
        setTimeout(() => sysToast('NUEVA QUEST DEL SISTEMA'), 1200);
      }
    }

    function acceptSysQuest() {
      if (!state.sysquest) return;
      state.sysquest.status = 'accepted';
      state.sysquest.acceptedAt = new Date().toISOString();
      persist();
      render();
      sysToast('QUEST ACEPTADA');
    }

    function rejectSysQuest() {
      if (!state.sysquest) return;
      if (!confirm('¿Rechazar la quest del Sistema?\n\nSe aplicará la penalización. Tres rechazos seguidos suspenden la evaluación.')) return;
      state.sysquest.status = 'rejected';
      const p = state.sysquest.penalty;
      state.xp[p.stat] = Math.max(0, state.xp[p.stat] - p.xp);
      state.sysquest_history.push(state.sysquest);
      state.sysquest = null;
      // Check 3 rechazos seguidos
      const recent = state.sysquest_history.slice(-3);
      if (recent.length === 3 && recent.every(q => q.status === 'failed' || q.status === 'rejected')) {
        const until = new Date();
        until.setDate(until.getDate() + 7);
        state.uiState.sysquest_suspended_until = until.toISOString();
        setTimeout(() => sysToast('EVALUACIÓN SUSPENDIDA · 7 días', 'danger'), 1000);
      }
      persist();
      render();
      sysToast('QUEST RECHAZADA', 'danger');
      floatXP(`-${p.xp}`, 'var(--negative)', null);
    }

    function completeSysQuest() {
      if (!state.sysquest || state.sysquest.status !== 'accepted') return;
      if (!confirm('¿Completaste la quest? Solo vos sabés la verdad.\n\nEl Sistema confía en tu honestidad.')) return;

      state.sysquest.status = 'completed';
      state.sysquest.completedAt = new Date().toISOString();

      const r = state.sysquest.reward;
      const prevLevel = levelFromXP(state.xp[r.stat]);
      const prevRank = currentRank().rank;
      state.xp[r.stat] += r.xp;
      const newLevel = levelFromXP(state.xp[r.stat]);
      const newRank = currentRank().rank;

      floatXP(`+${r.xp}`, STATS[r.stat].color, null);
      state.sysquest_history.push(state.sysquest);

      if (newLevel > prevLevel) setTimeout(() => showLevelUp(r.stat, newLevel), 400);
      if (newRank !== prevRank) setTimeout(() => showRankUp(newRank), newLevel > prevLevel ? 2500 : 400);

      ppOnSysquestComplete(state.sysquest);
      checkAchievements();
      state.sysquest = null;
      persist();
      render();
      sysToast('QUEST COMPLETADA', 'positive');
    }

    function weekKey() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - d.getDay() + 1);
      return d.toISOString().slice(0, 10);
    }

    function monthKey() { return new Date().toISOString().slice(0, 7); }

    function generateWeeklyQuests() {
      const wk = weekKey();
      if (state.weekly && state.weekly.week === wk) return;
      const prevIds = state.weekly?.quests?.map(q => q.id) || [];
      const pool = WEEKLY_TEMPLATES.filter(t => !prevIds.includes(t.id));
      const easy = pool.filter(t => t.diff === 'easy');
      const med = pool.filter(t => t.diff === 'med');
      const hard = pool.filter(t => t.diff === 'hard');
      const pick = (arr) => arr.length ? arr[Math.floor(Math.random() * arr.length)] : null;
      const quests = [pick(easy), pick(med), pick(hard)]
        .filter(Boolean)
        .map(t => ({ ...t, progress: 0, completed: false, type: 'weekly' }));
      state.weekly = { week: wk, quests };
      persist();
    }

    function generateMonthlyQuest() {
      const mk = monthKey();
      if (state.monthly && state.monthly.month === mk) return;
      const t = MONTHLY_TEMPLATES[Math.floor(Math.random() * MONTHLY_TEMPLATES.length)];
      state.monthly = { month: mk, ...t, progress: 0, completed: false, type: 'monthly' };
      persist();
    }

    function updateQuestsFromHabit(habitId, stat) {
      const checkQuest = (q) => {
        if (q.completed) return;
        let matched = false;
        if (q.habit && q.habit === habitId) { q.progress++; matched = true; }
        else if (q.stat && q.stat === stat) { q.progress++; matched = true; }
        if (matched && q.progress >= q.target) {
          q.completed = true;
          const perStat = Math.floor(q.xp / 6);
          Object.keys(STATS).forEach(k => state.xp[k] += perStat);
          setTimeout(() => sysToast(`+${q.xp} XP · QUEST COMPLETADA`, 'positive'), 400);
          ppOnQuestComplete(q.type || 'weekly');
        }
      };
      if (state.weekly?.quests) state.weekly.quests.forEach(checkQuest);
      if (state.monthly) checkQuest(state.monthly);
    }

    // DUNGEONS (Boss Fights renombrados)

    function createBoss(boss) {
      boss.id = 'dungeon_' + Date.now();
      boss.createdAt = todayKey();
      boss.completed = false;
      state.bosses.push(boss);
      persist();
      render();
      sysToast('MAZMORRA DESBLOQUEADA');
    }

    function toggleBossStep(bossId, stepIdx) {
      const b = state.bosses.find(x => x.id === bossId);
      if (!b) return;
      b.steps[stepIdx].done = !b.steps[stepIdx].done;
      if (b.steps.every(s => s.done) && !b.completed) {
        b.completed = true;
        b.completedAt = todayKey();
        const dungeonXP = b.doubleReward ? 1600 : 800;
        state.xp[b.stat] += dungeonXP;
        ppOnDungeonComplete();
        setTimeout(() => {
          const newLvl = levelFromXP(state.xp[b.stat]);
          showLevelUp(b.stat, newLvl, true);
          sysToast('MAZMORRA CONQUISTADA', 'positive');
        }, 400);
      }
      persist();
      render();
    }

    function deleteBoss(bossId) {
      state.bosses = state.bosses.filter(x => x.id !== bossId);
      persist();
      render();
    }

    // ============================================================
    // ACHIEVEMENTS
    // ============================================================
    function unlockAchievement(id) {
      if (state.achievements.find(a => a.id === id)) return;
      state.achievements.push({ id, date: todayKey() });
      const ach = ACHIEVEMENTS.find(a => a.id === id);
      if (ach) setTimeout(() => sysToast(`${ach.name.toUpperCase()} · DESBLOQUEADO`, 'positive'), 1000);
      persist();
    }

    function checkAchievements() {
      const has = (id) => state.achievements.find(a => a.id === id);
      if (!has('first_step') && log.habits.filter(h => h !== '__touched').length >= 1) unlockAchievement('first_step');
      if (!has('week_alive') && state.streaks.daily_log.longest >= 7) unlockAchievement('week_alive');
      if (!has('month_alive') && state.streaks.daily_log.longest >= 30) unlockAchievement('month_alive');
      if (!has('streak_30') && state.streaks.daily_log.longest >= 30) unlockAchievement('streak_30');
      if (!has('no_scroll_30') && state.streaks.no_scroll_am.longest >= 30) unlockAchievement('no_scroll_30');
      if (!has('balanced') && Object.keys(STATS).every(k => levelFromXP(state.xp[k]) >= 5)) unlockAchievement('balanced');
      if (!has('level_50') && totalLevel() >= 51) unlockAchievement('level_50');
      if (!has('social_butterfly') && levelFromXP(state.xp.vinculo) >= 10) unlockAchievement('social_butterfly');
      if (!has('first_quest') && state.weekly?.quests?.some(q => q.completed)) unlockAchievement('first_quest');
      if (!has('first_dungeon') && state.bosses.some(b => b.completed)) unlockAchievement('first_dungeon');
      const completedSysQ = state.sysquest_history.filter(q => q.status === 'completed').length;
      if (!has('first_sysquest') && completedSysQ >= 1) unlockAchievement('first_sysquest');
      if (!has('sysquest_7') && completedSysQ >= 7) unlockAchievement('sysquest_7');
    }

    function getEmptyDaysCount() {
      let count = 0;
      for (let i = 1; i <= 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const l = load(K.log(key), null);
        if (!l || l.habits.length === 0) count++;
        else break;
      }
      return count;
    }

    function generateWeeklyReport() {
      const today = new Date();
      if (today.getDay() !== 0) return null; // solo domingos

      const wk = weekKey();
      // No generar si ya existe para esta semana
      if (state.weeklyReports.find(r => r.week === wk)) return null;

      const oaa = getCurrentOAA();
      if (!oaa || oaa.total === null) return null;

      const logs7 = getRecentLogs(7);
      const logs30 = getRecentLogs(30);
      const rank = currentRank();
      const cls = state.currentClass || 'D';

      // Calcular cambios vs semana anterior
      const hist = state.oaa_history || [];
      const prevWeek = hist.length >= 8 ? hist[hist.length - 8] : null;
      const dimChange = {};
      const dims = ['academico', 'fisico', 'mental', 'social', 'identidad'];
      dims.forEach(d => {
        dimChange[d] = prevWeek?.dims?.[d] != null && oaa.dims[d] != null
          ? oaa.dims[d] - prevWeek.dims[d]
          : 0;
      });
      const totalChange = prevWeek?.total != null ? oaa.total - prevWeek.total : 0;

      // === OBSERVACIONES ===
      const observations = [];

      // 1. Caída significativa en alguna dimensión
      dims.forEach(d => {
        if (dimChange[d] < -1.5) {
          const dimName = { academico: 'Académico', fisico: 'Físico', mental: 'Mental', social: 'Social', identidad: 'Identidad' }[d];
          // Intentar detectar causa
          let causa = '';
          if (d === 'fisico') {
            const gymDays = logs7.filter(l => l.habits.includes('gym')).length;
            if (gymDays <= 1) causa = ` Causa probable: ${gymDays === 0 ? 'ausencia total de gym' : 'solo 1 día de gym'} esta semana.`;
          }
          if (d === 'social') {
            const vincDays = logs7.filter(l => l.habits.some(h => ['call', 'meal', 'msg', 'new_person', 'compliment'].includes(h))).length;
            if (vincDays <= 1) causa = ` Causa probable: ${vincDays === 0 ? 'cero' : '1'} interacción social registrada.`;
          }
          observations.push(`Caída detectada en ${dimName} (${numToLetter(oaa.dims[d] + Math.abs(dimChange[d]))} → ${numToLetter(oaa.dims[d])}).${causa}`);
        }
      });

      // 2. Patrón de rechazo de sysquests
      const recentQ = state.sysquest_history.filter(q => daysSince(q.date) <= 7);
      if (recentQ.length >= 2) {
        const rejected = recentQ.filter(q => q.status === 'rejected');
        if (rejected.length >= 2) {
          const categories = rejected.map(q => q.category);
          const uniqueCats = [...new Set(categories)];
          if (uniqueCats.length === 1) {
            const catName = { ruptura: 'Ruptura', confrontacion: 'Confrontación', disciplina_pura: 'Disciplina', curiosidad: 'Curiosidad', vulnerabilidad: 'Vulnerabilidad', fisico_extremo: 'Físico Extremo' }[uniqueCats[0]] || uniqueCats[0];
            observations.push(`Patrón persistente: ${rejected.length} de ${recentQ.length} quests rechazadas pertenecen a categoría ${catName}. Esto sugiere evitación deliberada de esa área.`);
          }
        }
      }

      // 3. Récord de scroll AM
      if (state.streaks.no_scroll_am.current >= 7 && state.streaks.no_scroll_am.current === state.streaks.no_scroll_am.longest) {
        observations.push(`Récord personal: ${state.streaks.no_scroll_am.current} días consecutivos sin scroll AM.`);
      }

      // 4. Daily intent completion
      let intentDone = 0, intentTotal = 0;
      logs7.forEach(l => {
        if (l.daily_intent?.items?.length > 0) {
          intentTotal += l.daily_intent.items.length;
          intentDone += (l.daily_intent.completed || []).filter(Boolean).length;
        }
      });
      const intentRate = intentTotal > 0 ? Math.round((intentDone / intentTotal) * 100) : null;
      if (intentRate !== null) {
        let intentObs = `Daily intent completion: ${intentRate}%.`;
        // Comparar con mes anterior
        let monthIntentDone = 0, monthIntentTotal = 0;
        logs30.forEach(l => {
          if (l.daily_intent?.items?.length > 0) {
            monthIntentTotal += l.daily_intent.items.length;
            monthIntentDone += (l.daily_intent.completed || []).filter(Boolean).length;
          }
        });
        const monthRate = monthIntentTotal > 0 ? Math.round((monthIntentDone / monthIntentTotal) * 100) : null;
        if (monthRate !== null && Math.abs(intentRate - monthRate) > 10) {
          intentObs += ` Comparativo mes: ${monthRate}%.`;
          if (intentRate < monthRate - 15) {
            intentObs += ` Hipótesis: estás definiendo intenciones que exceden tu energía operativa.`;
          }
        }
        observations.push(intentObs);
      }

      // 5. Subida notable
      dims.forEach(d => {
        if (dimChange[d] > 1.5) {
          const dimName = { academico: 'Académico', fisico: 'Físico', mental: 'Mental', social: 'Social', identidad: 'Identidad' }[d];
          observations.push(`Progreso significativo en ${dimName}: +${dimChange[d].toFixed(1)} niveles esta semana.`);
        }
      });

      // 6. Streak diario
      if (state.streaks.daily_log.current >= 14) {
        observations.push(`Streak activo de ${state.streaks.daily_log.current} días. Consistencia operativa sostenida.`);
      }

      // 7. Dimensión descuidada
      const lowest = dims.reduce((a, b) => (oaa.dims[a] || 0) < (oaa.dims[b] || 0) ? a : b);
      const highest = dims.reduce((a, b) => (oaa.dims[a] || 0) > (oaa.dims[b] || 0) ? a : b);
      if (oaa.dims[highest] - oaa.dims[lowest] > 4) {
        const loName = { academico: 'Académico', fisico: 'Físico', mental: 'Mental', social: 'Social', identidad: 'Identidad' }[lowest];
        observations.push(`Desbalance detectado: ${loName} está ${Math.round(oaa.dims[highest] - oaa.dims[lowest])} niveles por debajo de tu dimensión más fuerte.`);
      }

      // Limitar a 4 observaciones
      const finalObs = observations.slice(0, 4);

      // === RECOMENDACIONES ===
      const recommendations = [];

      // Recomendación basada en observaciones
      if (intentRate !== null && intentRate < 60) {
        recommendations.push('Reducir daily intents a 2 ítems durante 7 días. Re-evaluar el próximo domingo.');
      }
      const rejectedCats = recentQ.filter(q => q.status === 'rejected').map(q => q.category);
      if (rejectedCats.length >= 2) {
        recommendations.push(`Aceptar la próxima quest de ${rejectedCats[0] || 'la categoría rechazada'}${ppEnabled() ? ' o gastar 80 PP para skip.' : '.'}`);
      }
      if (dimChange.fisico < -1) {
        recommendations.push('Priorizar al menos 3 sesiones de actividad física esta semana.');
      }
      if (dimChange.social < -1) {
        recommendations.push('Agendar al menos 1 interacción presencial (meal o call) esta semana.');
      }
      if (recommendations.length === 0) {
        recommendations.push('Mantener el ritmo actual. Sin ajustes urgentes detectados.');
      }

      // === PP summary ===
      const ppWeek = state.ppLog.filter(l => daysSince(l.date) <= 7);
      const ppEarned = ppWeek.filter(l => l.type === 'earn').reduce((s, l) => s + l.amount, 0);
      const ppSpent = ppWeek.filter(l => l.type === 'spend').reduce((s, l) => s + Math.abs(l.amount), 0);

      // Weather context (if available)
      let weatherNote = '';

      const report = {
        week: wk,
        weekNumber: getWeekNumber(),
        year: today.getFullYear(),
        generatedAt: new Date().toISOString(),
        rank: rank.rank,
        class: classCode(cls),
        level: totalLevel(),
        oaa: {
          total: oaa.total,
          totalLetter: numToLetter(oaa.total),
          dims: {},
          totalChange: totalChange,
        },
        observations: finalObs,
        recommendations: recommendations.slice(0, 2),
        pp: { balance: state.pp, earned: ppEarned, spent: ppSpent },
        streak: state.streaks.daily_log.current,
        habitsThisWeek: logs7.reduce((s, l) => s + l.habits.filter(h => h !== '__touched').length, 0),
        feedbackGiven: false,
        resonatedObs: [],
      };

      dims.forEach(d => {
        report.oaa.dims[d] = {
          value: oaa.dims[d],
          letter: oaa.dims[d] !== null ? numToLetter(oaa.dims[d]) : '—',
          change: dimChange[d],
        };
      });

      state.weeklyReports.push(report);
      // Mantener últimos 52 informes (1 año)
      if (state.weeklyReports.length > 52) state.weeklyReports.shift();
      persist();

      return report;
    }

    function getWeekNumber() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
      const week1 = new Date(d.getFullYear(), 0, 4);
      return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    }

    function getSmartSuggestion() {
      // Solo Clase B+
      const classIdx = CLASS_ORDER.indexOf(state.currentClass || 'D');
      if (classIdx < CLASS_ORDER.indexOf('B')) return null;

      // Solo una sugerencia por día
      if (state.uiState.smart_suggestion_today === todayKey()) return null;

      const today = new Date();
      const dayOfWeek = today.getDay(); // 0=dom, 1=lun...
      const hour = today.getHours();

      // Analizar los últimos 30 días para detectar patrón por día de la semana
      const logs = getRecentLogs(30);
      const dayPatterns = {};

      // Contar hábitos por día de la semana
      logs.forEach(l => {
        const d = new Date(l.date);
        const dow = d.getDay();
        if (!dayPatterns[dow]) dayPatterns[dow] = {};
        l.habits.forEach(h => {
          if (h === '__touched') return;
          dayPatterns[dow][h] = (dayPatterns[dow][h] || 0) + 1;
        });
      });

      // Para hoy: ¿cuál hábito se hizo más veces en este día de la semana?
      const todayPattern = dayPatterns[dayOfWeek];
      if (!todayPattern) return null;

      // Encontrar el hábito dominante (más de 3 veces en las últimas ~4 semanas de este día)
      const entries = Object.entries(todayPattern).sort((a, b) => b[1] - a[1]);
      if (entries.length === 0) return null;

      const [topHabit, count] = entries[0];
      if (count < 3) return null; // no hay patrón fuerte

      // ¿Ya se marcó hoy?
      if (log.habits.includes(topHabit)) return null;

      const habit = findHabit(topHabit);
      if (!habit) return null;

      const dayNames = ['domingos', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábados'];

      return {
        habit: topHabit,
        label: habit.label,
        stat: habit.stat,
        count,
        dayName: dayNames[dayOfWeek],
        message: `${habit.label} registrado en ${count} de los últimos ${Math.min(4, Math.floor(logs.length / 7))} ${dayNames[dayOfWeek]}. Hoy aún sin actividad.`,
      };
    }

    function maybeAyanokojiMessage() {
      const daysSince = daysSinceCreated();
      if (daysSince < 90) return;

      // Cada 90 días
      const lastMsg = state.ayanokoji.lastMessage;
      if (lastMsg) {
        const daysSinceLast = Math.floor((new Date() - new Date(lastMsg)) / (1000 * 60 * 60 * 24));
        if (daysSinceLast < 90) return;
      }

      // No mostrar si ya se mostró hoy
      if (state.uiState.ayanokoji_shown_today === todayKey()) return;

      const oaa = getCurrentOAA();
      if (!oaa || oaa.total === null) return;

      // Filtrar mensajes ya mostrados
      const shownIds = state.ayanokoji.messages.map(m => m.id);
      const candidates = AYANOKOJI_MESSAGES.filter(m => !shownIds.includes(m.id));
      if (candidates.length === 0) return;

      // Evaluar condiciones
      const matching = candidates.filter(m => {
        try { return m.condition(oaa, state); }
        catch (e) { return false; }
      });

      if (matching.length === 0) return;

      // Elegir uno (priorizar los más específicos — últimos en la lista)
      const chosen = matching[matching.length - 1];

      state.ayanokoji.lastMessage = todayKey();
      state.ayanokoji.messages.push({ id: chosen.id, date: todayKey() });
      state.uiState.ayanokoji_shown_today = todayKey();
      persist();

      // Mostrar después de un delay
      setTimeout(() => showAyanokojiMessage(chosen), 3000);
    }

      if (oaa?.dims?.fisico !== null && oaa.dims.fisico < 9) {
        questions.push({
          area: 'DIMENSIÓN: FÍSICO',
          question: '¿Tu cuerpo está siendo un vehículo o un obstáculo esta semana?',
          context: 'Tu OAA Físico cayó. La pregunta no es si entrenaste — es si estás tratando tu cuerpo como herramienta.',
        });
      }

      if (oaa?.dims?.identidad !== null && oaa.dims.identidad < 9) {
        questions.push({
          area: 'DIMENSIÓN: IDENTIDAD',
          question: '¿Qué harías mañana si no existiera esta app?',
          context: 'Tu Identidad mide coherencia entre declaraciones y acciones. Si la respuesta a esta pregunta es "lo mismo", vas bien.',
        });
      }

      if (oaa?.dims?.academico !== null && oaa.dims.academico >= 12) {
        questions.push({
          area: 'DIMENSIÓN: ACADÉMICO',
          question: '¿Estás aprendiendo para aplicar o para acumular?',
          context: 'Tu input intelectual es alto. El Sistema pregunta si la salida es proporcional a la entrada.',
        });
      }

      const streak = state.streaks.daily_log.current;
      if (streak >= 14) {
        questions.push({
          area: 'PATRÓN: CONSISTENCIA',
          question: '¿Seguís haciendo esto porque te importa o porque no querés romper el streak?',
          context: `Llevás ${streak} días consecutivos. La inercia positiva es real, pero puede enmascarar agotamiento.`,
        });
      }

      if (state.bosses.filter(b => !b.completed).length >= 2) {
        questions.push({
          area: 'PATRÓN: MAZMORRAS',
          question: '¿Estás forjando mazmorras que realmente querés completar, o las que creés que deberías?',
          context: 'Tenés ' + state.bosses.filter(b => !b.completed).length + ' mazmorras abiertas. El Sistema nota la diferencia entre ambición y deseo.',
        });
      }

      // Default
      questions.push({
        area: 'PATRÓN: GENERAL',
        question: '¿Si pudieras cambiar una sola cosa de cómo estás usando este sistema, cuál sería?',
        context: 'A veces la pregunta más simple es la más útil. No la respondas rápido.',
      });

      // Elegir una aleatoria del pool
      return questions[Math.floor(Math.random() * questions.length)];
    }

    function renderHeatmap() {
      const $hm = document.getElementById('heatmap');
      if (!$hm) return;
      let html = '';
      for (let i = 34; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const l = load(K.log(key), null);
        const count = l ? l.habits.filter(h => h !== '__touched').length : 0;
        let lvl = 0;
        if (count >= 1) lvl = 1;
        if (count >= 3) lvl = 2;
        if (count >= 5) lvl = 3;
        if (count >= 8) lvl = 4;
        html += `<div class="heatmap-cell" data-lvl="${lvl}" title="${key}: ${count}"></div>`;
      }
      $hm.innerHTML = html;
    }

    let oaaLineChart = null;
    function renderOAALine() {
      const canvas = document.getElementById('oaaLineChart');
      if (!canvas) return;
      const hist = (state.oaa_history || []).filter(h => h.total !== null);
      if (hist.length < 7) return;

      // Agrupar por semana (tomar el último de cada semana)
      const weeks = [];
      for (let i = 0; i < hist.length; i += 7) {
        const chunk = hist.slice(i, i + 7);
        const last = chunk[chunk.length - 1];
        weeks.push(last);
      }
      const recent = weeks.slice(-12);
      const labels = recent.map(h => h.date.slice(5));
      const data = recent.map(h => h.total);

      const isLight = document.body.dataset.theme === 'light';
      const gridColor = isLight ? 'rgba(0,0,0,.06)' : 'rgba(139,92,246,.12)';

      if (oaaLineChart) oaaLineChart.destroy();
      oaaLineChart = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data,
            borderColor: '#8B5CF6',
            backgroundColor: 'rgba(139,92,246,.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#A78BFA',
            borderWidth: 2,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: gridColor }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 9, family: 'JetBrains Mono' } } },
            y: { min: 0, max: 14, grid: { color: gridColor }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 9, family: 'JetBrains Mono' }, callback: (v) => ['E−', 'E', 'E+', 'D−', 'D', 'D+', 'C−', 'C', 'C+', 'B−', 'B', 'B+', 'A−', 'A', 'A+'][v] || '' } },
          },
        },
      });
    }

    let xpStackChart = null;
    function renderXPStack() {
      const canvas = document.getElementById('xpStackChart');
      if (!canvas) return;

      const days = 14;
      const labels = [];
      const datasets = {};
      Object.keys(STATS).forEach(k => { datasets[k] = []; });

      for (let i = days - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        labels.push(key.slice(5));
        const dayLog = load(K.log(key), null);
        Object.keys(STATS).forEach(k => {
          datasets[k].push(dayLog ? (dayLog.xp_gained?.[k] || 0) : 0);
        });
      }

      const isLight = document.body.dataset.theme === 'light';
      const gridColor = isLight ? 'rgba(0,0,0,.06)' : 'rgba(139,92,246,.12)';

      const colors = {
        fuerza: '#FF4444', sabiduria: '#FFB020', disciplina: '#4ADE80',
        alma: '#60A5FA', vinculo: '#F472B6', juego: '#C084FC',
      };

      if (xpStackChart) xpStackChart.destroy();
      xpStackChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: Object.keys(STATS).map(k => ({
            label: STATS[k].name,
            data: datasets[k],
            backgroundColor: colors[k] + '88',
            borderColor: colors[k],
            borderWidth: 1,
          })),
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { stacked: true, grid: { display: false }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 8, family: 'JetBrains Mono' } } },
            y: { stacked: true, grid: { color: gridColor }, ticks: { color: isLight ? '#76728F' : '#6A6483', font: { size: 9 } } },
          },
        },
      });
    }

    function saveBoss() {
      const name = document.getElementById('bossName').value.trim();
      if (!name) { toast('Falta nombre'); return; }
      const statBtn = document.querySelector('#bossStat .select-opt.selected');
      const stat = statBtn?.dataset.val || 'alma';
      const steps = Array.from(document.querySelectorAll('.boss-step-input'))
        .map(i => i.value.trim()).filter(Boolean);
      if (steps.length < 2) { toast('Mínimo 2 etapas'); return; }
      const reward = document.getElementById('bossReward').value.trim();
      const active = state.bosses.filter(b => !b.completed).length;
      if (active >= 2) { toast('Máx 2 mazmorras activas'); return; }
      createBoss({
        name,
        stat,
        steps: steps.map(s => ({ name: s, done: false })),
        reward,
      });
      closeModal();
    }

    function exportData() {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('mo_')) data[k] = localStorage.getItem(k);
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `momentum_${todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Backup descargado', 'positive');
    }

    function importData() {
      const txt = document.getElementById('importJSON').value.trim();
      if (!txt) return;
      try {
        const data = JSON.parse(txt);
        if (!confirm('Esto reemplaza tus datos actuales. ¿Continuar?')) return;
        Object.keys(data).forEach(k => {
          if (k.startsWith('mo_')) localStorage.setItem(k, data[k]);
        });
        location.reload();
      } catch (e) {
        toast('JSON inválido', 'danger');
      }

    // FOCUS TIMER

    window.focusTimer = {
      duration: 25 * 60,
      remaining: 25 * 60,
      running: false,
      startedAt: null,
      mode: 25,
      interval: null,
    };

    function setTimerMode(mins) {
      if (focusTimer.running) return;
      focusTimer.mode = mins;
      focusTimer.duration = mins * 60;
      focusTimer.remaining = mins * 60;
      updateTimerUI();
    }

    function toggleTimer() {
      if (focusTimer.running) pauseTimer();
      else startTimer();
    }

    function startTimer() {
      focusTimer.running = true;
      focusTimer.startedAt = Date.now();
      focusTimer.interval = setInterval(tickTimer, 1000);
      updateTimerUI();
    }

    function pauseTimer() {
      focusTimer.running = false;
      if (focusTimer.interval) clearInterval(focusTimer.interval);
      updateTimerUI();
    }

    function resetTimer() {
      if (focusTimer.interval) clearInterval(focusTimer.interval);
      focusTimer.running = false;
      focusTimer.remaining = focusTimer.duration;
      updateTimerUI();
    }

    function tickTimer() {
      focusTimer.remaining--;
      if (focusTimer.remaining <= 0) completeTimer();
      else updateTimerUI();
    }

    function completeTimer() {
      clearInterval(focusTimer.interval);
      focusTimer.running = false;
      focusTimer.remaining = 0;
      updateTimerUI();
      const habitId = focusTimer.mode >= 90 ? 'deep_work' : 'pomo';
      if (!log.habits.includes(habitId)) logHabit(habitId);
      else toast(`Sesión completada`, 'positive');
      focusTimer.remaining = focusTimer.duration;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    function updateTimerUI() {
      const $t = document.getElementById('timerTime');
      const $m = document.getElementById('timerMode');
      const $c = document.getElementById('timerCircle');
      const $b = document.getElementById('timerStartBtn');
      if (!$t) return;
      const mm = Math.floor(focusTimer.remaining / 60).toString().padStart(2, '0');
      const ss = (focusTimer.remaining % 60).toString().padStart(2, '0');
      $t.textContent = `${mm}:${ss}`;
      $m.textContent = focusTimer.mode >= 90 ? 'Deep Work' : 'Pomodoro';
      $c.classList.toggle('running', focusTimer.running);
      $b.innerHTML = focusTimer.running ? '⏸ Pausar' : '▶ Iniciar';
    }

        el.style.left = (r.left + r.width / 2 - 20) + 'px';

    function escapeHtml(s) {
      if (typeof s !== 'string') return '';
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function countAllHabits() {
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('mo_log_')) {
          try {
            const l = JSON.parse(localStorage.getItem(k));
            count += l.habits.filter(h => h !== '__touched').length;
          } catch (e) { }
        }
      }
      return count;
    }

    function daysSinceCreated() {
      if (!state.user.createdAt) return 1;
      const start = new Date(state.user.createdAt);
      const now = new Date();
      return Math.max(1, Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1);
    }

    function maybeRemindReflection() {
      if (log.reflection?.closed) return;
      const hour = new Date().getHours();
      if (hour >= 21 && hour <= 23 && state.uiState.reflection_reminded_today !== todayKey()) {
        state.uiState.reflection_reminded_today = todayKey();
        persist();
        setTimeout(() => sysToast('CIERRE DE DÍA · ajustes'), 2000);
      }
      if (state.uiState.reflection_reminded_today && state.uiState.reflection_reminded_today !== todayKey()) {
        state.uiState.reflection_reminded_today = null;
        persist();
      }
    }

        if (state.user?.settings?.sysquest_enabled !== false) {
          maybeGenerateSysQuest();
        }
        // V3: recalcular OAA y clase
        getCurrentOAA();
        updateClassIfChanged();
        ppWeeklyOAABonus();
        // Check pause mode expiry
        if (state.pause?.active && new Date(state.pause.until) < new Date()) {
          state.pause = null;
          persist();
          sysToast('PAUSE MODE FINALIZADO');
        }
        applyTheme();
        maybeRemindReflection();
        // V3.3: Informe semanal
        maybeGenerateReport();
        // V3.3: Layer Ayanokoji
        maybeAyanokojiMessage();
        // V3.4: Final Exam anual
        maybeShowFinalExam();
        // V3.1: API integrations (async, non-blocking)
        if (state.user?.settings?.chess?.username) autoLogChess();
        fetchDailyQuote();
        maybeGistBackup();
      }
      render();
    }

    init();

    // ============================================================
    // SERVICE WORKER REGISTRATION + AUTO-UPDATE
    // ============================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update();
            });
            setInterval(() => reg.update(), 30 * 60 * 1000);
            reg.addEventListener('updatefound', () => {
              const newSW = reg.installing;
              if (!newSW) return;
              newSW.addEventListener('statechange', () => {
                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                  sysToast('VERSIÓN NUEVA · ACTUALIZANDO');
                  newSW.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          })
          .catch((err) => console.warn('SW reg failed:', err));
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }

    function render() {

      $app.innerHTML = html;
    }

      switch (state.page) {
        case 'home': return `<div class="page active">${renderHome()}</div>`;

        default: return `<div class="page active">${renderHome()}</div>`;
      }
    }

            <div class="sysnotif-corner bl"></div>

          html += `

        </div>
      `;
        }
      }

      // Check-in días vacíos
      const emptyDays = getEmptyDaysCount();
      if (emptyDays >= 5) {
        html += `
      <div class="checkin serious">
        <div class="checkin-tag">REGISTRO INTERRUMPIDO</div>

          <button class="btn btn-sm btn-ghost" onclick="dismissCheckin()">Entendido</button>
        </div>
      </div>
    `;
      } else if (emptyDays >= 3) {
        html += `
      <div class="checkin">
        <div class="checkin-tag">ATENCIÓN</div>
        <div class="checkin-title">${emptyDays} días sin actividad</div>
        <div class="checkin-text">¿Ajustás el sistema o necesitás un día tranquilo? Está bien.</div>

        </div>
      </div>
    `;
      }

      // Stat oxidada
      if (new Date().getDay() === 0) {
        const levels = Object.keys(STATS).map(k => ({ k, lvl: levelFromXP(state.xp[k]) }));

          </div>

      }

      // Daily Intent
      const di = log.daily_intent;
      html += `
    <div class="card">

        <span class="card-action" onclick="openModal('intent')">${di.items.length ? 'editar' : 'definir'}</span>

            <div class="intent-item ${di.completed[i] ? 'done' : ''}" onclick="updateIntent(${i})">

              <div class="intent-text">${escapeHtml(item)}</div>
            </div>
          `).join('')

      // Stats
      html += `

    </div>

      html += renderHabits();

      if (quote && quote.date === todayKey()) {

    function renderSysQuest(q) {

        completed: 'QUEST COMPLETADA',
        rejected: 'QUEST RECHAZADA',
        failed: 'QUEST FALLIDA'
      }[q.status] || '';

      const statusClass = q.status === 'accepted' ? 'accepted' : q.status === 'completed' ? 'completed' : q.status === 'failed' || q.status === 'rejected' ? 'failed' : '';

      const rank = currentRank();
      return `
    <div class="sysnotif ${statusClass}">
      <div class="sysnotif-corner tl"></div>
      <div class="sysnotif-corner tr"></div>
      <div class="sysnotif-corner bl"></div>
      <div class="sysnotif-corner br"></div>
      <div class="sysnotif-head">
        <span class="sysnotif-icon">${svgIcon('warn', 'icon')}</span>
        <span class="sysnotif-tag">${statusTag}</span>
        <span class="sysnotif-rank">RANK ${rank.rank}</span>
      </div>
      <div class="sysnotif-body">
        <div class="sysnotif-title">${escapeHtml(q.title)}</div>

            <div class="sysnotif-stat-val">+${q.reward.xp} ${STATS[q.reward.stat].name}</div>
          </div>

            <div class="sysnotif-stat-label">Penalización</div>
            <div class="sysnotif-stat-val">−${q.penalty.xp} ${STATS[q.penalty.stat].name}</div>
          </div>
        </div>
      </div>
      ${q.status === 'pending' ? `
        <div class="sysnotif-actions">
          <button class="btn btn-block" onclick="acceptSysQuest()">Aceptar</button>
          <button class="btn btn-ghost btn-sm" onclick="rejectSysQuest()">Rechazar</button>
          ${ppEnabled() ? `<button class="btn btn-ghost btn-sm" onclick="ppQuestReroll()" title="150 PP">⟳ Reroll</button>` : ''}

      ` : q.status === 'accepted' ? `

        html += `

          const capped = !done && gained >= cap;
          return `
              <button class="habit-chip ${done ? 'done' : ''} ${capped ? 'capped' : ''}" onclick="logHabit('${h.id}', event)">

          <div class="quest dungeon completed">
            <div class="quest-head">
              <div class="quest-name">${svgIcon('trophy', 'icon icon-sm')} ${escapeHtml(b.name)}</div>
              <div class="quest-xp" style="font-size:11px;color:var(--ink3);font-family:var(--font-mono);">${b.completedAt}</div>
            </div>
            <div class="quest-progress">${STATS[b.stat].name} · +800 XP</div>
            ${b.reward ? `<div class="quest-reward">◆ ${escapeHtml(b.reward)}</div>` : ''}
          </div>
        `).join('')}
      </div>
    `;
      }

      // Historial sysquests
      const sysHist = state.sysquest_history.slice(-8).reverse();
      if (sysHist.length) {
        html += `
      <div class="card">
        <div class="card-title"><span class="card-title-text">Quest log · sistema</span></div>
        ${sysHist.map(q => {
          const ic = q.status === 'completed' ? 'check' : 'x';
          const cl = q.status === 'completed' ? 'var(--positive)' : 'var(--negative)';
          return `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:12px;">
              <span style="color:${cl}">${svgIcon(ic, 'icon icon-sm')}</span>
              <span style="flex:1;">${escapeHtml(q.title)}</span>
              <span class="mono" style="font-size:9px;color:var(--ink3);">${q.date.slice(5)}</span>
            </div>
          `;
        }).join('')}
      </div>
    `;
      }

      // Notas recientes
      html += renderRecentNotes();

      return html;
    }

    function renderRecentNotes() {
      let notes = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        const dayLog = load(K.log(key), null);
        if (dayLog && dayLog.habit_notes) {
          Object.entries(dayLog.habit_notes).forEach(([hId, note]) => {
            const h = findHabit(hId);
            if (h) notes.push({ date: key, label: h.label, note: note, color: STATS[h.stat].color });
          });
        }
      }
      if (notes.length === 0) return '';
      return `
        <div class="card">
          <div class="card-title"><span class="card-title-text">Notas recientes</span></div>
          ${notes.map(n => `
            <div style="padding:8px 0;border-bottom:1px solid var(--border);">
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;">
                <span style="font-size:11px;color:${n.color};">${n.label}</span>
                <span class="mono" style="font-size:9px;color:var(--ink3);">${n.date.slice(5)}</span>
              </div>
              <div style="font-size:12px;color:var(--ink);font-style:italic;">"${escapeHtml(n.note)}"</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ============================================================
    // V3.4 — FINAL EXAM & WIDGET
    // ============================================================

    function maybeShowFinalExam() {
      if (!state.creationDate) return;
      const today = new Date();
      const creation = new Date(state.creationDate);
      const diffDays = Math.floor((today - creation) / (1000 * 60 * 60 * 24));

      // Solo mostrar en aniversarios exactos de 365 días (con margen de 3 días)
      if (diffDays > 0 && diffDays % 365 <= 3) {
        const year = Math.floor(diffDays / 365);
        const examKey = `final_exam_y${year}`;
        if (!state.achievements.find(a => a.id === examKey)) {
          // Grant achievement to not show again
          state.achievements.push({ id: examKey, date: todayKey() });
          persist();
          setTimeout(() => openModal('final_exam'), 2000);
        }
      }
    }

    function modalFinalExam() {
      const activeDays = state.streaks.daily_log.longest || 0; // Aproximación
      const xpTotal = Object.values(state.xp).reduce((a, b) => a + b, 0);
      const rank = currentRank().rank;
      const bossCount = state.bosses.filter(b => b.completed).length;

      return `
        <div class="modal-handle"></div>
        <div class="modal-tag" style="color:var(--sys);">EVALUACIÓN ANUAL</div>
        <div class="modal-title">Final Exam</div>
        <div style="font-size:13px;color:var(--ink2);margin-bottom:16px;line-height:1.5;">
          Ha pasado un año desde que iniciaste el Sistema. Un ciclo orbital completo.<br><br>
          En este tiempo, no te has limitado a marcar casillas. Has acumulado <span style="color:var(--sys2);">${xpTotal} XP</span>,
          alcanzado el Rango <span style="color:var(--sys2);">${rank}</span>, y conquistado ${bossCount} mazmorras.<br><br>
          La consistencia es la única métrica que no miente. El Sistema ha registrado tu evolución y validado tus resultados.
          Avanza al siguiente ciclo con intención.
        </div>
        <div style="text-align:center;padding:16px;background:var(--sys-glow);border-radius:var(--rsm);margin-bottom:16px;">
          <div class="mono" style="font-size:10px;color:var(--sys2);letter-spacing:.2em;">ESTATUS ACTUAL</div>
          <div class="display" style="font-size:32px;color:var(--sys);">${state.user.class || 'D'}</div>
        </div>
        <button class="btn btn-block" onclick="closeModal()">Recibido</button>
      `;
    }

    async function exportStatusWidget() {
      // Usar html2canvas para capturar la ventana de Character (app container)
      // Como no tenemos la librería cargada por defecto, usamos un fallback básico
      // (En una PWA real, cargaríamos html2canvas dinámicamente)
      toast('Generando widget...', 'neutral');
      try {
        if (!window.html2canvas) {
          const script = document.createElement('script');
          script.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
          document.body.appendChild(script);
          await new Promise(r => script.onload = r);
        }
        const el = document.getElementById('app');
        const canvas = await window.html2canvas(el, { backgroundColor: document.body.dataset.theme === 'light' ? '#F8F9FA' : '#0D0E15', scale: 2 });
        const dataUrl = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `MomentumOS_Status_${todayKey()}.png`;
        a.click();
        toast('Widget exportado exitosamente', 'positive');
      } catch (e) {
        toast('Error al generar widget', 'negative');
        console.error(e);
      }
    }

    function renderCharacter() {
      const totalXP = Object.keys(STATS).reduce((s, k) => s + state.xp[k], 0);
      const totalHabits = countAllHabits();
      const daysActive = daysSinceCreated();
      const rank = currentRank();
      let html = `
    <div class="status-window">
      <div class="status-title">▸ CHARACTER SHEET</div>
      <div style="text-align:center;margin-bottom:18px;">
        <div class="mono" style="font-size:10px;color:var(--ink3);letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px;">${rank.name}</div>
        <div class="display" style="font-size:48px;color:${rank.color};text-shadow:0 0 12px currentColor;line-height:1;">${escapeHtml(state.user.name)}</div>
        <div class="mono" style="font-size:11px;color:var(--sys2);letter-spacing:.2em;margin-top:6px;">RANK ${rank.rank} · LV ${totalLevel()}</div>
      </div>
      <div class="status-grid">
        <div>
          <div class="status-row-h">XP total</div>
          <div class="status-row-v sys">${totalXP.toLocaleString()}</div>
        </div>
        <div>
          <div class="status-row-h">Días activo</div>
          <div class="status-row-v">${daysActive}</div>
        </div>
        <div>
          <div class="status-row-h">Hábitos completados</div>
          <div class="status-row-v">${totalHabits}</div>
        </div>
        <div>
          <div class="status-row-h">Logros</div>
          <div class="status-row-v">${state.achievements.length}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="card-title-text">Atributos detallados</span></div>
      ${Object.keys(STATS).map(k => {
        const p = progressInLevel(state.xp[k]);
        return `
          <div class="stat-row">
            <div class="stat-icon" style="color:${STATS[k].color}">${svgIcon(STATS[k].icon)}</div>
            <div class="stat-body">
              <div class="stat-head">
                <span class="stat-name">${STATS[k].name}</span>
                <span class="stat-lvl" style="color:${STATS[k].color}">LV ${p.level}</span>
              </div>
              <div class="stat-bar">
                <div class="stat-fill" style="width:${p.pct}%;background:${STATS[k].color}"></div>
              </div>
              <div class="stat-xp">${state.xp[k].toLocaleString()} XP · falta ${p.needed - p.current} para LV ${p.level + 1}</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>

    ${renderTalentsSection()}
    ${renderExamHistory()}

    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="openModal('export')">${svgIcon('download', 'icon')} Backup</button>
      <button class="btn btn-ghost" style="flex:1;" onclick="exportStatusWidget()">${svgIcon('hexagon', 'icon')} Widget PNG</button>
    </div>
  `;
      return html;
    }

    // ============================================================
    // V3.4 — CALENDAR VIEW
    // ============================================================

    function renderCalendar() {
      const now = new Date();
      const viewMonth = state.calendarMonth || now.getMonth();
      const viewYear = state.calendarYear || now.getFullYear();
      const firstDay = new Date(viewYear, viewMonth, 1);
      const lastDay = new Date(viewYear, viewMonth + 1, 0);
      const startPad = (firstDay.getDay() + 6) % 7; // lunes = 0
      const totalDays = lastDay.getDate();
      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const today = todayKey();

      let html = `
        <div class="card">
          <div class="card-title">
            <span class="card-action" onclick="calendarNav(-1)">◂</span>
            <span class="card-title-text">${monthNames[viewMonth]} ${viewYear}</span>
            <span class="card-action" onclick="calendarNav(1)">▸</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;">
            ${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<div style="text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--ink4);padding:4px 0;letter-spacing:.1em;">${d}</div>`).join('')}
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">
      `;

      // Padding
      for (let i = 0; i < startPad; i++) {
        html += `<div style="aspect-ratio:1;"></div>`;
      }

      // Days
      for (let d = 1; d <= totalDays; d++) {
        const key = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayLog = load(K.log(key), null);
        const habitCount = dayLog ? dayLog.habits.filter(h => h !== '__touched').length : 0;
        const isToday = key === today;
        const hasSysQ = dayLog?.sysquest_status || null;
        const mood = dayLog?.reflection?.mood;

        // Intensidad de color por actividad
        let bg = 'var(--surface)';
        let border = 'transparent';
        if (habitCount >= 1) bg = 'rgba(139, 92, 246, .15)';
        if (habitCount >= 3) bg = 'rgba(139, 92, 246, .3)';
        if (habitCount >= 5) bg = 'rgba(139, 92, 246, .5)';
        if (habitCount >= 8) bg = 'rgba(139, 92, 246, .7)';
        if (isToday) border = 'var(--sys)';

        // Sysquest indicator
        let indicator = '';
        if (dayLog) {
          const sq = state.sysquest_history.find(q => q.date === key);
          if (sq) {
            indicator = sq.status === 'completed' ? '<span style="color:var(--positive);font-size:7px;">✓</span>' :
              sq.status === 'rejected' || sq.status === 'failed' ? '<span style="color:var(--negative);font-size:7px;">✗</span>' : '';
          }
        }

        // Mood dot
        let moodDot = '';
        if (mood) {
          const moodColors = ['', 'var(--negative)', 'var(--warning)', 'var(--ink3)', 'var(--positive)', 'var(--sys)'];
          moodDot = `<span style="display:block;width:4px;height:4px;border-radius:50%;background:${moodColors[mood]};margin:1px auto 0;"></span>`;
        }

        html += `
          <div onclick="showDayDetail('${key}')" style="aspect-ratio:1;background:${bg};border:1px solid ${border};border-radius:var(--rsm);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .15s var(--ease);">
            <span style="font-family:var(--font-mono);font-size:${isToday ? '11' : '10'}px;font-weight:${isToday ? '700' : '500'};color:${habitCount > 0 ? 'var(--ink)' : 'var(--ink3)'};">${d}</span>
            ${indicator}
            ${moodDot}
          </div>
        `;
      }

      html += `</div></div>`;

      // Resumen del mes
      let monthHabits = 0, monthDays = 0;
      for (let d = 1; d <= totalDays; d++) {
        const key = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayLog = load(K.log(key), null);
        if (dayLog && dayLog.habits.filter(h => h !== '__touched').length > 0) {
          monthDays++;
          monthHabits += dayLog.habits.filter(h => h !== '__touched').length;
        }
      }

      html += `
        <div class="card">
          <div class="card-title"><span class="card-title-text">Resumen · ${monthNames[viewMonth]}</span></div>
          <div style="display:flex;gap:12px;">
            <div style="flex:1;text-align:center;">
              <div class="display" style="font-size:28px;color:var(--sys2);">${monthDays}</div>
              <div class="mono" style="font-size:9px;color:var(--ink3);letter-spacing:.15em;">DÍAS ACTIVOS</div>
            </div>
            <div style="flex:1;text-align:center;">
              <div class="display" style="font-size:28px;color:var(--sys2);">${monthHabits}</div>
              <div class="mono" style="font-size:9px;color:var(--ink3);letter-spacing:.15em;">HÁBITOS</div>
            </div>
            <div style="flex:1;text-align:center;">
              <div class="display" style="font-size:28px;color:var(--sys2);">${monthDays > 0 ? Math.round(monthHabits / monthDays) : 0}</div>
              <div class="mono" style="font-size:9px;color:var(--ink3);letter-spacing:.15em;">PROMEDIO/DÍA</div>
            </div>
          </div>
        </div>
      `;

      return html;
    }

    function calendarNav(delta) {
      const now = new Date();
      state.calendarMonth = (state.calendarMonth ?? now.getMonth()) + delta;
      state.calendarYear = state.calendarYear ?? now.getFullYear();
      if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
      if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
      render();
    }

    function showDayDetail(dateKey) {
      const dayLog = load(K.log(dateKey), null);
      if (!dayLog || dayLog.habits.filter(h => h !== '__touched').length === 0) {
        toast('Sin actividad · ' + dateKey.slice(5));
        return;
      }

      const habits = dayLog.habits.filter(h => h !== '__touched');
      const xpTotal = Object.values(dayLog.xp_gained).reduce((a, b) => a + b, 0);
      const sq = state.sysquest_history.find(q => q.date === dateKey);

      let html = `
        <div class="modal-handle"></div>
        <div class="modal-tag">LOG · ${dateKey}</div>
        <div class="modal-title">${habits.length} hábitos · +${xpTotal} XP</div>
      `;

      // XP por stat
      html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">`;
      Object.keys(STATS).forEach(k => {
        if (dayLog.xp_gained[k] > 0) {
          html += `<span class="mono" style="font-size:10px;padding:3px 8px;background:${STATS[k].color}22;border:1px solid ${STATS[k].color}44;border-radius:var(--rsm);color:${STATS[k].color};">+${dayLog.xp_gained[k]} ${STATS[k].name}</span>`;
        }
      });
      html += `</div>`;

      // Hábitos
      html += `<div class="modal-label">Hábitos</div>`;
      habits.forEach(hId => {
        const h = findHabit(hId);
        if (h) {
          const note = dayLog.habit_notes?.[hId];
          html += `
            <div style="padding:6px 0;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;">
              <span style="color:${STATS[h.stat]?.color || 'var(--ink2)'};display:flex;">${svgIcon(h.icon || 'plus', 'icon icon-sm')}</span>
              <span style="font-size:12px;flex:1;">${h.label}</span>
              <span class="mono" style="font-size:9px;color:var(--ink3);">+${h.xp}</span>
            </div>
            ${note ? `<div style="padding:2px 0 6px 26px;font-size:11px;color:var(--ink3);font-style:italic;">"${escapeHtml(note)}"</div>` : ''}
          `;
        }
      });

      // Sysquest del día
      if (sq) {
        const sqColor = sq.status === 'completed' ? 'var(--positive)' : 'var(--negative)';
        html += `
          <div class="modal-label" style="margin-top:12px;">Quest del Sistema</div>
          <div style="padding:8px;border-left:2px solid ${sqColor};font-size:12px;">
            <span style="color:${sqColor};font-weight:600;">${sq.status.toUpperCase()}</span> · ${escapeHtml(sq.title)}
          </div>
        `;
      }

      // Reflection
      if (dayLog.reflection?.closed) {
        const r = dayLog.reflection;
        html += `<div class="modal-label" style="margin-top:12px;">Reflection</div>`;
        if (r.journal) html += `<div style="font-size:12px;color:var(--ink2);font-style:italic;margin-bottom:6px;">"${escapeHtml(r.journal)}"</div>`;
        html += `<div class="mono" style="font-size:10px;color:var(--ink3);">Mood: ${r.mood}/5 · Scroll: ${r.scroll}hs</div>`;
        if (r.voiceNote) html += `<div class="mono" style="font-size:10px;color:var(--info);margin-top:4px;">🎤 Voice note guardada</div>`;
      }

      // Intent
      if (dayLog.daily_intent?.items?.length > 0) {
        html += `<div class="modal-label" style="margin-top:12px;">Intención</div>`;
        dayLog.daily_intent.items.forEach((item, i) => {
          const done = dayLog.daily_intent.completed?.[i];
          html += `<div style="font-size:12px;color:${done ? 'var(--positive)' : 'var(--ink3)'};padding:3px 0;">${done ? '✓' : '○'} ${escapeHtml(item)}</div>`;
        });
      }

      openModal('__custom');
      const ov = document.getElementById('modalOv');
      if (ov) ov.querySelector('.modal').innerHTML = html;
    }

    function renderFocus() {
      return `
    <div class="card">
      <div class="card-title"><span class="card-title-text">Modo Foco</span></div>
      <div class="timer-wrap">
        <div class="timer-frame">
          <div class="timer-corner-tr"></div>
          <div class="timer-corner-bl"></div>
          <div class="timer-circle" id="timerCircle">

          <button class="btn btn-ghost" onclick="resetTimer()">Reset</button>
        </div>
        <div style="margin-top:24px;font-size:12px;color:var(--ink2);max-width:320px;margin-left:auto;margin-right:auto;line-height:1.6;font-family:var(--font-mono);letter-spacing:.04em;">
          Antes de iniciar: el celu boca abajo, otra mesa, otra habitación. No es resistir tentaciones — es no tenerlas.
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="card-title-text">Sesiones · hoy</span></div>
      <div style="display:flex;gap:12px;">
        <div style="flex:1;text-align:center;">
          <div class="display" style="font-size:36px;color:var(--sys2);">${log.habits.filter(h => h === 'pomo').length}</div>
          <div class="mono" style="font-size:9px;color:var(--ink3);letter-spacing:.2em;text-transform:uppercase;">POMODOROS</div>
        </div>
        <div style="flex:1;text-align:center;">
          <div class="display" style="font-size:36px;color:var(--sys2);">${log.habits.filter(h => h === 'deep_work').length}</div>
          <div class="mono" style="font-size:9px;color:var(--ink3);letter-spacing:.2em;text-transform:uppercase;">DEEP WORK</div>
        </div>
      </div>
    </div>
  `;
    }

    function renderNav() {
      return `
    <div class="bottom-nav">
      <button class="nav-tab ${state.page === 'home' ? 'active' : ''}" onclick="goPage('home')">
        ${svgIcon('home')}
        Home
      </button>
      <button class="nav-tab-fab" onclick="openModal('quick')">
        ${svgIcon('plus')}
      </button>
      <button class="nav-tab ${state.page === 'stats' ? 'active' : ''}" onclick="goPage('stats')">
        ${svgIcon('chart')}
        Status
      </button>
    </div>
  `;
    }

    function goPage(p) {
      state.page = p;
      render();
      if (p === 'stats') {
        setTimeout(() => { renderRadar(); renderHeatmap(); renderOAALine(); renderXPStack(); }, 60);
      }
      if (p === 'focus') {
        setTimeout(updateTimerUI, 60);
      }
      window.scrollTo(0, 0);
    }
  </script>
</body>
