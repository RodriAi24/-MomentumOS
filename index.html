    // ============================================================
    // CÁLCULO DE DIMENSIONES (0 a 14, mapeable a letras)
    // ============================================================

    function calcAcademico() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      const sabidIds = HABITS_BASE.sabiduria.map(h => h.id)
        .concat(state.custom.filter(c => c.stat === 'sabiduria').map(c => c.id));

      let freqRaw = 0;
      let totalSabidLogs = 0;
      let highEffortLogs = 0;
      const uniqueHabits = new Set();
      const daysWithSabid = new Set();

      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (sabidIds.includes(h)) {
            freqRaw += w;
            totalSabidLogs++;
            uniqueHabits.add(h);
            daysWithSabid.add(log.date);
            if (ACADEMICO_HIGH_EFFORT.includes(h)) highEffortLogs++;
          }
        });
      });

      // V14: target subido — 40 hábitos ponderados = A (era 15)
      // Llegar a A requiere ~3-4 sabiduría por día sostenidos
      const freqScore = Math.min(14, (freqRaw / 40) * 14);

      // Consistencia: % días con sabiduría — necesita 90%+ para A
      const consistencyScore = Math.pow(daysWithSabid.size / 30, 1.5) * 14;

      // Profundidad: high-effort tiene que ser dominante para A
      const depthScore = totalSabidLogs > 0
        ? Math.min(14, Math.pow(highEffortLogs / totalSabidLogs, 1.3) * 14)
        : 0;

      // Diversidad: necesitás 6+ hábitos distintos para A
      const diversityScore = Math.min(14, (uniqueHabits.size / 6) * 14);

      let raw = freqScore * 0.40 + consistencyScore * 0.30 + depthScore * 0.20 + diversityScore * 0.10;

      // Penalizaciones más agresivas
      let dryStreak = 0, maxDryStreak = 0;
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        const hasSabid = l && l.habits.some(h => sabidIds.includes(h));
        if (!hasSabid) { dryStreak++; maxDryStreak = Math.max(maxDryStreak, dryStreak); }
        else dryStreak = 0;
      }
      // V14: penalizaciones escaladas
      if (maxDryStreak >= 3) raw -= 1.0;
      if (maxDryStreak >= 5) raw -= 1.5;
      if (maxDryStreak >= 7) raw -= 2.0;

      // Carga profunda (CCA, deep_work)
      let deepLoad = 0;
      let pomoLoad = 0;
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        if (l) {
          deepLoad += l.habits.filter(h => h === 'deep_work').length;
          pomoLoad += l.habits.filter(h => h === 'pomo').length;
        }
      }
      const heavyCognitiveLoad = deepLoad >= 5 || pomoLoad >= 10;

      if (totalSabidLogs > 0 && uniqueHabits.size === 1 && uniqueHabits.has('notes') && !heavyCognitiveLoad) {
        raw = Math.min(raw, 8);
      }

      if (heavyCognitiveLoad) raw += 0.5;

      // V14: cap absoluto si menos de 21 días de uso (B máximo)
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    function calcFisico() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      const fuerzaIds = HABITS_BASE.fuerza.map(h => h.id);

      let freqRaw = 0;
      let sleepDays = 0;
      let hydrationDays = 0;
      const daysWithFisico = new Set();
      const habitTypes = new Set();
      let gymDays = 0;

      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (fuerzaIds.includes(h)) {
            freqRaw += w;
            daysWithFisico.add(log.date);
            habitTypes.add(h);
            if (h === 'gym') gymDays++;
            if (h === 'sleep7') sleepDays++;
            if (h === 'hydration') hydrationDays++;
          }
        });
      });

      // V14: targets subidos
      // Frecuencia: target 45 hábitos ponderados (era 18) — necesita actividad casi diaria
      const freqScore = Math.min(14, (freqRaw / 45) * 14);
      const consistencyScore = Math.pow(daysWithFisico.size / 30, 1.5) * 14;
      const sleepScore = Math.pow(sleepDays / 30, 1.3) * 14;
      const hydraVarScore = Math.min(14, (hydrationDays / 25) * 7 + (habitTypes.size / 6) * 7);

      let raw = freqScore * 0.30 + consistencyScore * 0.30 + sleepScore * 0.20 + hydraVarScore * 0.20;

      // Penalizaciones
      if (gymDays > 0 && habitTypes.size === 1 && habitTypes.has('gym')) {
        raw = Math.min(raw, 9); // cap B− (era B)
      }
      // Sin gym 7/14/21+ días — escalado
      let gymDryStreak = 0;
      for (let i = 0; i < 21; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        if (!l || !l.habits.includes('gym')) gymDryStreak++;
        else break;
      }
      if (gymDryStreak >= 7) raw -= 1;
      if (gymDryStreak >= 14) raw -= 2;
      if (gymDryStreak >= 21) raw -= 3;

      // Cap absoluto si menos de 21 días
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    function calcMental() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      // Sysquests en últimos 30 días
      const sysQ30 = state.sysquest_history.filter(q => daysSince(q.date) <= 30);
      const accepted = sysQ30.filter(q => q.status === 'accepted' || q.status === 'completed' || q.status === 'failed').length;
      const completed = sysQ30.filter(q => q.status === 'completed').length;
      const rejected = sysQ30.filter(q => q.status === 'rejected').length;
      const totalIssued = sysQ30.length;

      // Aceptación rate
      const acceptRate = totalIssued > 0 ? accepted / totalIssued : 0.5;
      const acceptScore = acceptRate * 14;

      // Completion rate de las aceptadas
      const completeRate = accepted > 0 ? completed / accepted : 0.5;
      const completeScore = completeRate * 14;

      // Daily intent completion
      let intentDone = 0, intentTotal = 0;
      logs.forEach(log => {
        if (log.daily_intent.items.length > 0) {
          intentTotal += log.daily_intent.items.length;
          intentDone += log.daily_intent.completed.filter(Boolean).length;
        }
      });
      const intentScore = intentTotal > 0 ? (intentDone / intentTotal) * 14 : 7;

      // V14: targets subidos en pomos y scroll streak
      const scrollScore = Math.min(14, Math.pow(state.streaks.no_scroll_am.current / 21, 1.2) * 14);

      let pomoCount = 0;
      logs.forEach(log => {
        if (log.habits.includes('pomo')) pomoCount++;
        if (log.habits.includes('deep_work')) pomoCount += 1.5;
      });
      // V14: target 40 pomos en 30d (era 15) — requiere ~1.3 pomos/día sostenidos
      const pomoScore = Math.min(14, (pomoCount / 40) * 14);

      const reflClosed = logs.filter(l => l.reflection?.closed).length;
      const reflScore = Math.pow(reflClosed / 30, 1.3) * 14;

      let raw =
        acceptScore * 0.25 +
        completeScore * 0.25 +
        intentScore * 0.15 +
        scrollScore * 0.15 +
        pomoScore * 0.10 +
        reflScore * 0.10;

      // Penalizaciones
      const lastThree = state.sysquest_history.slice(-3);
      if (lastThree.length === 3 && lastThree.every(q => q.status === 'rejected' || q.status === 'failed')) {
        raw = Math.min(raw, 7);
      }
      const last14 = state.sysquest_history.filter(q => daysSince(q.date) <= 14);
      if (last14.length > 0 && last14.every(q => q.status === 'rejected')) {
        raw = Math.min(raw, 5);
      }

      raw += getScreenTimeOAAFactor();

      // Cap absoluto si menos de 21 días
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    function calcSocial() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      let weighted = 0;
      const types = new Set();
      let mostRecentVinculo = Infinity;
      let qualityTimeCount = 0;
      let qualityTimeRecent = Infinity;

      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (SOCIAL_WEIGHTS[h] !== undefined) {
            weighted += SOCIAL_WEIGHTS[h] * w;
            types.add(h);
            mostRecentVinculo = Math.min(mostRecentVinculo, log.daysAgo);
          }
          if (h === 'quality_time') {
            qualityTimeCount++;
            qualityTimeRecent = Math.min(qualityTimeRecent, log.daysAgo);
          }
        });
      });

      // V14: target subido — 70 weighted points = A (era 30)
      let raw = Math.min(14, (weighted / 70) * 14);

      const qualityTimeMaster = qualityTimeCount >= 4 && qualityTimeRecent <= 7;

      if (!qualityTimeMaster) {
        // V14: decay más agresivo
        if (mostRecentVinculo >= 14) raw = Math.min(raw, 4);
        else if (mostRecentVinculo >= 10) raw -= 3;
        else if (mostRecentVinculo >= 7) raw -= 2;
        else if (mostRecentVinculo >= 4) raw -= 1;
      }

      if (types.size >= 5) raw += 1;
      if (qualityTimeMaster) raw += 0.5;

      // Cap absoluto si menos de 21 días
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    function calcIdentidad() {
      const logs = getRecentLogs(30);
      if (logs.length < 7) return null;

      const almaIds = HABITS_BASE.alma.map(h => h.id);
      const juegoIds = HABITS_BASE.juego.map(h => h.id);

      // Consistencia Alma
      let almaCount = 0;
      const almaDays = new Set();
      const almaTypes = new Set();
      logs.forEach(log => {
        const w = timeWeight(log.daysAgo);
        log.habits.forEach(h => {
          if (almaIds.includes(h)) {
            almaCount += w;
            almaDays.add(log.date);
            almaTypes.add(h);
          }
        });
      });
      // V14: targets subidos
      const almaScore = Math.min(14, Math.pow(almaDays.size / 25, 1.4) * 14);

      // Diversidad Juego: necesitás 6+ tipos para A
      const juegoTypes = new Set();
      logs.forEach(log => {
        log.habits.forEach(h => { if (juegoIds.includes(h)) juegoTypes.add(h); });
      });
      const juegoScore = (juegoTypes.size / 6) * 14;

      // Mazmorras: requieren más para alto score
      const recentBosses = state.bosses.filter(b => b.completed && daysSince(b.completedAt) <= 30);
      const recentForged = state.bosses.filter(b => daysSince(b.createdAt) <= 30);
      const bossScore = Math.min(14, recentBosses.length * 3 + recentForged.length * 0.5);

      const activeCustoms = state.custom.filter(c => {
        return logs.some(l => l.habits.includes(c.id));
      });
      const customScore = Math.min(14, activeCustoms.length * 2.5);

      const journaled = logs.filter(l => l.reflection?.journal && l.reflection.journal.length > 10).length;
      const journalScore = Math.min(14, (journaled / 20) * 14);

      let raw = almaScore * 0.30 + juegoScore * 0.20 + bossScore * 0.25 + customScore * 0.15 + journalScore * 0.10;

      if (state.custom.length > 0) {
        let maxLogs = 0;
        state.custom.forEach(c => {
          const count = logs.reduce((s, l) => s + (l.habits.includes(c.id) ? 1 : 0), 0);
          maxLogs = Math.max(maxLogs, count);
        });
        if (maxLogs >= 25) raw += 0.5;
      }

      // Cap absoluto si menos de 21 días
      if (logs.length < 21) raw = Math.min(raw, 10);

      return Math.max(0, Math.min(14, raw));
    }

    // ============================================================

    function calcAllDimensions() {
      return {
        academico: calcAcademico(),
        fisico: calcFisico(),
        mental: calcMental(),
        social: calcSocial(),
        identidad: calcIdentidad(),
      };
    }

    function calcOAATotal(dims) {
      // Si alguna dimensión es null, calcular con las que están y normalizar pesos
      let total = 0;
      let weightSum = 0;
      for (const key in OAA_WEIGHTS) {
        if (dims[key] !== null && dims[key] !== undefined) {
          total += dims[key] * OAA_WEIGHTS[key];
          weightSum += OAA_WEIGHTS[key];
        }
      }
      if (weightSum === 0) return null;
      return total / weightSum;
    }

    function getCurrentOAA() {
      // Cache: si el cálculo es de hoy, devolverlo. Si no, recalcular.
      const today = todayKey();
      if (state.oaa && state.oaa.date === today) return state.oaa;
      const dims = calcAllDimensions();
      const total = calcOAATotal(dims);
      state.oaa = { date: today, dims, total, computedAt: new Date().toISOString() };
      // Guardar histórico
      if (!state.oaa_history) state.oaa_history = [];
      // Solo guardar si es distinto al último
      const last = state.oaa_history[state.oaa_history.length - 1];
      if (!last || last.date !== today) {
        state.oaa_history.push({ date: today, dims, total });
        // Mantener últimos 120 días
        if (state.oaa_history.length > 120) state.oaa_history.shift();
      }
      persist();
      return state.oaa;
    }

    function computeCurrentClass() {
      // Calcular OAA promedio últimos N días según umbral más alto disponible
      if (!state.oaa_history || state.oaa_history.length === 0) return 'D';

      const history = state.oaa_history.filter(h => h.total !== null);
      if (history.length === 0) return 'D';

      // Ir desde la clase más alta hacia abajo, verificar si cumple
      const tryClasses = [...CLASS_ORDER].reverse();
      for (const cls of tryClasses) {
        const t = CLASS_THRESHOLDS[cls];
        if (cls === 'D') return 'D';

        const days = t.sustainDays;
        const recentN = history.slice(-days);
        if (recentN.length < days) continue;

        const avg = recentN.reduce((s, h) => s + h.total, 0) / recentN.length;
        if (avg < t.oaaMin) continue;

        // Extra: mazmorras para clase A
        if (t.extra.dungeons) {
          const completedDungeons = state.bosses.filter(b => b.completed).length;
          if (completedDungeons < t.extra.dungeons) continue;
        }

        return cls;
      }
      return 'D';
    }

    function updateClassIfChanged() {
      const newClass = computeCurrentClass();
      const oldClass = state.currentClass || 'D';
      if (newClass !== oldClass) {
        state.currentClass = newClass;
        state.classHistory = state.classHistory || [];
        state.classHistory.push({ date: todayKey(), from: oldClass, to: newClass });
        persist();
        // Notificar promoción o descenso
        const oldIdx = CLASS_ORDER.indexOf(oldClass);
        const newIdx = CLASS_ORDER.indexOf(newClass);
        setTimeout(() => {
          if (newIdx > oldIdx) {
            sysToast(`PROMOCIÓN · CLASE ${CLASS_THRESHOLDS[newClass].code}`, 'positive');
            ppOnClassPromotion();
          } else {
            sysToast(`REEVALUACIÓN · CLASE ${CLASS_THRESHOLDS[newClass].code}`, 'danger');
          }
        }, 800);
      }
    }

    function classCode(cls) {
      return CLASS_THRESHOLDS[cls]?.code || 'D';
    }

        date: todayKey(),
        type: 'earn',
        amount,
        reason,
        balance: state.pp,
        ts: Date.now(),
      });
      if (state.ppLog.length > 200) state.ppLog = state.ppLog.slice(-200);
      persist();
    }

    function spendPP(itemKey) {
      if (!ppEnabled()) { toast('PP desbloqueados en Clase B'); return false; }
      const item = PP_SPEND[itemKey];
      if (!item) return false;
      if (state.pp < item.cost) { toast('PP insuficientes · ' + item.cost + ' necesarios'); return false; }
      if (!checkPPLimit(itemKey)) {
        toast('Límite alcanzado · ' + item.limit);
        return false;
      }
      state.pp -= item.cost;
      state.ppLog.push({
        date: todayKey(),
        type: 'spend',
        amount: -item.cost,
        reason: item.label,
        itemKey,
        balance: state.pp,
        ts: Date.now(),
      });
      if (state.ppLog.length > 200) state.ppLog = state.ppLog.slice(-200);
      recordPPLimit(itemKey);
      persist();
      sysToast(`−${item.cost} PP · ${item.label}`);
      return true;
    }

    function checkPPLimit(itemKey) {
      const item = PP_SPEND[itemKey];
      if (!item) return false;
      const limits = state.ppLimits;
      const now = new Date();
      const key = itemKey;

      if (item.limit === 'unlimited') return true;
      if (item.limit === 'permanent') {
        return !limits[key];
      }

      const uses = (limits[key] || []).filter(ts => {
        const d = new Date(ts);
        if (item.limit === '1/day') return dateToKey(d) === todayKey();
        if (item.limit === '1/week') {
          const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate() - 7);
          return d > weekAgo;
        }
        if (item.limit === '1/month' || item.limit === '2/month') {
          const monthAgo = new Date(now); monthAgo.setMonth(monthAgo.getMonth() - 1);
          return d > monthAgo;
        }
        if (item.limit === '3/year') {
          const yearAgo = new Date(now); yearAgo.setFullYear(yearAgo.getFullYear() - 1);
          return d > yearAgo;
        }
        return true;
      });

      const maxUses = parseInt(item.limit) || 1;
      return uses.length < maxUses;
    }

    function recordPPLimit(itemKey) {
      if (!state.ppLimits[itemKey]) state.ppLimits[itemKey] = [];
      state.ppLimits[itemKey].push(Date.now());
    }

    function checkPPEarnings() {
      if (!ppEnabled()) return;
      const today = todayKey();
      const earned = state.ppLog.filter(l => l.date === today && l.type === 'earn');
      const reasons = earned.map(e => e.reason);

      if (log.reflection?.closed && !reasons.includes('reflection')) {

      }

      if (state.streaks.daily_log.last === today && !reasons.includes('daily_streak')) {

      }
    }

    function evaluateTalents() {
      if (!state.oaa_history || state.oaa_history.length < 30) return;
      const hist = state.oaa_history;

      TALENTS.forEach(t => {
        const hasTalent = state.talents.find(x => x.id === t.id);

        if (!hasTalent) {
          try {
            if (t.check(hist, state)) {
              state.talents.push({
                id: t.id,
                unlockedAt: todayKey(),
                active: true,
              });
              earnPP(PP_EARN.talent_unlocked, 'talent_' + t.id);
              setTimeout(() => sysToast(`TALENT DETECTADO · ${t.name.toUpperCase()}`, 'positive'), 800);
            }
          } catch (e) {
            console.warn('Talent check error:', t.id, e.message);
          }
        } else if (hasTalent.active && !t.permanent && t.decay) {
          try {
            if (t.decay(hist, state)) {
              hasTalent.active = false;
              hasTalent.lostAt = todayKey();
              setTimeout(() => sysToast(`TALENT PERDIDO · ${t.name.toUpperCase()}`, 'danger'), 800);
            }
          } catch (e) {
            console.warn('Talent decay error:', t.id, e.message);
          }
        }
      });

      persist();
    }

    function getActiveTalents() {
      return state.talents.filter(t => t.active);

    function getAllTalentsWithStatus() {
      return TALENTS.map(t => {
        const unlocked = state.talents.find(x => x.id === t.id);
        return {
          ...t,
          unlocked: !!unlocked,
          active: unlocked?.active || false,
          unlockedAt: unlocked?.unlockedAt,
          lostAt: unlocked?.lostAt,
        };
      });
    }

    function maybeOfferExam() {
      if (!examEnabled()) return;
      if (state.specialExam) return;

      const lastExam = state.examHistory[state.examHistory.length - 1];
      if (lastExam) {
        const daysSinceLast = daysSince(lastExam.endDate || lastExam.offeredDate);
        if (lastExam.status === 'failed' && daysSinceLast < EXAM_COOLDOWN_FAIL) return;
        if (lastExam.status === 'rejected' && daysSinceLast < EXAM_COOLDOWN_REJECT) return;
        if (lastExam.status === 'expired' && daysSinceLast < EXAM_COOLDOWN_REJECT) return;
        if (lastExam.status === 'passed') {
          const lastMonth = lastExam.endDate?.slice(0, 7);
          const thisMonth = todayKey().slice(0, 7);
          if (lastMonth === thisMonth) return;
        }
      }

      const today = new Date();
      if (today.getDate() > 3 && state.examHistory.length > 0) return;

      const lastId = lastExam?.examId;
      const pool = SPECIAL_EXAMS.filter(e => e.id !== lastId);
      const exam = pool[Math.floor(Math.random() * pool.length)];

      state.specialExam = {
        examId: exam.id,
        status: 'offered',
        offeredDate: todayKey(),
        acceptDeadline: new Date(Date.now() + 48 * 60 * 60 * 1000).toISOString(),
        dayLogs: [],
      };
      persist();
      setTimeout(() => sysToast('SPECIAL EXAM DISPONIBLE'), 1500);
    }

    function acceptExam() {
      if (!state.specialExam || state.specialExam.status !== 'offered') return;
      state.specialExam.status = 'active';
      state.specialExam.startDate = todayKey();
      state.specialExam.endDate = (() => {
        const d = new Date();
        d.setDate(d.getDate() + 7);
        return dateToKey(d);
      })();
      persist();
      render();
      sysToast('SPECIAL EXAM ACEPTADO · 7 DÍAS');
    }

    function rejectExam() {
      if (!state.specialExam) return;
      customConfirm('¿Rechazar el Special Exam? Cooldown de 14 días para el próximo.', () => {
        state.specialExam.status = 'rejected';

        state.specialExam = null;

    function checkExamExpiry() {
      if (!state.specialExam) return;
      const exam = state.specialExam;

      if (exam.status === 'offered' && new Date(exam.acceptDeadline) < new Date()) {
        exam.status = 'expired';
        state.examHistory.push({ ...exam });
        state.specialExam = null;
        persist();
        return;
      }

      if (exam.status === 'active' && exam.endDate && todayKey() > exam.endDate) {
        evaluateExam();
      }
    }

    function checkExamDaily() {
      if (!state.specialExam || state.specialExam.status !== 'active') return;
      const exam = state.specialExam;
      const template = SPECIAL_EXAMS.find(e => e.id === exam.examId);
      if (!template) return;

      const today = todayKey();
      if (exam.dayLogs.some(d => d.date === today)) return;

      const dayResult = evaluateExamDay(template);
      exam.dayLogs.push({ date: today, passed: dayResult.allMet, details: dayResult.details });
      persist();
    }

    function evaluateExamDay(template) {
      const details = [];
      let allMet = true;

      template.conditions.forEach(cond => {
        let met = false;
        switch (cond.type) {
          case 'daily_habit':
            met = log.habits.includes(cond.habitId);
            break;
          case 'daily_reflection':
            met = !!log.reflection?.closed;
            break;
          case 'daily_journal':
            met = !!(log.reflection?.journal && log.reflection.journal.length > 10);
            break;
          case 'daily_stat_count': {
            const statHabits = HABITS_BASE[cond.stat]?.map(h => h.id) || [];
            const count = log.habits.filter(h => statHabits.includes(h)).length;
            met = count >= cond.min;
            break;
          }
          case 'daily_all_stats': {
            const statKeys = Object.keys(STATS);
            met = statKeys.every(sk => {
              const ids = (HABITS_BASE[sk] || []).map(h => h.id)
                .concat(state.custom.filter(c => c.stat === sk).map(c => c.id));
              return log.habits.some(h => ids.includes(h));
            });
            break;
          }
          case 'total_habits':
            met = true;
            break;
        }
        details.push({ label: cond.label, met });
        if (!met && cond.type !== 'total_habits') allMet = false;
      });

      return { allMet, details };
    }

    function evaluateExam() {
      const exam = state.specialExam;
      if (!exam || exam.status !== 'active') return;
      const template = SPECIAL_EXAMS.find(e => e.id === exam.examId);
      if (!template) return;

      let passed = true;

      const dailyConditions = template.conditions.filter(c => c.type !== 'total_habits');
      if (dailyConditions.length > 0) {
        const requiredDays = template.duration;
        const passedDays = exam.dayLogs.filter(d => d.passed).length;
        if (passedDays < requiredDays) passed = false;
      }

      const totalConditions = template.conditions.filter(c => c.type === 'total_habits');
      totalConditions.forEach(cond => {
        let totalCount = 0;
        for (let i = 0; i < template.duration; i++) {
          const d = new Date(exam.startDate);
          d.setDate(d.getDate() + i);
          const key = dateToKey(d);
          const dayLog = load(K.log(key), null);
          if (dayLog) {
            totalCount += dayLog.habits.filter(h => cond.habitIds.includes(h)).length;
          }
        }
        if (totalCount < cond.min) passed = false;
      });

      exam.status = passed ? 'passed' : 'failed';
      exam.completedAt = todayKey();

      if (passed) {
        earnPP(template.reward.pp, 'special_exam_' + exam.examId);
        if (template.reward.title) {
          if (!state.examTitles) state.examTitles = [];
          if (!state.examTitles.includes(template.reward.title)) {
            state.examTitles.push(template.reward.title);
          }
        }
        setTimeout(() => sysToast(`SPECIAL EXAM APROBADO · +${template.reward.pp} PP`, 'positive'), 600);
      } else {
        setTimeout(() => sysToast('SPECIAL EXAM FALLIDO · Cooldown 21 días', 'danger'), 600);
      }

      state.examHistory.push({ ...exam });
      state.specialExam = null;
      persist();
      render();
    }

    function getExamProgress() {
      if (!state.specialExam || state.specialExam.status !== 'active') return null;
      const exam = state.specialExam;
      const template = SPECIAL_EXAMS.find(e => e.id === exam.examId);
      if (!template) return null;

      const startDate = new Date(exam.startDate);
      const now = new Date();
      const dayNumber = Math.min(template.duration, Math.floor((now - startDate) / (1000 * 60 * 60 * 24)) + 1);
      const passedDays = exam.dayLogs.filter(d => d.passed).length;
      const totalDays = template.duration;

      let totalProgress = {};
      template.conditions.filter(c => c.type === 'total_habits').forEach(cond => {
        let count = 0;
        for (let i = 0; i < dayNumber; i++) {
          const d = new Date(exam.startDate);
          d.setDate(d.getDate() + i);
          const key = dateToKey(d);
          const dayLog = load(K.log(key), null);
          if (dayLog) count += dayLog.habits.filter(h => cond.habitIds.includes(h)).length;
        }
        totalProgress[cond.label] = { current: count, target: cond.min };
      });

      const todayResult = evaluateExamDay(template);

      return {
        template,
        dayNumber,
        totalDays,
        passedDays,
        pct: (passedDays / totalDays) * 100,
        todayConditions: todayResult.details,
        totalProgress,
      };
    }

    async function fetchChessGames() {
      const username = state.user?.settings?.chess?.username;
      if (!username) return null;

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const url = `${API.chess.base}/${username}/games/${year}/${month}`;
      const data = await apiFetch(url, {}, 8000);
      if (!data?.games) return null;

      const today = todayKey();
      const todayGames = data.games.filter(g => {
        const d = new Date(g.end_time * 1000);
        return dateToKey(d) === today;
      });

      return todayGames.map(g => {
        const isWhite = g.white.username.toLowerCase() === username.toLowerCase();
        const myResult = isWhite ? g.white.result : g.black.result;
        const myRating = isWhite ? g.white.rating : g.black.rating;
        return {
          result: myResult,
          rating: myRating,
          timeClass: g.time_class,
          url: g.url,
        };
      });

      const username = state.user?.settings?.chess?.username;
      if (!username) return;

      const today = todayKey();
      const lastCheck = load('mo_chess_last_check', null);
      if (lastCheck === today) return;

      const games = await fetchChessGames();
      if (!games || games.length === 0) {
        save('mo_chess_last_check', today);
        return;
      }

      if (!log.habits.includes('chess')) {
        log.habits.push('chess');
        const gained = log.xp_gained.juego;

        const xpToAdd = Math.min(8, cap - gained);

          log.xp_gained.juego += xpToAdd;
          state.xp.juego += xpToAdd;
        }
        saveLog(log);
        persist();

        const wins = games.filter(g => g.result === 'win').length;

        sysToast(`${total} partida${total > 1 ? 's' : ''} detectada${total > 1 ? 's' : ''} \u00b7 ${wins}W \u00b7 Rating ${rating}`);

      save('mo_chess_last_check', today);
    }

    async function gistBackup() {
      const cfg = state.user?.settings?.gist;
      if (!cfg?.enabled || !cfg?.token) return;

      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('mo_')) data[k] = localStorage.getItem(k);
      }

      const content = JSON.stringify(data, null, 2);
      const filename = `system_backup_${todayKey()}.json`;

      const headers = {
        'Authorization': `token ${cfg.token}`,
        'Content-Type': 'application/json',
      };

      try {
        if (cfg.gistId) {
          await fetch(`${API.gist.base}/${cfg.gistId}`, {
            method: 'PATCH',
            headers,
            body: JSON.stringify({
              description: `The System backup · ${todayKey()}`,
              files: { [filename]: { content } },
            }),
          });
        } else {
          const res = await fetch(API.gist.base, {
            method: 'POST',
            headers,
            body: JSON.stringify({
              description: `The System backup \u00b7 ${todayKey()}`,
              public: false,
              files: { [filename]: { content } },
            }),
          });
          const result = await res.json();
          if (result.id) {
            state.user.settings.gist.gistId = result.id;
            persist();
          }
        }
        save('mo_last_backup', todayKey());
        console.log('Gist backup OK');
      } catch (e) {
        console.warn('Gist backup failed:', e.message);
      }
    }

    // ============================================================

    function getOAATrend(weeks = 4) {
      // Regresión lineal simple sobre últimas N semanas de OAA Total
      if (!state.oaa_history || state.oaa_history.length < weeks * 7) return 'flat';
      const recent = state.oaa_history.slice(-(weeks * 7)).filter(h => h.total !== null);
      if (recent.length < 7) return 'flat';
      const n = recent.length;
      const xs = recent.map((_, i) => i);
      const ys = recent.map(h => h.total);
      const xMean = xs.reduce((a, b) => a + b, 0) / n;
      const yMean = ys.reduce((a, b) => a + b, 0) / n;
      const num = xs.reduce((s, x, i) => s + (x - xMean) * (ys[i] - yMean), 0);
      const den = xs.reduce((s, x) => s + (x - xMean) ** 2, 0);
      const slope = den === 0 ? 0 : num / den;
      if (slope > 0.05) return 'up';
      if (slope < -0.05) return 'down';
      return 'flat';
    }

    function getDimChange(stat) {
      // Cambio vs semana anterior
      if (!state.oaa_history || state.oaa_history.length < 8) return 0;
      const today = state.oaa_history[state.oaa_history.length - 1];
      const weekAgo = state.oaa_history[state.oaa_history.length - 8];
      if (!today.dims[stat] || !weekAgo.dims[stat]) return 0;
      return today.dims[stat] - weekAgo.dims[stat];
    }

    function generateDailyQuest(currentRank, recentCategories) {
      // Pesos: ajustan según rango
      let weights = {
        ruptura: 2,
        confrontacion: 2,
        disciplina_pura: 2,
        curiosidad: 2,
        vulnerabilidad: 1,
        fisico_extremo: 2,
      };
      // Si tu rango es alto, aumentamos lo difícil
      if (currentRank === 'C' || currentRank === 'B') {
        weights.vulnerabilidad = 2;
        weights.disciplina_pura = 3;
      }
      if (currentRank === 'A' || currentRank === 'S' || currentRank === 'NL') {
        weights.vulnerabilidad = 3;
        weights.confrontacion = 3;
        weights.disciplina_pura = 3;
        weights.ruptura = 1;
        weights.curiosidad = 1;
      }
      // No repetir las últimas 2 categorías
      recentCategories.forEach(cat => { if (weights[cat]) weights[cat] = 0; });

      // Build weighted pool
      const pool = [];
      for (const cat in weights) {
        for (let i = 0; i < weights[cat]; i++) pool.push(cat);
      }
      const category = pool[Math.floor(Math.random() * pool.length)] || 'ruptura';

      // V3.7: Memoria de últimas 8 quests específicas (no solo categorías)
      const recentTitles = state.sysquest_history.slice(-8).map(q => q.title);
      const templates = QUEST_TEMPLATES[category];
      const fresh = templates.filter(t => !recentTitles.includes(t.title));
      const pickFrom = fresh.length > 0 ? fresh : templates;
      const tpl = pickFrom[Math.floor(Math.random() * pickFrom.length)];

      return {
        id: 'sysq_' + Date.now(),
        category,
        ...tpl,
        status: 'pending', // pending | accepted | rejected | completed | failed
        issuedAt: new Date().toISOString(),
        date: todayKey(),
      };
    }

    function load(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        if (v === null) return fallback;
        return JSON.parse(v);
      } catch (e) { return fallback; }
    }

    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); }
      catch (e) {
        if (e.name === 'QuotaExceededError' || e.code === 22) {
          // Storage full — try to clean up old logs
          console.warn('Storage quota exceeded, cleaning old logs');
          try {
            // Delete logs older than 180 days
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 180);
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
            keys.forEach(k => {
              if (k.startsWith('mo_log_')) {
                const dateStr = k.replace('mo_log_', '');
                const d = new Date(dateStr);
                if (d < cutoff) localStorage.removeItem(k);
              }
            });
            // Try save again
            localStorage.setItem(key, JSON.stringify(value));
            toast('Almacenamiento limpiado · logs antiguos eliminados', 'positive');
          } catch (e2) {
            console.error('save retry failed', key, e2);
            toast('Almacenamiento lleno · exportá backup', 'danger');
          }
        } else {
          console.error('save failed', key, e);
        }
      }
    }

    // V19: Streak XP multiplier — rewards consistency
    function getStreakMultiplier() {
      const streak = state.streaks?.daily_log?.current || 0;
      if (streak >= 60) return 1.50;
      if (streak >= 30) return 1.35;
      if (streak >= 14) return 1.20;
      if (streak >= 7) return 1.10;
      return 1.00;
    }

    function xpForLevel(level) {
      // V19: sub-quadratic curve ((lvl+1)^1.5 * 100) — more achievable than quadratic
      // lvl 0: 0 XP
      // lvl 1: 100 XP
      // lvl 3: 901 XP
      // lvl 5: 2,819 XP
      // lvl 7: 6,140 XP
      // lvl 10: 14,264 XP
      let total = 0;
      for (let i = 0; i < level; i++) total += Math.floor(Math.pow(i + 1, 1.5) * 100);
      return total;
    }



    function levelFromXP(xp) {
      // Starts at 0
      let lvl = 0;
      while (xpForLevel(lvl + 1) <= xp) lvl++;
      return lvl;
    }

    function progressInLevel(xp) {
      const lvl = levelFromXP(xp);
      const base = xpForLevel(lvl);
      const next = xpForLevel(lvl + 1);
      return {
        level: lvl,
        current: xp - base,
        needed: next - base,
        pct: ((xp - base) / (next - base)) * 100,
      };
    }

    function totalLevel() {
      return Object.keys(STATS).reduce((sum, key) => sum + levelFromXP(state.xp[key]), 0);
    }

    function currentRank() {
      const lvl = totalLevel();
      // V19: Strict mode — check level AND OAA requirements
      const oaa = state.oaa || { total: 0 };
      const dims = ['academico', 'fisico', 'mental', 'social', 'identidad']
        .map(k => oaa[k] || 0);
      const minDim = Math.min(...dims);

      let rank = RANKS[0];
      for (const r of RANKS) {
        if (lvl < r.min) continue;
        if (r.oaaMin && (oaa.total || 0) < r.oaaMin) continue;
        if (r.noDimBelow !== null && r.noDimBelow !== undefined && minDim < r.noDimBelow) continue;
        rank = r;
      }
      return rank;
    }

    function allHabits() {
      const all = {};
      for (const stat in HABITS_BASE) all[stat] = [...HABITS_BASE[stat]];
      state.custom.forEach(h => {
        if (all[h.stat]) all[h.stat].push(h);
      });
      return all;
    }

    function findHabit(habitId) {
      const all = allHabits();
      for (const stat in all) {
        const h = all[stat].find(x => x.id === habitId);
        if (h) return { ...h, stat };
      }
      return null;
    }

    function logHabit(habitId, originEvent) {
      if (!log || log.date !== todayKey()) log = getLog(todayKey());
      if (log.habits.includes(habitId)) {
        toast('Ya marcado hoy');
        return;
      }
      const h = findHabit(habitId);
      if (!h) return;

      // V19: No more daily caps — if you did the work, you get the XP
      let xpToAdd = h.xp;

      log.habits.push(habitId);
      const realHabits = log.habits.filter(x => x !== '__touched');

      // V19.7: Habit bounce animation
      if (originEvent?.target) {
        const row = originEvent.target.closest('.habit-row');
        if (row) {
          row.classList.add('bouncing');
          setTimeout(() => row.classList.remove('bouncing'), 400);
        }
      }

      // First log of the day bonus
      if (realHabits.length === 1) {
        xpToAdd += 5;
        setTimeout(() => sysToast('PRIMER LOG DEL DÍA · +5 BONUS'), 400);
      }

      // V19: First touch of this stat today bonus
      const statTouchedToday = realHabits.slice(0, -1).some(hid => {
        const hh = findHabit(hid);
        return hh && hh.stat === h.stat;
      });
      if (!statTouchedToday) {
        xpToAdd += 3;
        setTimeout(() => sysToast(`PRIMERA ${STATS[h.stat].name.toUpperCase()} · +3 BONUS`), 700);
      }

      // V19: Apply streak multiplier
      const streakMult = getStreakMultiplier();
      if (streakMult > 1.0) {
        const before = xpToAdd;
        xpToAdd = Math.floor(xpToAdd * streakMult);
        const bonus = xpToAdd - before;
        if (bonus > 0) {
          setTimeout(() => sysToast(`STREAK x${streakMult.toFixed(2)} · +${bonus} XP`), 1000);
        }
      }
      // Prompt nota (no-blocking, aparece después)
      setTimeout(() => promptHabitNote(habitId), 800);
      if (xpToAdd > 0) {
        log.xp_gained[h.stat] += xpToAdd;
        const prevLevel = levelFromXP(state.xp[h.stat]);
        const prevRank = currentRank().rank;
        state.xp[h.stat] += xpToAdd;
        const newLevel = levelFromXP(state.xp[h.stat]);
        const newRank = currentRank().rank;

        floatXP(`+${xpToAdd}`, STATS[h.stat].color, originEvent);

        if (newLevel > prevLevel) {
          setTimeout(() => showLevelUp(h.stat, newLevel), 600);
        }
        if (newRank !== prevRank) {
          setTimeout(() => showRankUp(newRank), newLevel > prevLevel ? 2500 : 600);
        }
      }

      updateDailyStreak();
      updateQuestsFromHabit(habitId, h.stat);
      checkDailyIntentBonus();
      checkAchievements();
      checkDailyCombo();

      saveLog(log);
      persist();
      render();

      // APOD trigger cuando marca astronomía
      if (habitId === 'stars') showAPOD();
    }

    // ============================================================
    // SCREEN TIME ACCOUNTABILITY SYSTEM
    // ============================================================
    // Umbral dinámico por rango + clase. Penalización NO LINEAL.
    // Afecta TODOS los stats (disciplina doble).
    // Primeros 7 días cumplidos: no suman, solo evitan penalización.
    // Después de streak sostenido: empezás a ganar de a poco.

    function getScreenTimeThreshold() {
      const rank = currentRank().rank;
      const cls = state.currentClass || 'D';
      let threshold = 3;
      const rankAdj = { E: 0, D: 0, C: -0.5, B: -0.5, A: -1, S: -1, NL: -1.5 };
      const clsAdj = { D: 0, C: -0.25, B: -0.5, A: -0.75, Aplus: -1 };
      threshold += (rankAdj[rank] || 0);
      threshold += (clsAdj[cls] || 0);
      return Math.max(1, Math.round(threshold * 4) / 4);
    }

    function calcScreenTimePenalty(hours, threshold) {
      const excess = Math.max(0, hours - threshold);
      if (excess === 0) return 0;
      // NO LINEAL — exponencial. Pasarte 1h duele, 4h destruye.
      // 0.5h over: ~4, 1h: ~10, 2h: ~25, 3h: ~45, 4h: ~70, 5h: ~100
      return Math.min(120, Math.round(Math.pow(excess, 1.8) * 6));
    }

    function calcScreenTimeReward(streak) {
      // Primeros 7 días: 0 reward. Solo evitás penalización.
      if (streak <= 7) return 0;
      if (streak <= 14) return 2;
      if (streak <= 21) return 5;
      if (streak <= 30) return 8;
      return 12; // cap ~15 XP/stat/día después de un mes
    }

    function reportScreenTime(hours) {
      if (log.screen_time !== null) return;
      hours = Math.round(hours * 2) / 2;

      const threshold = getScreenTimeThreshold();
      const passed = hours <= threshold;
      const st = state.screenTime;

      if (passed) {
        log.screen_time = 'pass';
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const ykey = dateToKey(yesterday);
        if (st.last === ykey || st.streak === 0) st.streak++;
        else st.streak = 1;
        if (st.streak > st.longest) st.longest = st.streak;
        st.last = todayKey();

        const reward = calcScreenTimeReward(st.streak);
        if (reward > 0) {
          Object.keys(STATS).forEach(k => state.xp[k] += reward);
          sysToast('SCREEN TIME · streak ' + st.streak + 'd · +' + (reward * 6) + ' XP', 'positive');
          floatXP('+' + (reward * 6), 'var(--positive)', null);
        } else {
          sysToast('SCREEN TIME · APROBADO · streak ' + st.streak + 'd');
        }
      } else {
        log.screen_time = 'fail';
        st.streak = 0;
        st.last = todayKey();

        const penalty = calcScreenTimePenalty(hours, threshold);
        // TODOS los stats pierden. DISCIPLINA pierde el DOBLE.
        Object.keys(STATS).forEach(k => {
          const mult = k === 'disciplina' ? 2 : 1;
          state.xp[k] = Math.max(0, state.xp[k] - (penalty * mult));
        });
        const totalLoss = (penalty * 5) + (penalty * 2);
        floatXP('-' + totalLoss, 'var(--negative)', null);
        sysToast('SCREEN TIME · ' + hours + 'h > ' + threshold + 'h · -' + totalLoss + ' XP', 'danger');
      }

      st.history.push({
        date: todayKey(), hours, threshold,
        result: passed ? 'pass' : 'fail',
        streak: st.streak,
        penalty: passed ? 0 : calcScreenTimePenalty(hours, threshold),
      });
      if (st.history.length > 90) st.history.shift();

      saveLog(log);
      persist();
      render();
    }

    function getScreenTimeOAAFactor() {
      const hist = state.screenTime.history;
      if (hist.length < 7) return 0;
      const last30 = hist.filter(h => daysSince(h.date) <= 30);
      if (last30.length === 0) return 0;
      const passRate = last30.filter(h => h.result === 'pass').length / last30.length;
      if (passRate >= 0.8) return 2;
      if (passRate >= 0.6) return 1;
      if (passRate >= 0.4) return 0;
      if (passRate >= 0.2) return -1;
      return -3;
    }

    function checkDailyCombo() {
      const statsHit = new Set();
      log.habits.forEach(h => {
        const habit = findHabit(h);
        if (habit) statsHit.add(habit.stat);
      });
      const comboLevel = statsHit.size;
      if (comboLevel >= 3 && !log.comboBonusGiven) {
        const bonus = comboLevel === 3 ? 10 : comboLevel === 4 ? 20 : comboLevel === 5 ? 35 : comboLevel >= 6 ? 50 : 0;
        if (bonus > 0) {
          Object.keys(STATS).forEach(k => {
            if (statsHit.has(k)) state.xp[k] += Math.floor(bonus / statsHit.size);
          });
          log.comboBonusGiven = true;
          saveLog(log);
          persist();
          setTimeout(() => sysToast(`COMBO ×${comboLevel} · +${bonus} XP`, 'positive'), 600);
        }
      }
    }

    function checkDailyIntentBonus() {
      const di = log.daily_intent;
      if (!di.items.length) return;
      if (di.bonusGiven) return;
      if (di.completed.filter(Boolean).length < di.items.length) return;
      const bonus = Math.floor(25 / 6);
      Object.keys(STATS).forEach(k => state.xp[k] += bonus);
      di.bonusGiven = true;
      setTimeout(() => toast(`+${bonus * 6} XP · bonus daily intent`, 'positive'), 800);
      checkPPEarnings();
    }

    function updateIntent(idx) {
      if (!log || log.date !== todayKey()) log = getLog(todayKey());
      log.daily_intent.completed[idx] = !log.daily_intent.completed[idx];
      checkDailyIntentBonus();
      saveLog(log);
      persist();
      render();
    }

    function saveIntent(items) {
      if (!log || log.date !== todayKey()) log = getLog(todayKey());
      log.daily_intent.items = items.filter(s => s.trim()).slice(0, 5);
      log.daily_intent.completed = log.daily_intent.items.map(() => false);
      log.daily_intent.bonusGiven = false;
      saveLog(log);
      render();
    }

    // ============================================================
    // SISTEMA: Daily Quest lifecycle
    // ============================================================
    function maybeGenerateSysQuest() {
      // Check si necesitamos generar una
      if (!state.uiState.onb_done) return;
      if (state.uiState.sysquest_suspended_until && new Date(state.uiState.sysquest_suspended_until) > new Date()) return;

      const today = todayKey();
      if (state.sysquest && state.sysquest.date === today) return; // ya hay una de hoy

      // BUGFIX: si ya hubo una quest hoy en el historial, NO generar otra.
      // Esto evita que completar/rechazar una quest genere otra el mismo día.
      const hadOneToday = state.sysquest_history.some(q => q.date === today);
      if (hadOneToday && !state.sysquest) return;

      // Si tenemos una vieja sin resolver (de OTRO día), marcarla fallida y archivar
      if (state.sysquest && state.sysquest.date !== today) {
        const old = state.sysquest;
        if (old.status === 'accepted' || old.status === 'pending') {
          old.status = 'failed';
          // aplicar penalización
          const p = old.penalty;
          state.xp[p.stat] = Math.max(0, state.xp[p.stat] - p.xp);
          state.sysquest_history.push(old);
          // Si rechazó/falló 3 días seguidos → suspender 7 días
          const recent = state.sysquest_history.slice(-3);
          if (recent.length === 3 && recent.every(q => q.status === 'failed' || q.status === 'rejected')) {
            const until = new Date();
            until.setDate(until.getDate() + 7);
            state.uiState.sysquest_suspended_until = dateToKey(until);
            setTimeout(() => {
              haptic('error');
              sysToast('EVALUACIÓN SUSPENDIDA · 7 días', 'danger');
            }, 1000);
          }
        } else if (old.status === 'completed' || old.status === 'rejected') {
          state.sysquest_history.push(old);
        }
        state.sysquest = null;

        // Re-check: ahora que archivamos la vieja, ¿ya hay una de hoy en el historial?
        if (state.sysquest_history.some(q => q.date === today)) {
          persist();
          return;
        }
      }

      // Generar nueva solo si no hay y no hubo ninguna hoy
      if (!state.sysquest) {
        const rank = currentRank().rank;
        const recentCats = state.sysquest_history.slice(-2).map(q => q.category);
        state.sysquest = generateDailyQuest(rank, recentCats);
        persist();
        setTimeout(() => sysToast('NUEVA QUEST DEL SISTEMA'), 1200);
      }
    }

    function acceptSysQuest() {
      if (!state.sysquest) return;
      state.sysquest.status = 'accepted';
      state.sysquest.acceptedAt = new Date().toISOString();
      persist();
      render();
      sysToast('QUEST ACEPTADA');
      haptic('medium');
    }

    function rejectSysQuest() {
      customConfirm('¿Rechazar la quest del Sistema?<br><br>Se aplicará la penalización. Tres rechazos seguidos suspenden la evaluación.', () => {
        if (!state.sysquest) return;
        state.sysquest.status = 'rejected';
        const p = state.sysquest.penalty;
        state.xp[p.stat] = Math.max(0, state.xp[p.stat] - p.xp);
        state.sysquest_history.push(state.sysquest);
        state.sysquest = null;
        // Check 3 rechazos seguidos
        const recent = state.sysquest_history.slice(-3);
        if (recent.length === 3 && recent.every(q => q.status === 'failed' || q.status === 'rejected')) {
          const until = new Date();
          until.setDate(until.getDate() + 7);
          state.uiState.sysquest_suspended_until = dateToKey(until);
          haptic('error');
          sysToast('EVALUACIÓN SUSPENDIDA · 7 días', 'danger');
        }
        persist();
        render();
        sysToast('QUEST RECHAZADA', 'danger');
        floatXP(`-${p.xp}`, 'var(--negative)', null);
      });
    }

    function completeSysQuest() {
      customConfirm('¿Completaste la quest? Solo vos sabés la verdad.<br><br>El Sistema confía en tu honestidad.', () => {
        if (!state.sysquest || state.sysquest.status !== 'accepted') return;
        state.sysquest.status = 'completed';
        state.sysquest.completedAt = todayKey();

        const r = state.sysquest.reward;
        const prevLevel = levelFromXP(state.xp[r.stat]);
        const prevRank = currentRank().rank;
        state.xp[r.stat] += r.xp;
        const newLevel = levelFromXP(state.xp[r.stat]);
        const newRank = currentRank().rank;

        floatXP(`+${r.xp}`, STATS[r.stat].color, null);
        state.sysquest_history.push(state.sysquest);

        if (newLevel > prevLevel) setTimeout(() => showLevelUp(r.stat, newLevel), 400);
        if (newRank !== prevRank) setTimeout(() => showRankUp(newRank), newLevel > prevLevel ? 2500 : 400);

        ppOnSysquestComplete(state.sysquest);
        checkAchievements();
        state.sysquest = null;
        persist();
        render();
        sysToast('QUEST COMPLETADA', 'positive');
        haptic('success');
      });
    }

    function weekKey() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      const day = d.getDay();
      const diff = (day === 0 ? -6 : 1 - day); // lunes = 0 offset
      d.setDate(d.getDate() + diff);
      return dateToKey(d);
    }

    function monthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function generateWeeklyQuests() {
      const wk = weekKey();
      if (state.weekly && state.weekly.week === wk) return;
      const prevIds = state.weekly?.quests?.map(q => q.id) || [];
      const pool = WEEKLY_TEMPLATES.filter(t => !prevIds.includes(t.id));
      const easy = pool.filter(t => t.diff === 'easy');
      const med = pool.filter(t => t.diff === 'med');
      const hard = pool.filter(t => t.diff === 'hard');
      const pick = (arr) => arr.length ? arr[Math.floor(Math.random() * arr.length)] : null;
      const quests = [pick(easy), pick(med), pick(hard)]
        .filter(Boolean)
        .map(t => ({ ...t, progress: 0, completed: false, type: 'weekly' }));
      state.weekly = { week: wk, quests };
      persist();
    }

    function generateMonthlyQuest() {
      const mk = monthKey();
      if (state.monthly && state.monthly.month === mk) return;
      const t = MONTHLY_TEMPLATES[Math.floor(Math.random() * MONTHLY_TEMPLATES.length)];
      state.monthly = { month: mk, ...t, progress: 0, completed: false, type: 'monthly' };
      persist();
    }

    function updateQuestsFromHabit(habitId, stat) {
      const checkQuest = (q) => {
        if (q.completed) return;
        let matched = false;
        if (q.habit && q.habit === habitId) { q.progress++; matched = true; }
        else if (q.stat && q.stat === stat) { q.progress++; matched = true; }
        if (matched && q.progress >= q.target) {
          q.completed = true;
          const perStat = Math.floor(q.xp / 6);
          Object.keys(STATS).forEach(k => state.xp[k] += perStat);
          setTimeout(() => sysToast(`+${q.xp} XP · QUEST COMPLETADA`, 'positive'), 400);
          ppOnQuestComplete(q.type || 'weekly');
        }
      };
      if (state.weekly?.quests) state.weekly.quests.forEach(checkQuest);
      if (state.monthly) checkQuest(state.monthly);
    }

    function getEmptyDaysCount() {
      let count = 0;
      for (let i = 1; i <= 14; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        if (!l || l.habits.length === 0) count++;

      }
      return count;

    const pageHistory = [];

    function goPage(p) {
      if (state.page && state.page !== p) {
        pageHistory.push(state.page);
        if (pageHistory.length > 10) pageHistory.shift();
      }
      const oldIdx = PAGE_ORDER.indexOf(state.page);
      const newIdx = PAGE_ORDER.indexOf(p);
      state.pageDirection = newIdx > oldIdx ? "right" : "left";
      state.page = p;
      render();
      if (p === 'stats') {
        setTimeout(() => { renderRadar(); renderHeatmap(); renderOAALine(); renderXPStack(); }, 60);
      }
      if (p === 'focus') {

      const prev = pageHistory.pop() || 'home';
      state.page = prev;
      render();
      if (prev === 'stats') setTimeout(() => { renderRadar(); renderHeatmap(); renderOAALine(); renderXPStack(); }, 60);

    const CLASS_POINT_BASE = {
      D: 50,
      C: 100,
      B: 250,
      A: 500,
      Aplus: 750,
    };

    function maybeCalculateClassPoints() {
      const now = new Date();
      const dayOfWeek = now.getDay(); // 0 = Sunday, 1 = Monday
      if (dayOfWeek !== 1) return; // Only run on Monday

      const todayK = todayKey();
      if (state.classPoints.lastWeeklyCalc === todayK) return;

      const cls = state.currentClass || 'D';
      const base = CLASS_POINT_BASE[cls] || 50;

      // Iterate the last 7 days of logs
      let habitsTotal = 0;
      let combos = 0;
      let intent3of3 = 0;
      let screenTimeOk = 0;
      let screenTimeFail = 0;
      let inactiveDays = 0;
      let sysquestCompleted = 0;
      let sysquestFailed = 0;

      for (let i = 1; i <= 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = dateToKey(d);
        const l = load(K.log(key), null);
        if (!l || (!l.habits?.length && l.scroll_am === null)) {
          inactiveDays++;
          continue;
        }
        const realHabits = (l.habits || []).filter(h => h !== '__touched');
        habitsTotal += realHabits.length;

        // Count combo: 3+ distinct stats touched
        const statsTouched = new Set();
        realHabits.forEach(hid => {
          for (const [stat, list] of Object.entries(HABITS_BASE)) {
            if (list.some(h => h.id === hid)) { statsTouched.add(stat); break; }
          }
        });
        (state.custom || []).forEach(c => {
          if (realHabits.includes(c.id)) statsTouched.add(c.stat);
        });
        if (statsTouched.size >= 3) combos++;

        // Daily intent 3/3
        const c = l.daily_intent?.completed || [];
        if (c.length >= 3 && c.every(Boolean)) intent3of3++;

        // Screen time
        if (l.screen_time === 'pass') screenTimeOk++;
        else if (l.screen_time === 'fail') screenTimeFail++;
      }

      // Sysquests this week
      (state.sysquest_history || []).forEach(sq => {
        if (sq.date && daysSince(sq.date) <= 7) {
          if (sq.status === 'completed') sysquestCompleted++;
          else if (sq.status === 'failed') sysquestFailed++;
        }
      });

      const streakBonus = Math.min(35, Math.max(0, state.streaks.daily_log.current) * 5);

      const bonuses = {
        habits: habitsTotal * 2,
        sysquests: sysquestCompleted * 10,
        combos: combos * 5,
        intent: intent3of3 * 20,
        screenTime: screenTimeOk * 15,
        streak: streakBonus,
      };

      const penalties = {
        inactive: inactiveDays * -10,
        sysquestFailed: sysquestFailed * -25,
        screenTimeFail: screenTimeFail * -15,
      };

      const total = base
        + Object.values(bonuses).reduce((a, b) => a + b, 0)
        + Object.values(penalties).reduce((a, b) => a + b, 0);

      const finalPoints = Math.max(0, total);

      const entry = {
        week: todayK,
        class: cls,
        base,
        bonuses,
        penalties,
        total: finalPoints,
      };

      state.classPoints.current = finalPoints;
      state.classPoints.history.push(entry);
      // Keep only last 26 weeks (~6 months)
      if (state.classPoints.history.length > 26) {
        state.classPoints.history = state.classPoints.history.slice(-26);
      }
      state.classPoints.lastWeeklyCalc = todayK;

      // Award PP: 1 class point = 1 PP
      if (finalPoints > 0 && ppEnabled()) {
        earnPP(finalPoints, 'weekly_class_points');
      }

      persist();

      setTimeout(() => {
        sysToast(`EVALUACIÓN SEMANAL · +${finalPoints} PP`, 'positive');
      }, 2000);
    }

    function generateWeeklyReport() {
      const today = new Date();
      if (today.getDay() !== 0) return null; // solo domingos

      const wk = weekKey();
      // No generar si ya existe para esta semana
      if (state.weeklyReports.find(r => r.week === wk)) return null;

      const oaa = getCurrentOAA();
      if (!oaa || oaa.total === null) return null;

      const logs7 = getRecentLogs(7);
      const logs30 = getRecentLogs(30);
      const rank = currentRank();
      const cls = state.currentClass || 'D';

      // Calcular cambios vs semana anterior
      const hist = state.oaa_history || [];
      const prevWeek = hist.length >= 8 ? hist[hist.length - 8] : null;
      const dimChange = {};
      const dims = ['academico', 'fisico', 'mental', 'social', 'identidad'];
      dims.forEach(d => {
        dimChange[d] = prevWeek?.dims?.[d] != null && oaa.dims[d] != null
          ? oaa.dims[d] - prevWeek.dims[d]
          : 0;
      });
      const totalChange = prevWeek?.total != null ? oaa.total - prevWeek.total : 0;

      // === OBSERVACIONES ===
      const observations = [];

      // 1. Caída significativa en alguna dimensión
      dims.forEach(d => {
        if (dimChange[d] < -1.5) {
          const dimName = { academico: 'Académico', fisico: 'Físico', mental: 'Mental', social: 'Social', identidad: 'Identidad' }[d];
          // Intentar detectar causa
          let causa = '';
          if (d === 'fisico') {
            const gymDays = logs7.filter(l => l.habits.includes('gym')).length;
            if (gymDays <= 1) causa = ` Causa probable: ${gymDays === 0 ? 'ausencia total de gym' : 'solo 1 día de gym'} esta semana.`;
          }
          if (d === 'social') {
            const vincDays = logs7.filter(l => l.habits.some(h => ['call', 'meal', 'msg', 'new_person', 'compliment'].includes(h))).length;
            if (vincDays <= 1) causa = ` Causa probable: ${vincDays === 0 ? 'cero' : '1'} interacción social registrada.`;
          }
          observations.push(`Caída detectada en ${dimName} (${numToLetter(oaa.dims[d] + Math.abs(dimChange[d]))} → ${numToLetter(oaa.dims[d])}).${causa}`);
        }
      });

      // 2. Patrón de rechazo de sysquests
      const recentQ = state.sysquest_history.filter(q => daysSince(q.date) <= 7);
      if (recentQ.length >= 2) {
        const rejected = recentQ.filter(q => q.status === 'rejected');
        if (rejected.length >= 2) {
          const categories = rejected.map(q => q.category);
          const uniqueCats = [...new Set(categories)];
          if (uniqueCats.length === 1) {
            const catName = { ruptura: 'Ruptura', confrontacion: 'Confrontación', disciplina_pura: 'Disciplina', curiosidad: 'Curiosidad', vulnerabilidad: 'Vulnerabilidad', fisico_extremo: 'Físico Extremo' }[uniqueCats[0]] || uniqueCats[0];
            observations.push(`Patrón persistente: ${rejected.length} de ${recentQ.length} quests rechazadas pertenecen a categoría ${catName}. Esto sugiere evitación deliberada de esa área.`);
          }
        }
      }

      // 3. Récord de scroll AM
      if (state.streaks.no_scroll_am.current >= 7 && state.streaks.no_scroll_am.current === state.streaks.no_scroll_am.longest) {
        observations.push(`Récord personal: ${state.streaks.no_scroll_am.current} días consecutivos sin scroll AM.`);
      }

      // 4. Daily intent completion
      let intentDone = 0, intentTotal = 0;
      logs7.forEach(l => {
        if (l.daily_intent?.items?.length > 0) {
          intentTotal += l.daily_intent.items.length;
          intentDone += (l.daily_intent.completed || []).filter(Boolean).length;
        }
      });
      const intentRate = intentTotal > 0 ? Math.round((intentDone / intentTotal) * 100) : null;
      if (intentRate !== null) {
        let intentObs = `Daily intent completion: ${intentRate}%.`;
        // Comparar con mes anterior
        let monthIntentDone = 0, monthIntentTotal = 0;
        logs30.forEach(l => {
          if (l.daily_intent?.items?.length > 0) {
            monthIntentTotal += l.daily_intent.items.length;
            monthIntentDone += (l.daily_intent.completed || []).filter(Boolean).length;
          }
        });
        const monthRate = monthIntentTotal > 0 ? Math.round((monthIntentDone / monthIntentTotal) * 100) : null;
        if (monthRate !== null && Math.abs(intentRate - monthRate) > 10) {
          intentObs += ` Comparativo mes: ${monthRate}%.`;
          if (intentRate < monthRate - 15) {
            intentObs += ` Hipótesis: estás definiendo intenciones que exceden tu energía operativa.`;
          }
        }
        observations.push(intentObs);
      }

      // 5. Subida notable
      dims.forEach(d => {
        if (dimChange[d] > 1.5) {
          const dimName = { academico: 'Académico', fisico: 'Físico', mental: 'Mental', social: 'Social', identidad: 'Identidad' }[d];
          observations.push(`Progreso significativo en ${dimName}: +${dimChange[d].toFixed(1)} niveles esta semana.`);
        }
      });

      // 6. Streak diario
      if (state.streaks.daily_log.current >= 14) {
        observations.push(`Streak activo de ${state.streaks.daily_log.current} días. Consistencia operativa sostenida.`);
      }

      // 7. Dimensión descuidada
      const lowest = dims.reduce((a, b) => (oaa.dims[a] || 0) < (oaa.dims[b] || 0) ? a : b);
      const highest = dims.reduce((a, b) => (oaa.dims[a] || 0) > (oaa.dims[b] || 0) ? a : b);
      if (oaa.dims[highest] - oaa.dims[lowest] > 4) {
        const loName = { academico: 'Académico', fisico: 'Físico', mental: 'Mental', social: 'Social', identidad: 'Identidad' }[lowest];
        observations.push(`Desbalance detectado: ${loName} está ${Math.round(oaa.dims[highest] - oaa.dims[lowest])} niveles por debajo de tu dimensión más fuerte.`);
      }

      // 8. Screen Time
      const stHist = state.screenTime.history.filter(h => daysSince(h.date) <= 7);
      if (stHist.length >= 3) {
        const stPassRate = stHist.filter(h => h.result === 'pass').length / stHist.length;
        if (stPassRate < 0.5) {
          const avgHours = (stHist.reduce((s, h) => s + h.hours, 0) / stHist.length).toFixed(1);
          observations.push(`Screen time promedio: ${avgHours}h/día. ${Math.round(stPassRate * 100)}% dentro del umbral. Impacto negativo en OAA Mental.`);
        } else if (stPassRate >= 0.85 && state.screenTime.streak >= 7) {
          observations.push(`Screen time controlado: streak de ${state.screenTime.streak} días. Impacto positivo en OAA Mental (+${getScreenTimeOAAFactor()}).`);
        }
      }

      // Limitar a 4 observaciones
      const finalObs = observations.slice(0, 4);

      // === RECOMENDACIONES ===
      const recommendations = [];

      // Recomendación basada en observaciones
      if (intentRate !== null && intentRate < 60) {
        recommendations.push('Reducir daily intents a 2 ítems durante 7 días. Re-evaluar el próximo domingo.');
      }
      const rejectedCats = recentQ.filter(q => q.status === 'rejected').map(q => q.category);
      if (rejectedCats.length >= 2) {
        recommendations.push(`Aceptar la próxima quest de ${rejectedCats[0] || 'la categoría rechazada'}${ppEnabled() ? ' o gastar 80 PP para skip.' : '.'}`);
      }
      if (dimChange.fisico < -1) {
        recommendations.push('Priorizar al menos 3 sesiones de actividad física esta semana.');
      }
      if (dimChange.social < -1) {
        recommendations.push('Agendar al menos 1 interacción presencial (meal o call) esta semana.');
      }
      if (recommendations.length === 0) {
        recommendations.push('Mantener el ritmo actual. Sin ajustes urgentes detectados.');
      }

      // === PP summary ===
      const ppWeek = state.ppLog.filter(l => daysSince(l.date) <= 7);
      const ppEarned = ppWeek.filter(l => l.type === 'earn').reduce((s, l) => s + l.amount, 0);
      const ppSpent = ppWeek.filter(l => l.type === 'spend').reduce((s, l) => s + Math.abs(l.amount), 0);


      const report = {
        week: wk,
        weekNumber: getWeekNumber(),
        year: today.getFullYear(),
        generatedAt: new Date().toISOString(),
        rank: rank.rank,
        class: classCode(cls),
        level: totalLevel(),
        oaa: {
          total: oaa.total,
          totalLetter: numToLetter(oaa.total),
          dims: {},
          totalChange: totalChange,
        },
        observations: finalObs,
        recommendations: recommendations.slice(0, 2),
        pp: { balance: state.pp, earned: ppEarned, spent: ppSpent },
        streak: state.streaks.daily_log.current,
        habitsThisWeek: logs7.reduce((s, l) => s + l.habits.filter(h => h !== '__touched').length, 0),
        feedbackGiven: false,
        resonatedObs: [],
      };

      dims.forEach(d => {
        report.oaa.dims[d] = {
          value: oaa.dims[d],
          letter: oaa.dims[d] !== null ? numToLetter(oaa.dims[d]) : '—',
          change: dimChange[d],
        };
      });

      state.weeklyReports.push(report);
      // Mantener últimos 52 informes (1 año)
      if (state.weeklyReports.length > 52) state.weeklyReports.shift();
      persist();

      return report;
    }

    function getWeekNumber() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
      const week1 = new Date(d.getFullYear(), 0, 4);
      return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    }

    function getLatestReport() {
      if (!state.weeklyReports.length) return null;
      return state.weeklyReports[state.weeklyReports.length - 1];
    }

    function markReportFeedback(obsIndex) {
      const report = getLatestReport();
      if (!report) return;
      if (report.resonatedObs.includes(obsIndex)) {
        report.resonatedObs = report.resonatedObs.filter(i => i !== obsIndex);
      } else {
        report.resonatedObs.push(obsIndex);
      }
      report.feedbackGiven = true;
      persist();
      // Re-render modal
      closeModal();
      openModal('report');
    }

    function getSmartSuggestion() {
      // V19.6: Disponible desde Rank C (no más Clase B-only)
      if (totalLevel() < 20) return null;

      // Solo una sugerencia por día
      if (state.uiState.smart_suggestion_today === todayKey()) return null;

      const today = new Date();
      const dayOfWeek = today.getDay();
      const hour = today.getHours();
      const logs = getRecentLogs(30);

      // ========== Patrón 1: hábito por día de la semana ==========
      const dayPatterns = {};
      logs.forEach(l => {
        const d = new Date(l.date);
        const dow = d.getDay();
        if (!dayPatterns[dow]) dayPatterns[dow] = {};
        l.habits.forEach(h => {
          if (h === '__touched') return;
          dayPatterns[dow][h] = (dayPatterns[dow][h] || 0) + 1;
        });
      });
      const todayPattern = dayPatterns[dayOfWeek];
      if (todayPattern) {
        const entries = Object.entries(todayPattern).sort((a, b) => b[1] - a[1]);
        if (entries.length > 0) {
          const [topHabit, count] = entries[0];
          if (count >= 3 && !log.habits.includes(topHabit)) {
            const habit = findHabit(topHabit);
            if (habit) {
              const dayNames = ['domingos', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábados'];
              return {
                habit: topHabit,
                label: habit.label,
                stat: habit.stat,
                message: `${habit.label} registrado en ${count} de los últimos ${dayNames[dayOfWeek]}. Hoy aún sin actividad.`,
              };
            }
          }
        }
      }

      // ========== Patrón 2: stat oxidándose ==========
      const statActivity = {};
      Object.keys(STATS).forEach(s => statActivity[s] = 0);
      logs.forEach(l => {
        l.habits.forEach(h => {
          const habit = findHabit(h);
          if (habit && statActivity[habit.stat] !== undefined) statActivity[habit.stat]++;
        });
      });
      const rusty = Object.entries(statActivity).sort((a, b) => a[1] - b[1])[0];
      if (rusty && rusty[1] < 3) {
        const statHabits = (HABITS_BASE[rusty[0]] || []);
        if (statHabits.length > 0) {
          const habit = statHabits[0];
          return {
            habit: habit.id,
            label: habit.label,
            stat: rusty[0],
            message: `${STATS[rusty[0]].name} con solo ${rusty[1]} actividades en 30 días. Stat oxidándose.`,
          };
        }
      }

      // ========== Patrón 3: cerca de level up ==========
      for (const stat of Object.keys(STATS)) {
        const p = progressInLevel(state.xp[stat]);
        if (p.pct >= 80) {
          const statHabits = (HABITS_BASE[stat] || []);
          const todoHoy = statHabits.filter(h => !log.habits.includes(h.id));
          if (todoHoy.length > 0) {
            const habit = todoHoy[0];
            const remaining = p.needed - p.current;
            return {
              habit: habit.id,
              label: habit.label,
              stat: stat,
              message: `Faltan ${remaining} XP para que ${STATS[stat].name} suba a LV ${p.level + 1}.`,
            };
          }
        }
      }

      // ========== Patrón 4: streak en riesgo (no marcaste nada hoy y es tarde) ==========
      if (hour >= 19 && log.habits.filter(h => h !== '__touched').length === 0) {
        const streak = state.streaks?.daily_log?.current || 0;
        if (streak >= 7) {
          // Sugerir el hábito más fácil/rápido
          const easyHabit = HABITS_BASE.alma?.find(h => h.id === 'gratitude') || HABITS_BASE.disciplina?.find(h => h.id === 'reflection');
          if (easyHabit && !log.habits.includes(easyHabit.id)) {
            return {
              habit: easyHabit.id,
              label: easyHabit.label,
              stat: easyHabit.stat,
              message: `Tu streak de ${streak} días en riesgo. ${easyHabit.label} mantiene el ciclo activo.`,
            };
          }
        }
      }

      return null;
    }

    function maybeAyanokojiMessage() {
      const daysSince = daysSinceCreated();
      // V19.5: First message at 14 days (was 90)
      if (daysSince < 14) return;

      // V19.5: Then every 21 days (was 90)
      const lastMsg = state.ayanokoji.lastMessage;
      if (lastMsg) {
        const daysSinceLast = Math.floor((new Date() - new Date(lastMsg)) / (1000 * 60 * 60 * 24));
        if (daysSinceLast < 21) return;
      }

      // No mostrar si ya se mostró hoy
      if (state.uiState.ayanokoji_shown_today === todayKey()) return;

      const oaa = getCurrentOAA();
      if (!oaa || oaa.total === null) return;

      // Filtrar mensajes ya mostrados
      const shownIds = state.ayanokoji.messages.map(m => m.id);
      const candidates = AYANOKOJI_MESSAGES.filter(m => !shownIds.includes(m.id));
      if (candidates.length === 0) return;

      // Evaluar condiciones
      const matching = candidates.filter(m => {
        try { return m.condition(oaa, state); }
        catch (e) { return false; }
      });

      if (matching.length === 0) return;

      // Elegir uno (priorizar los más específicos — últimos en la lista)
      const chosen = matching[matching.length - 1];

      state.ayanokoji.lastMessage = todayKey();
      state.ayanokoji.messages.push({ id: chosen.id, date: todayKey() });
      state.uiState.ayanokoji_shown_today = todayKey();
      persist();

      // Mostrar después de un delay
      setTimeout(() => showAyanokojiMessage(chosen), 3000);
    }

        questions.push({

          context: 'Tu OAA Académico está bajo. La curiosidad sin propósito directo es la marca del crecimiento real.',
        });

        });
      }

          context: `Llevás ${streak} días consecutivos. La inercia positiva es real, pero puede enmascarar agotamiento.`,
        });
      }

          area: 'PATRÓN: CONSISTENCIA',

          context: `${streak} días consecutivos. La respuesta a esta pregunta define si esto sigue siendo crecimiento o se convirtió en ritual.`,
        });

        questions.push({
          area: 'PATRÓN: STREAK ROTO',
          question: '¿Qué pasó el día que rompiste tu streak? ¿Lo viste venir?',
          context: `Tu récord es ${state.streaks.daily_log.longest} días. Las roturas tienen patrones que se repiten si no se nombran.`,
        });
      }

      // PATRONES - MAZMORRAS
      const activeBosses = state.bosses?.filter(b => !b.completed).length || 0;
      if (activeBosses >= 2) {
        questions.push({
          area: 'PATRÓN: MAZMORRAS',
          question: '¿Estás forjando mazmorras que realmente querés completar, o las que creés que deberías?',
          context: `Tenés ${activeBosses} mazmorras abiertas. El Sistema nota la diferencia entre ambición y deseo.`,
        });
      }
      if (daysSinceCreated() >= 45 && (!state.bosses || state.bosses.length === 0)) {
        questions.push({
          area: 'PATRÓN: AUSENCIA DE MAZMORRAS',
          question: '¿Por qué no has forjado una sola mazmorra en 45 días?',
          context: 'Las quests diarias las da el Sistema. Las épicas las elegís vos. El silencio acá no es neutralidad.',
        });
      }

      // PATRONES - SYSQUESTS
      const sysqHist = state.sysquest_history || [];
      const recentRejected = sysqHist.filter(q => daysSince(q.date) <= 30 && q.status === 'rejected').length;
      if (recentRejected >= 3) {
        questions.push({
          area: 'PATRÓN: RECHAZO',
          question: '¿Rechazás las quests porque están mal calibradas o porque te exigen lo que no querés ver?',
          context: `Rechazaste ${recentRejected} quests este mes. El Sistema pregunta una sola vez.`,
        });
      }
      const recentFailed = sysqHist.filter(q => daysSince(q.date) <= 30 && q.status === 'failed').length;
      if (recentFailed >= 3) {
        questions.push({
          area: 'PATRÓN: FALLAS',
          question: '¿Aceptás quests sin chequear si realmente podés cumplirlas?',
          context: `Fallaste ${recentFailed} quests recientes. Aceptar sin calcular es peor que rechazar.`,
        });
      }

      if (ppEnabled() && state.pp >= 2000 && state.ppLog?.filter(l => l.type === 'spend').length < 3) {
        questions.push({
          area: 'PATRÓN: PP ACUMULADOS',
          question: '¿Por qué acumulás Private Points sin usarlos?',
